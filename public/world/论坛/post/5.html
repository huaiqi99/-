  <script>
    (function() {
      try {
        const raw = localStorage.getItem('theme');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      } catch(e) {}
    })();

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      if (newTheme === 'dark') {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
      const btn = document.getElementById('themeBtn');
      if (btn) {
        btn.innerHTML = newTheme === 'dark'
          ? '<span class="icon">☀️</span> 日间'
          : '<span class="icon">🌙</span> 夜间';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('themeBtn');
      if (!btn) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark
        ? '<span class="icon">☀️</span> 日间'
        : '<span class="icon">🌙</span> 夜间';
    });
  </script>

      function getAvatarStyle(name, isLz) {
        if (isLz) return 'class="avatar lz-avatar"';
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const hues = [25, 35, 45, 55, 150, 160, 170, 180, 190, 200, 340, 350, 10, 20, 30];
        const hue = hues[Math.abs(hash) % hues.length];
        const bg = `hsl(${hue}, 28%, 82%)`;
        const color = `hsl(${hue}, 55%, 22%)`;
        return `class="avatar" style="background:${bg};color:${color};"`;
      }

      function renderFloors() {
        const container = document.getElementById('floors-container');
        if (!container) return;

        let html = '';
        for (const f of floors) {
          const lzClass = f.lz ? 'floor lz' : 'floor';
          let nameHtml = f.lz 
            ? f.name + ' <span class="badge lz-badge">楼主</span>'
            : f.name;
          if (f.marker) {
            nameHtml += ' <span class="marker">' + f.marker + '</span>';
          }
          const avatarAttr = getAvatarStyle(f.name, f.lz);
          const favBtn = f.fav 
            ? '<button><span class="sym-2d">★&#xFE0E;</span> 收藏</button>' 
            : '';

          html += `
          <div class="${lzClass}">
            <div class="head">
              <div ${avatarAttr}>${f.avatar}</div>
              <div class="info">
                <div class="name">${nameHtml}</div>
                <div class="time">${f.time}</div>
              </div>
              <span class="floor-num">#${f.num}</span>
            </div>
            <div class="body">${f.body}</div>
            <div class="actions">
              <button><span class="sym-2d">❤&#xFE0E;</span> ${f.likes}</button>
              <button><span class="sym-2d">↩&#xFE0E;</span> 回复</button>
              ${favBtn}
            </div>
          </div>`;
        }
        container.innerHTML = html;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderFloors);
      } else {
        renderFloors();
      }
    })();
  </script>
