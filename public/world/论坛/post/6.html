  <script>
    (function() {
      try {
        const raw = localStorage.getItem('theme');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      } catch(e) {}
    })();

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      if (newTheme === 'dark') {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
      const btn = document.getElementById('themeBtn');
      if (btn) {
        btn.innerHTML = newTheme === 'dark'
          ? '<span class="icon">☀️</span> 日间'
          : '<span class="icon">🌙</span> 夜间';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('themeBtn');
      if (!btn) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = isDark
        ? '<span class="icon">☀️</span> 日间'
        : '<span class="icon">🌙</span> 夜间';
    });
  </script>

function renderFloors() {
  const container = document.getElementById('floors');
  if (!container) return;

  floors.forEach((f, idx) => {
    const el = document.createElement('div');
    const lzClass = f.lz ? ' lz' : '';
    const accentClass = f.special ? ' accent' : '';
    const badgeHtml = f.lz
      ? ' <span class="badge lz-badge">楼主</span>'
      : f.special
      ? ' <span class="badge special-badge">🔹 特殊</span>'
      : '';

    el.className = `floor${lzClass}`;
    el.setAttribute('data-color', idx % 3);

    el.innerHTML = `
      <div class="head">
        <div class="avatar${accentClass}">${f.avatar}</div>
        <div class="info">
          <div class="name">${f.name}${badgeHtml}</div>
          <div class="time">${f.time}</div>
        </div>
        <span class="floor-num">#${f.num}</span>
      </div>
      <div class="body">${f.body}</div>
      <div class="actions">
        <button><span class="sym-2d">❤&#xFE0E;</span> ${f.likes}</button>
        <button><span class="sym-2d">↩&#xFE0E;</span> 回复</button>
        ${f.num === 1 ? '<button><span class="sym-2d">★&#xFE0E;</span> 收藏</button>' : ''}
      </div>
    `;

    container.appendChild(el);
  });
}

document.addEventListener('DOMContentLoaded', renderFloors);
</script>
