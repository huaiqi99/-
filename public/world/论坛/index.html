  <style>
    :root {
      --bg-body: #f7f4ef;
      --bg-card: #ffffff;
      --bg-card-alt: #f2eee9;
      --bg-modal: rgba(0,0,0,0.35);
      --border-light: #ece6de;
      --border-card: #e4ddd4;
      --text-primary: #2c2c2c;
      --text-secondary: #4a4a4a;
      --text-muted: #8a8a8a;
      --text-muted-light: #b0aaa2;
      --accent: #b03a2a;
      --accent-soft: rgba(176, 58, 42, 0.08);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      --transition: 0.25s ease;
    }
    [data-theme="dark"] {
      --bg-body: #181614;
      --bg-card: #24201c;
      --bg-card-alt: #1e1b18;
      --bg-modal: rgba(0,0,0,0.6);
      --border-light: #35302a;
      --border-card: #3a3530;
      --text-primary: #cfc8c0;
      --text-secondary: #9a948c;
      --text-muted: #6a6560;
      --text-muted-light: #5a5550;
      --accent: #b05a4a;
      --accent-soft: rgba(176, 90, 74, 0.12);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg-body);
      color: var(--text-primary);
      transition: background var(--transition), color var(--transition);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 18px 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      flex-wrap: wrap;
      gap: 8px;
    }
    #topbar .brand {

      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;

      color: var(--text-secondary);

      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;

    #list-view .list-header .count { font-size: 0.8rem; color: var(--text-muted); }

      flex-wrap: wrap;
      gap: 6px 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .filter-bar .filter-tag {
      font-size: 0.75rem;
      padding: 3px 14px;
      border-radius: 16px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .filter-bar .filter-tag:hover { border-color: var(--text-muted); }
    .filter-bar .filter-tag.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-bar .search-box {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .filter-bar .search-box input {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 4px 14px;
      font-size: 0.75rem;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition);
      width: 140px;
    }
    .filter-bar .search-box input:focus { border-color: var(--accent); }
    .filter-bar .search-box input::placeholder { color: var(--text-muted-light); }

    .post-item {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      text-decoration: none;
      color: var(--text-primary);

      cursor: pointer;
      box-shadow: var(--shadow-sm);

      opacity: 0;
      transform: translateY(10px);

    .post-item:nth-child(3) { animation-delay: 0.12s; }
    .post-item:nth-child(4) { animation-delay: 0.16s; }
    .post-item:nth-child(5) { animation-delay: 0.20s; }
    .post-item:nth-child(6) { animation-delay: 0.24s; }
    .post-item:nth-child(7) { animation-delay: 0.28s; }
    .post-item:nth-child(8) { animation-delay: 0.32s; }
    @keyframes card-in {

      100% { opacity: 1; transform: translateY(0); }

    .modal-overlay {

      background: var(--bg-modal);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;

    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);

      width: 100%;
      padding: 24px 28px;
      box-shadow: var(--shadow-lg);
      max-height: 90vh;
      overflow-y: auto;

    .modal-box .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
    .modal-box .modal-close {
      float: right;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      line-height: 1;

    .modal-box .modal-close:hover { color: var(--text-primary); }
    .modal-box label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 12px;
      margin-bottom: 4px;

  <script>
    (function() {
      try {
        const raw = localStorage.getItem('theme');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      } catch(e) {}
    })();
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
    }
  </script>
</head>

        if (Array.isArray(parsed) && parsed.length > 0) {
          // 把 DEFAULT_POSTS 里的 externalLink 补回去
          const defaultMap = {};
          DEFAULT_POSTS.forEach(p => { defaultMap[p.id] = p.externalLink; });
          return parsed.map(p => ({
            ...p,
            externalLink: defaultMap[p.id] || null
          }));
        }
      }
    } catch(e) {}
    savePosts(DEFAULT_POSTS);
    return DEFAULT_POSTS;
  }

  function savePosts(posts) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(posts)); } catch(e) {}
  }

  function getNextId(posts) {
    return posts.reduce((max, p) => Math.max(max, p.id), 0) + 1;
  }

  // ================================================================
  //  状态管理
  // ================================================================

  let currentPosts = loadPosts();
  let currentFilter = 'all';
  let currentSearch = '';
  let currentView = 'list';
  let currentDetailId = null;

  function getTodayCount() {
    const today = new Date().toDateString();
    try {
      const raw = localStorage.getItem('beijing_today_count');
      if (raw) {
        const data = JSON.parse(raw);
        if (data.date === today) return data.count;
      }
    } catch(e) {}
    return 0;
  }
  function incrementTodayCount() {
    const today = new Date().toDateString();
    const count = getTodayCount() + 1;
    localStorage.setItem('beijing_today_count', JSON.stringify({ date: today, count }));
    return count;
  }

  // ================================================================
  //  渲染函数
  // ================================================================

  function render() {
    if (currentView === 'detail') { renderDetail(); return; }
    renderList();
  }

  function renderList() {
    const container = document.getElementById('post-list');
    const countEl = document.getElementById('post-count');

    let filtered = currentPosts;
    if (currentFilter !== 'all') {
      filtered = filtered.filter(p => p.category === currentFilter);
    }
    if (currentSearch.trim()) {
      const q = currentSearch.trim().toLowerCase();
      filtered = filtered.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.author.toLowerCase().includes(q)
      );
    }
    filtered = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));

    countEl.textContent = filtered.length + ' 个帖子';

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state">🍵 没有找到帖子，要不你来写一篇？</div>`;
      return;
    }

    container.innerHTML = filtered.map(post => {
      const isExternal = post.externalLink && typeof post.externalLink === 'string';
      const cardContent = `
        <div class="title">
          ${post.title}
          <span class="category-tag">${post.category}</span>
          ${post.hot ? '<span class="hot">🔥 热</span>' : ''}
        </div>
        <div class="meta">
          <span class="author">${post.author}</span>
          <span>·</span>
          <span>${post.date}</span>
          <span>·</span>
          <span>最后回复 ${getRelativeTime(post.date)}</span>
        </div>
        <div class="excerpt">${post.content.slice(0, 80)}${post.content.length > 80 ? '……' : ''}</div>
        <div class="stats">
          <span>💬 <span class="num">${post.replies}</span></span>
          <span>👍 <span class="num">${formatNumber(post.likes)}</span></span>
        </div>
      `;

      if (isExternal) {
        return `<a class="post-item" href="${post.externalLink}" target="_self">${cardContent}</a>`;
      } else {
        return `<div class="post-item" onclick="openDetail(${post.id})">${cardContent}</div>`;
      }
    }).join('');
  }

  function renderDetail() {
    const post = currentPosts.find(p => p.id === currentDetailId);
    if (!post) { goBackToList(); return; }
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';
    document.getElementById('detail-title').textContent = post.title;
    document.getElementById('detail-meta').innerHTML = `
      <span>${post.author}</span>
      <span>·</span>
      <span>${post.date}</span>
      <span>·</span>
      <span>分类：${post.category}</span>
      ${post.hot ? '<span>🔥 热门</span>' : ''}
    `;
    document.getElementById('detail-body').textContent = post.content;
    document.getElementById('detail-stats').innerHTML = `
      <span>💬 <span class="num">${post.replies}</span> 回复</span>
      <span>👍 <span class="num">${formatNumber(post.likes)}</span> 点赞</span>
    `;
  }

  function openDetail(id) {
    currentDetailId = id;
    currentView = 'detail';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goBackToList() {
    currentView = 'list';
    document.getElementById('list-view').style.display = 'block';
    document.getElementById('detail-view').style.display = 'none';
    render();
  }

  function goHome() { goBackToList(); return false; }

  // ================================================================
  //  工具
  // ================================================================

  function formatNumber(n) {
    if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return n;
  }

  function getRelativeTime(dateStr) {
    const now = new Date();
    const then = new Date(dateStr);
    const diff = Math.floor((now - then) / (1000 * 60 * 60));
    if (diff < 1) return '刚刚';
    if (diff < 24) return diff + '小时前';
    const days = Math.floor(diff / 24);
    if (days < 7) return days + '天前';
    return dateStr;
  }

  // ================================================================
  //  发帖
  // ================================================================

  function openNewPostModal() {
    document.getElementById('new-post-modal').classList.add('open');
    document.getElementById('post-title').focus();
  }

  function closeNewPostModal() {
    document.getElementById('new-post-modal').classList.remove('open');
    document.getElementById('new-post-form').reset();
  }

  function submitNewPost(e) {
    e.preventDefault();
    const title = document.getElementById('post-title').value.trim();
    const category = document.getElementById('post-category').value;
    const author = document.getElementById('post-author').value.trim() || '匿名楼主';
    const content = document.getElementById('post-content').value.trim();
    if (!title || !content) return;

    const newPost = {
      id: getNextId(currentPosts),
      title, category, author,
      date: new Date().toISOString().slice(0, 10),
      content, replies: 0, likes: 0, hot: false
      // 新帖子没有 externalLink，属于本地帖子
    };

    currentPosts = [newPost, ...currentPosts];
    savePosts(currentPosts);
    document.getElementById('today-num').textContent = incrementTodayCount();
    closeNewPostModal();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ================================================================
  //  筛选 & 搜索
  // ================================================================

  function setupFilters() {
    document.querySelectorAll('.filter-tag').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        render();
      });
    });
    const searchInput = document.getElementById('search-input');
    let timer;
    searchInput.addEventListener('input', function() {
      clearTimeout(timer);
      timer = setTimeout(() => { currentSearch = this.value; render(); }, 250);
    });
  }

  // ================================================================
  //  茶馆实况
  // ================================================================

  function setupTavernStatus() {
    const onlineEl = document.getElementById('online-num');
    setInterval(() => {
      const base = 47;
      const variation = Math.floor(Math.random() * 30) - 10;
      onlineEl.textContent = Math.max(12, base + variation);
    }, 5000);

    const tempEl = document.getElementById('tea-temp');
    setInterval(() => {
      const base = 82;
      const variation = Math.floor(Math.random() * 8) - 3;
      tempEl.textContent = Math.max(65, Math.min(95, base + variation));
    }, 8000);

    document.getElementById('today-num').textContent = getTodayCount();

    const sayingEl = document.getElementById('saying-text');
    setInterval(() => {
      const idx = Math.floor(Math.random() * SAYINGS.length);
      sayingEl.textContent = SAYINGS[idx];
    }, 12000);
  }

  // ================================================================
  //  启动
  // ================================================================

  document.getElementById('new-post-btn').addEventListener('click', openNewPostModal);
  document.getElementById('modal-close').addEventListener('click', closeNewPostModal);
  document.getElementById('new-post-modal').addEventListener('click', function(e) {
    if (e.target === this) closeNewPostModal();
  });
  document.getElementById('new-post-form').addEventListener('submit', submitNewPost);

  setupFilters();
  setupTavernStatus();
  render();
</script>

</body>
</html>
