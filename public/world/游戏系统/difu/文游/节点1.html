<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>归终殿 · 引契 · 节点一</title>
    <style>
        :root {
            --bg-body: #e8e0d5;
            --bg-paper: #f6f0e7;
            --bg-card: #fcf8f0;
            --text-primary: #1f1a16;
            --text-secondary: #2c241e;
            --text-muted: #5a4d42;
            --text-muted-light: #8a7a6a;
            --border-light: #d5c8b8;
            --border-card: #c4b4a0;
            --shadow: 0 8px 32px rgba(44, 36, 30, 0.12);
            --radius: 12px;
            --font: "Courier New", "Source Code Pro", "PingFang SC", monospace;
            --transition: 0.3s ease;
            --accent: #8a2a1a;
            --accent-soft: rgba(138, 42, 26, 0.06);
        }
        [data-theme="dark"] {
            --bg-body: #1a1614;
            --bg-paper: #24201c;
            --bg-card: #2d2824;
            --text-primary: #cfc8c0;
            --text-secondary: #b8aea4;
            --text-muted: #8a8078;
            --text-muted-light: #6a6560;
            --border-light: #35302a;
            --border-card: #4a443e;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --accent: #b05a4a;
            --accent-soft: rgba(176, 90, 74, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .bg-texture {
            position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: 0.5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }
        .bg-vignette {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 55%, rgba(0,0,0,0.06) 100%);
        }
        [data-theme="dark"] .bg-vignette {
            background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.35) 100%);
        }

        /* ===== 左侧浮动菜单标签 ===== */
        .sidebar-tab {
            position: fixed;
            left: 0; top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-left: none;
            border-radius: 0 20px 20px 0;
            padding: 16px 10px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: opacity 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: var(--font);
            user-select: none;
            opacity: 0.35;
            touch-action: none;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
        }
        .sidebar-tab:hover,
        .sidebar-tab.dragging {
            opacity: 1;
            border-color: var(--accent);
            color: var(--accent);
        }
        .sidebar-tab.detached {
            border-radius: 20px;
            border: 1px solid var(--border-card);
            padding: 16px 12px;
        }

        /* ===== 右侧菜单遮罩与面板 ===== */
        .menu-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.15); z-index: 98;
            opacity: 0; pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .menu-overlay.show { opacity: 1; pointer-events: auto; }

        .float-menu-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 220px;
            background: var(--bg-card);
            border-left: 1px solid var(--border-card);
            box-shadow: -4px 0 20px rgba(0,0,0,0.06);
            z-index: 99;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 20px 16px;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            overflow-y: auto;
        }
        .float-menu-panel.open { transform: translateX(0); }
        .float-menu-item {
            background: none; border: none; border-radius: 6px;
            padding: 10px 12px; font-family: var(--font); font-size: 0.85rem;
            color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
            text-align: left; display: flex; align-items: center; gap: 8px;
            text-decoration: none;
        }
        .float-menu-item:hover { background: var(--accent-soft); color: var(--accent); }
        .float-menu-item .icon { font-size: 0.9rem; }

        /* ===== 主容器 ===== */
        #app {
            flex: 1; width: 100%; height: 100%;
            padding: 8px 12px 12px 12px;
            display: flex; flex-direction: column;
            align-items: center;
        }
        .medical-card {
            background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius);
            box-shadow: var(--shadow); position: relative;
            width: 100%; max-width: 860px; margin: 0 auto;
            height: 100%;
            animation: cardIn 0.45s ease forwards; overflow: hidden;
            display: flex; flex-direction: column;
        }
        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 顶部信息栏 ===== */
        .top-bar {
            padding: 10px 20px 8px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            flex-shrink: 0;
        }
        .scene-tag {
            font-size: 0.85rem; color: var(--accent); font-weight: 700;
            letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .progress-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .progress-bar {
            width: 100px; height: 3px; background: var(--border-light); border-radius: 2px; overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; }
        .progress-text { font-size: 0.7rem; color: var(--text-muted-light); min-width: 30px; text-align: right; }

        .medical-header {
            text-align: center; border-bottom: 1px solid var(--border-card);
            padding: 10px 16px 8px 16px; flex-shrink: 0;
        }
        .medical-header .title { font-size: 1.15rem; font-weight: 700; letter-spacing: 3px; color: var(--text-primary); }
        .medical-header .sub { font-size: 0.78rem; color: var(--text-muted-light); letter-spacing: 1px; margin-top: 2px; }

        /* ===== 内容区 ===== */
        .game-body {
            padding: 12px 24px 12px 24px; position: relative;
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }

        .narration-box {
            padding: 8px 0; transition: opacity 0.4s ease;
            flex: 1; display: flex;
            align-items: flex-start;
            overflow-y: auto;
            min-height: 0;
        }
        .narration-box.hidden { opacity: 0; pointer-events: none; flex: 0; padding: 0; overflow: hidden; }
        .narration-text {
            font-size: 1.18rem; line-height: 2.0; color: var(--text-secondary);
            text-indent: 2em; opacity: 0; width: 100%;
            padding-top: 2vh;
            letter-spacing: 0.02em;
        }
        .narration-text.show { animation: narrFadeIn 0.6s ease forwards; }
        @keyframes narrFadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .choice-box {
            padding: 8px 0 12px 0; display: none; flex-direction: column; gap: 8px;
            animation: cardIn 0.4s ease forwards; flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .choice-box.active { display: flex; }
        .choice-btn {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-card); border-radius: 8px;
            background: var(--bg-paper); color: var(--text-secondary); font-family: var(--font);
            font-size: 1.0rem; line-height: 1.5; cursor: pointer; transition: all var(--transition);
            text-align: left; position: relative; overflow: hidden;
        }
        .choice-btn::before { content: "▸ "; color: var(--accent); opacity: 0; transition: opacity 0.2s; }
        .choice-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); padding-left: 20px; }
        .choice-btn:hover::before { opacity: 1; }

        .dialogue-box {
            border-top: 1px solid var(--border-light);
            border-left: 3px solid var(--accent);
            padding: 12px 0 6px 12px;
            display: none;
            flex-direction: column; gap: 6px; flex-shrink: 0;
            margin-top: auto;
            background: var(--bg-paper);
            border-radius: 0 8px 8px 0;
            min-height: 80px;
            position: relative;
            z-index: 10;
        }
        .dialogue-box.active { display: flex; }
        .speaker-label {
            font-size: 0.9rem; font-weight: 700; color: var(--accent); letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px;
        }
        .speaker-label::before {
            content: ""; display: inline-block; width: 7px; height: 7px;
            background: var(--accent); border-radius: 50%; opacity: 0.6;
        }
        .dialogue-text { font-size: 1.08rem; line-height: 1.8; color: var(--text-secondary); min-height: 2em; }
        .dialogue-text .inner-os { font-style: italic; color: var(--text-muted); }

        .keyword { color: var(--accent); cursor: pointer; border-bottom: 1px dashed var(--accent); transition: all 0.2s; position: relative; z-index: 20; }
        .keyword:hover { background: var(--accent-soft); }

        /* ===== 底部操作栏 ===== */
        .bottom-bar {
            border-top: 1px solid var(--border-light);
            padding: 8px 20px calc(10px + env(safe-area-inset-bottom)) 20px;
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
            position: relative;
            z-index: 20;
        }
        .step-back-btn {
            font-size: 0.78rem; color: var(--text-muted-light); cursor: pointer;
            transition: all 0.3s; letter-spacing: 1px; opacity: 0; pointer-events: none; user-select: none;
        }
        .step-back-btn.show { opacity: 0.6; pointer-events: auto; }
        .step-back-btn:hover { color: var(--accent); opacity: 1; }
        .auto-play-toggle {
            font-size: 0.78rem; color: var(--text-muted-light); cursor: pointer;
            transition: all 0.3s; letter-spacing: 1px; user-select: none;
            display: flex; align-items: center; gap: 4px;
        }
        .auto-play-toggle:hover, .auto-play-toggle.active { color: var(--accent); }
        .click-hint {
            font-size: 0.78rem; color: var(--text-muted-light); opacity: 0;
            transition: opacity 0.3s; pointer-events: none; letter-spacing: 1px;
        }
        .click-hint.show { opacity: 0.6; animation: hintBlink 1.5s infinite; }
        @keyframes hintBlink { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

        .click-layer { position: absolute; inset: 0; z-index: 5; cursor: pointer; }
        .click-layer.disabled { pointer-events: none; display: none; }

        /* ===== 日志面板 ===== */
        .log-panel {
            position: fixed; left: 0; top: 0; bottom: 0; width: 320px;
            background: var(--bg-card); border-right: 1px solid var(--border-card);
            z-index: 200; transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            padding: 16px; overflow-y: auto; display: flex; flex-direction: column;
        }
        .log-panel.open { transform: translateX(0); }
        .log-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.15); z-index: 199;
            opacity: 0; pointer-events: none; transition: opacity 0.35s;
        }
        .log-overlay.show { opacity: 1; pointer-events: auto; }
        .log-header { font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; color: var(--text-primary); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-light); }
        .log-list { flex: 1; overflow-y: auto; font-size: 0.88rem; }
        .log-entry { padding: 8px 0; border-bottom: 1px solid var(--border-light); }
        .log-entry:last-child { border-bottom: none; }
        .log-speaker { font-size: 0.78rem; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
        .log-text { color: var(--text-secondary); line-height: 1.6; }
        .log-close { align-self: flex-end; background: none; border: none; font-size: 1.2rem; color: var(--text-muted-light); cursor: pointer; margin-bottom: 6px; }
        .log-close:hover { color: var(--accent); }

        /* ===== 弹窗通用 ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 300;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius);
            padding: 20px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto;
            box-shadow: var(--shadow); position: relative;
        }
        .modal-header { font-size: 1.05rem; font-weight: 700; letter-spacing: 2px; color: var(--text-primary); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border-light); }
        .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 1.2rem; color: var(--text-muted-light); cursor: pointer; font-family: inherit; }
        .modal-close:hover { color: var(--accent); }

        /* 存档 */
        .save-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .save-slot {
            border: 1px solid var(--border-card); border-radius: 8px; padding: 12px;
            cursor: pointer; transition: all 0.2s; color: var(--text-secondary);
        }
        .save-slot:hover { border-color: var(--accent); background: var(--accent-soft); }
        .save-slot.empty { cursor: default; color: var(--text-muted-light); }
        .save-slot.empty:hover { border-color: var(--border-card); background: transparent; }
        .slot-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
        .slot-preview { font-size: 0.82rem; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 设置 */
        .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 0.9rem; color: var(--text-secondary); }
        .setting-control { display: flex; align-items: center; gap: 8px; }
        .setting-control input[type="range"] { width: 100px; }
        .setting-control select {
            background: var(--bg-paper); border: 1px solid var(--border-card); border-radius: 4px;
            padding: 5px 8px; font-family: var(--font); font-size: 0.82rem; color: var(--text-secondary);
        }
        .setting-btn {
            padding: 8px 24px; border-radius: 6px; border: 1px solid var(--accent);
            background: var(--accent-soft); color: var(--accent); font-family: var(--font); font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s; letter-spacing: 1px; margin-top: 6px;
        }
        .setting-btn:hover { background: var(--accent); color: var(--bg-card); }

        /* 词典 */
        .dict-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.15); z-index: 400;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .dict-overlay.show { opacity: 1; pointer-events: auto; }
        .dict-card {
            background: var(--bg-card); border: 1px solid var(--border-card);
            border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0;
            padding: 18px 20px; width: 90%; max-width: 400px; box-shadow: var(--shadow); position: relative;
        }
        .dict-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
        .dict-content { font-size: 0.92rem; color: var(--text-secondary); line-height: 1.8; }
        .dict-status { font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; letter-spacing: 1px; }
        .dict-close { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 1rem; color: var(--text-muted-light); cursor: pointer; }
        .dict-close:hover { color: var(--accent); }

        @media (max-width: 700px) {
            .medical-header .title { font-size: 1.05rem; }
            .medical-header .sub { font-size: 0.72rem; }
            .game-body { padding: 10px 16px 10px 16px; }
            .narration-text { font-size: 1.08rem; line-height: 1.9; padding-top: 1vh; }
            .dialogue-text { font-size: 1.0rem; }
            .choice-btn { font-size: 0.95rem; padding: 11px 14px; }
            .speaker-label { font-size: 0.85rem; }
            .top-bar { padding: 8px 14px 6px 14px; }
            .scene-tag { font-size: 0.78rem; }
            .progress-bar { width: 80px; }
            .bottom-bar { padding: 6px 14px calc(8px + env(safe-area-inset-bottom)) 14px; }
            .step-back-btn, .auto-play-toggle, .click-hint { font-size: 0.72rem; }
            .log-panel { width: 260px; padding: 14px; }
            .save-grid { grid-template-columns: 1fr; }
            .modal-card { padding: 16px; }
            .float-menu-panel { width: 200px; padding: 16px 12px; }
            .sidebar-tab { padding: 14px 8px; font-size: 0.65rem; border-radius: 0 18px 18px 0; }
        }
        @media (max-width: 420px) {
            .medical-header .title { font-size: 0.95rem; }
            .narration-text { font-size: 1.02rem; line-height: 1.8; }
            .dialogue-text { font-size: 0.95rem; }
            .choice-btn { font-size: 0.9rem; padding: 10px 12px; }
            .speaker-label { font-size: 0.8rem; }
            .log-panel { width: 220px; }
            .float-menu-panel { width: 180px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-texture"></div>
    <div class="bg-vignette"></div>

    <!-- 左侧浮动菜单标签 -->
    <div class="sidebar-tab" id="sidebarTab">菜单</div>

    <!-- 右侧菜单遮罩 -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- 右侧菜单面板 -->
    <div class="float-menu-panel" id="floatMenuPanel">
        <button class="float-menu-item" onclick="GameEngine.toggleBgm(); toggleFloatMenu();">
            <span class="icon" id="bgmIcon">🔇</span> <span id="bgmLabel">BGM</span>
        </button>
        <button class="float-menu-item" onclick="GameEngine.toggleLog(); toggleFloatMenu();">
            <span class="icon">📋</span> 日志
        </button>
        <button class="float-menu-item" onclick="GameEngine.openSettings(); toggleFloatMenu();">
            <span class="icon">⚙️</span> 设置
        </button>
        <button class="float-menu-item" onclick="GameEngine.openSaveMenu(); toggleFloatMenu();">
            <span class="icon">💾</span> 存档
        </button>
        <button class="float-menu-item" onclick="GameEngine.openLoadMenu(); toggleFloatMenu();">
            <span class="icon">📂</span> 读档
        </button>
        <a class="float-menu-item" href="./index.html" onclick="toggleFloatMenu();">
            <span class="icon">←</span> 目录
        </a>
        <button class="float-menu-item" onclick="ThemeManager.toggle(); toggleFloatMenu();">
            <span class="icon" id="themeIcon">🌙</span> <span id="themeLabel">夜间</span>
        </button>
    </div>

    <!-- 左侧日志 -->
    <div class="log-overlay" id="logOverlay" onclick="GameEngine.closeLog()"></div>
    <div class="log-panel" id="logPanel">
        <button class="log-close" onclick="GameEngine.closeLog()">✕</button>
        <div class="log-header">📋 剧情日志</div>
        <div class="log-list" id="logList"></div>
    </div>

    <!-- 存档/读档弹窗 -->
    <div class="modal-overlay" id="savePanelOverlay" onclick="GameEngine.closeSaveMenu()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="GameEngine.closeSaveMenu()">✕</button>
            <div class="modal-header" id="savePanelTitle">存档管理</div>
            <div class="save-grid" id="saveSlots"></div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsOverlay" onclick="GameEngine.closeSettings()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="GameEngine.closeSettings()">✕</button>
            <div class="modal-header">系统设置</div>
            <div class="setting-row">
                <span class="setting-label">文字速度</span>
                <div class="setting-control">
                    <select id="settingSpeed"><option value="60">慢</option><option value="30" selected>中</option><option value="10">快</option></select>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label">BGM 音量</span>
                <div class="setting-control"><input type="range" id="settingBgm" min="0" max="100" value="30"><span id="bgmVal">30%</span></div>
            </div>
            <div class="setting-row">
                <span class="setting-label">音效音量</span>
                <div class="setting-control"><input type="range" id="settingSfx" min="0" max="100" value="50"><span id="sfxVal">50%</span></div>
            </div>
            <div style="text-align:center;margin-top:10px;">
                <button class="setting-btn" onclick="GameEngine.applySettings()">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 词典弹窗 -->
    <div class="dict-overlay" id="dictOverlay" onclick="GameEngine.closeDict()">
        <div class="dict-card" id="dictCard" onclick="event.stopPropagation()">
            <button class="dict-close" onclick="GameEngine.closeDict()">✕</button>
            <div class="dict-title" id="dictTitle"></div>
            <div class="dict-content" id="dictContent"></div>
            <div class="dict-status" id="dictStatus"></div>
        </div>
    </div>

    <div id="app">
        <div class="medical-card game-card" id="gameCard">
            <div class="top-bar">

    <script>
        function toggleFloatMenu() {
            const panel = document.getElementById('floatMenuPanel');
            const overlay = document.getElementById('menuOverlay');
            panel.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        document.getElementById('menuOverlay').addEventListener('click', function() {
            document.getElementById('floatMenuPanel').classList.remove('open');
            this.classList.remove('show');
        });

        document.getElementById('settingBgm').addEventListener('input', e => document.getElementById('bgmVal').textContent = e.target.value + '%');
        document.getElementById('settingSfx').addEventListener('input', e => document.getElementById('sfxVal').textContent = e.target.value + '%');

        // ===== 左侧标签拖动逻辑 =====
        document.addEventListener('DOMContentLoaded', function() {
            const tab = document.getElementById('sidebarTab');
            if (!tab) return;

            let isDragging = false;
            let hasMoved = false;
            let startX, startY, initialLeft, initialTop;
            const MOVE_THRESHOLD = 5;

            function onPointerDown(e) {
                const clientX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousedown' ? e.clientY : e.touches[0].clientY;

                isDragging = true;
                hasMoved = false;
                startX = clientX;
                startY = clientY;

                const rect = tab.getBoundingClientRect();
                if (!tab.dataset.fixed) {
                    tab.style.transform = 'none';
                    tab.style.top = rect.top + 'px';
                    tab.style.left = rect.left + 'px';
                    tab.dataset.fixed = '1';
                }

                initialTop = parseFloat(tab.style.top) || rect.top;
                initialLeft = parseFloat(tab.style.left) || rect.left;

                tab.classList.add('dragging');

                if (e.type === 'touchstart') {
                    document.addEventListener('touchmove', onPointerMove, { passive: false });
                    document.addEventListener('touchend', onPointerUp);
                } else {
                    document.addEventListener('mousemove', onPointerMove);
                    document.addEventListener('mouseup', onPointerUp);
                }
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                e.preventDefault();

                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
                    hasMoved = true;
                    tab.classList.add('detached');
                }

                let newTop = initialTop + dy;
                let newLeft = initialLeft + dx;

                const maxTop = window.innerHeight - tab.offsetHeight;
                const maxLeft = window.innerWidth - tab.offsetWidth;

                newTop = Math.max(0, Math.min(newTop, maxTop));
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));

                tab.style.top = newTop + 'px';
                tab.style.left = newLeft + 'px';
            }

            function onPointerUp(e) {
                if (!isDragging) return;
                isDragging = false;
                tab.classList.remove('dragging');

                document.removeEventListener('mousemove', onPointerMove);
                document.removeEventListener('mouseup', onPointerUp);
                document.removeEventListener('touchmove', onPointerMove);
                document.removeEventListener('touchend', onPointerUp);

                if (!hasMoved) {
                    toggleFloatMenu();
                }
            }

            tab.addEventListener('mousedown', onPointerDown);
            tab.addEventListener('touchstart', onPointerDown, { passive: false });
        });

        // ===== 关键词词典 =====
        const keywords = {
            '归终殿': { desc: '地府六殿卞城王设立的专门机构，负责引渡滞留人间的冤魂。编制仅限十位正式引渡人，外加一批打杂的小引渡人。存续近四百年。' },
            '引渡人': { desc: '归终殿的核心执行人员。拥有实体，能流血受伤，却又非纯粹的凡人肉身，可自由穿梭阴阳，调动阴气法力。主要职责是收束滞留人间的冤魂。' },
            '引契': { desc: '归终殿派发任务的凭证，类似人间的公文。引渡人凭引契前往指定地点收束冤魂。任务堆积如山，高可及梁。' },
            '枉死城': { desc: '地府收容因天灾人祸不能寿终正寝的魂魄之所。部分魂魄在前往枉死城的途中被漏掉，滞留在人间成为孤魂野鬼。' },
            '卞城王': { desc: '地府第六殿阎王，归终殿的创立者。对「十全十美」有莫名执念，因此正式引渡人编制仅限十位。' },
            '杯中良缘': { desc: '醉梦客栈特有的风俗。喝下对方递来的酒，即表示愿意与对方结为「有缘人」。' },
            '冤魂': { desc: '因非正常死亡而滞留人间的魂魄。停留时间越长，成为怨魂乃至厉鬼的几率越大。' }
        };

        // ===== 场景标签映射 =====
        const sceneMap = {
            0: '🏮 醉梦客栈 · 大堂',
            67: '🌾 无涯村 · 村口',
            88: '🌳 歪脖子老槐树下'
        };

        // ===== BGM 映射 =====
        const bgmMap = {};

        // ===== 剧情脚本 =====
        const script = [
            { type: 'narration', text: '你推开醉梦客栈的门时，没有野鬼遍地，也没有阴风阵阵。大堂里坐满了人，划拳的、喝酒的、聊天的，喧闹得像个庙会。' },
            { type: 'narration', text: '你低头看了看自己这身黑衣长袍，现在站在一群短打布衣的村民中间，像个误入菜市场的送葬队伍领班。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（地府那帮文书是不是又把卷宗拿反了？）', inner: true },
            { type: 'narration', text: '你选了个靠门的角落坐下，小二擦了两下桌面就算招呼过了，你给自己倒了杯酒，开始盘算任期还剩多少年。' },
            { type: 'narration', text: '正走着神，一阵汗味突然糊到了你面前。你抬头，看见一张络腮胡几乎遮住半张脸的粗糙面孔。男人嘿嘿笑着，眼睛在你身上上下扫了好几下。' },
            { type: 'dialogue', speaker: '王铁柱', text: '这位小哥，我看你有些面生啊，家住何方？' },
            { type: 'dialogue', speaker: '栾方棋', text: '（大哥，我只是个路过的打工人。你手离我酒杯远点。）', inner: true },
            { type: 'narration', text: '一只满是黑毛的手伸过来，伸手就要抓你的酒杯。你低头看了看自己这只握住酒杯的手，又看了看他那张热切的脸，欲言又止，止言又欲，脑子里做好了最坏的打算。' },
            { type: 'choice', choices: [
                { text: '推过酒杯：家住京城。', next: 9 },
                { text: '坐直身子：我是来引渡亡魂的。', next: 41 }
            ]},

            // ===== 分支A =====
            { type: 'narration', text: '你按下把酒杯抢回来的冲动，反而将它朝大汉的方向推了推，脸上挤出个还算客气的笑。' },
            { type: 'dialogue', speaker: '栾方棋', text: '家住京城。' },
            { type: 'dialogue', speaker: '王铁柱', text: '京城好啊，那小兄弟来这醉梦客栈，也是来……咳咳，寻那「杯中良缘」的？' },
            { type: 'narration', text: '他说「杯中良缘」四个字时，眉毛几乎要飞进头发里，语气百转千回，硬生生把一句普通的话说成了接头暗号。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（何意味。）', inner: true },
            { type: 'narration', text: '你含糊地「嗯」了一声，低头假装在喝酒，打算糊弄两句就找借口走人。但大汉显然把你的含糊当成了默认。' },
            { type: 'dialogue', speaker: '王铁柱', text: '实不相瞒，哥哥我在这醉梦客栈蹲了三天了，就等一个合眼缘的。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（你蹲三天关我什么事？）', inner: true },
            { type: 'narration', text: '他挪了挪屁股，板凳朝你这边又凑了半尺。你不动声色地往后靠了靠，他却不依不饶地又凑近了一些。' },
            { type: 'dialogue', speaker: '王铁柱', text: '小兄弟，你觉得哥哥我怎么样？你方才说家住京城，那想必是见过大世面的。哥哥我不求别的，就想找个踏实人搭伙过日子——咱俩……是不是挺有缘的？' },
            { type: 'narration', text: '你触电般想抽回手，王铁柱却握得更紧，甚至用拇指摩挲你的手背，含情脉脉地看着你。' },
            { type: 'dialogue', speaker: '王铁柱', text: '京城来的公子就是懂规矩。不如今晚就……' },
            { type: 'narration', text: '你猛地往后一仰，差点连人带椅翻过去。' },
            { type: 'dialogue', speaker: '栾方棋', text: '兄台且慢！实不相瞒，我是出家人。' },
            { type: 'narration', text: '你急中生智，一把按住他凑过来的肩膀，脸上挤出个肃穆的表情。' },
            { type: 'dialogue', speaker: '王铁柱', text: '（一愣，脸上的笑容僵在半空）出家人？' },
            { type: 'dialogue', speaker: '栾方棋', text: '对，云游道士，不近女色，也……不近男色。而且身患隐疾，不宜结缘。' },
            { type: 'narration', text: '王铁柱缓缓松开你的手腕，脸上的表情从狂喜转为呆滞，再从呆滞转为羞愤。他猛地一拍桌子。' },
            { type: 'dialogue', speaker: '王铁柱', text: '好你个京城来的！先递酒给我，转头又说自己是道士！戏弄我王铁柱是吧？' },
            { type: 'narration', text: '周围酒客「唰」地一下全看了过来，有人开始窃窃私语。你低头看着地上那只被拍落的杯子，沉默良久。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（活得久真是什么都能见着。）', inner: true },
            { type: 'narration', text: '王铁柱的咒骂声渐渐远去，而你面无表情地喝着酒，将一切世俗的语言都隔绝在外。脸皮而已，无需在意。但你深知这样沉默下去不是办法，任务还得做，地府还得回，于是你站起来，若无其事地开始找人搭话，试图询问最近的村子有没有发生什么灵异事件。' },
            { type: 'narration', text: '经王铁柱一事后，众人看你的目光多少带了点微妙的意味。不知是不是不愿招惹你这个身患隐疾的道士，大多数人都选择了沉默，但也有少数人对你此行的目的感到好奇，并亲切的发问——' },
            { type: 'dialogue', speaker: '中年男人', text: '你再说一次，仔细说说你是来这干什么的？' },
            { type: 'dialogue', speaker: '栾方棋', text: '我是引渡人，主要职责是来引渡人间未归游魂的。' },
            { type: 'dialogue', speaker: '中年男人', text: '你刚不是说你是道士吗？' },
            { type: 'dialogue', speaker: '栾方棋', text: '……道士也分很多种，我是救济苍生那一类的。' },
            { type: 'dialogue', speaker: '众人', text: '哦哦哦原来是这样。' },
            { type: 'dialogue', speaker: '中年女人', text: '（松了口气，操着口方言转身离开）吓死我了，一上来就问我看没看见鬼，我还以为真有鬼呢。' },
            { type: 'dialogue', speaker: '老年人', text: '小伙子，吓唬人可是不对的。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'jump', next: 67 },

            // ===== 分支B =====
            { type: 'narration', text: '你坐直了身子，面不改色，一字一顿。' },
            { type: 'dialogue', speaker: '栾方棋', text: '我是来引渡无涯村亡魂的。' },
            { type: 'dialogue', speaker: '王铁柱', text: '（刚喝了口酒还没咽下去，闻言竟是直接喷了出来）你说什么？' },
            { type: 'narration', text: '你注意到周围几桌的人已经开始往这边看了。你犹豫了一下，还是本着「也许他没听清」的心态，重复了一遍。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（理直气壮）我是来引渡无涯村亡魂的。' },
            { type: 'dialogue', speaker: '王铁柱', text: '那你怎么不早说，还把酒递给我干什么？你想害我啊！' },
            { type: 'narration', text: '他语气激昂，仿佛你不是递了杯酒，而是递了碗砒霜。而此时，看完全程的小二贴心的凑过来为你解释了一下何为杯中良缘。' },
            { type: 'narration', text: '小二凑过来为你解释：在醉梦客栈，喝下对方的酒就是要寻你做「有缘人」的意思。您既不阻止，还主动把酒送过去，那不就是把自己的情缘送过去了吗？' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'narration', text: '你低头瞧见那只被大汉丢在地上的杯子，喉结艰难地滚动了一下。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（活得久真是什么都能见着。）', inner: true },
            { type: 'narration', text: '王铁柱似乎是觉得十分晦气，转头就走了，随便找了张桌子坐下，开始向周围人讲述自己的经历。' },
            { type: 'dialogue', speaker: '王铁柱', text: '你们是没看见啊，我看那小子穿得跟个送葬的似的，模样还算周正，又一个人坐了这么久，还以为他是个懂规矩的呢！' },
            { type: 'dialogue', speaker: '王铁柱', text: '我好心过去搭话，结果他竟然说什么，他是个道士，还要勾我的魂！' },
            { type: 'narration', text: '男人愤愤不平，嗓门还大，经他这一嚎几乎半个客栈的人都听得到，丝毫不在意栾方棋就在离他几米远的位置。虽说栾方棋觉得自己细胳膊细腿的不像是能渣了那胡子大汉的样子，但其他人显然不那么认为。看过来的眼神满是探究，甚至还隐约听见了几声关于他独特品味的议论。' },
            { type: 'narration', text: '片刻后，王铁柱的咒骂声渐渐远去，而你面无表情地喝着酒，将一切世俗的语言都隔绝在外。脸皮而已，无需在意。但你深知这样沉默下去不是办法，任务还得做，地府还得回，于是你站起来，若无其事地开始找人搭话，试图询问最近的村子有没有发生什么灵异事件。' },
            { type: 'narration', text: '经此一事后，众人看你的目光多少带了点微妙的意味。不知是不是不愿招惹你这个神秘的勾魂使者，大多数人都选择了沉默，但也有少数人对你此行的目的感到好奇，并亲切的发问——' },
            { type: 'dialogue', speaker: '中年男人', text: '你再说一次，仔细说说你是来这干什么的？' },
            { type: 'dialogue', speaker: '栾方棋', text: '我是引渡人，主要职责是来引渡人间未归游魂的。' },
            { type: 'dialogue', speaker: '中年男人', text: '他说他是个道士。' },

            { type: 'dialogue', speaker: '众人', text: '哦哦哦原来是这样。' },
            { type: 'dialogue', speaker: '王铁柱', text: '（又挤了进来，拍着胸脯道）我就说我没骗人吧，他就是这么说的！还要勾我的魂！' },
            { type: 'dialogue', speaker: '老年人', text: '小伙子，勾魂可是不对的。' },
            { type: 'dialogue', speaker: '中年女人', text: '（松了口气，操着口方言转身离开）吓死我了，一上来就问我看没看见鬼，我还以为真有鬼呢。' },

            { type: 'narration', text: '你果断放弃了与这群活在太平盛世表象下的村民深入探讨「亡魂滞留」的学术问题。人群聚得快，散得也快。' },

            { type: 'dialogue', speaker: '老者', text: '收妖，老夫年轻时可是此道翘楚！你会夜观天象否，或者会召唤亡灵，借尸还魂？看得出我气运如何，是否印堂发黑？还是说你会呼风唤雨，召集各方瑞兽前来祈福？' },
            { type: 'dialogue', speaker: '栾方棋', text: '（何意味）', inner: true },
            { type: 'dialogue', speaker: '栾方棋', text: '……都不会。' },
            { type: 'dialogue', speaker: '众人', text: '（一阵唏嘘）', inner: true },
            { type: 'narration', text: '老者沉默半晌，重新捡起地上的担子，语气里满是恨铁不成钢的嫌弃。' },
            { type: 'dialogue', speaker: '老者', text: '嘶……年轻人，道行浅了点啊。我年轻时比这厉害多了都混不上几顿饱饭，如今这世道，可养不起光吃饭不办事的道士！' },
            { type: 'narration', text: '眼见着老人要走，栾方棋在心里衡量了一下平时引渡人的工作，赶紧开口——' },
            { type: 'dialogue', speaker: '栾方棋', text: '我……我也许会净化土地，收冤魂，保一方平安什么的。（急病乱投医）' },
            { type: 'narration', text: '召唤祥瑞什么的太夸张了，那是天上神仙才能做到的事情，他顶多能召唤几只鬼出来。该说不说，也许在归终殿随便拉个人出来都比不上那些会呼风唤雨的道士，毕竟他们最擅长的除了打架就是引魂，随便借尸还魂这种事还真做不到。' },
            { type: 'dialogue', speaker: '老者', text: '（依旧恨铁不成钢）唉，年轻人，道行浅啊，再练练，再练练吧！' },
            { type: 'narration', text: '话音未落，人已挑着担晃晃悠悠地消失在了人群外。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'narration', text: '你望着老人挑着担远去的背影，依旧很难想象他召唤瑞兽的样子。来了半天什么有用的信息都没问出来，你沉默了一会儿，决定出门找找情报。' },
            { type: 'narration', text: '干你们这一行的常被人误认为江湖术士，倒也无可厚非，毕竟在某种意义上，你们确实起到了江湖术士的作用——收冤魂，保一方水土什么的。' },
            { type: 'narration', text: '一般来说引渡人的工作晚上会更方便执行，且更多情况下，引魂的地方根本就看不到人，从来没出现过现在这种被人围观的场面。' },
            { type: 'narration', text: '由于引渡人的身份特殊性，他们在人间引魂从不藏着掖着，直接暴露身份的不在少数，反正过后普通人也会被抹除记忆，倒是十分省事。想清楚这一点后，你埋头往门外走。刚抬脚跨出客栈大门，却见不远处同样头戴斗笠脸披面纱的女人。' },
            { type: 'narration', text: '那女人一眼便看到了你。目光相接的瞬间，她一把推开人群，快步上前拉住你的衣袖。' },
            { type: 'dialogue', speaker: '冉舟', text: '（低声）栾方棋？你也……接到这个任务了？' },
            { type: 'narration', text: '来者正是冉舟，是你来自地府的同门师姐，席位比你高一级，但实力远远不止高一级。' },
            { type: 'narration', text: '你将斗笠取下，望着面前的人，同样非常震惊。' },
            { type: 'dialogue', speaker: '栾方棋', text: '难道你也是？？' },
            { type: 'narration', text: '两人对视一眼，无需多言，极为默契地从兜里掏出一张被雨水浸得有些皱巴的纸，上面赫然写着同样冰冷简洁的字句：京城郊外，无涯村，冤魂收束。归终殿派发。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'dialogue', speaker: '冉舟', text: '……' },
            { type: 'dialogue', speaker: '栾方棋', text: '（早知道有人来我就不来了。）', inner: true },
            { type: 'narration', text: '两人相对无言，周围的人瞧见俩衣着怪异的人立在街头，审视的目光愈发炽烈，时不时对二人的打扮评头论足，猜测他们的身份。' },
            { type: 'narration', text: '冉舟默不作声地将纸揣回怀里，一把拉住栾方棋的胳膊，将他扯到路旁一棵歪脖子老槐树下，确认避开了人群才叹气道——' },
            { type: 'dialogue', speaker: '冉舟', text: '归终殿那「十全十美」的编制……这次竟舍得派两位正式引渡人同来？看来这无涯村的钉子户怕是不好拔啊。' },
            { type: 'narration', text: '归终殿编制仅限十位引渡人，据传是六殿下对「十全十美」的莫名执念。平日任务堆积如山，人手捉襟见肘都是常态。' },
            { type: 'narration', text: '一开始，归终殿的建立是为了处理那些阴差不便插手，滞留人间的麻烦魂魄。也因此，引渡人成了地府最特殊的一类人——拥有实体，能流血受伤，却又非纯粹的凡人肉身，可自由穿梭阴阳，调动阴气法力。' },
            { type: 'narration', text: '大概是因为后来发现这随意建立的临时收容所相当的好用，便一直延续至今，存续了近四百年。' },
            { type: 'narration', text: '你每次路过归终殿都能瞥见殿内引契堆积如山，高可及梁。从前的你并不知道为什么引渡人永远只有十个，直到殿内的某位前辈告诉你——这「十」的限制，是卞城王殿下对「精简机构」的独特理解。' },
            { type: 'narration', text: '后来许是殿下自己也看不过眼，才大发慈悲增设了一批打杂的小引渡人，聊作补充。但正式的引渡人，依旧只有十个。物以稀为贵，像现在这种连续派出两个正式引渡人解决同一个问题是极度少见的，一般都是重大事件。' },
            { type: 'narration', text: '所以两人在见面时都不约而同的捏了一把冷汗，颇有种英勇赴死的感慨。' },
            { type: 'narration', text: '不情愿归不情愿，任务还是要做的，在简单了解了前后情况之后，两人有了共同的决定：先去城里买件衣裳。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（……下个月的引契果然还是会堆成山砸我脸上。）', inner: true },
            { type: 'narration', text: '【节点一 · 完】', ending: true }
        ];

    </script>
