<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归终殿 · 引契 · 节点一</title>
    <style>
        :root {
            --bg-body: #e8e0d5;
            --bg-paper: #f6f0e7;
            --bg-card: #fcf8f0;
            --text-primary: #1f1a16;
            --text-secondary: #2c241e;
            --text-muted: #5a4d42;
            --text-muted-light: #8a7a6a;
            --border-light: #d5c8b8;
            --border-card: #c4b4a0;
            --shadow: 0 8px 32px rgba(44, 36, 30, 0.12);
            --radius: 12px;
            --font: "Courier New", "Source Code Pro", "PingFang SC", monospace;
            --transition: 0.3s ease;
            --accent: #8a2a1a;
            --accent-soft: rgba(138, 42, 26, 0.06);
        }

        [data-theme="dark"] {
            --bg-body: #1a1614;
            --bg-paper: #24201c;
            --bg-card: #2d2824;
            --text-primary: #cfc8c0;
            --text-secondary: #b8aea4;
            --text-muted: #8a8078;
            --text-muted-light: #6a6560;
            --border-light: #35302a;
            --border-card: #4a443e;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --accent: #b05a4a;
            --accent-soft: rgba(176, 90, 74, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 0 16px 30px 16px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .float-group {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .float-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 6px 14px 6px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            letter-spacing: 0.3px;
            text-decoration: none;
        }

        .float-btn:hover { border-color: var(--accent); color: var(--accent); }
        .float-btn .icon { font-size: 0.9rem; }

        #app {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 0 0 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .medical-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 24px 28px 30px 28px;
            box-shadow: var(--shadow);
            position: relative;
            width: 100%;
            animation: cardIn 0.45s ease forwards;
        }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .medical-header {
            text-align: center;
            border-bottom: 2px solid var(--border-card);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .medical-header .title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-primary);
        }

        .medical-header .sub {
            font-size: 0.85rem;
            color: var(--text-muted-light);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* ===== 游戏界面 ===== */
        .game-card {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 旁白区 */
        .narration-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            padding: 12px 8px;
            transition: opacity 0.4s ease;
        }

        .narration-box.hidden { opacity: 0; pointer-events: none; }

        .narration-text {
            font-size: 1.15rem;
            line-height: 2;
            color: var(--text-secondary);
            text-indent: 2em;
            width: 100%;
            opacity: 0;
        }

        .narration-text.show {
            animation: narrFadeIn 0.6s ease forwards;
        }

        @keyframes narrFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 选项区 */
        .choice-box {
            padding: 16px 12px;
            display: none;
            flex-direction: column;
            gap: 10px;
            animation: cardIn 0.4s ease forwards;
        }

        .choice-box.active { display: flex; }

        .choice-btn {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border-card);
            border-radius: 8px;
            background: var(--bg-paper);
            color: var(--text-secondary);
            font-family: var(--font);
            font-size: 1.0rem;
            line-height: 1.6;
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn::before {
            content: "▸ ";
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .choice-btn:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
            padding-left: 22px;
        }

        .choice-btn:hover::before { opacity: 1; }

        /* 对话框区 */
        .dialogue-box {
            border-top: 1px solid var(--border-light);
            padding-top: 16px;
            margin-top: auto;
            min-height: 120px;
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .dialogue-box.active { display: flex; }

        .speaker-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-label::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.6;
        }

        .dialogue-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-secondary);
            min-height: 3em;
        }

        .dialogue-text .inner-os {
            font-style: italic;
            color: var(--text-muted);
        }

        /* 点击推进提示 */
        .click-hint {
            position: absolute;
            bottom: 14px;
            right: 22px;
            font-size: 0.8rem;
            color: var(--text-muted-light);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .click-hint.show { opacity: 0.6; animation: hintBlink 1.5s infinite; }

        @keyframes hintBlink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* 上一句按钮 */
        .step-back-btn {
            position: absolute;
            bottom: 14px;
            left: 22px;
            font-size: 0.8rem;
            color: var(--text-muted-light);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            user-select: none;
        }

        .step-back-btn.show {
            opacity: 0.6;
            pointer-events: auto;
        }

        .step-back-btn:hover {
            color: var(--accent);
            opacity: 1;
        }

        /* 推进点击层（选项出现时禁用） */
        .click-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            cursor: pointer;
        }

        .click-layer.disabled { pointer-events: none; display: none; }

        @media (max-width: 700px) {
            body { padding: 0 10px 20px 10px; }
            .medical-card { padding: 18px 16px 22px 16px; }
            .medical-header .title { font-size: 1.1rem; }
            .medical-header .sub { font-size: 0.8rem; }
            .narration-text { font-size: 1.05rem; line-height: 1.9; }
            .dialogue-text { font-size: 1.0rem; }
            .choice-btn { font-size: 0.95rem; padding: 12px 14px; }
            .speaker-label { font-size: 0.88rem; }
            .float-group { top: 12px; right: 12px; gap: 6px; }
            .float-btn { padding: 5px 11px 5px 9px; font-size: 0.7rem; }
            .click-hint, .step-back-btn { font-size: 0.75rem; }
        }

        @media (max-width: 420px) {
            .medical-card { padding: 14px 12px 18px 12px; }
            .narration-text { font-size: 1.0rem; }
            .dialogue-text { font-size: 0.95rem; }
            .choice-btn { font-size: 0.9rem; padding: 10px 12px; }
            .speaker-label { font-size: 0.85rem; }
            .click-hint, .step-back-btn { font-size: 0.72rem; }
        }
    </style>
</head>
<body>

    <div class="float-group">
        <a class="float-btn" href="./index.html">
            <span class="icon">←</span> 返回目录
        </a>
        <button class="float-btn" id="themeBtn" onclick="toggleTheme()">
            <span class="icon">🌙</span> 夜间
        </button>
    </div>

    <div id="app">
        <div class="medical-card game-card" id="gameCard">
            <div class="medical-header" style="margin-bottom: 12px; border-bottom-width: 1px;">
                <div class="title">｜ 节点一 · 醉梦客栈 ｜</div>
                <div class="sub">CHAPTER 01 · THE DREAM INN</div>
            </div>

            <div class="narration-box" id="narrationBox">
                <div class="narration-text" id="narrationText"></div>
            </div>

            <div class="choice-box" id="choiceBox"></div>

            <div class="dialogue-box" id="dialogueBox">
                <div class="speaker-label" id="speakerLabel"></div>
                <div class="dialogue-text" id="dialogueText"></div>
            </div>

            <div class="step-back-btn" id="stepBackBtn" onclick="event.stopPropagation(); goBack();">
                <span>◀ 上一句</span>
            </div>

            <div class="click-hint" id="clickHint">◆ 点击继续 ◆</div>
            <div class="click-layer" id="clickLayer" onclick="handleClick()"></div>
        </div>
    </div>

    <script>
        // ===== 剧情脚本 =====
        const script = [
            { type: 'narration', text: '你推开醉梦客栈的门时，没有野鬼遍地，也没有阴风阵阵。大堂里坐满了人，划拳的、喝酒的、聊天的，喧闹得像个庙会。' },
            { type: 'narration', text: '你低头看了看自己这身黑衣长袍，现在站在一群短打布衣的村民中间，像个误入菜市场的送葬队伍领班。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（地府那帮文书是不是又把卷宗拿反了？）', inner: true },
            { type: 'narration', text: '你选了个靠门的角落坐下，小二擦了两下桌面就算招呼过了，你给自己倒了杯酒，开始盘算任期还剩多少年。' },
            { type: 'narration', text: '正走着神，一阵汗味突然糊到了你面前。你抬头，看见一张络腮胡几乎遮住半张脸的粗糙面孔。男人嘿嘿笑着，眼睛在你身上上下扫了好几下。' },
            { type: 'dialogue', speaker: '王铁柱', text: '这位小哥，我看你有些面生啊，家住何方？' },
            { type: 'dialogue', speaker: '栾方棋', text: '（大哥，我只是个路过的打工人。你手离我酒杯远点。）', inner: true },
            { type: 'narration', text: '一只满是黑毛的手伸过来，伸手就要抓你的酒杯。你低头看了看自己这只握住酒杯的手，又看了看他那张热切的脸，欲言又止，止言又欲，脑子里做好了最坏的打算。' },
            { type: 'choice', choices: [
                { text: '推过酒杯：家住京城。', next: 9 },
                { text: '坐直身子：我是来引渡亡魂的。', next: 41 }
            ]},

            // ===== 分支A (9-40) =====
            { type: 'narration', text: '你按下把酒杯抢回来的冲动，反而将它朝大汉的方向推了推，脸上挤出个还算客气的笑。' },
            { type: 'dialogue', speaker: '栾方棋', text: '家住京城。' },
            { type: 'dialogue', speaker: '王铁柱', text: '京城好啊，那小兄弟来这醉梦客栈，也是来……咳咳，寻那「杯中良缘」的？' },
            { type: 'narration', text: '他说「杯中良缘」四个字时，眉毛几乎要飞进头发里，语气百转千回，硬生生把一句普通的话说成了接头暗号。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（何意味。）', inner: true },
            { type: 'narration', text: '你含糊地「嗯」了一声，低头假装在喝酒，打算糊弄两句就找借口走人。但大汉显然把你的含糊当成了默认。' },
            { type: 'dialogue', speaker: '王铁柱', text: '实不相瞒，哥哥我在这醉梦客栈蹲了三天了，就等一个合眼缘的。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（你蹲三天关我什么事？）', inner: true },
            { type: 'narration', text: '他挪了挪屁股，板凳朝你这边又凑了半尺。你不动声色地往后靠了靠，他却不依不饶地又凑近了一些。' },
            { type: 'dialogue', speaker: '王铁柱', text: '小兄弟，你觉得哥哥我怎么样？你方才说家住京城，那想必是见过大世面的。哥哥我不求别的，就想找个踏实人搭伙过日子——咱俩……是不是挺有缘的？' },
            { type: 'narration', text: '你触电般想抽回手，王铁柱却握得更紧，甚至用拇指摩挲你的手背，含情脉脉地看着你。' },
            { type: 'dialogue', speaker: '王铁柱', text: '京城来的公子就是懂规矩。不如今晚就……' },
            { type: 'narration', text: '你猛地往后一仰，差点连人带椅翻过去。' },
            { type: 'dialogue', speaker: '栾方棋', text: '兄台且慢！实不相瞒，我是出家人。' },
            { type: 'narration', text: '你急中生智，一把按住他凑过来的肩膀，脸上挤出个肃穆的表情。' },
            { type: 'dialogue', speaker: '王铁柱', text: '（一愣，脸上的笑容僵在半空）出家人？' },
            { type: 'dialogue', speaker: '栾方棋', text: '对，云游道士，不近女色，也……不近男色。而且身患隐疾，不宜结缘。' },
            { type: 'narration', text: '王铁柱缓缓松开你的手腕，脸上的表情从狂喜转为呆滞，再从呆滞转为羞愤。他猛地一拍桌子。' },
            { type: 'dialogue', speaker: '王铁柱', text: '好你个京城来的！先递酒给我，转头又说自己是道士！戏弄我王铁柱是吧？' },
            { type: 'narration', text: '周围酒客「唰」地一下全看了过来，有人开始窃窃私语。你低头看着地上那只被拍落的杯子，沉默良久。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（活得久真是什么都能见着。）', inner: true },
            { type: 'narration', text: '王铁柱的咒骂声渐渐远去，而你面无表情地喝着酒，将一切世俗的语言都隔绝在外。脸皮而已，无需在意。但你深知这样沉默下去不是办法，任务还得做，地府还得回，于是你站起来，若无其事地开始找人搭话，试图询问最近的村子有没有发生什么灵异事件。' },
            { type: 'narration', text: '经王铁柱一事后，众人看你的目光多少带了点微妙的意味。不知是不是不愿招惹你这个身患隐疾的道士，大多数人都选择了沉默，但也有少数人对你此行的目的感到好奇，并亲切的发问——' },
            { type: 'dialogue', speaker: '中年男人', text: '你再说一次，仔细说说你是来这干什么的？' },
            { type: 'dialogue', speaker: '栾方棋', text: '我是引渡人，主要职责是来引渡人间未归游魂的。' },
            { type: 'dialogue', speaker: '中年男人', text: '你刚不是说你是道士吗？' },
            { type: 'dialogue', speaker: '栾方棋', text: '……道士也分很多种，我是救济苍生那一类的。' },
            { type: 'dialogue', speaker: '众人', text: '哦哦哦原来是这样。' },
            { type: 'dialogue', speaker: '中年女人', text: '（松了口气，操着口方言转身离开）吓死我了，一上来就问我看没看见鬼，我还以为真有鬼呢。' },
            { type: 'dialogue', speaker: '老年人', text: '小伙子，吓唬人可是不对的。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'jump', next: 67 },

            // ===== 分支B (41-66) =====
            { type: 'narration', text: '你坐直了身子，面不改色，一字一顿。' },
            { type: 'dialogue', speaker: '栾方棋', text: '我是来引渡无涯村亡魂的。' },
            { type: 'dialogue', speaker: '王铁柱', text: '（刚喝了口酒还没咽下去，闻言竟是直接喷了出来）你说什么？' },
            { type: 'narration', text: '你注意到周围几桌的人已经开始往这边看了。你犹豫了一下，还是本着「也许他没听清」的心态，重复了一遍。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（理直气壮）我是来引渡无涯村亡魂的。' },
            { type: 'dialogue', speaker: '王铁柱', text: '那你怎么不早说，还把酒递给我干什么？你想害我啊！' },
            { type: 'narration', text: '他语气激昂，仿佛你不是递了杯酒，而是递了碗砒霜。而此时，看完全程的小二贴心的凑过来为你解释了一下何为杯中良缘。' },
            { type: 'narration', text: '小二凑过来为你解释：在醉梦客栈，喝下对方的酒就是要寻你做「有缘人」的意思。您既不阻止，还主动把酒送过去，那不就是把自己的情缘送过去了吗？' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'narration', text: '你低头瞧见那只被大汉丢在地上的杯子，喉结艰难地滚动了一下。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（活得久真是什么都能见着。）', inner: true },
            { type: 'narration', text: '王铁柱似乎是觉得十分晦气，转头就走了，随便找了张桌子坐下，开始向周围人讲述自己的经历。' },
            { type: 'dialogue', speaker: '王铁柱', text: '你们是没看见啊，我看那小子穿得跟个送葬的似的，模样还算周正，又一个人坐了这么久，还以为他是个懂规矩的呢！' },
            { type: 'dialogue', speaker: '王铁柱', text: '我好心过去搭话，结果他竟然说什么，他是个道士，还要勾我的魂！' },
            { type: 'narration', text: '男人愤愤不平，嗓门还大，经他这一嚎几乎半个客栈的人都听得到，丝毫不在意栾方棋就在离他几米远的位置。虽说栾方棋觉得自己细胳膊细腿的不像是能渣了那胡子大汉的样子，但其他人显然不那么认为。看过来的眼神满是探究，甚至还隐约听见了几声关于他独特品味的议论。' },
            { type: 'narration', text: '片刻后，王铁柱的咒骂声渐渐远去，而你面无表情地喝着酒，将一切世俗的语言都隔绝在外。脸皮而已，无需在意。但你深知这样沉默下去不是办法，任务还得做，地府还得回，于是你站起来，若无其事地开始找人搭话，试图询问最近的村子有没有发生什么灵异事件。' },
            { type: 'narration', text: '经此一事后，众人看你的目光多少带了点微妙的意味。不知是不是不愿招惹你这个神秘的勾魂使者，大多数人都选择了沉默，但也有少数人对你此行的目的感到好奇，并亲切的发问——' },
            { type: 'dialogue', speaker: '中年男人', text: '你再说一次，仔细说说你是来这干什么的？' },
            { type: 'dialogue', speaker: '栾方棋', text: '我是引渡人，主要职责是来引渡人间未归游魂的。' },
            { type: 'dialogue', speaker: '中年男人', text: '他说他是个道士。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……对的，是道士。' },
            { type: 'dialogue', speaker: '众人', text: '哦哦哦原来是这样。' },
            { type: 'dialogue', speaker: '王铁柱', text: '（又挤了进来，拍着胸脯道）我就说我没骗人吧，他就是这么说的！还要勾我的魂！' },
            { type: 'dialogue', speaker: '老年人', text: '小伙子，勾魂可是不对的。' },
            { type: 'dialogue', speaker: '中年女人', text: '（松了口气，操着口方言转身离开）吓死我了，一上来就问我看没看见鬼，我还以为真有鬼呢。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },

            // ===== 汇合点 (67-末尾) =====
            { type: 'narration', text: '你果断放弃了与这群活在太平盛世表象下的村民深入探讨「亡魂滞留」的学术问题。人群聚得快，散得也快。' },
            { type: 'narration', text: '你刚松了口气，正要出门寻找线索，一位挑着空担子的老者就扒开人群走了进来。' },
            { type: 'dialogue', speaker: '老者', text: '后生，穿得这般别致，可是要去收妖？' },
            { type: 'narration', text: '听到这话，你大为震惊，心想难道真来了个懂行的？' },
            { type: 'dialogue', speaker: '栾方棋', text: '正是，老人家可是听说了村中哪里不太平？' },
            { type: 'dialogue', speaker: '老者', text: '收妖，老夫年轻时可是此道翘楚！你会夜观天象否，或者会召唤亡灵，借尸还魂？看得出我气运如何，是否印堂发黑？还是说你会呼风唤雨，召集各方瑞兽前来祈福？' },
            { type: 'dialogue', speaker: '栾方棋', text: '（何意味）', inner: true },
            { type: 'dialogue', speaker: '栾方棋', text: '……都不会。' },
            { type: 'dialogue', speaker: '众人', text: '（一阵唏嘘）', inner: true },
            { type: 'narration', text: '老者沉默半晌，重新捡起地上的担子，语气里满是恨铁不成钢的嫌弃。' },
            { type: 'dialogue', speaker: '老者', text: '嘶……年轻人，道行浅了点啊。我年轻时比这厉害多了都混不上几顿饱饭，如今这世道，可养不起光吃饭不办事的道士！' },
            { type: 'narration', text: '眼见着老人要走，栾方棋在心里衡量了一下平时引渡人的工作，赶紧开口——' },
            { type: 'dialogue', speaker: '栾方棋', text: '我……我也许会净化土地，收冤魂，保一方平安什么的。（急病乱投医）' },
            { type: 'narration', text: '召唤祥瑞什么的太夸张了，那是天上神仙才能做到的事情，他顶多能召唤几只鬼出来。该说不说，也许在归终殿随便拉个人出来都比不上那些会呼风唤雨的道士，毕竟他们最擅长的除了打架就是引魂，随便借尸还魂这种事还真做不到。' },
            { type: 'dialogue', speaker: '老者', text: '（依旧恨铁不成钢）唉，年轻人，道行浅啊，再练练，再练练吧！' },
            { type: 'narration', text: '话音未落，人已挑着担晃晃悠悠地消失在了人群外。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'narration', text: '你望着老人挑着担远去的背影，依旧很难想象他召唤瑞兽的样子。来了半天什么有用的信息都没问出来，你沉默了一会儿，决定出门找找情报。' },
            { type: 'narration', text: '干你们这一行的常被人误认为江湖术士，倒也无可厚非，毕竟在某种意义上，你们确实起到了江湖术士的作用——收冤魂，保一方水土什么的。' },
            { type: 'narration', text: '一般来说引渡人的工作晚上会更方便执行，且更多情况下，引魂的地方根本就看不到人，从来没出现过现在这种被人围观的场面。' },
            { type: 'narration', text: '由于引渡人的身份特殊性，他们在人间引魂从不藏着掖着，直接暴露身份的不在少数，反正过后普通人也会被抹除记忆，倒是十分省事。想清楚这一点后，你埋头往门外走。刚抬脚跨出客栈大门，却见不远处同样头戴斗笠脸披面纱的女人。' },
            { type: 'narration', text: '那女人一眼便看到了你。目光相接的瞬间，她一把推开人群，快步上前拉住你的衣袖。' },
            { type: 'dialogue', speaker: '冉舟', text: '（低声）栾方棋？你也……接到这个任务了？' },
            { type: 'narration', text: '来者正是冉舟，是你来自地府的同门师姐，席位比你高一级，但实力远远不止高一级。' },
            { type: 'narration', text: '你将斗笠取下，望着面前的人，同样非常震惊。' },
            { type: 'dialogue', speaker: '栾方棋', text: '难道你也是？？' },
            { type: 'narration', text: '两人对视一眼，无需多言，极为默契地从兜里掏出一张被雨水浸得有些皱巴的纸，上面赫然写着同样冰冷简洁的字句：京城郊外，无涯村，冤魂收束。归终殿派发。' },
            { type: 'dialogue', speaker: '栾方棋', text: '……' },
            { type: 'dialogue', speaker: '冉舟', text: '……' },
            { type: 'dialogue', speaker: '栾方棋', text: '（早知道有人来我就不来了。）', inner: true },
            { type: 'narration', text: '两人相对无言，周围的人瞧见俩衣着怪异的人立在街头，审视的目光愈发炽烈，时不时对二人的打扮评头论足，猜测他们的身份。' },
            { type: 'narration', text: '冉舟默不作声地将纸揣回怀里，一把拉住栾方棋的胳膊，将他扯到路旁一棵歪脖子老槐树下，确认避开了人群才叹气道——' },
            { type: 'dialogue', speaker: '冉舟', text: '归终殿那「十全十美」的编制……这次竟舍得派两位正式引渡人同来？看来这无涯村的钉子户怕是不好拔啊。' },
            { type: 'narration', text: '归终殿编制仅限十位引渡人，据传是六殿下对「十全十美」的莫名执念。平日任务堆积如山，人手捉襟见肘都是常态。' },
            { type: 'narration', text: '一开始，归终殿的建立是为了处理那些阴差不便插手，滞留人间的麻烦魂魄。也因此，引渡人成了地府最特殊的一类人——拥有实体，能流血受伤，却又非纯粹的凡人肉身，可自由穿梭阴阳，调动阴气法力。' },
            { type: 'narration', text: '大概是因为后来发现这随意建立的临时收容所相当的好用，便一直延续至今，存续了近四百年。' },
            { type: 'narration', text: '你每次路过归终殿都能瞥见殿内引契堆积如山，高可及梁。从前的你并不知道为什么引渡人永远只有十个，直到殿内的某位前辈告诉你——这「十」的限制，是卞城王殿下对「精简机构」的独特理解。' },
            { type: 'narration', text: '后来许是殿下自己也看不过眼，才大发慈悲增设了一批打杂的小引渡人，聊作补充。但正式的引渡人，依旧只有十个。物以稀为贵，像现在这种连续派出两个正式引渡人解决同一个问题是极度少见的，一般都是重大事件。' },
            { type: 'narration', text: '所以两人在见面时都不约而同的捏了一把冷汗，颇有种英勇赴死的感慨。' },
            { type: 'narration', text: '不情愿归不情愿，任务还是要做的，在简单了解了前后情况之后，两人有了共同的决定：先去城里买件衣裳。' },
            { type: 'dialogue', speaker: '栾方棋', text: '（……下个月的引契果然还是会堆成山砸我脸上。）', inner: true },
            { type: 'narration', text: '【节点一 · 完】', ending: true }
        ];

        // ===== 状态 =====
        let currentIdx = 0;
        let historyStack = [];
        let isTyping = false;
        let typeTimer = null;
        let isChoiceActive = false;
        let isEnded = false;

        // ===== DOM =====
        const narrationBox = document.getElementById('narrationBox');
        const narrationText = document.getElementById('narrationText');
        const choiceBox = document.getElementById('choiceBox');
        const dialogueBox = document.getElementById('dialogueBox');
        const speakerLabel = document.getElementById('speakerLabel');
        const dialogueText = document.getElementById('dialogueText');
        const clickLayer = document.getElementById('clickLayer');
        const clickHint = document.getElementById('clickHint');
        const stepBackBtn = document.getElementById('stepBackBtn');

        // ===== 初始化主题 =====
        (function() {
            try {
                const raw = localStorage.getItem('theme');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.value === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                }
            } catch (e) {}
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.getElementById('themeBtn').innerHTML = isDark ?
                '<span class="icon">☀️</span> 日间' :
                '<span class="icon">🌙</span> 夜间';
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            if (newTheme === 'dark') html.setAttribute('data-theme', 'dark');
            else html.removeAttribute('data-theme');
            localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
            document.getElementById('themeBtn').innerHTML = newTheme === 'dark' ?
                '<span class="icon">☀️</span> 日间' :
                '<span class="icon">🌙</span> 夜间';
        }

        // ===== 游戏控制 =====
        function initGame() {
            historyStack = [];
            currentIdx = 0;
            isEnded = false;
            showStep(0);
        }

        function showStep(idx) {
            if (idx < 0 || idx >= script.length) return;

            if (historyStack[historyStack.length - 1] !== idx) {
                historyStack.push(idx);
            }
            currentIdx = idx;
            const node = script[idx];

            if (node.type === 'jump') {
                showStep(node.next);
                return;
            }

            // 重置状态
            isChoiceActive = false;
            isEnded = false;
            clickHint.classList.remove('show');
            clickLayer.classList.remove('disabled');
            choiceBox.classList.remove('active');
            choiceBox.innerHTML = '';
            isTyping = false;
            clearTimeout(typeTimer);

            // 控制上一句按钮：只要历史里不止一步就显示
            if (historyStack.length > 1) {
                stepBackBtn.classList.add('show');
            } else {
                stepBackBtn.classList.remove('show');
            }

            if (node.type === 'narration') {
                renderNarration(node);
            } else if (node.type === 'dialogue') {
                renderDialogue(node);
            } else if (node.type === 'choice') {
                renderChoice(node);
            }
        }

        function renderNarration(node) {
            dialogueBox.classList.remove('active');
            speakerLabel.textContent = '';
            dialogueText.textContent = '';

            narrationBox.classList.remove('hidden');
            narrationText.textContent = node.text;
            narrationText.classList.remove('show');
            void narrationText.offsetWidth;
            narrationText.classList.add('show');

            if (node.ending) {
                isEnded = true;
                clickLayer.classList.add('disabled');
                // 结尾也保留「上一句」按钮（只要历史长度>1）
                return;
            }

            setTimeout(() => {
                if (!isChoiceActive && !isEnded) clickHint.classList.add('show');
            }, 600);
        }

        function renderDialogue(node) {
            narrationBox.classList.add('hidden');
            narrationText.textContent = '';

            dialogueBox.classList.add('active');
            speakerLabel.textContent = node.speaker || '未知';

            if (node.inner) {
                dialogueText.innerHTML = '<span class="inner-os">' + escapeHtml(node.text) + '</span>';
            } else {
                dialogueText.innerHTML = escapeHtml(node.text);
            }

            const fullHTML = dialogueText.innerHTML;
            const plainText = node.text;
            dialogueText.innerHTML = '';
            isTyping = true;
            clickHint.classList.remove('show');

            let i = 0;
            function typeChar() {
                if (!isTyping) return;
                if (i < plainText.length) {
                    dialogueText.textContent = plainText.substring(0, i + 1);
                    i++;
                    typeTimer = setTimeout(typeChar, 30);
                } else {
                    isTyping = false;
                    dialogueText.innerHTML = fullHTML;
                    if (!isChoiceActive && !isEnded) clickHint.classList.add('show');
                }
            }
            typeChar();
        }

        function renderChoice(node) {
            narrationBox.classList.add('hidden');
            narrationText.textContent = '';
            dialogueBox.classList.remove('active');
            speakerLabel.textContent = '';
            dialogueText.textContent = '';

            isChoiceActive = true;
            clickLayer.classList.add('disabled');
            clickHint.classList.remove('show');
            stepBackBtn.classList.remove('show');
            choiceBox.classList.add('active');
            choiceBox.innerHTML = '';

            node.choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    choiceBox.classList.remove('active');
                    showStep(choice.next);
                };
                choiceBox.appendChild(btn);
            });
        }

        function handleClick() {
            if (isChoiceActive || isEnded) return;

            if (isTyping) {
                isTyping = false;
                clearTimeout(typeTimer);
                const node = script[currentIdx];
                if (node.type === 'dialogue') {
                    if (node.inner) {
                        dialogueText.innerHTML = '<span class="inner-os">' + escapeHtml(node.text) + '</span>';
                    } else {
                        dialogueText.innerHTML = escapeHtml(node.text);
                    }
                }
                clickHint.classList.add('show');
                return;
            }

            const nextIdx = currentIdx + 1;
            if (nextIdx < script.length) {
                showStep(nextIdx);
            }
        }

        function goBack() {
            if (historyStack.length <= 1) return;

            historyStack.pop();
            const prevIdx = historyStack[historyStack.length - 1];
            historyStack.pop();
            showStep(prevIdx);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
