<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>归终殿 · 惊鸿榜后续</title>
    <style>
        :root {
            --bg-body: #f7f4ef;
            --bg-card: #ffffff;
            --bg-card-alt: #f5f2ee;
            --text-primary: #2c2c2c;
            --text-secondary: #4a4a4a;
            --text-muted: #8a8a8a;
            --border-light: #ece6de;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --radius: 14px;
            --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            --transition: 0.3s ease;
            --color-luan: #b03a2a;
            --color-luan-bg: rgba(176,58,42,0.08);
            --color-huai: #2a6b8a;
            --color-huai-bg: rgba(42,107,138,0.08);
            --color-cheng: #5a8a7a;
            --color-cheng-bg: rgba(90,138,122,0.08);
            --color-luo: #7b4b8a;
            --color-luo-bg: rgba(123,75,138,0.08);
            --color-jing: #c9a84b;
            --color-jing-bg: rgba(201,168,75,0.08);
            --color-zheng: #b87333;
            --color-zheng-bg: rgba(184,115,51,0.08);
        }
        [data-theme="dark"] {
            --bg-body: #181614;
            --bg-card: #24201c;
            --bg-card-alt: #2d2824;
            --text-primary: #cfc8c0;
            --text-secondary: #9a948c;
            --text-muted: #6a6560;
            --border-light: #35302a;
            --color-luan: #d06050;
            --color-luan-bg: rgba(208,96,80,0.12);
            --color-huai: #5a9aba;
            --color-huai-bg: rgba(90,154,186,0.12);
            --color-cheng: #7aaa9a;
            --color-cheng-bg: rgba(122,170,154,0.12);
            --color-luo: #a07ab0;
            --color-luo-bg: rgba(160,122,176,0.12);
            --color-jing: #e0c070;
            --color-jing-bg: rgba(224,192,112,0.12);
            --color-zheng: #d09050;
            --color-zheng-bg: rgba(208,144,80,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .float-group {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        .float-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 6px 14px 6px 12px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
        }
        .float-btn:hover { border-color: var(--color-luan); color: var(--color-luan); }
        .float-btn .icon { font-size: 0.85rem; }

        #app {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .chat-window {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            margin: 12px 16px 16px;
        }

        .chat-titlebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 16px 8px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-card);
            gap: 6px;
        }
        .chat-titlebar .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .chat-titlebar .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-titlebar .left .dots { display: flex; gap: 5px; }
        .chat-titlebar .left .dot {
            width: 11px; height: 11px;
            border-radius: 50%;
        }
        .chat-titlebar .left .dot.r { background: #e05a4a; }
        .chat-titlebar .left .dot.y { background: #e8b84a; }
        .chat-titlebar .left .dot.g { background: #5aaa6a; }
        .chat-titlebar .title-text {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .chat-titlebar .title-text .names {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-titlebar .title-text .names .av {
            font-size: 0.8rem;
            font-weight: 600;
        }
        .chat-titlebar .title-text .names .av.a { color: var(--color-luan); }
        .chat-titlebar .title-text .names .av.b { color: var(--color-huai); }
        .chat-titlebar .title-text .names .av.c { color: var(--color-cheng); }
        .chat-titlebar .title-text .names .av.d { color: var(--color-luo); }
        .chat-titlebar .title-text .names .av.e { color: var(--color-jing); }
        .chat-titlebar .title-text .names .av.z { color: var(--color-zheng); }
        .chat-titlebar .title-text .names .arrow {
            color: var(--text-muted);
            font-size: 0.6rem;
            margin: 0 2px;
        }
        .chat-titlebar .right-placeholder { width: 48px; }

        .chat-tabs {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            background: var(--bg-card-alt);
            padding: 3px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }
        .chat-tab {
            padding: 4px 16px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }
        .chat-tab:hover { color: var(--text-secondary); }
        .chat-tab.active {
            background: var(--bg-card);
            color: var(--color-luan);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .chat-tab .sym { margin-right: 3px; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: var(--bg-card-alt); border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

        .msg-unit {
            max-width: 78%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
        }
        .msg-unit.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .msg-unit.left { align-self: flex-start; }
        .msg-unit.right { align-self: flex-end; }
        .msg-unit.right .msg-name {
            align-self: flex-end;
            padding-right: 4px;
        }
        .msg-unit.left .msg-name {
            align-self: flex-start;
            padding-left: 4px;
        }
        .msg-name {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 1px;
            line-height: 1.4;
        }
        .msg-bubble {
            padding: 9px 16px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.7;
            word-break: break-word;
        }
        .msg-unit.left .msg-bubble { border-bottom-left-radius: 4px; }
        .msg-unit.right .msg-bubble { border-bottom-right-radius: 4px; }

        /* 私聊印象色 */
        .chat-panel.huaiqi .msg-unit.sender-luan .msg-bubble { background: var(--color-luan-bg); color: var(--color-luan); }
        .chat-panel.huaiqi .msg-unit.sender-huai .msg-bubble { background: var(--color-huai-bg); color: var(--color-huai); }
        .chat-panel.xiujing .msg-unit.sender-jing .msg-bubble { background: var(--color-jing-bg); color: var(--color-jing); }
        .chat-panel.xiujing .msg-unit.sender-luo .msg-bubble { background: var(--color-luo-bg); color: var(--color-luo); }
        .chat-panel.muqi .msg-unit.sender-cheng .msg-bubble { background: var(--color-cheng-bg); color: var(--color-cheng); }
        .chat-panel.muqi .msg-unit.sender-ke .msg-bubble { background: rgba(138,138,138,0.15); color: #6a6a6a; }

        /* 群聊各人颜色 */
        .chat-panel.fuxiu .msg-unit.sender-zheng .msg-bubble { background: var(--color-zheng-bg); color: var(--color-zheng); }
        .chat-panel.fuxiu .msg-unit.sender-zhou .msg-bubble { background: rgba(90,122,154,0.08); color: #4a6a8a; }
        .chat-panel.fuxiu .msg-unit.sender-chen .msg-bubble { background: rgba(90,154,122,0.08); color: #4a8a6a; }
        .chat-panel.fuxiu .msg-unit.sender-li .msg-bubble { background: rgba(138,122,154,0.08); color: #7a5a8a; }
        .chat-panel.fuxiu .msg-unit.sender-zhao .msg-bubble { background: rgba(154,122,122,0.08); color: #8a5a5a; }

        .chat-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
        .chat-panel.active { display: flex; }

        .chat-footer {
            padding: 10px 18px 12px;
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: var(--bg-card);
        }
        .chat-footer .input-placeholder {
            flex: 1;
            padding: 8px 16px;
            border-radius: 22px;
            border: 1px solid var(--border-light);
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--bg-card-alt);
            user-select: none;
        }
        .chat-footer .send-placeholder {
            padding: 8px 20px;
            border-radius: 22px;
            border: none;
            background: var(--border-light);
            color: var(--text-muted);
            font-size: 0.85rem;
            user-select: none;
        }

        @media (min-width: 769px) {
            .chat-window { margin: 16px 20px 20px; max-height: 820px; }
            .chat-titlebar { padding: 12px 24px 10px; }
            .chat-tab { padding: 5px 20px; font-size: 0.78rem; }
            .chat-messages { padding: 16px 24px 14px; }
            .msg-unit { max-width: 72%; }
            .msg-bubble { font-size: 0.95rem; padding: 9px 18px; }
            .chat-footer { padding: 12px 24px 14px; }
            .float-group { top: 20px; right: 28px; gap: 8px; }
            .float-btn { padding: 6px 16px 6px 12px; }
        }

        @media (max-width: 768px) {
            .float-group { top: 10px; right: 12px; gap: 5px; }
            .float-btn { padding: 4px 10px 4px 8px; font-size: 0.6rem; }
            .float-btn .icon { font-size: 0.7rem; }
            #app { max-width: 100%; }
            .chat-window { border-radius: 0; border: none; margin: 0; height: 100vh; height: 100dvh; box-shadow: none; }
            .chat-titlebar { padding: 10px 14px 8px; min-height: 52px; }
            .chat-titlebar .title-text { font-size: 0.8rem; }
            .chat-titlebar .title-text .names .av { font-size: 0.75rem; }
            .chat-titlebar .left .dots { gap: 4px; }
            .chat-titlebar .left .dot { width: 10px; height: 10px; }
            .chat-titlebar .right-placeholder { width: 40px; }
            .chat-tabs { padding: 3px; gap: 3px; }
            .chat-tab { padding: 4px 14px; font-size: 0.65rem; }
            .chat-messages { padding: 12px 14px 10px; }
            .msg-unit { max-width: 84%; }
            .msg-bubble { font-size: 1rem; padding: 8px 15px; }
            .chat-footer { padding: 8px 14px 10px; min-height: 50px; }
            .chat-footer .input-placeholder { font-size: 0.85rem; padding: 7px 14px; }
            .chat-footer .send-placeholder { font-size: 0.8rem; padding: 7px 16px; }
        }

        @media (max-width: 420px) {
            .chat-titlebar { padding: 8px 10px 6px; min-height: 48px; }
            .chat-titlebar .left .dots { display: none; }
            .chat-titlebar .title-text { font-size: 0.75rem; }
            .chat-titlebar .title-text .names .av { font-size: 0.7rem; }
            .chat-titlebar .right-placeholder { width: 32px; }
            .chat-tabs { padding: 2px; gap: 2px; }
            .chat-tab { padding: 3px 10px; font-size: 0.6rem; }
            .chat-tab .sym { font-size: 0.55rem; }
            .chat-messages { padding: 10px 10px 8px; }
            .msg-unit { max-width: 88%; }
            .msg-bubble { font-size: 0.95rem; padding: 7px 12px; }
            .chat-footer { padding: 6px 10px 8px; min-height: 44px; }
            .chat-footer .input-placeholder { font-size: 0.78rem; padding: 6px 12px; }
            .chat-footer .send-placeholder { font-size: 0.72rem; padding: 6px 12px; }
            .float-group { top: 6px; right: 8px; gap: 4px; }
            .float-btn { padding: 3px 8px 3px 6px; font-size: 0.5rem; }
            .float-btn .icon { font-size: 0.6rem; }
        }
    </style>
    <script>
        (function(){
            try {
                const raw = localStorage.getItem('theme');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.value === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                }
            } catch(e) {}
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerHTML = newTheme === 'dark' ? '<span class="icon">☀️</span> 日间' : '<span class="icon">🌙</span> 夜间';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '<span class="icon">☀️</span> 日间' : '<span class="icon">🌙</span> 夜间';
            }
        });
    </script>
</head>
<body>

    <div class="float-group">
        <a class="float-btn" href="./index.html"><span class="icon">←</span> 返回</a>
        <button class="float-btn" id="themeBtn" onclick="toggleTheme()"><span class="icon">🌙</span> 夜间</button>
    </div>

    <div id="app">
        <div class="chat-window">
            <div class="chat-titlebar">

                    </div>
                    <div class="right-placeholder"></div>

                <div class="chat-tabs">
                    <button class="chat-tab active" data-panel="huaiqi" onclick="switchPanel('huaiqi')"><span class="sym">✿</span>淮棋</button>
                    <button class="chat-tab" data-panel="xiujing" onclick="switchPanel('xiujing')"><span class="sym">◈</span>修璟</button>
                    <button class="chat-tab" data-panel="muqi" onclick="switchPanel('muqi')"><span class="sym">◉</span>木栖</button>
                    <button class="chat-tab" data-panel="fuxiu" onclick="switchPanel('fuxiu')"><span class="sym">✦</span>符修院</button>

            <div class="chat-panel huaiqi active" id="panel-huaiqi"><div class="chat-messages" id="msgs-huaiqi"></div></div>

            <div class="chat-footer">
                <span class="input-placeholder">输入消息…</span>
                <span class="send-placeholder">发送</span>
            </div>
        </div>
    </div>

        const panelStates = {};
        let currentPanel = 'huaiqi';

        function renderPanel(key) {
            const container = document.getElementById('msgs-' + key);
            if (!container || container.children.length > 0) return;

            const data = chatData[key];
            data.messages.forEach(msg => {
                const unit = document.createElement('div');
                unit.className = 'msg-unit ' + msg.side + ' sender-' + msg.sender;
                if (msg.name) {
                    unit.innerHTML = '<div class="msg-name">' + msg.name + '</div>';
                }
                unit.innerHTML += '<div class="msg-bubble">' + msg.text + '</div>';
                container.appendChild(unit);
            });

            panelStates[key] = { idx: 0, done: false };
            const units = container.querySelectorAll('.msg-unit');
            if (units.length > 0) {
                units[0].classList.add('show');
                panelStates[key].idx = 1;
            }
        }

        function switchPanel(key) {
            if (key === currentPanel) return;

            document.querySelectorAll('.chat-panel').forEach(el => el.classList.remove('active'));
            document.getElementById('panel-' + key).classList.add('active');
            document.querySelectorAll('.chat-tab').forEach(el => el.classList.remove('active'));
            document.querySelector('.chat-tab[data-panel="' + key + '"]').classList.add('active');

            const data = chatData[key];
            const colors = data.title.colors.split(' ');
            document.getElementById('titleText').innerHTML =
                '<span class="names"><span class="av ' + colors[0] + '">' + data.title.left +
                '</span><span class="arrow">·</span><span class="av ' + colors[1] + '">' + data.title.right + '</span></span>';

            currentPanel = key;
            renderPanel(key);

            // 切换到顶部，不是底部
            const mc = document.querySelector('#panel-' + key + ' .chat-messages');
            if (mc) mc.scrollTop = 0;
        }

        function loadNext(key) {
            const state = panelStates[key];
            if (!state || state.done) return;

            const container = document.getElementById('msgs-' + key);
            const units = container.querySelectorAll('.msg-unit');
            if (state.idx >= units.length) {
                state.done = true;
                return;
            }

            const newUnit = units[state.idx];
            newUnit.classList.add('show');
            state.idx++;

            // 仅当新消息被遮挡时才滚动到可见位置
            const containerRect = container.getBoundingClientRect();
            const unitRect = newUnit.getBoundingClientRect();
            if (unitRect.bottom > containerRect.bottom - 10) {
                newUnit.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function initAll() {
            Object.keys(chatData).forEach(key => {
                renderPanel(key);
                document.getElementById('msgs-' + key).addEventListener('click', () => loadNext(key));
            });
            switchPanel('huaiqi');
        }

        window.switchPanel = switchPanel;
        document.addEventListener('DOMContentLoaded', initAll);
    </script>
