<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>归终殿 · 惊鸿榜后续</title>
    <style>
        :root {
            --bg-body: #f7f4ef;
            --bg-card: #ffffff;
            --bg-chat-left: #f0ece6;
            --text-primary: #2c2c2c;
            --text-secondary: #4a4a4a;
            --text-muted: #8a8a8a;
            --border-light: #ece6de;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --radius: 14px;
            --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            --transition: 0.3s ease;
            --color-luan: #b03a2a;
            --color-luan-bg: rgba(176,58,42,0.08);
            --color-huai: #2a6b8a;
            --color-huai-bg: rgba(42,107,138,0.08);
            --color-cheng: #5a8a7a;
            --color-cheng-bg: rgba(90,138,122,0.08);
            --color-luo: #7b4b8a;
            --color-luo-bg: rgba(123,75,138,0.08);
            --color-jing: #c9a84b;
            --color-jing-bg: rgba(201,168,75,0.08);
        }
        [data-theme="dark"] {
            --bg-body: #181614;
            --bg-card: #24201c;
            --bg-chat-left: #2d2824;
            --text-primary: #cfc8c0;
            --text-secondary: #9a948c;
            --text-muted: #6a6560;
            --border-light: #35302a;
            --color-luan: #b05a4a;
            --color-luan-bg: rgba(176,90,74,0.10);
            --color-huai: #4a8baa;
            --color-huai-bg: rgba(74,139,170,0.10);
            --color-cheng: #6a9a8a;
            --color-cheng-bg: rgba(106,154,138,0.10);
            --color-luo: #9b6baa;
            --color-luo-bg: rgba(155,107,170,0.10);
            --color-jing: #dbb85c;
            --color-jing-bg: rgba(219,184,92,0.10);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .float-group {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        .float-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 6px 14px 6px 12px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
        }
        .float-btn:hover { border-color: var(--color-luan); color: var(--color-luan); }
        .float-btn .icon { font-size: 0.85rem; }

        #app {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 0;
        }

        .chat-window {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            margin: 12px 16px 16px 16px;
            height: calc(100vh - 28px);
            height: calc(100dvh - 28px);
        }

        .chat-titlebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 16px 8px 16px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-card);
            gap: 6px;
            min-height: 56px;
        }
        .chat-titlebar .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .chat-titlebar .left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-titlebar .left .dots { display: flex; gap: 5px; }
        .chat-titlebar .left .dot {
            width: 11px; height: 11px;
            border-radius: 50%;
            background: var(--border-light);
        }
        .chat-titlebar .left .dot.r { background: #e05a4a; }
        .chat-titlebar .left .dot.y { background: #e8b84a; }
        .chat-titlebar .left .dot.g { background: #5aaa6a; }
        .chat-titlebar .title-text {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .chat-titlebar .title-text .names {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-titlebar .title-text .names .av {
            font-size: 0.8rem;
            font-weight: 600;
        }
        .chat-titlebar .title-text .names .av.a { color: var(--color-luan); }
        .chat-titlebar .title-text .names .av.b { color: var(--color-huai); }
        .chat-titlebar .title-text .names .av.c { color: var(--color-cheng); }
        .chat-titlebar .title-text .names .av.d { color: var(--color-luo); }
        .chat-titlebar .title-text .names .av.e { color: var(--color-jing); }
        .chat-titlebar .title-text .names .arrow {
            color: var(--text-muted);
            font-size: 0.6rem;
            margin: 0 2px;
        }
        .chat-titlebar .right-placeholder { width: 48px; flex-shrink: 0; }

        .chat-tabs {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            background: var(--bg-card-alt);
            padding: 3px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            margin: 0 auto;
        }
        .chat-tab {
            padding: 4px 16px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }
        .chat-tab:hover { color: var(--text-secondary); }
        .chat-tab.active {
            background: var(--bg-card);
            color: var(--color-luan);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .chat-tab .sym { margin-right: 3px; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 60px;
            scroll-behavior: smooth;
            background: var(--bg-card);
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: var(--bg-card-alt); border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

        .msg {
            max-width: 78%;
            padding: 9px 16px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.7;
            word-break: break-word;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .msg.show { opacity: 1; transform: translateY(0); }
        .msg.left {
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            background: var(--bg-chat-left);
            color: var(--text-secondary);
        }
        .msg.right {
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-panel.huaiqi .msg.left { background: var(--color-luan-bg); color: var(--color-luan); }
        .chat-panel.huaiqi .msg.right { background: var(--color-huai-bg); color: var(--color-huai); }
        .chat-panel.xiujing .msg.left { background: var(--color-jing-bg); color: var(--color-jing); }
        .chat-panel.xiujing .msg.right { background: var(--color-luo-bg); color: var(--color-luo); }
        .chat-panel.muqi .msg.left,
        .chat-panel.muqi .msg.right { background: var(--color-cheng-bg); color: var(--color-cheng); }

        .chat-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
        .chat-panel.active { display: flex; }
        .chat-panel .chat-messages { flex: 1; overflow-y: auto; }

        .chat-footer {
            padding: 10px 18px 12px 18px;
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: var(--bg-card);
            min-height: 54px;
        }
        .chat-footer .input-placeholder {
            flex: 1;
            padding: 8px 16px;
            border-radius: 22px;
            border: 1px solid var(--border-light);
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--bg-card-alt);
            cursor: default;
            user-select: none;
        }
        .chat-footer .send-placeholder {
            padding: 8px 20px;
            border-radius: 22px;
            border: none;
            background: var(--border-light);
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: default;
            user-select: none;
        }

        /* ===== 电脑端 ===== */
        @media (min-width: 769px) {
            .chat-window { margin: 16px 20px 20px 20px; max-height: 820px; }
            .chat-titlebar { padding: 12px 24px 10px 24px; min-height: 60px; }
            .chat-tab { padding: 5px 20px; font-size: 0.78rem; }
            .chat-messages { padding: 16px 24px 14px 24px; gap: 6px; }
            .msg { font-size: 0.95rem; padding: 9px 18px; max-width: 72%; }
            .chat-footer { padding: 12px 24px 14px 24px; min-height: 60px; }
            .float-group { top: 20px; right: 28px; gap: 8px; }
            .float-btn { padding: 6px 16px 6px 12px; font-size: 0.7rem; }
            .msg { border-radius: 18px; }
            .msg.left { border-bottom-left-radius: 4px; }
            .msg.right { border-bottom-right-radius: 4px; }
        }

        /* ===== 手机端（全屏舒适版） ===== */
        @media (max-width: 768px) {
            body { padding: 0; overflow: hidden; }
            .float-group { top: 10px; right: 12px; gap: 5px; }
            .float-btn { padding: 4px 10px 4px 8px; font-size: 0.6rem; border-radius: 18px; }
            .float-btn .icon { font-size: 0.7rem; }
            #app { max-width: 100%; padding: 0; }
            .chat-window { border-radius: 0; border: none; margin: 0; height: 100vh; height: 100dvh; width: 100%; box-shadow: none; }
            .chat-titlebar { padding: 10px 14px 8px 14px; min-height: 52px; gap: 6px; }
            .chat-titlebar .title-text { font-size: 0.8rem; }
            .chat-titlebar .title-text .names .av { font-size: 0.75rem; }
            .chat-titlebar .left .dots { gap: 4px; }
            .chat-titlebar .left .dot { width: 10px; height: 10px; }
            .chat-titlebar .right-placeholder { width: 40px; }
            .chat-tabs { padding: 3px; gap: 3px; border-radius: 18px; }
            .chat-tab { padding: 4px 14px; font-size: 0.65rem; border-radius: 13px; }
            .chat-messages { padding: 12px 14px 10px 14px; gap: 10px; }
            .msg { font-size: 1rem; padding: 8px 15px; max-width: 84%; border-radius: 16px; }
            .msg.left { border-bottom-left-radius: 4px; }
            .msg.right { border-bottom-right-radius: 4px; }
            .chat-footer { padding: 8px 14px 10px 14px; min-height: 50px; gap: 10px; }
            .chat-footer .input-placeholder { font-size: 0.85rem; padding: 7px 14px; border-radius: 20px; }
            .chat-footer .send-placeholder { font-size: 0.8rem; padding: 7px 16px; border-radius: 20px; }
        }

        /* ===== 小屏手机（>380px 保持舒适） ===== */
        @media (max-width: 420px) {
            .chat-titlebar { padding: 8px 10px 6px 10px; min-height: 48px; gap: 4px; }
            .chat-titlebar .left .dots { display: none; }
            .chat-titlebar .title-text { font-size: 0.75rem; }
            .chat-titlebar .title-text .names .av { font-size: 0.7rem; }
            .chat-titlebar .right-placeholder { width: 32px; }
            .chat-tabs { padding: 2px; gap: 2px; }
            .chat-tab { padding: 3px 10px; font-size: 0.6rem; border-radius: 11px; }
            .chat-tab .sym { font-size: 0.55rem; }
            .chat-messages { padding: 10px 10px 8px 10px; gap: 8px; }
            .msg { font-size: 0.95rem; padding: 7px 12px; max-width: 88%; border-radius: 14px; }
            .chat-footer { padding: 6px 10px 8px 10px; min-height: 44px; gap: 8px; }
            .chat-footer .input-placeholder { font-size: 0.78rem; padding: 6px 12px; border-radius: 18px; }
            .chat-footer .send-placeholder { font-size: 0.72rem; padding: 6px 12px; border-radius: 18px; }
            .float-group { top: 6px; right: 8px; gap: 4px; }
            .float-btn { padding: 3px 8px 3px 6px; font-size: 0.5rem; border-radius: 14px; }
            .float-btn .icon { font-size: 0.6rem; }
        }
    </style>
    <script>
        (function(){
            try {
                const raw = localStorage.getItem('theme');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.value === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else if (parsed && parsed.value === 'light') {
                        document.documentElement.removeAttribute('data-theme');
                    }
                }
            } catch(e) {}
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerHTML = newTheme === 'dark' ? '<span class="icon">☀️</span> 日间' : '<span class="icon">🌙</span> 夜间';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '<span class="icon">☀️</span> 日间' : '<span class="icon">🌙</span> 夜间';
            }
        });
    </script>
</head>
<body>

    <div class="float-group">
        <a class="float-btn" href="./index.html"><span class="icon">←</span> 返回</a>
        <button class="float-btn" id="themeBtn" onclick="toggleTheme()"><span class="icon">🌙</span> 夜间</button>
    </div>

    <div id="app">
        <div class="chat-window">
            <div class="chat-titlebar">
                <div class="top-row">
                    <div class="left">
                        <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
                        <span class="title-text" id="titleText"><span class="names"><span class="av a">✿</span><span class="arrow">·</span><span class="av b">✦</span></span></span>
                    </div>
                    <div class="right-placeholder"></div>
                </div>
                <div class="chat-tabs">
                    <button class="chat-tab active" data-panel="huaiqi" onclick="switchPanel('huaiqi')"><span class="sym">✿</span>淮棋</button>
                    <button class="chat-tab" data-panel="xiujing" onclick="switchPanel('xiujing')"><span class="sym">◈</span>修璟</button>
                    <button class="chat-tab" data-panel="muqi" onclick="switchPanel('muqi')"><span class="sym">◉</span>木栖</button>
                </div>
            </div>

            <div class="chat-panel huaiqi active" id="panel-huaiqi"><div class="chat-messages" id="msgs-huaiqi"></div></div>
            <div class="chat-panel xiujing" id="panel-xiujing"><div class="chat-messages" id="msgs-xiujing"></div></div>
            <div class="chat-panel muqi" id="panel-muqi"><div class="chat-messages" id="msgs-muqi"></div></div>

            <div class="chat-footer">
                <span class="input-placeholder">输入消息…</span>
                <span class="send-placeholder">发送</span>
            </div>
        </div>
    </div>

    <script>
        const chatData = {
            huaiqi: {
                title: { left: '✿', right: '✦', label: '淮棋' },
                messages: [
                    { side: 'left', text: '林淮，你看到那个榜了吗？' },
                    { side: 'right', text: '嗯。' },
                    { side: 'left', text: '你第一诶。' },
                    { side: 'right', text: '无聊。' },
                    { side: 'left', text: '我怎么觉得你有点高兴？' },
                    { side: 'right', text: '……没有。' },
                    { side: 'left', text: '你明明嘴角都翘了。' },
                    { side: 'right', text: '你看错了。' },
                    { side: 'left', text: '行吧行吧，你说没有就没有。反正我看到你名字在第一的时候，还挺开心的。' },
                    { side: 'right', text: '嗯。' },
                ]
            },
            xiujing: {
                title: { left: '◈', right: '❖', label: '修璟' },
                messages: [
                    { side: 'left', text: '听说你今天被弟子堵了？' },
                    { side: 'right', text: '……消息传得这么快？' },
                    { side: 'left', text: '我后援会的人第一时间就转给我了。' },
                    { side: 'right', text: '后援会？' },
                    { side: 'left', text: '你不知道？归终殿有个"璟大人后援会"，带头的是个很有钱的女弟子。' },
                    { side: 'right', text: '……我现在知道了。' },
                    { side: 'left', text: '榜上我第二，你第四。' },
                    { side: 'right', text: '……你想说什么？' },
                    { side: 'left', text: '没什么。就是觉得挺好的。' },
                    { side: 'right', text: '……嗯。' },
                ]
            },
            muqi: {
                title: { left: '◉', right: '◉', label: '木栖' },
                messages: [
                    { side: 'left', text: '师姐师姐你第三！！！' },
                    { side: 'right', text: '……什么第三？' },
                    { side: 'left', text: '惊鸿榜！你第三！' },
                    { side: 'right', text: '……你们还真的搞了投票？我还以为蔡可你只是说着玩的。' },
                    { side: 'left', text: '大家都在投！你比首席还高！' },
                    { side: 'right', text: '罗修知道这事吗？' },
                    { side: 'left', text: '他知道……他还被弟子当面问什么时候和璟大人成亲。' },
                    { side: 'right', text: '……这群年轻人。' },
                    { side: 'left', text: '师姐你是不是有点高兴？你嘴角动了！' },
                    { side: 'right', text: '……没有。药杵拿稳。' },
                ]
            }
        };

        const panelStates = { huaiqi: { idx: 0, done: false }, xiujing: { idx: 0, done: false }, muqi: { idx: 0, done: false } };
        let currentPanel = 'huaiqi';

        function renderPanel(key) {
            const container = document.getElementById('msgs-' + key);
            if (!container) return;
            container.innerHTML = '';
            chatData[key].messages.forEach((msg, i) => {
                const el = document.createElement('div');
                el.className = 'msg ' + msg.side;
                el.textContent = msg.text;
                container.appendChild(el);
            });
            panelStates[key].idx = 0;
            panelStates[key].done = false;
            const msgs = container.querySelectorAll('.msg');
            if (msgs.length) { msgs[0].classList.add('show'); panelStates[key].idx = 1; }
        }

        function switchPanel(key) {
            if (key === currentPanel) return;
            document.querySelectorAll('.chat-panel').forEach(el => el.classList.remove('active'));
            document.getElementById('panel-' + key).classList.add('active');
            document.querySelectorAll('.chat-tab').forEach(el => el.classList.remove('active'));
            document.querySelector('.chat-tab[data-panel="' + key + '"]').classList.add('active');

            const data = chatData[key];
            const titleEl = document.getElementById('titleText');
            if (titleEl) {
                const colorMap = { huaiqi: 'a b', xiujing: 'e d', muqi: 'c c' };
                const colors = colorMap[key].split(' ');
                titleEl.innerHTML = `<span class="names"><span class="av ${colors[0]}">${data.title.left}</span><span class="arrow">·</span><span class="av ${colors[1]}">${data.title.right}</span></span>`;
            }
            currentPanel = key;
            const container = document.getElementById('msgs-' + key);
            if (container && container.children.length === 0) renderPanel(key);
            else { const mc = document.querySelector('#panel-' + key + ' .chat-messages'); if (mc) mc.scrollTop = mc.scrollHeight; }
        }

        function loadNext(key) {
            const state = panelStates[key];
            if (state.done) return;
            const container = document.getElementById('msgs-' + key);
            if (!container) return;
            const msgs = container.querySelectorAll('.msg');
            if (state.idx >= msgs.length) { state.done = true; return; }
            msgs[state.idx].classList.add('show');
            state.idx++;
            container.scrollTop = container.scrollHeight;
        }

        function initAll() {
            ['huaiqi', 'xiujing', 'muqi'].forEach(key => {
                renderPanel(key);
                const container = document.getElementById('msgs-' + key);
                container.addEventListener('scroll', function() {
                    const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight <= 20;
                    if (atBottom) loadNext(key);
                });
                const msgs = container.querySelectorAll('.msg');
                msgs.forEach((el, i) => { if (i > 0) el.classList.remove('show'); });
                panelStates[key].idx = 1;
                container.scrollTop = 0;
            });
            switchPanel('huaiqi');
            document.querySelectorAll('.chat-panel .chat-messages').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.msg')) return;
                    const id = this.closest('.chat-panel').id.replace('panel-', '');
                    loadNext(id);
                });
            });
        }

        window.switchPanel = switchPanel;
        document.addEventListener('DOMContentLoaded', initAll);
    </script>
</body>
</html>
