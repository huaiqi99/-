<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>归终殿 · 血脉羁绊</title>
    <style>
        /* ===== 全局 ===== */
        :root {
            --bg-body: #f7f4ef;
            --bg-card: #ffffff;
            --bg-hover: #f2eee9;
            --border-light: #ece6de;
            --border-card: #d5c8b8;
            --text-primary: #2c2c2c;
            --text-secondary: #4a4a4a;
            --text-muted: #8a8a8a;
            --accent: #8a3a2a;
            --profile-lin: #D49A9A;
            --profile-luo: #4E5A64;
            --font-serif: "Georgia", "Times New Roman", "Songti SC", serif;
            --font-mono: "Courier New", "Source Code Pro", monospace;
            --transition: 0.3s ease;
            --sidebar-width: 240px;
            /* 印象色 */
            --lin-blue: #2a6b8a;
            --luan-red: #8B1A1A;
            --luo-purple: #7b4b8a;
            --wei-gold: #c9a84b;
        }

        [data-theme="dark"] {
            --bg-body: #1a1614;
            --bg-card: #24201c;
            --bg-hover: #2d2824;
            --border-light: #3d3732;
            --border-card: #4a443e;
            --text-primary: #e8e0d5;
            --text-secondary: #b8aea4;
            --text-muted: #8a8078;
            --accent: #c4b4a0;
            --lin-blue: #4a8bae;
            --luan-red: #b05a4a;
            --luo-purple: #9b6baa;
            --wei-gold: #d4b85a;
        }

        body[data-profile="linxiwu"] {
            --profile-accent: var(--profile-lin);
            --center-color: #D49A9A;
            --wave1-color: #2a6b8a;
            --wave2-color: #b05a4a;
        }
        body[data-profile="luojin"] {
            --profile-accent: var(--profile-luo);
            --center-color: #4E5A64;
            --wave1-color: #7b4b8a;
            --wave2-color: #c9a84b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font-serif);
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 0 16px 40px 16px;
        }

        /* ===== 浮动按钮 ===== */
        .float-group {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .float-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 6px 14px 6px 12px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            text-decoration: none;
        }
        .float-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ===== 顶栏 ===== */
        .top-header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 4px 12px 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-bottom: 1px solid var(--border-light);
        }
        .top-header .page-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .page-title .sym {
            color: var(--profile-accent);
            transition: color var(--transition);
        }
        .top-header .profile-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            margin-left: 2px;
        }
        .top-header .profile-name span {
            color: var(--profile-accent);
            font-weight: 600;
        }

        /* ===== 侧边栏 ===== */
        .sidebar-tab {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-left: none;
            border-radius: 0 8px 8px 0;
            padding: 10px 10px 10px 6px;
            cursor: pointer;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.2);
            transition: all var(--transition);
            writing-mode: vertical-rl;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            user-select: none;
            transform-style: flat;
            -webkit-transform-style: flat;
        }
        .sidebar-tab:hover {
            border-color: var(--profile-accent);
            color: var(--profile-accent);
        }
        .sidebar-panel {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border-card);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.25);
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            z-index: 95;
            padding: 24px 16px 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-panel.open {
            transform: translateX(0);
        }
        .sidebar-panel .close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            margin-bottom: 12px;
            transition: color var(--transition);
        }
        .sidebar-panel .close-btn:hover {
            color: var(--profile-accent);
        }
        .sidebar-panel .panel-title {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-light);
            font-family: var(--font-mono);
        }
        .sidebar-panel .nav-item {
            display: block;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 0.85rem;
            font-family: var(--font-serif);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
            background: none;
            width: 100%;
            margin-bottom: 2px;
            text-decoration: none;
            transform-style: flat;
            -webkit-transform-style: flat;
        }
        .sidebar-panel .nav-item:hover {
            background: var(--bg-hover);
            border-color: var(--border-light);
        }
        .sidebar-panel .nav-item.active {
            background: rgba(138, 58, 42, 0.04);
            border-color: var(--profile-accent);
            color: var(--profile-accent);
            font-weight: 600;
        }
        .sidebar-panel .nav-item .sym {
            display: inline-block;
            width: 22px;
            transform-style: flat;
            -webkit-transform-style: flat;
        }
        .sidebar-panel .panel-footer {
            margin-top: auto;
            font-size: 0.6rem;
            color: var(--text-muted);
            text-align: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }
        .sidebar-panel .profile-switch-btn {
            margin-top: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-serif);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }
        .sidebar-panel .profile-switch-btn:hover {
            border-color: var(--profile-accent);
            color: var(--profile-accent);
            background: rgba(138, 58, 42, 0.04);
        }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 92;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .sidebar-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        body.no-scroll {
            overflow: hidden;
        }

        /* ===== 内容块 ===== */
        .content-block {
            display: none;
        }
        .content-block.active {
            display: block;
        }

        /* ===== 卡片 ===== */
        .card {
            position: relative;
            background: var(--bg-card);
            padding: 18px 18px 16px 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border-card);
            box-shadow: inset 0 0 0 1px var(--profile-accent), 0 2px 10px rgba(0, 0, 0, 0.06);
            transition: border-color var(--transition), box-shadow var(--transition), transform 0.25s ease;
            animation: cardIn 0.45s ease forwards;
            line-height: 1.6;
        }
        .card-grad {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-hover) 100%);
        }
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(ellipse at 30% 20%, rgba(255, 248, 240, 0.03) 0%, transparent 70%), radial-gradient(ellipse at 70% 80%, rgba(255, 248, 240, 0.02) 0%, transparent 60%);
            z-index: 0;
        }
        .card::after {
            content: attr(data-corner);
            position: absolute;
            top: -7px;
            left: 14px;
            font-size: 1.2rem;
            color: var(--profile-accent);
            background: var(--bg-body);
            padding: 0 3px;
            opacity: 0.75;
            z-index: 2;
            transition: all 0.3s;
            transform-style: flat;
            -webkit-transform-style: flat;
        }
        .card .corner-deco {
            position: absolute;
            bottom: -7px;
            right: 14px;
            font-size: 1.2rem;
            color: var(--profile-accent);
            background: var(--bg-body);
            padding: 0 3px;
            opacity: 0.75;
            z-index: 2;
            transition: all 0.3s;
            pointer-events: none;
            transform-style: flat;
            -webkit-transform-style: flat;
        }
        .card:hover {
            border-color: var(--profile-accent);
            box-shadow: inset 0 0 0 1px var(--profile-accent), 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .card:hover::after,
        .card:hover .corner-deco {
            opacity: 1;
            transform: scale(1.1);
        }
        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font-serif);
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            padding-bottom: 6px;
            z-index: 1;
        }
        .card-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 3.2rem;
            height: 2px;
            background: var(--profile-accent);
            opacity: 0.5;
            border-radius: 1px;
        }

        /* ===== 柳枝图谱容器 ===== */
        .vine-section {
            padding: 4px 0;
            position: relative;
            z-index: 1;
        }
        .vine-section .section-label {
            text-align: center;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            letter-spacing: 2px;
            color: var(--text-muted);
            padding: 4px 0 16px 0;
            opacity: 0.5;
        }

        .vine-container {
            display: flex;
            flex-direction: row;
            gap: 0;
            justify-content: center;
            align-items: stretch;
            position: relative;
            min-height: 500px;
        }

        .vine-col {
            flex: 1;
            max-width: 480px;
            min-width: 0;
            position: relative;
            padding: 0 4px;
        }
        .vine-col .col-label {
            text-align: center;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            letter-spacing: 2px;
            color: var(--text-muted);
            padding-bottom: 6px;
            opacity: 0.4;
        }

        .vine-col svg {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
            overflow: visible;
        }

        .vine-divider {
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--profile-accent), transparent);
            opacity: 0.2;
            flex-shrink: 0;
            margin: 0 6px;
            border-radius: 1px;
        }

        .link-note {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 12px 0 4px 0;
            opacity: 0.6;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        /* ===== 图例 ===== */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            justify-content: center;
            padding-top: 14px;
            margin-top: 4px;
            border-top: 1px solid var(--border-light);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .legend-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ===== 花瓣 ===== */
        #petal-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            overflow: hidden;
        }
        .petal-char {
            position: absolute;
            top: -30px;
            font-size: 18px;
            will-change: transform, opacity;
            opacity: 0;
            user-select: none;
            transform-style: flat;
            -webkit-transform-style: flat;
            animation: petalFall linear infinite;
        }
        @keyframes petalFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(calc(100vh + 50px)) rotate(360deg);
                opacity: 0;
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .vine-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                min-height: auto;
            }
            .vine-col {
                max-width: 100%;
                width: 100%;
            }
            .vine-divider {
                width: 50%;
                height: 2px;
                margin: 0 auto;
                background: linear-gradient(to right, transparent, var(--profile-accent), transparent);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 0 12px 30px 12px;
                font-size: 15px;
            }
            .top-header {
                padding: 14px 0 10px 0;
            }
            .top-header .page-title {
                font-size: 1.1rem;
            }
            .sidebar-panel {
                width: 210px;
                padding: 20px 14px 16px 14px;
            }
            .sidebar-tab {
                padding: 8px 8px 8px 4px;
                font-size: 0.65rem;
            }
            .float-group {
                top: 12px;
                right: 12px;
                gap: 6px;
            }
            .float-btn {
                padding: 4px 10px 4px 8px;
                font-size: 0.65rem;
            }
            .legend {
                gap: 6px 12px;
            }
            .legend-item {
                font-size: 0.55rem;
            }
        }

        .sym,
        .sidebar-tab .sym,
        .sidebar-panel .nav-item .sym,
        .card::after,
        .card .corner-deco,
        .petal-char {
            transform-style: flat !important;
            -webkit-transform-style: flat !important;
        }
    </style>
</head>
