<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>血脉羁绊 · 预览（修复版）</title>
<style>
:root{--bg-body:#f7f4ef;--bg-card:#ffffff;--border-light:#ece6de;--border-card:#d5c8b8;--text-primary:#2c2c2c;--text-muted:#8a8a8a;--profile-accent:#D49A9A;--font-serif:"Georgia","Times New Roman","Songti SC",serif;--font-mono:"Courier New","Source Code Pro",monospace;--lin-blue:#2a6b8a;--luan-red:#b05a4a;--pink-flower:#e07070;--blue-light:#7ab8d4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-serif);background:var(--bg-body);color:var(--text-primary);padding:0 16px 40px 16px;min-height:100vh;display:flex;justify-content:center}
.app-wrap{max-width:900px;width:100%;padding-top:16px;display:flex;flex-direction:column;gap:14px}
.header{padding:0 4px 10px 4px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px}
.header h1{font-size:1.2rem;font-weight:700}
.header h1 .accent{color:var(--profile-accent);font-weight:400}
.header .sub{font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono);letter-spacing:1.5px}
.main-row{display:flex;flex-direction:row;gap:16px;align-items:stretch;width:100%;min-height:500px}
.main-card{flex:2;min-width:0;width:100%;background:var(--bg-card);border:1px solid var(--border-card);border-radius:8px;padding:14px 12px 12px 12px;box-shadow:inset 0 0 0 1px var(--profile-accent),0 2px 10px rgba(0,0,0,0.04);overflow:hidden;display:flex;flex-direction:column}
.card-title{font-size:0.9rem;font-weight:600;color:var(--text-muted);padding-bottom:8px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px;flex-shrink:0}
.card-title .sym{color:var(--profile-accent)}
.preview-wrap{position:relative;width:100%;overflow:auto;background:var(--bg-body);border-radius:4px;margin-top:2px;flex:1;min-height:300px;-webkit-overflow-scrolling:touch}
.preview-wrap::-webkit-scrollbar{width:6px;height:6px}
.preview-wrap::-webkit-scrollbar-track{background:var(--border-light);border-radius:3px}
.preview-wrap::-webkit-scrollbar-thumb{background:var(--profile-accent);border-radius:3px;opacity:0.5}
.preview-wrap svg{display:block;width:100%;height:100%;background:transparent;overflow:visible}
.detail-panel{flex:1;min-width:0;width:100%;background:var(--bg-card);border:1px solid var(--border-card);border-radius:8px;padding:16px 14px;box-shadow:inset 0 0 0 1px var(--profile-accent),0 2px 10px rgba(0,0,0,0.04);display:flex;flex-direction:column;overflow:hidden}
.detail-panel .panel-title{font-weight:600;font-size:0.85rem;color:var(--text-primary);border-bottom:1px solid var(--border-light);padding-bottom:8px;margin-bottom:10px;letter-spacing:0.5px;flex-shrink:0}
.detail-panel .panel-title .sym{color:var(--profile-accent)}
.detail-list{flex:1;overflow-y:auto;min-height:100px;-webkit-overflow-scrolling:touch}
.detail-list::-webkit-scrollbar{width:5px}
.detail-list::-webkit-scrollbar-track{background:var(--border-light);border-radius:3px}
.detail-list::-webkit-scrollbar-thumb{background:var(--profile-accent);border-radius:3px;opacity:0.5}
.detail-item{padding:6px 0 6px 8px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:background 0.2s;border-radius:4px;font-size:0.75rem}
.detail-item:hover{background:var(--bg-body)}
.detail-item .label{font-weight:500;color:var(--text-primary);font-size:0.75rem;font-family:var(--font-mono);letter-spacing:0.3px}
.detail-item .preview{font-size:0.65rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.detail-item.active{background:rgba(212,154,154,0.12);border-left:2px solid var(--profile-accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:10px;margin-top:4px;border-top:1px solid var(--border-light);flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:0.6rem;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:0.3px}
.legend-item .swatch{width:18px;height:3px;border-radius:2px;flex-shrink:0}
.legend-item .dot-swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-item .sym-swatch{font-size:0.9rem;line-height:1}
.status-msg{font-size:0.6rem;font-family:var(--font-mono);color:var(--text-muted);text-align:center;padding:4px 0 0 0;opacity:0.3;letter-spacing:0.5px;flex-shrink:0}
@media(max-width:820px){.main-row{flex-direction:column;min-height:70vh;gap:12px}.main-card,.detail-panel{flex:1;min-height:0;max-height:none;overflow:auto}.main-card{order:1}.detail-panel{order:2}.preview-wrap{min-height:200px;max-height:60vh;height:auto}.detail-list{min-height:60px}body{padding:0 10px 30px 10px}.main-card{padding:10px 8px}.detail-panel{padding:12px 10px}}
@media(max-width:480px){.main-row{min-height:60vh}.header h1{font-size:1rem}.header .sub{font-size:0.55rem}.card-title{font-size:0.8rem}.detail-panel .panel-title{font-size:0.75rem}}
</style>
</head>
<body>

<div class="app-wrap">
<div class="header">
<h1>❤ 血脉羁绊 · <span class="accent">预览</span></h1>
<span class="sub" id="headerSub">波峰间距 310px · 周期 14.5s</span>
</div>

<div class="main-row">

<div class="main-card">
<div class="card-title"><span class="sym">❀</span> 林淮 · 栾方棋</div>
<div class="preview-wrap" id="scrollContainer">
<svg id="wavePreview" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<div class="legend">
<span class="legend-item"><span class="swatch" style="background:#D49A9A;"></span> 中心线</span>
<span class="legend-item"><span class="swatch" style="background:#2a6b8a;"></span> 波浪 1</span>
<span class="legend-item"><span class="swatch" style="background:#b05a4a;"></span> 波浪 2</span>
<span class="legend-item"><span class="sym-swatch">✦</span> 节点</span>
<span class="legend-item"><span class="sym-swatch" style="color:#e07070;">❀</span> 花饰</span>
<span class="legend-item"><span class="swatch" style="background:#e07070;"></span> 虚线</span>
<span class="legend-item"><span class="dot-swatch" style="background:#2a6b8a;"></span> 林淮</span>
<span class="legend-item"><span class="dot-swatch" style="background:#b05a4a;"></span> 栾方棋</span>
</div>
<div class="status-msg">⏳ 波形流动 · 对话左右交替 · 点击右侧详情跳转</div>
</div>

<div class="detail-panel">
<div class="panel-title"><span class="sym">✦</span> 对话详情</div>
<div class="detail-list" id="detailList"></div>
</div>

</div>
</div>

<script>
(function(){
var svg=document.getElementById('wavePreview');
var detailList=document.getElementById('detailList');
var scrollContainer=document.getElementById('scrollContainer');
var ns='http://www.w3.org/2000/svg';

var OPACITY=0.27;
var PERIOD=14.5;
var phaseA=0,phaseB=0,lastTime=0;

var dialogData=[
{side:'right',label:'初识 · 国师府',lines:[{speaker:'林淮',text:'「属下没有名字，只有编号卯九。」',color:'#2a6b8a'},{speaker:'秦墨予',text:'「你叫什么名字？」',color:'#b05a4a'},{speaker:'秦墨予',text:'「既然有名字，你以后就叫林淮。」',color:'#b05a4a'}],ref:'——第77章'},
{side:'left',label:'走近 · 书房教字',lines:[{speaker:'林淮',text:'「国师大人，这不合规矩。」',color:'#2a6b8a'},{speaker:'秦墨予',text:'「过来，我教你‘林淮’两个字怎么写。」',color:'#b05a4a'},{speaker:'秦墨予',text:'「在这里，我就是规矩。」',color:'#b05a4a'}],ref:'——第77章'},
{side:'right',label:'第一次动心 · 柳州山洞',lines:[{speaker:'林淮',text:'「我只是想见你。」',color:'#2a6b8a'},{speaker:'秦墨予',text:'「你这人脑子烧傻了吧？！」',color:'#b05a4a'}],ref:'——第79章'},
{side:'left',label:'雪中分别 · 宫门口',lines:[{speaker:'林淮',text:'「白头空负三生意，犹记寒阶共雪温。」',color:'#2a6b8a'},{speaker:'秦墨予',text:'「遥望卿云归雁尽，缘深终作浅痕存。」',color:'#b05a4a'}],ref:'——第86章'},
{side:'right',label:'最后一面 · 国师府',lines:[{speaker:'林淮',text:'「秦墨予。」',color:'#2a6b8a'},{speaker:'秦墨予',text:'「如果有一天，我做错了什么……一定要阻止我。」',color:'#b05a4a'}],ref:'——第84章'},
{side:'left',label:'死后初遇 · 人间宅院',lines:[{speaker:'林淮',text:'「我来送你最后一程。」',color:'#2a6b8a'},{speaker:'栾方棋',text:'「你是来送我上路的吗？」',color:'#b05a4a'},{speaker:'栾方棋',text:'「谢谢你。」',color:'#b05a4a'}],ref:'——第90章'},
{side:'right',label:'无涯村重逢 · 竹林',lines:[{speaker:'林淮',text:'「你……你竟然会这么想。」（笑）',color:'#2a6b8a'},{speaker:'栾方棋',text:'「……我只是不想给你添麻烦。」',color:'#b05a4a'}],ref:'——第7章'},
{side:'left',label:'皇宫 · 观花卷之后',lines:[{speaker:'林淮',text:'「只要我的灵魂还留在这世界上一天，\n你就不会只是一个人。」',color:'#2a6b8a'},{speaker:'栾方棋',text:'「……」',color:'#b05a4a'}],ref:'——第69章'},
{side:'right',label:'浮生树下 · 告白',lines:[{speaker:'林淮',text:'「我爱你，方棋。」',color:'#2a6b8a'},{speaker:'栾方棋',text:'「你是林淮……你是林淮。」',color:'#b05a4a'}],ref:'——第112章'},
{side:'left',label:'成亲 · 归终殿',lines:[{speaker:'林淮',text:'「一荣俱荣，一损俱损。\n浮生之契，同生共死。」',color:'#2a6b8a'},{speaker:'栾方棋',text:'「我要和林淮成亲了！」',color:'#b05a4a'}],ref:'——第121章'}
];

var numNodes=dialogData.length;

// ===== 自适应布局计算 =====
// 根据窗口宽度动态计算所有尺寸参数
// 关键修复：
//   1. 桌面端 cx = W/2（原 bug：cx=400 而 W=900，左右不对称）
//   2. 手机端字体比桌面小（原 bug：手机 textSize=20 > 桌面 18）
//   3. maxChars 根据可用宽度和字体大小动态计算（原 bug：硬编码且溢出）
//   4. 行高随 textSize 缩放（原 bug：硬编码 26/24/20）
//   5. nodeSpacing 足够容纳 3 行卡片内容（原 bug：卡片重叠）
//   6. 桌面 viewBox 宽高比匹配容器，SVG 填满 2200px（原 bug：大量空白）
function getLayout(){
    var vw=window.innerWidth;
    var isMobile=vw<820;

    // 通用参数
    var centerGap=56;       // 文字基线距中心线的水平偏移 (textX = cx ± centerGap)
    var speakerOffset=4;    // 说话者标签额外偏移
    var sidePadding=16;     // SVG 左右边距

    if(isMobile){
        // ===== 手机端 =====
        // viewBox 360 宽，匹配常见手机屏宽
        var W=360;
        var cx=W/2;                          // 修复：cx 居中
        var textSize=11;                     // 修复：从 20 降到 11（原 20px 在半屏 ~104px 宽里只能放 5 字）
        var speakerSize=9;                   // 修复：从 16 降到 9
        var refSize=7;                       // 修复：从 12 降到 7
        var labelSize=9;                     // 修复：从 16 降到 9
        var starSize=14;                     // 修复：从 22 降到 14
        var flowerSize=11;                   // 修复：从 18 降到 11
        var amp=5;
        var spacing=240;
        var startY=30;
        var nodeSpacing=230;                 // 修复：从 160 增到 230（原值导致 3 行卡片重叠 122px）

        // 行高随字体大小缩放（原 bug：硬编码 24/20/28）
        var contentLine=Math.round(textSize*1.36);  // 11→15
        var spOffset=Math.round(textSize*1.27);     // 11→14
        var diffExtra=Math.round(textSize*1.64);    // 11→18

        // 头部偏移（星标→虚线→标签→对话）随字体缩放
        var dashOffset=15;
        var labelOffset=15;
        var dialogStartOffset=10;

        // 动态计算 maxChars：可用宽度 = cx - centerGap - speakerOffset - sidePadding
        // 中文字符宽度 ≈ 1em（即 textSize）
        var availW=cx-centerGap-speakerOffset-sidePadding;  // 180-56-4-16=104
        var maxChars=Math.max(4,Math.floor(availW/textSize)); // 104/11=9

        // 最终高度：确保最后一张卡有足够空间
        var finalHeight=startY+numNodes*nodeSpacing+40;

        return{
            isMobile:true,W:W,cx:cx,
            textSize:textSize,speakerSize:speakerSize,refSize:refSize,labelSize:labelSize,
            starSize:starSize,flowerSize:flowerSize,
            amp:amp,spacing:spacing,startY:startY,nodeSpacing:nodeSpacing,
            dashOffset:dashOffset,labelOffset:labelOffset,dialogStartOffset:dialogStartOffset,
            contentLine:contentLine,spOffset:spOffset,diffExtra:diffExtra,
            centerGap:centerGap,speakerOffsetVal:speakerOffset,sidePadding:sidePadding,
            maxChars:maxChars,finalHeight:finalHeight,
            containerHeight:'auto',containerMaxHeight:'60vh'
        };
    }else{
        // ===== 桌面端 =====
        // viewBox 550×2200，宽高比 0.25 ≈ 容器宽高比（~549/2200）
        // 这样 SVG 能完整填满 2200px 容器，无空白
        var W2=550;
        var cx2=W2/2;                        // 修复：cx=275（原 bug：cx=400 而 W=900）
        var textSize2=12;                    // 修复：从 18 降到 12（原 18 在 viewBox 900 里缩放后仅 ~11px）
        var speakerSize2=10;                 // 修复：从 14 降到 10
        var refSize2=8;                      // 修复：从 11 降到 8
        var labelSize2=10;                   // 修复：从 14 降到 10
        var starSize2=18;
        var flowerSize2=14;
        var amp2=7;
        var spacing2=310;
        var startY2=40;
        var nodeSpacing2=215;                // 修复：确保 ≥ 3 行卡片高度(205)，原 220 在 textSize=18 时卡片高 282 严重重叠

        var contentLine2=Math.round(textSize2*1.33);  // 12→16
        var spOffset2=Math.round(textSize2*1.25);     // 12→15
        var diffExtra2=Math.round(textSize2*1.67);    // 12→20

        var dashOffset2=18;
        var labelOffset2=18;
        var dialogStartOffset2=12;

        var availW2=cx2-centerGap-speakerOffset-sidePadding;  // 275-56-4-16=199
        var maxChars2=Math.max(6,Math.floor(availW2/textSize2)); // 199/12=16

        return{
            isMobile:false,W:W2,cx:cx2,
            textSize:textSize2,speakerSize:speakerSize2,refSize:refSize2,labelSize:labelSize2,
            starSize:starSize2,flowerSize:flowerSize2,
            amp:amp2,spacing:spacing2,startY:startY2,nodeSpacing:nodeSpacing2,
            dashOffset:dashOffset2,labelOffset:labelOffset2,dialogStartOffset:dialogStartOffset2,
            contentLine:contentLine2,spOffset:spOffset2,diffExtra:diffExtra2,
            centerGap:centerGap,speakerOffsetVal:speakerOffset,sidePadding:sidePadding,
            maxChars:maxChars2,finalHeight:2200,           // 修复：直接固定 2200（原 Math.max 总是取更大值 2690）
            containerHeight:'2200px',containerMaxHeight:'2200px'
        };
    }
}

var L=getLayout();

// 应用容器样式和 viewBox
function applyLayout(){
    var wrap=document.querySelector('.preview-wrap');
    if(wrap){
        wrap.style.height=L.containerHeight;
        wrap.style.maxHeight=L.containerMaxHeight;
        wrap.style.overflow='auto';
    }
    svg.setAttribute('viewBox','0 0 '+L.W+' '+L.finalHeight);
    var headerSub=document.getElementById('headerSub');
    if(headerSub){
        headerSub.textContent='波峰间距 '+L.spacing+'px · 周期 '+PERIOD+'s · 每行'+L.maxChars+'字';
    }
}
applyLayout();

// ===== 波浪线生成 =====
function generateWavePoints(sign,spacing,amp,phase){
    var pts=[],step=4,totalHeight2=L.finalHeight+spacing,numPoints=Math.floor(totalHeight2/step)+6;
    for(var i=0;i<numPoints;i++){
        var y=-spacing/2+i*step;
        if(y<-spacing/2)continue;
        if(y>L.finalHeight+spacing/2)break;
        var angle=(y/spacing)*2*Math.PI+phase;
        var x=L.cx+sign*amp*Math.sin(angle);
        pts.push({x:x,y:y});
    }
    return pts;
}

function buildBezierPath(pts){
    if(pts.length<2)return '';
    var d='M '+pts[0].x.toFixed(2)+','+pts[0].y.toFixed(2);
    for(var i=0;i<pts.length-1;i++){
        var p0=pts[i],p1=pts[i+1],dy=p1.y-p0.y;
        if(Math.abs(dy)<0.3){d+=' L '+p1.x.toFixed(2)+','+p1.y.toFixed(2);continue;}
        var cpx=p0.x,cpx2=p1.x,cpy=p0.y+dy*0.45,cpy2=p1.y-dy*0.45;
        d+=' C '+cpx.toFixed(2)+','+cpy.toFixed(2)+' '+cpx2.toFixed(2)+','+cpy2.toFixed(2)+' '+p1.x.toFixed(2)+','+p1.y.toFixed(2);
    }
    return d;
}

// ===== 文本换行（修复：支持 \n 显式换行）=====
function wrapText(text,maxChars){
    // 先按 \n 拆分（数据中存在显式换行的诗句）
    var segments=text.split('\n');
    var result=[];
    for(var s=0;s<segments.length;s++){
        var seg=segments[s];
        if(seg.length<=maxChars){
            result.push(seg);
            continue;
        }
        // 超过 maxChars 时按字符数切分，优先在空格处断行
        var current='';
        for(var i=0;i<seg.length;i++){
            current+=seg[i];
            if(current.length>=maxChars){
                var lb=current.lastIndexOf(' ');
                if(lb===-1)lb=current.length;
                result.push(current.substring(0,lb));
                current=current.substring(lb).trim();
            }
        }
        if(current.length>0)result.push(current);
    }
    return result;
}

// ===== 绘制对话块（行高全部使用 L 中动态计算的值）=====
function drawDialogBlock(side,lines,ref,baseX,baseY){
    var anchor=(side==='left')?'end':'start';
    var spOff=(side==='left')?-L.speakerOffsetVal:L.speakerOffsetVal;
    var currentY=baseY,lastSpeaker=null;

    for(var j=0;j<lines.length;j++){
        var item=lines[j];
        var isNewSpeaker=(lastSpeaker!==null&&lastSpeaker!==item.speaker);
        if(isNewSpeaker)currentY+=L.diffExtra;

        // 说话者标签
        var sp=document.createElementNS(ns,'text');
        sp.setAttribute('x',baseX+spOff);
        sp.setAttribute('y',currentY);
        sp.setAttribute('text-anchor',anchor);
        sp.setAttribute('font-family','"Courier New","Source Code Pro",monospace');
        sp.setAttribute('font-size',L.speakerSize);
        sp.setAttribute('font-weight','600');
        sp.setAttribute('fill',item.color);
        sp.setAttribute('opacity','0.65');
        sp.setAttribute('letter-spacing','0.5px');
        sp.textContent='— '+item.speaker;
        svg.appendChild(sp);

        currentY+=L.spOffset;

        // 对话内容（自适应换行）
        var lines2=wrapText(item.text,L.maxChars);
        for(var k=0;k<lines2.length;k++){
            var t=document.createElementNS(ns,'text');
            t.setAttribute('x',baseX+spOff);
            t.setAttribute('y',currentY+k*L.contentLine);
            t.setAttribute('text-anchor',anchor);
            t.setAttribute('font-family','"Georgia","Times New Roman","Songti SC",serif');
            t.setAttribute('font-size',L.textSize);
            t.setAttribute('fill',item.color);
            t.setAttribute('font-style','italic');
            t.setAttribute('font-weight','400');
            t.setAttribute('opacity','0.92');
            t.textContent=lines2[k];
            svg.appendChild(t);
        }
        currentY+=lines2.length*L.contentLine+6;
        lastSpeaker=item.speaker;
    }

    // 参考文献
    var refY=currentY+10;
    var refEl=document.createElementNS(ns,'text');
    refEl.setAttribute('x',baseX+spOff);
    refEl.setAttribute('y',refY);
    refEl.setAttribute('text-anchor',anchor);
    refEl.setAttribute('font-family','"Courier New","Source Code Pro",monospace');
    refEl.setAttribute('font-size',L.refSize);
    refEl.setAttribute('fill','#555555');
    refEl.setAttribute('opacity','0.6');
    refEl.setAttribute('letter-spacing','0.3px');
    refEl.textContent=ref;
    svg.appendChild(refEl);

    return refY+16;
}

// ===== 详情面板 =====
function buildDetailPanel(){
    detailList.innerHTML='';
    dialogData.forEach(function(d,idx){
        var div=document.createElement('div');
        div.className='detail-item';
        div.dataset.index=idx;
        var label=document.createElement('div');
        label.className='label';
        label.textContent=(idx+1)+'. '+d.label;
        var preview=document.createElement('div');
        preview.className='preview';
        var firstLine=d.lines[0]?d.lines[0].text.replace(/\n/g,' '):'';
        preview.textContent=firstLine.substring(0,35)+(firstLine.length>35?'…':'');
        div.appendChild(label);
        div.appendChild(preview);
        div.addEventListener('click',function(){
            var index=parseInt(this.dataset.index);
            scrollToNode(index);
            document.querySelectorAll('.detail-item').forEach(function(el){el.classList.remove('active');});
            this.classList.add('active');
        });
        detailList.appendChild(div);
    });
    var first=detailList.querySelector('.detail-item');
    if(first)first.classList.add('active');
}

function scrollToNode(index){
    var y=L.startY+index*L.nodeSpacing;
    var totalH=L.finalHeight+60;
    var percent=(y-20)/totalH;
    if(scrollContainer){
        var target=scrollContainer.scrollHeight*Math.max(0,Math.min(1,percent));
        scrollContainer.scrollTo({top:target-80,behavior:'smooth'});
    }
}
window.scrollToNode=scrollToNode;

// ===== 渲染 =====
function render(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);

    // 中心轴线
    var axis=document.createElementNS(ns,'line');
    axis.setAttribute('x1',L.cx);
    axis.setAttribute('y1',L.startY);
    axis.setAttribute('x2',L.cx);
    axis.setAttribute('y2',L.finalHeight-20);
    axis.setAttribute('stroke','#D49A9A');
    axis.setAttribute('stroke-width',4);
    axis.setAttribute('opacity','0.4');
    axis.setAttribute('stroke-linecap','round');
    svg.appendChild(axis);

    // 波浪线
    var ptsA=generateWavePoints(1,L.spacing,L.amp,phaseA);
    var ptsB=generateWavePoints(-1,L.spacing,L.amp,phaseB);
    var pathA=document.createElementNS(ns,'path');
    pathA.setAttribute('d',buildBezierPath(ptsA));
    pathA.setAttribute('stroke','#2a6b8a');
    pathA.setAttribute('stroke-width',2);
    pathA.setAttribute('fill','none');
    pathA.setAttribute('stroke-linecap','round');
    pathA.setAttribute('opacity',OPACITY);
    svg.appendChild(pathA);
    var pathB=document.createElementNS(ns,'path');
    pathB.setAttribute('d',buildBezierPath(ptsB));
    pathB.setAttribute('stroke','#b05a4a');
    pathB.setAttribute('stroke-width',2);
    pathB.setAttribute('fill','none');
    pathB.setAttribute('stroke-linecap','round');
    pathB.setAttribute('opacity',OPACITY);
    svg.appendChild(pathB);

    // 节点
    for(var i=0;i<numNodes;i++){
        var y=L.startY+i*L.nodeSpacing;
        var data=dialogData[i];
        var side=data.side;

        // 星标
        var star=document.createElementNS(ns,'text');
        star.setAttribute('x',L.cx);
        star.setAttribute('y',y+5);
        star.setAttribute('text-anchor','middle');
        star.setAttribute('font-family','"Georgia","Times New Roman","Songti SC",serif');
        star.setAttribute('font-size',L.starSize);
        star.setAttribute('fill','#7ab8d4');
        star.setAttribute('opacity','0.8');
        star.textContent='✦';
        svg.appendChild(star);

        var dashY=y+L.dashOffset;

        if(side==='left'){
            var dashStart=L.sidePadding;
            var dashEnd=L.cx-28;
            var flowerX=dashStart+(dashEnd-dashStart)*0.4;
            var dash=document.createElementNS(ns,'line');
            dash.setAttribute('x1',dashStart);
            dash.setAttribute('y1',dashY);
            dash.setAttribute('x2',dashEnd);
            dash.setAttribute('y2',dashY);
            dash.setAttribute('stroke','#e07070');
            dash.setAttribute('stroke-width',2);
            dash.setAttribute('opacity','0.5');
            dash.setAttribute('stroke-dasharray','5,6');
            svg.appendChild(dash);
            var flower=document.createElementNS(ns,'text');
            flower.setAttribute('x',flowerX);
            flower.setAttribute('y',dashY+6);
            flower.setAttribute('text-anchor','middle');
            flower.setAttribute('font-family','"Georgia","Times New Roman","Songti SC",serif');
            flower.setAttribute('font-size',L.flowerSize);
            flower.setAttribute('fill','#e07070');
            flower.setAttribute('opacity','0.85');
            flower.textContent='❀';
            svg.appendChild(flower);
        }else{
            var dashStart2=L.cx+28;
            var dashEnd2=L.W-L.sidePadding;
            var flowerX2=dashStart2+(dashEnd2-dashStart2)*0.6;
            var dash2=document.createElementNS(ns,'line');
            dash2.setAttribute('x1',dashStart2);
            dash2.setAttribute('y1',dashY);
            dash2.setAttribute('x2',dashEnd2);
            dash2.setAttribute('y2',dashY);
            dash2.setAttribute('stroke','#7ab8d4');
            dash2.setAttribute('stroke-width',2);
            dash2.setAttribute('opacity','0.5');
            dash2.setAttribute('stroke-dasharray','5,6');
            svg.appendChild(dash2);
            var flower2=document.createElementNS(ns,'text');
            flower2.setAttribute('x',flowerX2);
            flower2.setAttribute('y',dashY+6);
            flower2.setAttribute('text-anchor','middle');
            flower2.setAttribute('font-family','"Georgia","Times New Roman","Songti SC",serif');
            flower2.setAttribute('font-size',L.flowerSize);
            flower2.setAttribute('fill','#e07070');
            flower2.setAttribute('opacity','0.85');
            flower2.textContent='❀';
            svg.appendChild(flower2);
        }

        var labelY=dashY+L.labelOffset;
        var labelX=(side==='left')?L.cx-L.centerGap:L.cx+L.centerGap;
        var anchorLabel=(side==='left')?'end':'start';
        var label=document.createElementNS(ns,'text');
        label.setAttribute('x',labelX);
        label.setAttribute('y',labelY);
        label.setAttribute('text-anchor',anchorLabel);
        label.setAttribute('font-family','"Courier New","Source Code Pro",monospace');
        label.setAttribute('font-size',L.labelSize);
        label.setAttribute('font-weight','600');
        label.setAttribute('fill','#555555');
        label.setAttribute('opacity','0.8');
        label.setAttribute('letter-spacing','0.8px');
        label.textContent=data.label;
        svg.appendChild(label);

        var textBaseX=(side==='left')?L.cx-L.centerGap:L.cx+L.centerGap;
        var textStartY=labelY+L.dialogStartOffset;
        drawDialogBlock(side,data.lines,data.ref,textBaseX,textStartY);
    }

    // 方向箭头（字号自适应）
    function addDir(x,y,text,color){
        var t=document.createElementNS(ns,'text');
        t.setAttribute('x',x);
        t.setAttribute('y',y);
        t.setAttribute('text-anchor','middle');
        t.setAttribute('font-family','"Courier New","Source Code Pro",monospace');
        t.setAttribute('font-size',L.refSize);
        t.setAttribute('fill',color);
        t.setAttribute('opacity','0.3');
        t.textContent=text;
        svg.appendChild(t);
    }
    addDir(L.sidePadding+8,20,'↓','#2a6b8a');
    addDir(L.W-L.sidePadding-8,20,'↑','#b05a4a');
}

// ===== 动画 =====
function animate(time){
    if(!lastTime)lastTime=time;
    var delta=(time-lastTime)/1000;
    lastTime=time;
    var omega=(2*Math.PI)/PERIOD;
    var dPhase=delta*omega;
    phaseA+=dPhase;
    phaseB-=dPhase;
    var twoPi=2*Math.PI;
    while(phaseA>twoPi)phaseA-=twoPi;
    while(phaseA<0)phaseA+=twoPi;
    while(phaseB>twoPi)phaseB-=twoPi;
    while(phaseB<0)phaseB+=twoPi;
    render();
    requestAnimationFrame(animate);
}

// ===== 窗口大小变化自适应（修复：原代码无 resize 监听）=====
var resizeTimer=null;
window.addEventListener('resize',function(){
    if(resizeTimer)clearTimeout(resizeTimer);
    resizeTimer=setTimeout(function(){
        L=getLayout();
        applyLayout();
    },200);
});

// ===== 初始化 =====
buildDetailPanel();
phaseA=0;
phaseB=Math.PI;
requestAnimationFrame(animate);

setTimeout(function(){
    if(scrollContainer)scrollContainer.style.overflow='auto';
    var dl=document.getElementById('detailList');
    if(dl)dl.style.overflowY='auto';
},100);

console.log('✅ 修复版已加载');
console.log('  布局参数:',{
    isMobile:L.isMobile,
    W:L.W,
    cx:L.cx,
    textSize:L.textSize,
    maxChars:L.maxChars,
    nodeSpacing:L.nodeSpacing,
    finalHeight:L.finalHeight,
    containerHeight:L.containerHeight
});
})();
</script>
