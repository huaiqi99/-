<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>血脉羁绊 · 淮棋线</title>
    <style>
        /* ===== 基础 ===== */
        :root {
            --bg-body: #f7f4ef;
            --bg-card: #ffffff;
            --border-light: #ece6de;
            --border-card: #d5c8b8;
            --text-primary: #2c2c2c;
            --text-muted: #8a8a8a;
            --font-serif: "Georgia", "Times New Roman", "Songti SC", serif;
            --font-mono: "Courier New", "Source Code Pro", monospace;
            --profile-accent: #D49A9A;
            --lin-blue: #2a6b8a;
            --luan-red: #b05a4a;
            --pink-flower: #e07070;
            --blue-light: #7ab8d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-serif);
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 0 16px 40px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app-wrap {
            max-width: 900px;
            width: 100%;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .header {
            padding: 0 4px 10px 4px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header h1 { font-size: 1.2rem; font-weight: 700; }
        .header h1 .accent { color: var(--profile-accent); font-weight: 400; }
        .header .sub { font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 1.5px; }

        /* ===== 主行 ===== */
        .main-row {
            display: flex;
            flex-direction: row;
            gap: 16px;
            align-items: stretch;
            width: 100%;
            min-height: 500px;
        }

        /* ===== 主卡片 ===== */
        .main-card {
            flex: 2;
            min-width: 0;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 14px 12px 12px 12px;
            box-shadow: inset 0 0 0 1px var(--profile-accent), 0 2px 10px rgba(0,0,0,0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 1900px;
            max-height: 80vh;
        }
        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .card-title .sym { color: var(--profile-accent); }

        .preview-wrap {
            position: relative;
            width: 100%;
            overflow: auto;
            background: var(--bg-body);
            border-radius: 4px;
            margin-top: 2px;
            flex: 1;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .preview-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
        .preview-wrap::-webkit-scrollbar-track { background: var(--border-light); border-radius: 3px; }
        .preview-wrap::-webkit-scrollbar-thumb { background: var(--profile-accent); border-radius: 3px; opacity: 0.5; }

        .preview-wrap svg {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
            overflow: visible;
        }

        /* ===== 详情面板 ===== */
        .detail-panel {
            flex: 1;
            min-width: 0;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 16px 14px;
            box-shadow: inset 0 0 0 1px var(--profile-accent), 0 2px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 1900px;
            max-height: 80vh;
        }
        .detail-panel .panel-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 8px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .detail-panel .panel-title .sym { color: var(--profile-accent); }

        .detail-list {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        .detail-list::-webkit-scrollbar { width: 5px; }
        .detail-list::-webkit-scrollbar-track { background: var(--border-light); border-radius: 3px; }
        .detail-list::-webkit-scrollbar-thumb { background: var(--profile-accent); border-radius: 3px; opacity: 0.5; }

        .detail-item {
            padding: 6px 0 6px 8px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .detail-item:hover { background: var(--bg-body); }
        .detail-item .label {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.75rem;
            font-family: var(--font-mono);
            letter-spacing: 0.3px;
        }
        .detail-item .preview {
            font-size: 0.65rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-style: italic;
        }
        .detail-item.active {
            background: rgba(212,154,154,0.12);
            border-left: 2px solid var(--profile-accent);
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            padding-top: 10px;
            margin-top: 4px;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.6rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }
        .legend-item .swatch { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; }
        .legend-item .dot-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .legend-item .sym-swatch { font-size: 0.9rem; line-height: 1; }

        .status-msg {
            font-size: 0.6rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            text-align: center;
            padding: 4px 0 0 0;
            opacity: 0.3;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* ===== 手机端 ===== */
        @media (max-width: 820px) {
            .main-row {
                flex-direction: column;
                min-height: 70vh;
                gap: 12px;
            }
            .main-card, .detail-panel {
                flex: 1;
                min-height: 0;
                height: auto;
                max-height: 70vh;
            }
            .main-card { order: 1; }
            .detail-panel { order: 2; max-height: 40vh; }
            .preview-wrap { min-height: 0; }
            .detail-list { min-height: 0; }
            body { padding: 0 10px 30px 10px; }
            .main-card { padding: 10px 8px; }
            .detail-panel { padding: 12px 10px; }
        }
        @media (max-width: 480px) {
            .main-row { min-height: 60vh; }
            .main-card, .detail-panel { max-height: 60vh; }
            .detail-panel { max-height: 35vh; }
            .header h1 { font-size: 1rem; }
            .header .sub { font-size: 0.55rem; }
            .card-title { font-size: 0.8rem; }
            .detail-panel .panel-title { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="app-wrap">
    <div class="header">
        <h1>❤ 血脉羁绊 · <span class="accent">淮棋线</span></h1>
        <span class="sub">波峰间距 510px · 周期 14.5s</span>
    </div>

    <div class="main-row">
        <div class="main-card">
            <div class="card-title"><span class="sym">❀</span> 林淮 · 栾方棋</div>
            <div class="preview-wrap" id="scrollContainer">
                <svg id="wavePreview" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <div class="legend">
                <span class="legend-item"><span class="swatch" style="background:#D49A9A;"></span> 中心线</span>
                <span class="legend-item"><span class="swatch" style="background:#2a6b8a;"></span> 波浪 1</span>
                <span class="legend-item"><span class="swatch" style="background:#b05a4a;"></span> 波浪 2</span>
                <span class="legend-item"><span class="sym-swatch">✦</span> 节点</span>
                <span class="legend-item"><span class="sym-swatch" style="color:#e07070;">❀</span> 花饰</span>
                <span class="legend-item"><span class="swatch" style="background:#e07070;"></span> 虚线</span>
                <span class="legend-item"><span class="dot-swatch" style="background:#2a6b8a;"></span> 林淮</span>
                <span class="legend-item"><span class="dot-swatch" style="background:#b05a4a;"></span> 栾方棋</span>
            </div>
            <div class="status-msg">⏳ 波形流动 · 对话左右交替 · 点击右侧详情跳转</div>
        </div>

        <div class="detail-panel">
            <div class="panel-title"><span class="sym">✦</span> 对话详情</div>
            <div class="detail-list" id="detailList"></div>
        </div>
    </div>
</div>

<script>
(function() {
    var svg = document.getElementById('wavePreview');
    var detailList = document.getElementById('detailList');
    var scrollContainer = document.getElementById('scrollContainer');
    var ns = 'http://www.w3.org/2000/svg';

    // ===== 检测手机端 =====
    var isMobile = window.innerWidth < 600;
    var scale = isMobile ? 1.6 : 1.0;
    var maxChars = isMobile ? 20 : 28;

    // ===== 基础参数（乘以 scale） =====
    var BASE_W = 860;
    var BASE_CX = 400;
    var START_Y = 50;
    var NODE_SPACING = 220;
    var AMP = 11;
    var OPACITY = 0.27;
    var PERIOD = 14.5;

    var W = Math.round(BASE_W * scale);
    var cx = Math.round(BASE_CX * scale);
    var spacing = Math.round(510 * scale);
    var nodeSpacing = Math.round(NODE_SPACING * scale);
    var amp = Math.round(AMP * scale);
    var startY = Math.round(START_Y * scale);

    // ===== 对话数据 =====
    var dialogData = [{
        side: 'right',
        label: '初识 · 国师府',
        lines: [
            { speaker: '林淮', text: '「属下没有名字，只有编号卯九。」', color: '#2a6b8a' },
            { speaker: '秦墨予', text: '「你叫什么名字？」', color: '#b05a4a' },
            { speaker: '秦墨予', text: '「既然有名字，你以后就叫林淮。」', color: '#b05a4a' }
        ],
        ref: '——第77章'
    }, {
        side: 'left',
        label: '走近 · 书房教字',
        lines: [
            { speaker: '林淮', text: '「国师大人，这不合规矩。」', color: '#2a6b8a' },
            { speaker: '秦墨予', text: '「过来，我教你‘林淮’两个字怎么写。」', color: '#b05a4a' },
            { speaker: '秦墨予', text: '「在这里，我就是规矩。」', color: '#b05a4a' }
        ],
        ref: '——第77章'
    }, {
        side: 'right',
        label: '第一次动心 · 柳州山洞',
        lines: [
            { speaker: '林淮', text: '「我只是想见你。」', color: '#2a6b8a' },
            { speaker: '秦墨予', text: '「你这人脑子烧傻了吧？！」', color: '#b05a4a' }
        ],
        ref: '——第79章'
    }, {
        side: 'left',
        label: '雪中分别 · 宫门口',
        lines: [
            { speaker: '林淮', text: '「白头空负三生意，犹记寒阶共雪温。」', color: '#2a6b8a' },
            { speaker: '秦墨予', text: '「遥望卿云归雁尽，缘深终作浅痕存。」', color: '#b05a4a' }
        ],
        ref: '——第86章'
    }, {
        side: 'right',
        label: '最后一面 · 国师府',
        lines: [
            { speaker: '林淮', text: '「秦墨予。」', color: '#2a6b8a' },
            { speaker: '秦墨予', text: '「如果有一天，我做错了什么……一定要阻止我。」', color: '#b05a4a' }
        ],
        ref: '——第84章'
    }, {
        side: 'left',
        label: '死后初遇 · 人间宅院',
        lines: [
            { speaker: '林淮', text: '「我来送你最后一程。」', color: '#2a6b8a' },
            { speaker: '栾方棋', text: '「你是来送我上路的吗？」', color: '#b05a4a' },
            { speaker: '栾方棋', text: '「谢谢你。」', color: '#b05a4a' }
        ],
        ref: '——第90章'
    }, {
        side: 'right',
        label: '无涯村重逢 · 竹林',
        lines: [
            { speaker: '林淮', text: '「你……你竟然会这么想。」（笑）', color: '#2a6b8a' },
            { speaker: '栾方棋', text: '「……我只是不想给你添麻烦。」', color: '#b05a4a' }
        ],
        ref: '——第7章'
    }, {
        side: 'left',
        label: '皇宫 · 观花卷之后',
        lines: [
            { speaker: '林淮', text: '「只要我的灵魂还留在这世界上一天，\n你就不会只是一个人。」', color: '#2a6b8a' },
            { speaker: '栾方棋', text: '「……」', color: '#b05a4a' }
        ],
        ref: '——第69章'
    }, {
        side: 'right',
        label: '浮生树下 · 告白',
        lines: [
            { speaker: '林淮', text: '「我爱你，方棋。」', color: '#2a6b8a' },
            { speaker: '栾方棋', text: '「你是林淮……你是林淮。」', color: '#b05a4a' }
        ],
        ref: '——第112章'
    }, {
        side: 'left',
        label: '成亲 · 归终殿',
        lines: [
            { speaker: '林淮', text: '「一荣俱荣，一损俱损。\n浮生之契，同生共死。」', color: '#2a6b8a' },
            { speaker: '栾方棋', text: '「我要和林淮成亲了！」', color: '#b05a4a' }
        ],
        ref: '——第121章'
    }];

    var numNodes = dialogData.length;
    var totalHeight = startY + numNodes * nodeSpacing + nodeSpacing * 2;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + totalHeight);

    var phaseA = 0, phaseB = 0, lastTime = 0;

    // ===== 波浪 =====
    function generateWavePoints(sign, spacing, amp, phase) {
        var pts = [];
        var step = Math.max(3.5 * scale, 4);
        var total = totalHeight + spacing;
        var n = Math.floor(total / step) + 6;
        for (var i = 0; i < n; i++) {
            var y = -spacing/2 + i * step;
            if (y < -spacing/2) continue;
            if (y > totalHeight + spacing/2) break;
            var angle = (y / spacing) * 2 * Math.PI + phase;
            pts.push({ x: cx + sign * amp * Math.sin(angle), y: y });
        }
        return pts;
    }

    function buildBezierPath(pts) {
        if (pts.length < 2) return '';
        var d = 'M ' + pts[0].x.toFixed(2) + ',' + pts[0].y.toFixed(2);
        for (var i = 0; i < pts.length - 1; i++) {
            var p0 = pts[i], p1 = pts[i+1];
            var dy = p1.y - p0.y;
            if (Math.abs(dy) < 0.3) { d += ' L ' + p1.x.toFixed(2) + ',' + p1.y.toFixed(2); continue; }
            var cpx = p0.x, cpx2 = p1.x;
            var cpy = p0.y + dy * 0.45, cpy2 = p1.y - dy * 0.45;
            d += ' C ' + cpx.toFixed(2) + ',' + cpy.toFixed(2) + ' ' + cpx2.toFixed(2) + ',' + cpy2.toFixed(2) + ' ' + p1.x.toFixed(2) + ',' + p1.y.toFixed(2);
        }
        return d;
    }

    // ===== 换行 =====
    function wrapText(text, maxChars2) {
        if (text.length <= maxChars2) return [text];
        var result = [], current = '';
        for (var i = 0; i < text.length; i++) {
            current += text[i];
            if (current.length >= maxChars2) {
                var lastBreak = current.lastIndexOf(' ');
                if (lastBreak === -1) lastBreak = current.length;
                result.push(current.substring(0, lastBreak));
                current = current.substring(lastBreak).trim();
            }
        }
        if (current.length > 0) result.push(current);
        return result;
    }

    // ===== 绘制对话块 =====
    function drawDialogBlock(svg, side, lines, ref, baseX, baseY) {
        var anchor = (side === 'left') ? 'end' : 'start';
        var textX = baseX;
        var speakerOffset = (side === 'left') ? -4 * scale : 4 * scale;

        var SAME_LINE = Math.round(20 * scale);
        var DIFF_EXTRA = Math.round(16 * scale);
        var CONTENT_LINE = Math.round(20 * scale);
        var SPEAKER_SIZE = Math.round(15 * scale);
        var TEXT_SIZE = Math.round(18 * scale);
        var REF_SIZE = Math.round(13 * scale);
        var SP_OFFSET = Math.round(18 * scale);

        var currentY = baseY;
        var lastSpeaker = null;

        for (var j = 0; j < lines.length; j++) {
            var item = lines[j];
            var isNewSpeaker = (lastSpeaker !== null && lastSpeaker !== item.speaker);
            if (isNewSpeaker) currentY += DIFF_EXTRA;

            var sp = document.createElementNS(ns, 'text');
            sp.setAttribute('x', textX + speakerOffset);
            sp.setAttribute('y', currentY);
            sp.setAttribute('text-anchor', anchor);
            sp.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
            sp.setAttribute('font-size', SPEAKER_SIZE);
            sp.setAttribute('font-weight', '600');
            sp.setAttribute('fill', item.color);
            sp.setAttribute('opacity', '0.65');
            sp.setAttribute('letter-spacing', '0.5px');
            sp.textContent = '— ' + item.speaker;
            svg.appendChild(sp);

            currentY += SP_OFFSET;

            var lines2 = wrapText(item.text, maxChars);
            for (var k = 0; k < lines2.length; k++) {
                var t = document.createElementNS(ns, 'text');
                t.setAttribute('x', textX + speakerOffset);
                t.setAttribute('y', currentY + k * CONTENT_LINE);
                t.setAttribute('text-anchor', anchor);
                t.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                t.setAttribute('font-size', TEXT_SIZE);
                t.setAttribute('fill', item.color);
                t.setAttribute('font-style', 'italic');
                t.setAttribute('font-weight', '400');
                t.setAttribute('opacity', '0.92');
                t.textContent = lines2[k];
                svg.appendChild(t);
            }

            currentY += lines2.length * CONTENT_LINE + Math.round(4 * scale);
            lastSpeaker = item.speaker;
        }

        var refY = currentY + Math.round(8 * scale);
        var refEl = document.createElementNS(ns, 'text');
        refEl.setAttribute('x', textX + speakerOffset);
        refEl.setAttribute('y', refY);
        refEl.setAttribute('text-anchor', anchor);
        refEl.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
        refEl.setAttribute('font-size', REF_SIZE);
        refEl.setAttribute('fill', '#555555');
        refEl.setAttribute('opacity', '0.6');
        refEl.setAttribute('letter-spacing', '0.3px');
        refEl.textContent = ref;
        svg.appendChild(refEl);

        return refY + Math.round(14 * scale);
    }

    // ===== 详情面板 =====
    function buildDetailPanel() {
        detailList.innerHTML = '';
        dialogData.forEach(function(d, idx) {
            var div = document.createElement('div');
            div.className = 'detail-item';
            div.dataset.index = idx;
            var label = document.createElement('div');
            label.className = 'label';
            label.textContent = (idx + 1) + '. ' + d.label;
            var preview = document.createElement('div');
            preview.className = 'preview';
            var firstLine = d.lines[0] ? d.lines[0].text : '';
            preview.textContent = firstLine.substring(0, 35) + (firstLine.length > 35 ? '…' : '');
            div.appendChild(label);
            div.appendChild(preview);
            div.addEventListener('click', function() {
                var index = parseInt(this.dataset.index);
                scrollToNode(index);
                document.querySelectorAll('.detail-item').forEach(function(el) { el.classList.remove('active'); });
                this.classList.add('active');
            });
            detailList.appendChild(div);
        });
        var first = detailList.querySelector('.detail-item');
        if (first) first.classList.add('active');
    }

    function scrollToNode(index) {
        var y = startY + index * nodeSpacing;
        var totalH = totalHeight + 60;
        var percent = (y - 20) / totalH;
        if (scrollContainer) {
            var target = scrollContainer.scrollHeight * Math.max(0, Math.min(1, percent));
            scrollContainer.scrollTo({ top: target - 80, behavior: 'smooth' });
        }
    }
    window.scrollToNode = scrollToNode;

    // ===== 主渲染 =====
    function render() {
        while (svg.firstChild) svg.removeChild(svg.firstChild);

        // 中心线
        var axis = document.createElementNS(ns, 'line');
        axis.setAttribute('x1', cx);
        axis.setAttribute('y1', startY);
        axis.setAttribute('x2', cx);
        axis.setAttribute('y2', totalHeight - 20);
        axis.setAttribute('stroke', '#D49A9A');
        axis.setAttribute('stroke-width', Math.round(4 * scale));
        axis.setAttribute('opacity', '0.4');
        axis.setAttribute('stroke-linecap', 'round');
        svg.appendChild(axis);

        // 波浪线
        var ptsA = generateWavePoints(1, spacing, amp, phaseA);
        var ptsB = generateWavePoints(-1, spacing, amp, phaseB);

        var pathA = document.createElementNS(ns, 'path');
        pathA.setAttribute('d', buildBezierPath(ptsA));
        pathA.setAttribute('stroke', '#2a6b8a');
        pathA.setAttribute('stroke-width', Math.round(2 * scale));
        pathA.setAttribute('fill', 'none');
        pathA.setAttribute('stroke-linecap', 'round');
        pathA.setAttribute('opacity', OPACITY);
        svg.appendChild(pathA);

        var pathB = document.createElementNS(ns, 'path');
        pathB.setAttribute('d', buildBezierPath(ptsB));
        pathB.setAttribute('stroke', '#b05a4a');
        pathB.setAttribute('stroke-width', Math.round(2 * scale));
        pathB.setAttribute('fill', 'none');
        pathB.setAttribute('stroke-linecap', 'round');
        pathB.setAttribute('opacity', OPACITY);
        svg.appendChild(pathB);

        // 节点
        for (var i = 0; i < numNodes; i++) {
            var y = startY + i * nodeSpacing;
            var data = dialogData[i];
            var side = data.side;

            var STAR_SIZE = Math.round(28 * scale);
            var FLOWER_SIZE = Math.round(24 * scale);
            var LABEL_SIZE = Math.round(15 * scale);
            var LABEL_OFFSET = Math.round(30 * scale);
            var TEXT_OFFSET = Math.round(56 * scale);
            var DASH_Y_OFFSET = Math.round(28 * scale);

            // 四角星
            var star = document.createElementNS(ns, 'text');
            star.setAttribute('x', cx);
            star.setAttribute('y', y + Math.round(5 * scale));
            star.setAttribute('text-anchor', 'middle');
            star.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
            star.setAttribute('font-size', STAR_SIZE);
            star.setAttribute('fill', '#7ab8d4');
            star.setAttribute('opacity', '0.8');
            star.textContent = '✦';
            svg.appendChild(star);

            // 虚线
            var dashY = y + DASH_Y_OFFSET;

            if (side === 'left') {
                var dashStart = Math.round(16 * scale);
                var dashEnd = cx - Math.round(28 * scale);
                var flowerX = dashStart + (dashEnd - dashStart) * 0.4;

                var dash = document.createElementNS(ns, 'line');
                dash.setAttribute('x1', dashStart);
                dash.setAttribute('y1', dashY);
                dash.setAttribute('x2', dashEnd);
                dash.setAttribute('y2', dashY);
                dash.setAttribute('stroke', '#e07070');
                dash.setAttribute('stroke-width', Math.round(2 * scale));
                dash.setAttribute('opacity', '0.5');
                dash.setAttribute('stroke-dasharray', Math.round(5 * scale) + ',' + Math.round(6 * scale));
                svg.appendChild(dash);

                var flower = document.createElementNS(ns, 'text');
                flower.setAttribute('x', flowerX);
                flower.setAttribute('y', dashY + Math.round(6 * scale));
                flower.setAttribute('text-anchor', 'middle');
                flower.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                flower.setAttribute('font-size', FLOWER_SIZE);
                flower.setAttribute('fill', '#e07070');
                flower.setAttribute('opacity', '0.85');
                flower.textContent = '❀';
                svg.appendChild(flower);

            } else {
                var dashStart = cx + Math.round(28 * scale);
                var dashEnd = W - Math.round(16 * scale);
                var flowerX = dashStart + (dashEnd - dashStart) * 0.6;

                var dash = document.createElementNS(ns, 'line');
                dash.setAttribute('x1', dashStart);
                dash.setAttribute('y1', dashY);
                dash.setAttribute('x2', dashEnd);
                dash.setAttribute('y2', dashY);
                dash.setAttribute('stroke', '#7ab8d4');
                dash.setAttribute('stroke-width', Math.round(2 * scale));
                dash.setAttribute('opacity', '0.5');
                dash.setAttribute('stroke-dasharray', Math.round(5 * scale) + ',' + Math.round(6 * scale));
                svg.appendChild(dash);

                var flower = document.createElementNS(ns, 'text');
                flower.setAttribute('x', flowerX);
                flower.setAttribute('y', dashY + Math.round(6 * scale));
                flower.setAttribute('text-anchor', 'middle');
                flower.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                flower.setAttribute('font-size', FLOWER_SIZE);
                flower.setAttribute('fill', '#e07070');
                flower.setAttribute('opacity', '0.85');
                flower.textContent = '❀';
                svg.appendChild(flower);
            }

            // 时间标签：在虚线下方，与对话侧边对齐
            var labelY = dashY + LABEL_OFFSET;
            var labelX = (side === 'left') ? cx - TEXT_OFFSET : cx + TEXT_OFFSET;
            var anchorLabel = (side === 'left') ? 'end' : 'start';

            var label = document.createElementNS(ns, 'text');
            label.setAttribute('x', labelX);
            label.setAttribute('y', labelY);
            label.setAttribute('text-anchor', anchorLabel);
            label.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
            label.setAttribute('font-size', LABEL_SIZE);
            label.setAttribute('font-weight', '600');
            label.setAttribute('fill', '#555555');
            label.setAttribute('opacity', '0.8');
            label.setAttribute('letter-spacing', '0.8px');
            label.textContent = data.label;
            svg.appendChild(label);

            // 对话
            var textBaseX = (side === 'left') ? cx - TEXT_OFFSET : cx + TEXT_OFFSET;
            var textStartY = labelY + Math.round(20 * scale);
            drawDialogBlock(svg, side, data.lines, data.ref, textBaseX, textStartY);
        }

        // 方向指示
        function addDir(x, y, text, color) {
            var t = document.createElementNS(ns, 'text');
            t.setAttribute('x', x);
            t.setAttribute('y', y);
            t.setAttribute('text-anchor', 'middle');
            t.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
            t.setAttribute('font-size', Math.round(11 * scale));
            t.setAttribute('fill', color);
            t.setAttribute('opacity', '0.3');
            t.textContent = text;
            svg.appendChild(t);
        }
        addDir(Math.round(28 * scale), Math.round(28 * scale), '↓', '#2a6b8a');
        addDir(W - Math.round(28 * scale), Math.round(28 * scale), '↑', '#b05a4a');
    }

    // ===== 动画 =====
    function animate(time) {
        if (!lastTime) lastTime = time;
        var delta = (time - lastTime) / 1000;
        lastTime = time;
        var omega = (2 * Math.PI) / PERIOD;
        var dPhase = delta * omega;
        phaseA += dPhase;
        phaseB -= dPhase;
        var twoPi = 2 * Math.PI;
        while (phaseA > twoPi) phaseA -= twoPi;
        while (phaseA < 0) phaseA += twoPi;
        while (phaseB > twoPi) phaseB -= twoPi;
        while (phaseB < 0) phaseB += twoPi;
        render();
        requestAnimationFrame(animate);
    }

    // ===== resize =====
    function handleResize() {
        var newMobile = window.innerWidth < 600;
        var newScale = newMobile ? 1.6 : 1.0;
        var newMaxChars = newMobile ? 20 : 28;
        if (newMobile !== isMobile || Math.abs(newScale - scale) > 0.01) {
            isMobile = newMobile;
            scale = newScale;
            maxChars = newMaxChars;
            W = Math.round(BASE_W * scale);
            cx = Math.round(BASE_CX * scale);
            spacing = Math.round(510 * scale);
            nodeSpacing = Math.round(NODE_SPACING * scale);
            amp = Math.round(AMP * scale);
            startY = Math.round(START_Y * scale);
            totalHeight = startY + numNodes * nodeSpacing + nodeSpacing * 2;
            svg.setAttribute('viewBox', '0 0 ' + W + ' ' + totalHeight);
            render();
        }
    }
    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleResize, 300);
    });

    // ===== 启动 =====
    buildDetailPanel();
    phaseA = 0;
    phaseB = Math.PI;
    requestAnimationFrame(animate);

    setTimeout(function() {
        if (scrollContainer) scrollContainer.style.overflow = 'auto';
        var dl = document.getElementById('detailList');
        if (dl) dl.style.overflowY = 'auto';
    }, 100);

    console.log('✅ 最终版：电脑端900px，卡片高度1900px，滚动条，手机端18px字体');
})();
</script>

</body>
</html>
