<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>血脉羁绊 · 淮棋线</title>
    <style>
        :root {
            --bg-body: #f7f4ef;
            --bg-card: #ffffff;
            --border-light: #ece6de;
            --border-card: #d5c8b8;
            --text-primary: #2c2c2c;
            --text-muted: #8a8a8a;
            --font-serif: "Georgia", "Times New Roman", "Songti SC", serif;
            --font-mono: "Courier New", "Source Code Pro", monospace;
            --lin-blue: #2a6b8a;
            --luan-red: #b05a4a;
            --pink-light: #f0c8c8;
            --blue-light: #7ab8d4;
            --star-color: #7ab8d4;
            --profile-accent: #D49A9A;
            --center-color: #D49A9A;
            --wave1-color: #2a6b8a;
            --wave2-color: #b05a4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-serif);
            background: var(--bg-body);
            color: var(--text-primary);
            padding: 0 16px 40px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-wrap {
            max-width: 860px;
            width: 100%;
            padding-top: 16px;
        }

        .header {
            padding: 0 4px 12px 4px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 { font-size: 1.1rem; font-weight: 700; }
        .header h1 .accent { color: var(--profile-accent); font-weight: 400; }
        .header .sub { font-size: 0.65rem; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 1.5px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 16px 14px 14px 14px;
            margin-top: 12px;
            box-shadow: inset 0 0 0 1px var(--profile-accent), 0 2px 10px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .sym { color: var(--profile-accent); }

        .preview-wrap {
            position: relative;
            width: 100%;
            overflow: visible;
            background: var(--bg-body);
            border-radius: 4px;
            margin-top: 2px;
        }

        .preview-wrap svg {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
            overflow: visible;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            padding-top: 12px;
            margin-top: 6px;
            border-top: 1px solid var(--border-light);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.55rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .legend-item .swatch {
            width: 18px;
            height: 3px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .legend-item .dot-swatch {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .legend-item .sym-swatch { font-size: 0.9rem; line-height: 1; }

        .status-msg {
            font-size: 0.6rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            text-align: center;
            padding: 6px 0 0 0;
            opacity: 0.35;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            body { padding: 0 8px 30px 8px; }
            .card { padding: 10px 8px; }
            .legend { gap: 4px 12px; }
            .legend-item { font-size: 0.5rem; }
        }
    </style>
</head>
<body>

    <div class="app-wrap">

        <div class="header">
            <h1>❤ 血脉羁绊 · <span class="accent">淮棋线</span></h1>
            <span class="sub">波峰间距 510px · 周期 14.5s</span>
        </div>

        <div class="card">
            <div class="card-title"><span class="sym">❀</span> 林淮 · 栾方棋</div>

            <div class="preview-wrap">
                <svg id="wavePreview" viewBox="0 0 820 1600" preserveAspectRatio="xMidYMid meet"></svg>
            </div>

            <div class="legend">
                <span class="legend-item"><span class="swatch" style="background:#D49A9A;"></span> 中心线</span>
                <span class="legend-item"><span class="swatch" style="background:#2a6b8a;"></span> 波浪 1</span>
                <span class="legend-item"><span class="swatch" style="background:#b05a4a;"></span> 波浪 2</span>
                <span class="legend-item"><span class="sym-swatch">✦</span> 节点</span>
                <span class="legend-item"><span class="sym-swatch" style="color:#f0c8c8;">❀</span> 花饰</span>
                <span class="legend-item"><span class="swatch" style="background:#f0c8c8;"></span> 虚线（粉）</span>
                <span class="legend-item"><span class="swatch" style="background:#7ab8d4;"></span> 虚线（蓝）</span>
                <span class="legend-item"><span class="dot-swatch" style="background:#2a6b8a;"></span> 林淮</span>
                <span class="legend-item"><span class="dot-swatch" style="background:#b05a4a;"></span> 栾方棋</span>
            </div>

            <div class="status-msg">⏳ 波形流动 · 对话左右交替</div>
        </div>

    </div>

    <script>
        (function() {

            var svg = document.getElementById('wavePreview');
            var ns = 'http://www.w3.org/2000/svg';

            // ===== 画布尺寸（卡片大小，不占满屏幕） =====
            var W = 820,
                H = 1600;
            var cx = 410;
            var START_Y = 50;
            var END_Y = 1550;

            // ===== 固定参数 =====
            var spacing = 510;
            var amp = 11;
            var opacity = 0.27;
            var period = 14.5;
            var phaseA = 0;
            var phaseB = 0;
            var lastTime = 0;

            // ===== 对话数据（左右交替） =====
            // side: 'left' 或 'right'，表示这一段对话放在哪一侧
            var dialogData = [{
                side: 'right',
                label: '初识 · 国师府',
                lines: [
                    { speaker: '林淮', text: '「属下没有名字，只有编号卯九。」', color: '#2a6b8a' },
                    { speaker: '秦墨予', text: '「你叫什么名字？」', color: '#b05a4a' },
                    { speaker: '秦墨予', text: '「既然有名字，你以后就叫林淮。」', color: '#b05a4a' },
                ],
                ref: '——第77章'
            }, {
                side: 'left',
                label: '走近 · 书房教字',
                lines: [
                    { speaker: '林淮', text: '「国师大人，这不合规矩。」', color: '#2a6b8a' },
                    { speaker: '秦墨予', text: '「过来，我教你‘林淮’两个字怎么写。」', color: '#b05a4a' },
                    { speaker: '秦墨予', text: '「在这里，我就是规矩。」', color: '#b05a4a' },
                ],
                ref: '——第77章'
            }, {
                side: 'right',
                label: '第一次动心 · 柳州山洞',
                lines: [
                    { speaker: '林淮', text: '「我只是想见你。」', color: '#2a6b8a' },
                    { speaker: '秦墨予', text: '「你这人脑子烧傻了吧？！」', color: '#b05a4a' },
                ],
                ref: '——第79章'
            }, {
                side: 'left',
                label: '雪中分别 · 宫门口',
                lines: [
                    { speaker: '林淮', text: '「白头空负三生意，犹记寒阶共雪温。」', color: '#2a6b8a' },
                    { speaker: '秦墨予', text: '「遥望卿云归雁尽，缘深终作浅痕存。」', color: '#b05a4a' },
                ],
                ref: '——第86章'
            }, {
                side: 'right',
                label: '最后一面 · 国师府',
                lines: [
                    { speaker: '林淮', text: '「秦墨予。」', color: '#2a6b8a' },
                    { speaker: '秦墨予', text: '「如果有一天，我做错了什么……一定要阻止我。」', color: '#b05a4a' },
                ],
                ref: '——第84章'
            }, {
                side: 'left',
                label: '死后初遇 · 人间宅院',
                lines: [
                    { speaker: '林淮', text: '「我来送你最后一程。」', color: '#2a6b8a' },
                    { speaker: '栾方棋', text: '「你是来送我上路的吗？」', color: '#b05a4a' },
                    { speaker: '栾方棋', text: '「谢谢你。」', color: '#b05a4a' },
                ],
                ref: '——第90章'
            }, {
                side: 'right',
                label: '无涯村重逢 · 竹林',
                lines: [
                    { speaker: '林淮', text: '「你……你竟然会这么想。」（笑）', color: '#2a6b8a' },
                    { speaker: '栾方棋', text: '「……我只是不想给你添麻烦。」', color: '#b05a4a' },
                ],
                ref: '——第7章'
            }, {
                side: 'left',
                label: '皇宫 · 观花卷之后',
                lines: [
                    { speaker: '林淮', text: '「只要我的灵魂还留在这世界上一天，你就不会只是一个人。」', color: '#2a6b8a' },
                    { speaker: '栾方棋', text: '「……」', color: '#b05a4a' },
                ],
                ref: '——第69章'
            }, {
                side: 'right',
                label: '浮生树下 · 告白',
                lines: [
                    { speaker: '林淮', text: '「我爱你，方棋。」', color: '#2a6b8a' },
                    { speaker: '栾方棋', text: '「你是林淮……你是林淮。」', color: '#b05a4a' },
                ],
                ref: '——第112章'
            }, {
                side: 'left',
                label: '成亲 · 归终殿',
                lines: [
                    { speaker: '林淮', text: '「一荣俱荣，一损俱损。浮生之契，同生共死。」', color: '#2a6b8a' },
                    { speaker: '栾方棋', text: '「我要和林淮成亲了！」', color: '#b05a4a' },
                ],
                ref: '——第121章'
            }];

            var numNodes = dialogData.length;
            var nodeSpacing = (END_Y - START_Y) / (numNodes - 1);

            // ===== 生成波浪点 =====
            function generateWavePoints(sign, spacing, amp, phase) {
                var pts = [];
                var step = 3.5;
                var totalHeight = (END_Y - START_Y) + spacing;
                var numPoints = Math.floor(totalHeight / step) + 4;
                for (var i = 0; i < numPoints; i++) {
                    var y = START_Y - spacing / 2 + i * step;
                    if (y < START_Y - spacing) continue;
                    if (y > END_Y + spacing / 2) break;
                    var angle = ((y - START_Y) / spacing) * 2 * Math.PI + phase;
                    var x = cx + sign * amp * Math.sin(angle);
                    pts.push({ x: x, y: y });
                }
                return pts;
            }

            function buildBezierPath(pts) {
                if (pts.length < 2) return '';
                var d = 'M ' + pts[0].x.toFixed(2) + ',' + pts[0].y.toFixed(2);
                for (var i = 0; i < pts.length - 1; i++) {
                    var p0 = pts[i];
                    var p1 = pts[i + 1];
                    var dy = p1.y - p0.y;
                    if (Math.abs(dy) < 0.3) {
                        d += ' L ' + p1.x.toFixed(2) + ',' + p1.y.toFixed(2);
                        continue;
                    }
                    var cpx = p0.x;
                    var cpx2 = p1.x;
                    var cpy = p0.y + dy * 0.45;
                    var cpy2 = p1.y - dy * 0.45;
                    d += ' C ' + cpx.toFixed(2) + ',' + cpy.toFixed(2) +
                        ' ' + cpx2.toFixed(2) + ',' + cpy2.toFixed(2) +
                        ' ' + p1.x.toFixed(2) + ',' + p1.y.toFixed(2);
                }
                return d;
            }

            // ===== 绘制多行文本（同一侧） =====
            function drawLines(svg, x, y, lines, side, lineHeight) {
                lineHeight = lineHeight || 16;
                var anchor = (side === 'left') ? 'end' : 'start';
                var textX = (side === 'left') ? x - 6 : x + 6;

                // 说话人标签
                for (var i = 0; i < lines.length; i++) {
                    var item = lines[i];
                    // 说话人小标签（在台词上方）
                    var sp = document.createElementNS(ns, 'text');
                    sp.setAttribute('x', textX);
                    sp.setAttribute('y', y + i * lineHeight - 4);
                    sp.setAttribute('text-anchor', anchor);
                    sp.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
                    sp.setAttribute('font-size', '7');
                    sp.setAttribute('fill', item.color);
                    sp.setAttribute('opacity', '0.4');
                    sp.setAttribute('letter-spacing', '0.5px');
                    sp.textContent = '— ' + item.speaker;
                    svg.appendChild(sp);

                    // 台词
                    var t = document.createElementNS(ns, 'text');
                    t.setAttribute('x', textX);
                    t.setAttribute('y', y + i * lineHeight + 6);
                    t.setAttribute('text-anchor', anchor);
                    t.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                    t.setAttribute('font-size', '9.5');
                    t.setAttribute('fill', item.color);
                    t.setAttribute('font-style', 'italic');
                    t.setAttribute('font-weight', '400');
                    t.setAttribute('opacity', '0.92');
                    t.textContent = item.text;
                    svg.appendChild(t);
                }
            }

            // ===== 主渲染 =====
            function render() {
                while (svg.firstChild) svg.removeChild(svg.firstChild);

                // 1. 中心线
                var axis = document.createElementNS(ns, 'line');
                axis.setAttribute('x1', cx);
                axis.setAttribute('y1', START_Y - 20);
                axis.setAttribute('x2', cx);
                axis.setAttribute('y2', END_Y + 20);
                axis.setAttribute('stroke', '#D49A9A');
                axis.setAttribute('stroke-width', '4');
                axis.setAttribute('opacity', '0.4');
                axis.setAttribute('stroke-linecap', 'round');
                svg.appendChild(axis);

                // 2. 波浪线
                var ptsA = generateWavePoints(1, spacing, amp, phaseA);
                var ptsB = generateWavePoints(-1, spacing, amp, phaseB);

                var pathA = document.createElementNS(ns, 'path');
                pathA.setAttribute('d', buildBezierPath(ptsA));
                pathA.setAttribute('stroke', '#2a6b8a');
                pathA.setAttribute('stroke-width', '2');
                pathA.setAttribute('fill', 'none');
                pathA.setAttribute('stroke-linecap', 'round');
                pathA.setAttribute('opacity', opacity);
                svg.appendChild(pathA);

                var pathB = document.createElementNS(ns, 'path');
                pathB.setAttribute('d', buildBezierPath(ptsB));
                pathB.setAttribute('stroke', '#b05a4a');
                pathB.setAttribute('stroke-width', '2');
                pathB.setAttribute('fill', 'none');
                pathB.setAttribute('stroke-linecap', 'round');
                pathB.setAttribute('opacity', opacity);
                svg.appendChild(pathB);

                // 3. 节点
                for (var i = 0; i < numNodes; i++) {
                    var y = START_Y + i * nodeSpacing;
                    var data = dialogData[i];
                    var side = data.side;

                    // ---- 四角星（中心线上） ----
                    var star = document.createElementNS(ns, 'text');
                    star.setAttribute('x', cx);
                    star.setAttribute('y', y + 4);
                    star.setAttribute('text-anchor', 'middle');
                    star.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                    star.setAttribute('font-size', '20');
                    star.setAttribute('fill', '#7ab8d4');
                    star.setAttribute('opacity', '0.8');
                    star.textContent = '✦';
                    svg.appendChild(star);

                    // ---- 两侧 ❀ + 虚线（加长） ----
                    var leftX = cx - 70;
                    var rightX = cx + 70;

                    // 左侧 ❀
                    var lf = document.createElementNS(ns, 'text');
                    lf.setAttribute('x', leftX);
                    lf.setAttribute('y', y + 3);
                    lf.setAttribute('text-anchor', 'middle');
                    lf.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                    lf.setAttribute('font-size', '16');
                    lf.setAttribute('fill', '#f0c8c8');
                    lf.setAttribute('opacity', '0.6');
                    lf.textContent = '❀';
                    svg.appendChild(lf);

                    // 左侧虚线（加长到中轴线附近）
                    var dashL = document.createElementNS(ns, 'line');
                    dashL.setAttribute('x1', leftX + 8);
                    dashL.setAttribute('y1', y);
                    dashL.setAttribute('x2', cx - 14);
                    dashL.setAttribute('y2', y);
                    dashL.setAttribute('stroke', '#f0c8c8');
                    dashL.setAttribute('stroke-width', '1.5');
                    dashL.setAttribute('opacity', '0.45');
                    dashL.setAttribute('stroke-dasharray', '4,5');
                    svg.appendChild(dashL);

                    // 右侧 ❀
                    var rf = document.createElementNS(ns, 'text');
                    rf.setAttribute('x', rightX);
                    rf.setAttribute('y', y + 3);
                    rf.setAttribute('text-anchor', 'middle');
                    rf.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                    rf.setAttribute('font-size', '16');
                    rf.setAttribute('fill', '#f0c8c8');
                    rf.setAttribute('opacity', '0.6');
                    rf.textContent = '❀';
                    svg.appendChild(rf);

                    // 右侧虚线（加长到中轴线附近）
                    var dashR = document.createElementNS(ns, 'line');
                    dashR.setAttribute('x1', rightX - 8);
                    dashR.setAttribute('y1', y);
                    dashR.setAttribute('x2', cx + 14);
                    dashR.setAttribute('y2', y);
                    dashR.setAttribute('stroke', '#7ab8d4');
                    dashR.setAttribute('stroke-width', '1.5');
                    dashR.setAttribute('opacity', '0.45');
                    dashR.setAttribute('stroke-dasharray', '4,5');
                    svg.appendChild(dashR);

                    // ---- 场景标签 ----
                    var labelY = y - nodeSpacing * 0.3;
                    if (i === 0) labelY = START_Y - 6;
                    var label = document.createElementNS(ns, 'text');
                    label.setAttribute('x', cx);
                    label.setAttribute('y', labelY);
                    label.setAttribute('text-anchor', 'middle');
                    label.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
                    label.setAttribute('font-size', '8.5');
                    label.setAttribute('fill', '#8a8a8a');
                    label.setAttribute('opacity', '0.5');
                    label.setAttribute('letter-spacing', '0.8px');
                    label.textContent = data.label;
                    svg.appendChild(label);

                    // ---- 对话（放在对应侧） ----
                    var lineHeight = 18;
                    var textStartY = y + 12;

                    // 根据 side 决定文字放在哪一侧
                    // 对话文字放在 ❀ 更外侧，留出空间
                    var textOffset = 50; // 从 ❀ 再往外偏移
                    var textX = (side === 'left') ? leftX - textOffset : rightX + textOffset;
                    var anchor = (side === 'left') ? 'end' : 'start';

                    // 画对话
                    for (var j = 0; j < data.lines.length; j++) {
                        var item = data.lines[j];

                        // 说话人标签（在台词上方）
                        var sp = document.createElementNS(ns, 'text');
                        sp.setAttribute('x', textX);
                        sp.setAttribute('y', textStartY + j * lineHeight - 4);
                        sp.setAttribute('text-anchor', anchor);
                        sp.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
                        sp.setAttribute('font-size', '7');
                        sp.setAttribute('fill', item.color);
                        sp.setAttribute('opacity', '0.35');
                        sp.setAttribute('letter-spacing', '0.5px');
                        sp.textContent = '— ' + item.speaker;
                        svg.appendChild(sp);

                        // 台词
                        var t = document.createElementNS(ns, 'text');
                        t.setAttribute('x', textX);
                        t.setAttribute('y', textStartY + j * lineHeight + 6);
                        t.setAttribute('text-anchor', anchor);
                        t.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                        t.setAttribute('font-size', '9.5');
                        t.setAttribute('fill', item.color);
                        t.setAttribute('font-style', 'italic');
                        t.setAttribute('font-weight', '400');
                        t.setAttribute('opacity', '0.92');
                        t.textContent = item.text;
                        svg.appendChild(t);
                    }

                    // ---- 章节引用 ----
                    var refY = textStartY + data.lines.length * lineHeight + 8;
                    var ref = document.createElementNS(ns, 'text');
                    ref.setAttribute('x', textX);
                    ref.setAttribute('y', refY);
                    ref.setAttribute('text-anchor', anchor);
                    ref.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
                    ref.setAttribute('font-size', '6.5');
                    ref.setAttribute('fill', '#8a8a8a');
                    ref.setAttribute('opacity', '0.25');
                    ref.setAttribute('letter-spacing', '0.3px');
                    ref.textContent = data.ref;
                    svg.appendChild(ref);
                }

                // 方向指示
                function addDir(x, y, text, color) {
                    var t = document.createElementNS(ns, 'text');
                    t.setAttribute('x', x);
                    t.setAttribute('y', y);
                    t.setAttribute('text-anchor', 'middle');
                    t.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
                    t.setAttribute('font-size', '9');
                    t.setAttribute('fill', color);
                    t.setAttribute('opacity', '0.3');
                    t.textContent = text;
                    svg.appendChild(t);
                }
                addDir(30, 28, '↓', '#2a6b8a');
                addDir(790, 28, '↑', '#b05a4a');
            }

            // ===== 动画 =====
            function animate(time) {
                if (!lastTime) lastTime = time;
                var delta = (time - lastTime) / 1000;
                lastTime = time;

                var omega = (2 * Math.PI) / period;
                var dPhase = delta * omega;
                phaseA += dPhase;
                phaseB -= dPhase;

                var twoPi = 2 * Math.PI;
                while (phaseA > twoPi) phaseA -= twoPi;
                while (phaseA < 0) phaseA += twoPi;
                while (phaseB > twoPi) phaseB -= twoPi;
                while (phaseB < 0) phaseB += twoPi;

                render();
                requestAnimationFrame(animate);
            }

            // ===== 启动 =====
            phaseA = 0;
            phaseB = Math.PI;
            requestAnimationFrame(animate);

            console.log('✅ 淮棋线完整版已加载，10段对话左右交替');
