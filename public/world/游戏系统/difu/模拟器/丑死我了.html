<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>血脉羁绊 · 预览</title>
    <style>
        :root {
            --bg-body: #faf6ef;
            --bg-card: #ffffff;
            --bg-card-alt: #f2eee9;
            --border-light: #e8e0d5;
            --border-card: #d5c8b8;
            --text-primary: #1f1a16;
            --text-secondary: #2c241e;
            --text-muted: #5a4d42;
            --text-muted-light: #8a7a6a;
            --accent: #8a3a2a;
            --accent-glow: rgba(138,58,42,0.25);
            --lin-blue: #2a6b8a;
            --luan-red: #8B1A1A;
            --luo-purple: #7b4b8a;
            --wei-gold: #c9a84b;
            --linxiwu-pink: #D49A9A;
            --luojin-gray: #4E5A64;
            --font-serif: "Georgia", "Times New Roman", "Songti SC", serif;
            --font-mono: "Courier New", "Source Code Pro", monospace;
            --transition: 0.25s ease;
        }

        [data-theme="dark"] {
            --bg-body: #1e1a16;
            --bg-card: #2a2520;
            --bg-card-alt: #24201c;
            --border-light: #3a3530;
            --border-card: #4a443e;
            --text-primary: #cfc8c0;
            --text-secondary: #b8aea4;
            --text-muted: #8a8078;
            --text-muted-light: #6a6560;
            --accent: #b05a4a;
            --accent-glow: rgba(176,90,74,0.30);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-serif);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 0 16px 40px 16px;
        }

        .preview-header {
            max-width: 1100px;
            margin: 0 auto 16px auto;
            padding: 20px 4px 12px 4px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 8px;
        }
        .preview-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .preview-header h1 .accent {
            color: var(--linxiwu-pink);
            font-weight: 400;
        }
        .preview-header .sub {
            font-size: 0.7rem;
            color: var(--text-muted-light);
            font-family: var(--font-mono);
            letter-spacing: 1.5px;
        }

        .preview-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 20px 12px 16px 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
            overflow: hidden;
        }

        .vine-rows {
            display: flex;
            flex-direction: row;
            gap: 0;
            justify-content: center;
            min-height: 600px;
            position: relative;
        }

        .vine-col {
            flex: 1;
            max-width: 480px;
            min-width: 0;
            position: relative;
            padding: 0 4px;
        }
        .vine-col .col-label {
            text-align: center;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            letter-spacing: 2px;
            color: var(--text-muted-light);
            padding-bottom: 6px;
            opacity: 0.5;
        }

        .vine-col svg {
            display: block;
            width: 100%;
            height: 600px;
            background: transparent;
            overflow: visible;
        }

        .vine-divider {
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--linxiwu-pink), transparent);
            opacity: 0.25;
            flex-shrink: 0;
            margin: 0 6px;
            border-radius: 1px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            justify-content: center;
            padding-top: 14px;
            margin-top: 4px;
            border-top: 1px solid var(--border-light);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            color: var(--text-muted-light);
            letter-spacing: 0.3px;
        }
        .legend-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            .vine-rows {
                flex-direction: column;
                align-items: center;
                min-height: auto;
                gap: 20px;
            }
            .vine-col {
                max-width: 100%;
                width: 100%;
            }
            .vine-col svg {
                height: 500px;
            }
            .vine-divider {
                width: 50%;
                height: 2px;
                margin: 0 auto;
                background: linear-gradient(to right, transparent, var(--linxiwu-pink), transparent);
            }
            .preview-container { padding: 12px 6px; }
        }

        @media (max-width: 480px) {
            .vine-col svg { height: 420px; }
            .preview-header h1 { font-size: 1rem; }
            .legend { gap: 6px 12px; }
            .legend-item { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <div class="preview-header">
        <h1>❤ 血脉羁绊 · <span class="accent">预览</span></h1>
        <span class="sub">柳枝垂落 · 对话交织</span>
    </div>

    <div class="preview-container">

        <div class="vine-rows">

            <!-- 左：淮棋 -->
            <div class="vine-col">
                <div class="col-label">❀ 淮 · 棋</div>
                <svg id="svgLin" viewBox="0 0 420 600" preserveAspectRatio="xMidYMid meet"></svg>
            </div>

            <div class="vine-divider"></div>

            <!-- 右：修璟 -->
            <div class="vine-col">
                <div class="col-label">◈ 修 · 璟</div>
                <svg id="svgXiu" viewBox="0 0 420 600" preserveAspectRatio="xMidYMid meet"></svg>
            </div>

        </div>

        <div class="legend">
            <span class="legend-item"><span class="dot" style="background:#2a6b8a;"></span> 林淮</span>
            <span class="legend-item"><span class="dot" style="background:#b05a4a;"></span> 栾方棋</span>
            <span class="legend-item"><span class="dot" style="background:#7b4b8a;"></span> 罗修</span>
            <span class="legend-item"><span class="dot" style="background:#c9a84b;"></span> 魏元璟</span>
            <span class="legend-item"><span class="dot" style="background:#D49A9A;"></span> 归终交汇</span>
        </div>

    </div>

    <script>
        (function() {

            // ===== 对话式台词 =====
            var linData = [
                { side: 'right', quote: '「我只是想见你。」', speaker: '林淮', color: '#2a6b8a' },
                { side: 'left', quote: '「你……脑子烧傻了吧？」', speaker: '栾方棋', color: '#b05a4a' },
                { side: 'right', quote: '「白头空负三生意，\n犹记寒阶共雪温。」', speaker: '林淮', color: '#2a6b8a' },
                { side: 'left', quote: '「遥望卿云归雁尽，\n缘深终作浅痕存。」', speaker: '栾方棋', color: '#b05a4a' },
                { side: 'right', quote: '「只要你活着，就好。」', speaker: '林淮', color: '#2a6b8a' },
                { side: 'left', quote: '「一荣俱荣，一损俱损。」', speaker: '栾方棋', color: '#b05a4a' },
                { side: 'right', quote: '「我爱你，方棋。」', speaker: '林淮', color: '#2a6b8a' },
                { side: 'left', quote: '「……我也是。」', speaker: '栾方棋', color: '#b05a4a' },
            ];

            var xiuData = [
                { side: 'left', quote: '「罗修！落月宫你这辈子都赔不起！！」', speaker: '魏元璟', color: '#c9a84b' },
                { side: 'right', quote: '「赔？那就不赔了。」', speaker: '罗修', color: '#7b4b8a' },
                { side: 'left', quote: '「你还想要酒吗？」', speaker: '魏元璟', color: '#c9a84b' },
                { side: 'right', quote: '「不要了。」', speaker: '罗修', color: '#7b4b8a' },
                { side: 'left', quote: '「师父，你想喝酒吗？」', speaker: '魏元璟', color: '#c9a84b' },
                { side: 'right', quote: '「……嗯。」', speaker: '罗修', color: '#7b4b8a' },
                { side: 'left', quote: '「不悔。」', speaker: '魏元璟', color: '#c9a84b' },
                { side: 'right', quote: '「魂火为鉴，永生不离。」', speaker: '罗修', color: '#7b4b8a' },
            ];

            var W = 420,
                H = 600;
            var centerX = 210;
            var waveAmp = 14; // 更浅的幅度
            var period = 110;
            var startY = 50;

            // 节点位置：交替在直线左右
            function getNodePositions(count) {
                var positions = [];
                for (var i = 0; i < count; i++) {
                    var y = startY + i * period / 2 + 10;
                    var isPeak = (i % 2 === 0);
                    var xOffset = isPeak ? waveAmp : -waveAmp;
                    positions.push({ y: y, xOffset: xOffset, isPeak: isPeak });
                }
                return positions;
            }

            // 生成波浪路径（用sin）
            function generateWavePoints(amp, period, startY, endY, steps) {
                steps = steps || 300;
                var pts = [];
                for (var i = 0; i <= steps; i++) {
                    var t = i / steps;
                    var y = startY + t * (endY - startY);
                    var x = centerX + amp * Math.sin((y - startY) / period * 2 * Math.PI);
                    pts.push({ x: x, y: y });
                }
                return pts;
            }

            function buildPath(pts) {
                var d = 'M ' + pts[0].x.toFixed(2) + ',' + pts[0].y.toFixed(2);
                for (var i = 1; i < pts.length; i++) {
                    d += ' L ' + pts[i].x.toFixed(2) + ',' + pts[i].y.toFixed(2);
                }
                return d;
            }

            // ===== 主渲染 =====
            function renderVine(svgId, data, color1, color2, centerColor, label) {
                var svg = document.getElementById(svgId);
                if (!svg) return;
                while (svg.firstChild) svg.removeChild(svg.firstChild);

                var ns = 'http://www.w3.org/2000/svg';
                var count = data.length;
                var nodePos = getNodePositions(count);
                var endY = startY + (count - 1) * period / 2 + 50;

                // 1. 中间粗直线（加粗加深）
                var axis = document.createElementNS(ns, 'line');
                axis.setAttribute('x1', centerX);
                axis.setAttribute('y1', startY - 10);
                axis.setAttribute('x2', centerX);
                axis.setAttribute('y2', endY);
                axis.setAttribute('stroke', centerColor);
                axis.setAttribute('stroke-width', '3.5');
                axis.setAttribute('opacity', '0.5');
                axis.setAttribute('stroke-linecap', 'round');
                svg.appendChild(axis);

                // 2. 两条波浪线（带动态效果：用class标记，CSS animation）
                var pts1 = generateWavePoints(waveAmp, period, startY - 10, endY);
                var pts2 = generateWavePoints(-waveAmp, period, startY - 10, endY);

                var wave1 = document.createElementNS(ns, 'path');
                wave1.setAttribute('d', buildPath(pts1));
                wave1.setAttribute('stroke', color1);
                wave1.setAttribute('stroke-width', '2');
                wave1.setAttribute('fill', 'none');
                wave1.setAttribute('stroke-linecap', 'round');
                wave1.setAttribute('opacity', '0.4');
                wave1.setAttribute('class', 'wave-drift');
                svg.appendChild(wave1);

                var wave2 = document.createElementNS(ns, 'path');
                wave2.setAttribute('d', buildPath(pts2));
                wave2.setAttribute('stroke', color2);
                wave2.setAttribute('stroke-width', '2');
                wave2.setAttribute('fill', 'none');
                wave2.setAttribute('stroke-linecap', 'round');
                wave2.setAttribute('opacity', '0.4');
                wave2.setAttribute('class', 'wave-drift-2');
                svg.appendChild(wave2);

                // 2.5 动态效果style
                var style = document.createElementNS(ns, 'style');
                style.textContent = `
                    .wave-drift { animation: drift1 4s ease-in-out infinite alternate; }
                    .wave-drift-2 { animation: drift2 5s ease-in-out infinite alternate-reverse; }
                    @keyframes drift1 {
                        0% { transform: translateX(-8px); }
                        100% { transform: translateX(8px); }
                    }
                    @keyframes drift2 {
                        0% { transform: translateX(6px); }
                        100% { transform: translateX(-6px); }
                    }
                `;
                svg.appendChild(style);

                // 3. 节点（在直线上！用纯符号）
                for (var i = 0; i < count; i++) {
                    var pos = nodePos[i];
                    var item = data[i];

                    // 节点在直线上的位置（x = centerX，y在波浪线上下轻微浮动）
                    var nodeX = centerX;
                    var nodeY = pos.y;

                    // 节点符号（用文本，无圆无框）
                    var sym = document.createElementNS(ns, 'text');
                    sym.setAttribute('x', nodeX);
                    sym.setAttribute('y', nodeY + 4);
                    sym.setAttribute('text-anchor', 'middle');
                    sym.setAttribute('font-family', 'var(--font-serif)');
                    sym.setAttribute('font-size', '20');
                    sym.setAttribute('fill', item.color);
                    sym.setAttribute('opacity', '0.8');
                    sym.textContent = (i % 2 === 0) ? '✦' : '✧';
                    svg.appendChild(sym);

                    // 分支虚线（横向伸出）
                    var dir = (item.side === 'right') ? 1 : -1;
                    var branchLen = 100;

                    var bx1 = nodeX,
                        by1 = nodeY;
                    var bx2 = nodeX + dir * branchLen,
                        by2 = nodeY;

                    var branch = document.createElementNS(ns, 'line');
                    branch.setAttribute('x1', bx1);
                    branch.setAttribute('y1', by1);
                    branch.setAttribute('x2', bx2);
                    branch.setAttribute('y2', by2);
                    branch.setAttribute('stroke', item.color);
                    branch.setAttribute('stroke-width', '1.2');
                    branch.setAttribute('opacity', '0.3');
                    branch.setAttribute('stroke-dasharray', '3,5');
                    svg.appendChild(branch);

                    // 台词（在分支线下面，而不是末端）
                    var lines = item.quote.split('\n');
                    var fontSize = (lines.length > 1) ? 9.5 : 11;
                    var lineHeight = fontSize + 2.5;
                    var anchor = (dir === 1) ? 'start' : 'end';

                    // 台词位置：分支线下面偏移
                    var textX = nodeX + dir * (branchLen * 0.6);
                    var textY = nodeY + (dir === 1 ? 18 : 18);

                    for (var li = 0; li < lines.length; li++) {
                        var t = document.createElementNS(ns, 'text');
                        t.setAttribute('x', textX);
                        t.setAttribute('y', textY + li * lineHeight);
                        t.setAttribute('text-anchor', anchor);
                        t.setAttribute('font-family', '"Georgia","Times New Roman","Songti SC",serif');
                        t.setAttribute('font-size', fontSize);
                        t.setAttribute('fill', item.color);
                        t.setAttribute('font-style', 'italic');
                        t.setAttribute('font-weight', '400');
                        t.setAttribute('letter-spacing', '0.2px');
                        t.setAttribute('opacity', '0.9');
                        t.textContent = lines[li];
                        svg.appendChild(t);
                    }

                    // 说话人（在台词下方更小）
                    var sp = document.createElementNS(ns, 'text');
                    sp.setAttribute('x', textX);
                    sp.setAttribute('y', textY + lines.length * lineHeight + 8);
                    sp.setAttribute('text-anchor', anchor);
                    sp.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
                    sp.setAttribute('font-size', '7');
                    sp.setAttribute('fill', item.color);
                    sp.setAttribute('opacity', '0.35');
                    sp.setAttribute('letter-spacing', '0.5px');
                    sp.textContent = '— ' + item.speaker;
                    svg.appendChild(sp);
                }

                // 顶部装饰
                var topSym = document.createElementNS(ns, 'text');
                topSym.setAttribute('x', centerX);
                topSym.setAttribute('y', 22);
                topSym.setAttribute('text-anchor', 'middle');
                topSym.setAttribute('font-size', '16');
                topSym.setAttribute('fill', centerColor);
                topSym.setAttribute('opacity', '0.3');
                topSym.textContent = (svgId === 'svgLin') ? '❀' : '◈';
                svg.appendChild(topSym);

                // 底部
                var foot = document.createElementNS(ns, 'text');
                foot.setAttribute('x', centerX);
                foot.setAttribute('y', H - 8);
                foot.setAttribute('text-anchor', 'middle');
                foot.setAttribute('font-family', '"Courier New","Source Code Pro",monospace');
                foot.setAttribute('font-size', '8');
                foot.setAttribute('fill', centerColor);
                foot.setAttribute('opacity', '0.2');
                foot.setAttribute('letter-spacing', '1.5px');
                foot.textContent = label;
                svg.appendChild(foot);
            }

            // ===== 执行 =====
            renderVine('svgLin', linData, '#2a6b8a', '#b05a4a', '#D49A9A', '❀ 浮生之契 · 同生共死');
            renderVine('svgXiu', xiuData, '#7b4b8a', '#c9a84b', '#4E5A64', '◈ 魂火为鉴 · 永生不离');

        })();
    </script>

</body>
</html>
