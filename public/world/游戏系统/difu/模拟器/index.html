<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引渡人模拟器 · 归终殿</title>
<style>
:root{
  /* ★ 夜间模式卡片半透明,让底图透出来 */
  --bg-body:#1a1614;--bg-card:rgba(36,32,28,0.72);--bg-card-hover:rgba(45,40,36,0.82);--border-light:#3d3732;--border-card:#4a443e;--text-primary:#e8e0d5;--text-secondary:#b8aea4;--text-muted:#8a8078;--accent:#c4b4a0;--profile-lin:#D49A9A;--profile-luo:#4E5A64;--font-serif:"Georgia","Times New Roman","Songti SC",serif;--font-mono:"Courier New","Source Code Pro",monospace;--transition:0.3s ease;
}
[data-theme="light"]{--bg-body:#f7f4ef;--bg-card:rgba(255,255,255,0.78);--bg-card-hover:rgba(255,255,255,0.9);--border-light:#ece6de;--border-card:#d5c8b8;--text-primary:#2c2c2c;--text-secondary:#4a4a4a;--text-muted:#8a8a8a;--accent:#8a3a2a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-serif);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:color var(--transition);overflow:hidden;position:relative;

  /* ★ 底图:横屏(电脑/平板横屏)用电脑端图片 */
  background:url('首页图.jpg') center/cover no-repeat fixed var(--bg-body);
}
/* ★ 竖屏(手机/平板竖屏)用手机端图片 */
@media (orientation:portrait){
  body{background:url('手机图.jpg') center/cover no-repeat fixed var(--bg-body);}
  /* 把上面的 url 换成你的手机端图片路径即可 */
}

/* 底图遮罩(让文字更清晰) */
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0.15) 40%,rgba(0,0,0,0.25) 70%,rgba(0,0,0,0.5) 100%);
}
[data-theme="light"] body::before{
  background:linear-gradient(180deg,rgba(255,255,255,0.25) 0%,rgba(255,255,255,0.1) 40%,rgba(255,255,255,0.2) 70%,rgba(255,255,255,0.4) 100%);
}

.float-group{position:fixed;top:20px;right:24px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.float-btn{background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;font-size:.65rem;color:rgba(255,255,255,0.8);cursor:pointer;transition:all var(--transition);font-family:var(--font-mono);display:flex;align-items:center;gap:6px;letter-spacing:.3px;text-decoration:none;}
.float-btn:hover{background:rgba(255,255,255,0.25);border-color:var(--accent);color:var(--accent);}
[data-theme="light"] .float-btn{background:rgba(255,255,255,0.6);border-color:rgba(138,58,42,0.2);color:var(--text-secondary);}

.container{width:100%;max-width:520px;text-align:center;position:relative;z-index:3;}
.badge{font-size:.65rem;color:rgba(255,255,255,0.6);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;font-family:var(--font-mono);}
[data-theme="light"] .badge{color:rgba(44,44,44,0.5);}
/* ★ 文字描边:夜间白字包黑边,日间黑字包白边 */
h1{font-size:2rem;font-weight:700;letter-spacing:2px;margin-bottom:6px;color:#fff;
  text-shadow:-1px -1px 0 rgba(0,0,0,0.7),1px -1px 0 rgba(0,0,0,0.7),-1px 1px 0 rgba(0,0,0,0.7),1px 1px 0 rgba(0,0,0,0.7),0 0 8px rgba(0,0,0,0.5),0 2px 12px rgba(0,0,0,0.5);
}
[data-theme="light"] h1{color:var(--text-primary);
  text-shadow:-1px -1px 0 rgba(255,255,255,0.8),1px -1px 0 rgba(255,255,255,0.8),-1px 1px 0 rgba(255,255,255,0.8),1px 1px 0 rgba(255,255,255,0.8),0 0 8px rgba(255,255,255,0.6),0 2px 8px rgba(0,0,0,0.15);
}
.badge{
  text-shadow:-1px -1px 0 rgba(0,0,0,0.5),1px -1px 0 rgba(0,0,0,0.5),-1px 1px 0 rgba(0,0,0,0.5),1px 1px 0 rgba(0,0,0,0.5);
}
[data-theme="light"] .badge{
  text-shadow:-1px -1px 0 rgba(255,255,255,0.7),1px -1px 0 rgba(255,255,255,0.7),-1px 1px 0 rgba(255,255,255,0.7),1px 1px 0 rgba(255,255,255,0.7);
}
.subtitle{font-size:.9rem;color:rgba(255,255,255,0.85);font-style:italic;margin-bottom:32px;line-height:1.6;
  text-shadow:-1px -1px 0 rgba(0,0,0,0.6),1px -1px 0 rgba(0,0,0,0.6),-1px 1px 0 rgba(0,0,0,0.6),1px 1px 0 rgba(0,0,0,0.6),0 1px 4px rgba(0,0,0,0.4);
}
[data-theme="light"] .subtitle{color:var(--text-secondary);
  text-shadow:-1px -1px 0 rgba(255,255,255,0.7),1px -1px 0 rgba(255,255,255,0.7),-1px 1px 0 rgba(255,255,255,0.7),1px 1px 0 rgba(255,255,255,0.7);
}
.footer-note{
  text-shadow:-1px -1px 0 rgba(0,0,0,0.5),1px -1px 0 rgba(0,0,0,0.5),-1px 1px 0 rgba(0,0,0,0.5),1px 1px 0 rgba(0,0,0,0.5);
}
[data-theme="light"] .footer-note{
  text-shadow:-1px -1px 0 rgba(255,255,255,0.6),1px -1px 0 rgba(255,255,255,0.6),-1px 1px 0 rgba(255,255,255,0.6),1px 1px 0 rgba(255,255,255,0.6);
}

/* 卡片缩小,半透明,让背景透出来 */
.profile-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.profile-card{background:var(--bg-card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1.5px solid var(--border-card);border-radius:12px;padding:18px 12px;cursor:pointer;transition:all var(--transition);position:relative;}
.profile-card:hover{transform:translateY(-2px);background:var(--bg-card-hover);}
.profile-card.active[data-profile="linxiwu"]{border-color:var(--profile-lin);box-shadow:0 0 0 3px rgba(212,154,154,0.15);}
.profile-card.active[data-profile="luojin"]{border-color:var(--profile-luo);box-shadow:0 0 0 3px rgba(78,90,100,0.15);}
.profile-card .sym{font-size:1.4rem;margin-bottom:6px;display:block;}
.profile-card .name{font-size:1rem;font-weight:600;margin-bottom:4px;}
.profile-card .desc{font-size:.72rem;color:var(--text-muted);line-height:1.4;}

/* 开始按钮缩小 */
.start-btn{display:inline-block;width:100%;padding:10px;background:rgba(255,255,255,0.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1.5px solid var(--accent);border-radius:20px;color:var(--accent);font-family:var(--font-serif);font-size:.9rem;letter-spacing:2px;cursor:pointer;transition:all var(--transition);text-decoration:none;text-align:center;}
.start-btn:hover{background:var(--accent);color:#fff;}
.footer-note{margin-top:18px;font-size:.65rem;color:rgba(255,255,255,0.4);font-family:var(--font-mono);letter-spacing:.5px;}
[data-theme="light"] .footer-note{color:var(--text-muted);}

/* ===== 粒子层 ===== */
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.particle{position:absolute;bottom:-20px;font-size:12px;color:var(--accent);opacity:0;animation:floatUp linear infinite;will-change:transform,opacity;}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}10%{opacity:0.6;}90%{opacity:0.4;}100%{transform:translateY(-110vh) translateX(var(--drift)) rotate(360deg);opacity:0;}}

/* 光晕装饰 */
.glow{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.08;pointer-events:none;z-index:0;animation:glowPulse 6s ease-in-out infinite alternate;}
.glow-1{width:300px;height:300px;background:var(--profile-lin);top:10%;left:10%;animation-delay:0s;}
.glow-2{width:250px;height:250px;background:var(--profile-luo);bottom:15%;right:10%;animation-delay:3s;}
@keyframes glowPulse{0%{opacity:0.05;transform:scale(1);}100%{opacity:0.12;transform:scale(1.15);}}

/* ===== 波浪效果 ===== */
.waves-container{position:fixed;bottom:0;left:0;right:0;z-index:2;pointer-events:none;line-height:0;}
.waves-container svg{width:100%;height:80px;display:block;}
.wave-layer{animation:waveMove 12s linear infinite;}
.wave-layer-2{animation:waveMove 18s linear infinite reverse;opacity:0.5;}
.wave-layer-3{animation:waveMove 24s linear infinite;opacity:0.3;}
@keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

@media(max-width:480px){
  h1{font-size:1.5rem;}
  .profile-select{gap:8px;}
  .profile-card{padding:14px 8px;}
  .profile-card .sym{font-size:1.2rem;}
  .profile-card .name{font-size:.9rem;}
  .profile-card .desc{font-size:.65rem;}
  .subtitle{font-size:.82rem;margin-bottom:20px;}
  .start-btn{padding:8px;font-size:.82rem;}
  .waves-container svg{height:50px;}
}
</style>
</head>
<body>

<div class="float-group">
  <a class="float-btn" href="../index"><span style="margin-right:2px;">←</span> 返回</a>
  <button class="float-btn" id="themeBtn" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeLabel">夜间</span></button>
</div>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<!-- 粒子层 -->
<div id="particles"></div>

<div class="container">
  <div class="badge">◈ 归终殿弟子手册</div>
  <h1>引渡人模拟器</h1>
  <p class="subtitle">"从入门弟子到十席之路，你的地府生涯，由你书写。"</p>
  <div class="profile-select" id="profileSelect">
    <div class="profile-card active" data-profile="linxiwu" onclick="selectProfile('linxiwu')">
      <span class="sym">✿</span>
      <div class="name">林栖梧</div>
      <div class="desc">符修院助教 · 浮生树血脉<br>双父：林淮 × 栾方棋</div>
    </div>
    <div class="profile-card" data-profile="luojin" onclick="selectProfile('luojin')">
      <span class="sym">✦</span>
      <div class="name">罗烬</div>
      <div class="desc">讲武堂弟子 · 刀法传承<br>双父：罗修 × 魏元璟</div>
    </div>
  </div>
  <a href="./壳.html" class="start-btn" id="startBtn">开始人生</a>
  <script>
  (function(){
    var inShell=false;
    try{inShell=window.self!==window.top&&window.parent&&window.parent.GZD&&window.parent.GZD.Shell;}catch(e){}
    document.addEventListener('click',function(e){
      var a=e.target.closest?e.target.closest('a'):null;
      if(!a)return;
      var href=a.getAttribute('href')||'';
      if(!href||href.charAt(0)==='#')return;
      if(a.id==='startBtn'&&inShell){e.preventDefault();try{window.parent.GZD.Shell.load('./命薄.html');}catch(err){}return;}
      if(/^(\.\.[\/\\]|\/|https?:|mailto:|tel:)/i.test(href)){a.target='_top';}
    },false);
  })();
  </script>

  <div class="footer-note" id="footerNote">当前档案：林栖梧</div>
</div>

<!-- ===== 波浪效果 ===== -->
<div class="waves-container">
  <svg viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 第一层波浪(最深色) -->
    <g class="wave-layer">
      <path d="M0,40 C180,60 360,20 540,40 C720,60 900,20 1080,40 C1260,60 1440,20 1440,40 L1440,80 L0,80 Z" fill="var(--bg-body)" opacity="0.3"></path>
      <path d="M0,40 C180,60 360,20 540,40 C720,60 900,20 1080,40 C1260,60 1440,20 1440,40 L1440,80 L0,80 Z" fill="var(--bg-body)" opacity="0.3" transform="translate(1440,0)"></path>
    </g>
    <!-- 第二层波浪(中色) -->
    <g class="wave-layer-2">
      <path d="M0,45 C200,25 400,65 600,45 C800,25 1000,65 1200,45 C1320,35 1380,50 1440,45 L1440,80 L0,80 Z" fill="var(--bg-body)" opacity="0.4" transform="translate(1440,0)"></path>
      <path d="M0,45 C200,25 400,65 600,45 C800,25 1000,65 1200,45 C1320,35 1380,50 1440,45 L1440,80 L0,80 Z" fill="var(--bg-body)" opacity="0.4"></path>
    </g>
    <!-- 第三层波浪(最浅色) -->
    <g class="wave-layer-3">
      <path d="M0,50 C160,35 320,65 480,50 C640,35 800,65 960,50 C1120,35 1280,65 1440,50 L1440,80 L0,80 Z" fill="var(--bg-body)" opacity="0.5"></path>
      <path d="M0,50 C160,35 320,65 480,50 C640,35 800,65 960,50 C1120,35 1280,65 1440,50 L1440,80 L0,80 Z" fill="var(--bg-body)" opacity="0.5" transform="translate(1440,0)"></path>
    </g>
  </svg>
</div>

<script>
(function(){try{var raw=localStorage.getItem('theme');if(raw){var parsed=JSON.parse(raw);if(parsed&&parsed.value==='light'){document.documentElement.setAttribute('data-theme','light');}else{document.documentElement.removeAttribute('data-theme');} }else{document.documentElement.setAttribute('data-theme','light');} }catch(e){document.documentElement.setAttribute('data-theme','light');} })();
function toggleTheme(){var html=document.documentElement;var isLight=html.getAttribute('data-theme')==='light';var newTheme=isLight?'dark':'light';if(newTheme==='light'){html.setAttribute('data-theme','light');}else{html.removeAttribute('data-theme');}localStorage.setItem('theme',JSON.stringify({value:newTheme}));updateThemeBtn();}
function updateThemeBtn(){var icon=document.getElementById('themeIcon');var label=document.getElementById('themeLabel');if(!icon||!label)return;var isLight=document.documentElement.getAttribute('data-theme')==='light';icon.textContent=isLight?'🌙':'☀️';label.textContent=isLight?'夜间':'日间';}
function selectProfile(id){localStorage.setItem('activeProfile',id);document.querySelectorAll('.profile-card').forEach(function(c){c.classList.toggle('active',c.dataset.profile===id);});var names={linxiwu:'林栖梧',luojin:'罗烬'};var note=document.getElementById('footerNote');if(note)note.textContent='当前档案：'+names[id];}
(function(){var saved=localStorage.getItem('activeProfile')||'linxiwu';selectProfile(saved);updateThemeBtn();})();

/* ===== 粒子生成 ===== */
var particleSymbols=['✦','✿','◈','·','嘻嘻','❖'];
var particleColors=['#D49A9A','#c4b4a0','#8a8078','#4E5A64','#b8aea4'];
function spawnParticles(){var container=document.getElementById('particles');if(!container)return;for(var i=0;i<28;i++){var p=document.createElement('span');p.className='particle';p.textContent=particleSymbols[Math.floor(Math.random()*particleSymbols.length)];p.style.left=Math.random()*100+'%';p.style.fontSize=(Math.random()*10+8)+'px';p.style.color=particleColors[Math.floor(Math.random()*particleColors.length)];p.style.setProperty('--drift',((Math.random()-0.5)*120)+'px');var duration=Math.random()*8+6;p.style.animationDuration=duration+'s';p.style.animationDelay=(Math.random()*duration)+'s';container.appendChild(p);}}
spawnParticles();
</script>

</body>
</html>
