<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>归终殿 · 命簿模拟</title>
<style>
:root{
  --bg-body:#f7f4ef;
  --bg-card:#ffffff;
  --bg-hover:#f2eee9;
  --bg-accent-soft:rgba(138,58,42,0.04);
  --border-light:#ece6de;
  --border-card:#d5c8b8;
  --text-primary:#2c2c2c;
  --text-secondary:#4a4a4a;
  --text-muted:#8a8a8a;
  --accent:#8a3a2a;
  --profile-lin:#D49A9A;
  --profile-luo:#4E5A64;
  --font-serif:"Georgia","Times New Roman","Songti SC","Noto Serif SC",serif;
  --font-mono:"Courier New","Source Code Pro",monospace;
  --transition:0.3s ease;
  /* 字体大小变量 */
  --fs-base:16px;
  --fs-msg:1rem;
  --fs-meta:0.75rem;
  --fs-input:1rem;
  --fs-title:1.1rem;
  /* 气泡专用色(日间) */
  --bubble-ai-bg:#f5f3f0;
  --bubble-ai-border:#e0d8cc;
  --bubble-user-bg:rgba(212,154,154,0.15);
  --bubble-user-border:rgba(212,154,154,0.5);
  --bubble-opening-bg:rgba(212,154,154,0.06);
  --bubble-opening-border:var(--profile-lin);
}
[data-theme="dark"]{
  --bg-body:#1a1614;
  --bg-card:#24201c;
  --bg-hover:#2d2824;
  --bg-accent-soft:rgba(196,180,160,0.06);
  --border-light:#3d3732;
  --border-card:#4a443e;
  --text-primary:#e8e0d5;
  --text-secondary:#b8aea4;
  --text-muted:#8a8078;
  --accent:#c4b4a0;
  /* 气泡专用色(夜间) */
  --bubble-ai-bg:#2d2824;
  --bubble-ai-border:#4a443e;
  --bubble-user-bg:rgba(212,154,154,0.18);
  --bubble-user-border:rgba(212,154,154,0.5);
  --bubble-opening-bg:rgba(212,154,154,0.08);
  --bubble-opening-border:var(--profile-lin);
}
body[data-profile="linxiwu"]{
  --profile-accent:var(--profile-lin);
  --bubble-user-bg:rgba(212,154,154,0.15);
  --bubble-user-border:rgba(212,154,154,0.5);
}
body[data-profile="luojin"]{
  --profile-accent:var(--profile-luo);
  --bubble-user-bg:rgba(78,90,100,0.15);
  --bubble-user-border:rgba(78,90,100,0.5);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-serif);
  /* 关键改动:背景用 --bg-card(白色),而不是 --bg-body(米色) */
  background:var(--bg-card);
  color:var(--text-primary);
  font-size:var(--fs-base);
  line-height:1.7;
  transition:background var(--transition),color var(--transition);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ===== 顶部导航栏 ===== */
.top-bar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  background:var(--bg-card);
  border-bottom:1px solid var(--border-card);
  /* 关键改动:宽度跟其他内页一致 900px */
  max-width:900px;
  width:100%;
  margin:0 auto;
}
.top-bar .back-btn,
.top-bar .icon-btn{
  background:transparent;
  border:1px solid var(--border-card);
  color:var(--text-secondary);
  padding:6px 12px;
  border-radius:18px;
  font-family:var(--font-mono);
  font-size:var(--fs-meta);
  letter-spacing:0.5px;
  cursor:pointer;
  text-decoration:none;
  transition:all var(--transition);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:4px;
}
.top-bar .back-btn:hover,
.top-bar .icon-btn:hover{
  border-color:var(--profile-accent,var(--accent));
  color:var(--profile-accent,var(--accent));
}
.top-bar .title-block{
  flex:1;
  text-align:center;
  min-width:0;
  overflow:hidden;
}
.top-bar .title-block .chapter{
  font-size:var(--fs-title);
  font-weight:600;
  letter-spacing:1px;
  color:var(--text-primary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.top-bar .title-block .role{
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:1px;
  margin-top:2px;
}

/* 字体调节按钮组 */
.font-controls{
  display:flex;
  gap:2px;
  border:1px solid var(--border-card);
  border-radius:14px;
  overflow:hidden;
  flex-shrink:0;
}
.font-controls button{
  background:transparent;
  border:none;
  color:var(--text-muted);
  padding:5px 10px;
  font-family:var(--font-mono);
  cursor:pointer;
  font-size:var(--fs-meta);
  transition:all var(--transition);
  min-width:28px;
}
.font-controls button:hover{
  background:var(--bg-hover);
  color:var(--profile-accent,var(--accent));
}
.font-controls button.active{
  background:var(--bg-accent-soft);
  color:var(--profile-accent,var(--accent));
}

/* ===== 配置提示条 ===== */
.config-banner{
  flex-shrink:0;
  max-width:900px;
  width:100%;
  margin:0 auto;
  padding:6px 16px;
  font-size:var(--fs-meta);
  color:var(--text-secondary);
  background:var(--bg-accent-soft);
  border-bottom:1px solid var(--border-light);
  display:flex;
  align-items:center;
  gap:6px;
}
.config-banner.configured{
  background:rgba(80,140,80,0.06);
  color:var(--text-muted);
}
.config-banner .banner-text{flex:1;min-width:0;line-height:1.5}
.config-banner .banner-link{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px dotted var(--accent);
  white-space:nowrap;
  font-family:var(--font-mono);
}
.config-banner .provider-tag{
  display:inline-block;
  padding:1px 6px;
  background:rgba(80,140,80,0.15);
  color:#5a8a5a;
  border-radius:6px;
  font-size:0.7rem;
  font-family:var(--font-mono);
  margin:0 2px;
}
[data-theme="dark"] .config-banner .provider-tag{
  background:rgba(120,180,120,0.12);
  color:#8ab88a;
}

/* ===== 剧情流主区 ===== */
.story-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:18px 16px 12px 16px;
  /* 关键改动:宽度 900px */
  max-width:900px;
  width:100%;
  margin:0 auto;
}
.story-area::-webkit-scrollbar{width:5px}
.story-area::-webkit-scrollbar-thumb{background:var(--border-card);border-radius:3px}
.story-area::-webkit-scrollbar-track{background:transparent}

.chapter-banner{
  text-align:center;
  margin-bottom:20px;
  padding:16px 0;
  border-bottom:1px solid var(--border-light);
}
.chapter-banner .chapter-sym{
  font-size:1.4rem;
  color:var(--profile-accent,var(--accent));
  margin-bottom:6px;
}
.chapter-banner .chapter-title{
  font-size:var(--fs-title);
  font-weight:600;
  letter-spacing:2px;
  color:var(--text-primary);
}
.chapter-banner .chapter-sub{
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:1px;
  margin-top:4px;
}

/* ===== 消息气泡 ===== */
.msg-row{
  display:flex;
  margin-bottom:14px;
  align-items:flex-start;
  gap:10px;
  animation:msgFadeIn 0.4s ease;
}
@keyframes msgFadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.msg-row.left{justify-content:flex-start}
.msg-row.right{justify-content:flex-end}

.msg-avatar{
  flex-shrink:0;
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--bg-hover);
  border:1.5px solid var(--border-card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.1rem;
  color:var(--profile-accent,var(--accent));
  font-weight:600;
}
.msg-row.right .msg-avatar{
  background:var(--profile-accent,var(--accent));
  color:var(--bg-card);
  border-color:var(--profile-accent,var(--accent));
}

.msg-bubble-wrap{
  max-width:calc(100% - 100px);
  display:flex;
  flex-direction:column;
  min-width:0;
}

.msg-label{
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:1px;
  margin-bottom:4px;
  padding:0 4px;
}
.msg-row.right .msg-label{text-align:right}

.msg-bubble{
  padding:12px 16px;
  border-radius:14px;
  font-size:var(--fs-msg);
  line-height:1.85;
  color:var(--text-primary);
  word-wrap:break-word;
  white-space:pre-wrap;
  position:relative;
  border:1.5px solid var(--border-card);
}

/* AI 回应(左):浅灰色 */
.msg-row.left .msg-bubble{
  background:var(--bubble-ai-bg);
  border-color:var(--bubble-ai-border);
  border-top-left-radius:4px;
}

/* 玩家行动(右):淡粉色(林栖梧)/淡蓝灰色(罗烬) */
.msg-row.right .msg-bubble{
  background:var(--bubble-user-bg);
  border-color:var(--bubble-user-border);
  border-top-right-radius:4px;
}

/* 开场剧情(左,特殊样式) */
.msg-row.opening .msg-bubble{
  background:var(--bubble-opening-bg);
  border:1.5px solid var(--bubble-opening-border);
  border-left:4px solid var(--bubble-opening-border);
  border-top-left-radius:4px;
}

/* 错误消息 */
.msg-row.error .msg-bubble{
  background:rgba(160,64,64,0.08);
  border-color:rgba(160,64,64,0.4);
  color:#a04040;
}

/* 气泡底部操作按钮 */
.msg-actions{
  margin-top:5px;
  padding:0 4px;
  display:flex;
  gap:6px;
}
.msg-row.left .msg-actions{justify-content:flex-start}
.msg-row.right .msg-actions{justify-content:flex-end}
.msg-action-btn{
  background:transparent;
  border:1px solid var(--border-card);
  color:var(--text-muted);
  padding:3px 10px;
  border-radius:12px;
  font-size:0.72rem;
  cursor:pointer;
  font-family:var(--font-mono);
  transition:all 0.2s;
}
.msg-action-btn:hover:not(:disabled){
  border-color:var(--accent);
  color:var(--accent);
  background:var(--bg-accent-soft);
}
.msg-action-btn:disabled{opacity:0.5;cursor:wait}

/* ===== 加载中气泡 ===== */
.msg-loading{
  display:inline-flex;
  gap:5px;
  align-items:center;
  padding:12px 16px;
  background:var(--bubble-ai-bg);
  border:1.5px solid var(--bubble-ai-border);
  border-radius:14px;
  border-top-left-radius:4px;
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-style:italic;
}
.msg-loading .dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--profile-accent,var(--accent));
  animation:dotPulse 1.2s infinite ease-in-out;
}
.msg-loading .dot:nth-child(2){animation-delay:0.2s}
.msg-loading .dot:nth-child(3){animation-delay:0.4s}
@keyframes dotPulse{
  0%,80%,100%{opacity:0.3;transform:scale(0.8)}
  40%{opacity:1;transform:scale(1)}
}

/* ===== 编辑模式 ===== */
.msg-edit-area{
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
}
.msg-edit-area textarea{
  width:100%;
  min-height:90px;
  padding:10px 14px;
  background:var(--bg-card);
  color:var(--text-primary);
  border:2px solid var(--profile-accent,var(--accent));
  border-radius:10px;
  font-family:inherit;
  font-size:var(--fs-msg);
  line-height:1.75;
  resize:vertical;
  outline:none;
}
.msg-edit-area textarea:focus{box-shadow:0 0 0 3px rgba(138,58,42,0.1)}
.msg-edit-btns{
  display:flex;
  gap:6px;
  justify-content:flex-end;
}
.msg-edit-btns button{
  padding:5px 14px;
  border-radius:14px;
  border:1px solid var(--border-card);
  background:transparent;
  color:var(--text-secondary);
  font-family:var(--font-mono);
  font-size:0.75rem;
  cursor:pointer;
  transition:all 0.2s;
}
.msg-edit-btns button.save{
  border-color:var(--accent);
  color:var(--accent);
}
.msg-edit-btns button:hover{background:var(--bg-hover)}
.msg-edit-btns button.save:hover{background:var(--accent);color:var(--bg-card)}

/* ===== 底部输入栏 ===== */
.input-bar{
  flex-shrink:0;
  max-width:900px;
  width:100%;
  margin:0 auto;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)) 16px;
  background:var(--bg-card);
  border-top:1px solid var(--border-card);
  display:flex;
  gap:10px;
  align-items:flex-end;
}
.input-bar textarea{
  flex:1;
  padding:10px 16px;
  background:var(--bg-body);
  color:var(--text-primary);
  border:1.5px solid var(--border-card);
  border-radius:20px;
  font-family:inherit;
  font-size:var(--fs-input);
  line-height:1.6;
  resize:none;
  outline:none;
  min-height:44px;
  max-height:120px;
  transition:border-color 0.2s;
}
.input-bar textarea:focus{border-color:var(--profile-accent,var(--accent))}
.input-bar textarea::placeholder{color:var(--text-muted);opacity:0.7}

.send-btn{
  padding:10px 20px;
  background:transparent;
  border:1.5px solid var(--accent);
  color:var(--accent);
  border-radius:20px;
  cursor:pointer;
  font-family:inherit;
  font-size:var(--fs-input);
  letter-spacing:1px;
  transition:all 0.2s;
  white-space:nowrap;
  flex-shrink:0;
}
.send-btn:hover:not(:disabled){
  background:var(--accent);
  color:var(--bg-card);
}
.send-btn:disabled{opacity:0.5;cursor:wait}

/* ===== 响应式 ===== */
@media(max-width:600px){
  :root{
    --fs-base:15px;
    --fs-msg:0.95rem;
    --fs-meta:0.7rem;
    --fs-input:0.95rem;
    --fs-title:1rem;
  }
  .top-bar{padding:8px 12px;gap:8px}
  .top-bar .back-btn{padding:5px 10px;font-size:0.65rem}
  .top-bar .title-block .chapter{font-size:1rem}
  .top-bar .title-block .role{font-size:0.65rem}
  .font-controls button{padding:4px 8px;font-size:0.65rem;min-width:22px}
  .config-banner{padding:5px 12px;font-size:0.65rem}
  .story-area{padding:14px 12px 8px 12px}
  .msg-avatar{width:30px;height:30px;font-size:0.95rem}
  .msg-bubble-wrap{max-width:calc(100% - 80px)}
  .msg-bubble{padding:10px 14px;font-size:0.95rem;line-height:1.8}
  .input-bar{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)) 12px;gap:8px}
  .input-bar textarea{padding:9px 14px;font-size:0.95rem;min-height:40px}
  .send-btn{padding:9px 16px;font-size:0.9rem}
}
@media(max-width:380px){
  .top-bar .title-block .role{display:none}
  .font-controls button{padding:3px 6px}
}

/* 大屏幕:跟其他内页一致的 900px 宽度 */
@media(min-width:901px){
  body{
    /* 在大屏上给左右一点点淡色边框,模拟"卡片浮在背景上"的感觉 */
    box-shadow:inset 1px 0 0 var(--border-light),inset -1px 0 0 var(--border-light);
  }
}
</style>
</head>
<body data-profile="linxiwu">

<!-- 顶部导航 -->
<div class="top-bar">
  <a class="back-btn" href="./命薄.html"><span>←</span> 命簿</a>
  <div class="title-block">
    <div class="chapter" id="chapterTitle">第一章 · 归终殿的新叶</div>
    <div class="role" id="roleLabel">林栖梧</div>
  </div>
  <div class="font-controls">
    <button data-size="small" title="小字体">A-</button>
    <button data-size="normal" class="active" title="正常字体">A</button>
    <button data-size="large" title="大字体">A+</button>
  </div>
</div>

<!-- 配置提示条 -->
<div class="config-banner" id="configBanner">
  <span class="banner-text" id="bannerText">读取配置中...</span>
  <a class="banner-link" href="./设置.html" id="bannerLink">前往设置 →</a>
</div>

<!-- 剧情流主区 -->
<div class="story-area" id="storyArea">
  <div class="chapter-banner">
    <div class="chapter-sym">❀</div>
    <div class="chapter-title">第一章 · 归终殿的新叶</div>
    <div class="chapter-sub">苍珩四百三十五年 · 霜月</div>
  </div>
  <!-- 消息会动态插入这里 -->
</div>

<!-- 章节侧边栏(先放这里,JS 会渲染内容) -->
<div id="chapterSidebar" style="display:none"></div>

<!-- 底部输入栏 -->
<div class="input-bar">
  <textarea id="inputBox" placeholder="今日欲行何事?" rows="1"></textarea>
  <button class="send-btn" id="sendBtn">发送</button>
</div>

<script>
// ===== 字体调节(独立逻辑,放在 模拟AI.js 之前) =====
(function(){
  const FONT_KEY = 'gzd_sim_fontsize';
  const SIZES = {
    small: { '--fs-base':'14px','--fs-msg':'0.9rem','--fs-meta':'0.7rem','--fs-input':'0.9rem','--fs-title':'1rem' },
    normal:{ '--fs-base':'16px','--fs-msg':'1rem','--fs-meta':'0.75rem','--fs-input':'1rem','--fs-title':'1.1rem' },
    large: { '--fs-base':'18px','--fs-msg':'1.15rem','--fs-meta':'0.85rem','--fs-input':'1.1rem','--fs-title':'1.2rem' }
  };
  function applyFont(size){
    const root = document.documentElement;
    const cfg = SIZES[size] || SIZES.normal;
    Object.entries(cfg).forEach(([k,v]) => root.style.setProperty(k,v));
    document.querySelectorAll('.font-controls button').forEach(b => {
      b.classList.toggle('active', b.dataset.size === size);
    });
    try{ localStorage.setItem(FONT_KEY, size); }catch(e){}
  }
  try{
    const saved = localStorage.getItem(FONT_KEY) || 'normal';
    applyFont(saved);
  }catch(e){ applyFont('normal'); }
  document.querySelectorAll('.font-controls button').forEach(b => {
    b.addEventListener('click', () => applyFont(b.dataset.size));
  });

  // ===== 主题沿用 GZD =====
  // 注意:CSS 用 [data-theme="dark"] 表示夜间,所以 dark 时必须 setAttribute('data-theme','dark')
  function applyTheme(t){
    const h = document.documentElement;
    h.setAttribute('data-theme', t);  // light 或 dark 都设置属性
  }
  function getStoredTheme(){
    try{
      const r = localStorage.getItem('theme');
      if(r){
        // 兼容两种存储格式:直接字符串 或 {value: 'xxx'} 对象
        const p = JSON.parse(r);
        if(p === 'light' || p === 'dark') return p;
        if(p && p.value) return p.value;
      }
    }catch(e){
      if(r === 'light' || r === 'dark') return r;
    }
    return 'light';
  }
  applyTheme(getStoredTheme());

  // ===== 角色沿用 GZD =====
  function applyProfile(){
    let p = 'linxiwu';
    try{ p = localStorage.getItem('activeProfile') || 'linxiwu'; }catch(e){}
    document.body.setAttribute('data-profile', p);
    const roleLabel = document.getElementById('roleLabel');
    if(roleLabel) roleLabel.textContent = p === 'luojin' ? '罗烬' : '林栖梧';
    const chapterTitle = document.getElementById('chapterTitle');
    if(chapterTitle) chapterTitle.textContent = p === 'luojin' ? '第一章 · 刀与火' : '第一章 · 归终殿的新叶';
    const chapterBannerTitle = document.querySelector('.chapter-banner .chapter-title');
    if(chapterBannerTitle) chapterBannerTitle.textContent = p === 'luojin' ? '第一章 · 刀与火' : '第一章 · 归终殿的新叶';
    const chapterSym = document.querySelector('.chapter-banner .chapter-sym');
    if(chapterSym) chapterSym.textContent = p === 'luojin' ? '◈' : '❀';
  }
  applyProfile();
})();
</script>

<script src="./模拟AI.js"></script>
</body>
</html>
