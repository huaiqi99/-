<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>归终殿 · 命簿模拟</title>
<style>
:root{
  --bg-body:#f7f4ef;
  --bg-card:#ffffff;
  --bg-hover:#f2eee9;
  --bg-accent-soft:rgba(138,58,42,0.04);
  --border-light:#ece6de;
  --border-card:#d5c8b8;
  --text-primary:#2c2c2c;
  --text-secondary:#4a4a4a;
  --text-muted:#8a8a8a;
  --accent:#8a3a2a;
  --profile-lin:#D49A9A;
  --profile-luo:#4E5A64;
  --font-serif:"Georgia","Times New Roman","Songti SC","Noto Serif SC",serif;
  --font-mono:"Courier New","Source Code Pro",monospace;
  --transition:0.3s ease;
  /* 字体大小变量(可调节) */
  --fs-base:16px;
  --fs-msg:1rem;
  --fs-meta:0.75rem;
  --fs-input:1rem;
  --fs-title:1.1rem;
}
[data-theme="dark"]{
  --bg-body:#1a1614;
  --bg-card:#24201c;
  --bg-hover:#2d2824;
  --bg-accent-soft:rgba(196,180,160,0.06);
  --border-light:#3d3732;
  --border-card:#4a443e;
  --text-primary:#e8e0d5;
  --text-secondary:#b8aea4;
  --text-muted:#8a8078;
  --accent:#c4b4a0;
}
body[data-profile="linxiwu"]{--profile-accent:var(--profile-lin)}
body[data-profile="luojin"]{--profile-accent:var(--profile-luo)}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-serif);
  background:var(--bg-body);
  color:var(--text-primary);
  font-size:var(--fs-base);
  line-height:1.7;
  transition:background var(--transition),color var(--transition);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ===== 顶部导航栏 ===== */
.top-bar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  background:var(--bg-card);
  border-bottom:1px solid var(--border-light);
  max-width:780px;
  width:100%;
  margin:0 auto;
}
.top-bar .back-btn,
.top-bar .icon-btn{
  background:transparent;
  border:1px solid var(--border-card);
  color:var(--text-secondary);
  padding:6px 12px;
  border-radius:18px;
  font-family:var(--font-mono);
  font-size:var(--fs-meta);
  letter-spacing:0.5px;
  cursor:pointer;
  text-decoration:none;
  transition:all var(--transition);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:4px;
}
.top-bar .back-btn:hover,
.top-bar .icon-btn:hover{
  border-color:var(--profile-accent,var(--accent));
  color:var(--profile-accent,var(--accent));
}
.top-bar .title-block{
  flex:1;
  text-align:center;
  min-width:0;
  overflow:hidden;
}
.top-bar .title-block .chapter{
  font-size:var(--fs-title);
  font-weight:600;
  letter-spacing:1px;
  color:var(--text-primary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.top-bar .title-block .role{
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:1px;
  margin-top:2px;
}

/* 字体调节按钮组 */
.font-controls{
  display:flex;
  gap:2px;
  border:1px solid var(--border-card);
  border-radius:14px;
  overflow:hidden;
  flex-shrink:0;
}
.font-controls button{
  background:transparent;
  border:none;
  color:var(--text-muted);
  padding:4px 8px;
  font-family:var(--font-mono);
  cursor:pointer;
  font-size:var(--fs-meta);
  transition:all var(--transition);
  min-width:24px;
}
.font-controls button:hover{
  background:var(--bg-hover);
  color:var(--profile-accent,var(--accent));
}
.font-controls button.active{
  background:var(--bg-accent-soft);
  color:var(--profile-accent,var(--accent));
}

/* ===== 配置提示条 ===== */
.config-banner{
  flex-shrink:0;
  max-width:780px;
  width:100%;
  margin:0 auto;
  padding:6px 14px;
  font-size:var(--fs-meta);
  color:var(--text-secondary);
  background:var(--bg-accent-soft);
  border-bottom:1px solid var(--border-light);
  display:flex;
  align-items:center;
  gap:6px;
}
.config-banner.configured{
  background:rgba(80,140,80,0.06);
  color:var(--text-muted);
}
.config-banner .banner-text{flex:1;min-width:0;line-height:1.5}
.config-banner .banner-link{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px dotted var(--accent);
  white-space:nowrap;
  font-family:var(--font-mono);
}
.config-banner .provider-tag{
  display:inline-block;
  padding:1px 6px;
  background:rgba(80,140,80,0.15);
  color:#5a8a5a;
  border-radius:6px;
  font-size:0.7rem;
  font-family:var(--font-mono);
  margin:0 2px;
}
[data-theme="dark"] .config-banner .provider-tag{
  background:rgba(120,180,120,0.12);
  color:#8ab88a;
}

/* ===== 剧情流主区 ===== */
.story-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:16px 14px 12px 14px;
  max-width:780px;
  width:100%;
  margin:0 auto;
}
.story-area::-webkit-scrollbar{width:4px}
.story-area::-webkit-scrollbar-thumb{background:var(--border-card);border-radius:2px}

.chapter-banner{
  text-align:center;
  margin-bottom:18px;
  padding:14px 0;
  border-bottom:1px solid var(--border-light);
}
.chapter-banner .chapter-sym{
  font-size:1.4rem;
  color:var(--profile-accent,var(--accent));
  margin-bottom:6px;
}
.chapter-banner .chapter-title{
  font-size:var(--fs-title);
  font-weight:600;
  letter-spacing:2px;
  color:var(--text-primary);
}
.chapter-banner .chapter-sub{
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:1px;
  margin-top:4px;
}

/* ===== 消息气泡(借鉴聊天布局) ===== */
.msg-row{
  display:flex;
  margin-bottom:14px;
  align-items:flex-start;
  gap:8px;
  animation:msgFadeIn 0.4s ease;
}
@keyframes msgFadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* 左侧:NPC / AI 回应 */
.msg-row.left{justify-content:flex-start}
/* 右侧:玩家行动 */
.msg-row.right{justify-content:flex-end}

.msg-avatar{
  flex-shrink:0;
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--bg-hover);
  border:1.5px solid var(--border-card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  color:var(--profile-accent,var(--accent));
  font-weight:600;
}
.msg-row.right .msg-avatar{
  background:var(--profile-accent,var(--accent));
  color:var(--bg-card);
  border-color:var(--profile-accent,var(--accent));
}

.msg-bubble-wrap{
  max-width:calc(100% - 80px);
  display:flex;
  flex-direction:column;
  min-width:0;
}

.msg-label{
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:1px;
  margin-bottom:3px;
  padding:0 4px;
}
.msg-row.right .msg-label{text-align:right}

.msg-bubble{
  padding:10px 14px;
  border-radius:14px;
  font-size:var(--fs-msg);
  line-height:1.8;
  color:var(--text-primary);
  word-wrap:break-word;
  white-space:pre-wrap;
  position:relative;
  border:1px solid var(--border-light);
}
/* AI 回应(左) */
.msg-row.left .msg-bubble{
  background:var(--bg-card);
  border-top-left-radius:4px;
}
/* 玩家行动(右) */
.msg-row.right .msg-bubble{
  background:var(--bg-accent-soft);
  border-color:var(--profile-accent,var(--accent));
  border-top-right-radius:4px;
}
/* 开场剧情(左,特殊样式) */
.msg-row.opening .msg-bubble{
  background:rgba(138,58,42,0.04);
  border-left:3px solid var(--profile-accent,var(--accent));
  border-top-left-radius:4px;
}
.msg-row.opening .msg-bubble::before{
  content:'❀';
  position:absolute;
  left:-2px;
  top:8px;
  color:var(--profile-accent,var(--accent));
  font-size:0.8rem;
  background:var(--bg-card);
  padding:0 4px;
  border-radius:50%;
}

/* 错误消息 */
.msg-row.error .msg-bubble{
  background:rgba(160,64,64,0.08);
  border-color:rgba(160,64,64,0.3);
  color:#a04040;
}

/* 气泡底部操作按钮 */
.msg-actions{
  margin-top:4px;
  padding:0 4px;
  display:flex;
  gap:6px;
  justify-content:flex-end;
}
.msg-row.left .msg-actions{justify-content:flex-start}
.msg-action-btn{
  background:transparent;
  border:1px solid var(--border-card);
  color:var(--text-muted);
  padding:2px 8px;
  border-radius:10px;
  font-size:0.7rem;
  cursor:pointer;
  font-family:var(--font-mono);
  transition:all 0.2s;
}
.msg-action-btn:hover:not(:disabled){
  border-color:var(--accent);
  color:var(--accent);
}
.msg-action-btn:disabled{opacity:0.5;cursor:wait}

/* ===== 加载中气泡 ===== */
.msg-loading{
  display:inline-flex;
  gap:4px;
  align-items:center;
  padding:10px 14px;
  background:var(--bg-card);
  border:1px solid var(--border-light);
  border-radius:14px;
  border-top-left-radius:4px;
  font-size:var(--fs-meta);
  color:var(--text-muted);
  font-style:italic;
}
.msg-loading .dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--profile-accent,var(--accent));
  animation:dotPulse 1.2s infinite ease-in-out;
}
.msg-loading .dot:nth-child(2){animation-delay:0.2s}
.msg-loading .dot:nth-child(3){animation-delay:0.4s}
@keyframes dotPulse{
  0%,80%,100%{opacity:0.3;transform:scale(0.8)}
  40%{opacity:1;transform:scale(1)}
}

/* ===== 编辑模式(内联 textarea) ===== */
.msg-edit-area{
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
}
.msg-edit-area textarea{
  width:100%;
  min-height:80px;
  padding:10px 12px;
  background:var(--bg-card);
  color:var(--text-primary);
  border:1.5px solid var(--profile-accent,var(--accent));
  border-radius:10px;
  font-family:inherit;
  font-size:var(--fs-msg);
  line-height:1.7;
  resize:vertical;
  outline:none;
}
.msg-edit-area textarea:focus{box-shadow:0 0 0 2px rgba(138,58,42,0.1)}
.msg-edit-btns{
  display:flex;
  gap:6px;
  justify-content:flex-end;
}
.msg-edit-btns button{
  padding:5px 14px;
  border-radius:14px;
  border:1px solid var(--border-card);
  background:transparent;
  color:var(--text-secondary);
  font-family:var(--font-mono);
  font-size:0.75rem;
  cursor:pointer;
  transition:all 0.2s;
}
.msg-edit-btns button.save{
  border-color:var(--accent);
  color:var(--accent);
}
.msg-edit-btns button:hover{background:var(--bg-hover)}
.msg-edit-btns button.save:hover{background:var(--accent);color:var(--bg-card)}

/* ===== 底部输入栏 ===== */
.input-bar{
  flex-shrink:0;
  max-width:780px;
  width:100%;
  margin:0 auto;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)) 14px;
  background:var(--bg-card);
  border-top:1px solid var(--border-light);
  display:flex;
  gap:8px;
  align-items:flex-end;
}
.input-bar textarea{
  flex:1;
  padding:10px 14px;
  background:var(--bg-body);
  color:var(--text-primary);
  border:1px solid var(--border-card);
  border-radius:18px;
  font-family:inherit;
  font-size:var(--fs-input);
  line-height:1.6;
  resize:none;
  outline:none;
  min-height:42px;
  max-height:120px;
  transition:border-color 0.2s;
}
.input-bar textarea:focus{border-color:var(--profile-accent,var(--accent))}
.input-bar textarea::placeholder{color:var(--text-muted);opacity:0.7}

.send-btn{
  padding:10px 18px;
  background:transparent;
  border:1.5px solid var(--accent);
  color:var(--accent);
  border-radius:18px;
  cursor:pointer;
  font-family:inherit;
  font-size:var(--fs-input);
  letter-spacing:1px;
  transition:all 0.2s;
  white-space:nowrap;
  flex-shrink:0;
}
.send-btn:hover:not(:disabled){
  background:var(--accent);
  color:var(--bg-card);
}
.send-btn:disabled{opacity:0.5;cursor:wait}

/* ===== 响应式 ===== */
@media(max-width:600px){
  :root{
    --fs-base:15px;
    --fs-msg:0.95rem;
    --fs-meta:0.7rem;
    --fs-input:0.95rem;
    --fs-title:1rem;
  }
  .top-bar{padding:8px 10px;gap:6px}
  .top-bar .back-btn,
  .top-bar .icon-btn{padding:5px 10px;font-size:0.65rem}
  .top-bar .title-block .chapter{font-size:1rem}
  .top-bar .title-block .role{font-size:0.65rem}
  .font-controls button{padding:3px 6px;font-size:0.65rem;min-width:20px}
  .config-banner{padding:5px 10px;font-size:0.65rem}
  .story-area{padding:12px 10px 8px 10px}
  .msg-avatar{width:28px;height:28px;font-size:0.9rem}
  .msg-bubble-wrap{max-width:calc(100% - 70px)}
  .msg-bubble{padding:9px 12px;font-size:0.95rem;line-height:1.75}
  .input-bar{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)) 10px;gap:6px}
  .input-bar textarea{padding:9px 12px;font-size:0.95rem;min-height:38px}
  .send-btn{padding:9px 14px;font-size:0.9rem}
}
@media(max-width:380px){
  .top-bar .title-block .role{display:none}
  .font-controls button{padding:3px 5px}
}

/* 大屏幕不要太大 */
@media(min-width:781px){
  body{box-shadow:inset 0 0 0 1px var(--border-light)}
}
</style>
</head>
<body data-profile="linxiwu">

<!-- 顶部导航 -->
<div class="top-bar">
  <a class="back-btn" href="./命薄.html"><span>←</span> 命簿</a>
  <div class="title-block">
    <div class="chapter" id="chapterTitle">第一章 · 归终殿的新叶</div>
    <div class="role" id="roleLabel">林栖梧</div>
  </div>
  <div class="font-controls">
    <button data-size="small" title="小字体">A-</button>
    <button data-size="normal" class="active" title="正常字体">A</button>
    <button data-size="large" title="大字体">A+</button>
  </div>
</div>

<!-- 配置提示条 -->
<div class="config-banner" id="configBanner">
  <span class="banner-text" id="bannerText">读取配置中...</span>
  <a class="banner-link" href="./设置.html" id="bannerLink">前往设置 →</a>
</div>

<!-- 剧情流主区 -->
<div class="story-area" id="storyArea">
  <div class="chapter-banner">
    <div class="chapter-sym">❀</div>
    <div class="chapter-title">第一章 · 归终殿的新叶</div>
    <div class="chapter-sub">苍珩四百三十五年 · 霜月</div>
  </div>
  <!-- 消息会动态插入这里 -->
</div>

<!-- 底部输入栏 -->
<div class="input-bar">
  <textarea id="inputBox" placeholder="今日欲行何事?" rows="1"></textarea>
  <button class="send-btn" id="sendBtn">发送</button>
</div>

<script>
// ===== 字体调节(独立逻辑,放在 模拟AI.js 之前) =====
(function(){
  const FONT_KEY = 'gzd_sim_fontsize';
  const SIZES = {
    small: { '--fs-base':'14px','--fs-msg':'0.9rem','--fs-meta':'0.7rem','--fs-input':'0.9rem','--fs-title':'1rem' },
    normal:{ '--fs-base':'16px','--fs-msg':'1rem','--fs-meta':'0.75rem','--fs-input':'1rem','--fs-title':'1.1rem' },
    large: { '--fs-base':'18px','--fs-msg':'1.15rem','--fs-meta':'0.85rem','--fs-input':'1.1rem','--fs-title':'1.2rem' }
  };
  function applyFont(size){
    const root = document.documentElement;
    const cfg = SIZES[size] || SIZES.normal;
    Object.entries(cfg).forEach(([k,v]) => root.style.setProperty(k,v));
    document.querySelectorAll('.font-controls button').forEach(b => {
      b.classList.toggle('active', b.dataset.size === size);
    });
    try{ localStorage.setItem(FONT_KEY, size); }catch(e){}
  }
  // 启动时读取
  try{
    const saved = localStorage.getItem(FONT_KEY) || 'normal';
    applyFont(saved);
  }catch(e){ applyFont('normal'); }
  // 绑定按钮
  document.querySelectorAll('.font-controls button').forEach(b => {
    b.addEventListener('click', () => applyFont(b.dataset.size));
  });

  // ===== 主题沿用 GZD =====
  function applyTheme(t){
    const h = document.documentElement;
    if(t === 'light') h.setAttribute('data-theme','light');
    else h.removeAttribute('data-theme');
  }
  try{
    const r = localStorage.getItem('theme');
    if(r){
      const p = JSON.parse(r);
      if(p && p.value) applyTheme(p.value);
      else applyTheme('light');
    } else { applyTheme('light'); }
  }catch(e){ applyTheme('light'); }

  // ===== 角色沿用 GZD =====
  function applyProfile(){
    let p = 'linxiwu';
    try{ p = localStorage.getItem('activeProfile') || 'linxiwu'; }catch(e){}
    document.body.setAttribute('data-profile', p);
    const roleLabel = document.getElementById('roleLabel');
    if(roleLabel) roleLabel.textContent = p === 'luojin' ? '罗烬' : '林栖梧';
    const chapterTitle = document.getElementById('chapterTitle');
    if(chapterTitle) chapterTitle.textContent = p === 'luojin' ? '第一章 · 刀与火' : '第一章 · 归终殿的新叶';
    const chapterBannerTitle = document.querySelector('.chapter-banner .chapter-title');
    if(chapterBannerTitle) chapterBannerTitle.textContent = p === 'luojin' ? '第一章 · 刀与火' : '第一章 · 归终殿的新叶';
    const chapterSym = document.querySelector('.chapter-banner .chapter-sym');
    if(chapterSym) chapterSym.textContent = p === 'luojin' ? '◈' : '❀';
  }
  applyProfile();
})();
</script>

<script src="./模拟AI.js"></script>
</body>
</html>
