	<!DOCTYPE html>
	<html lang="zh-CN" data-theme="dark">
	<head>
    <script>
	/* 防套娃：壳只能当最外层。若发现自己被装进了某个窗口，立即抢占整个页面 */
	if(window.self!==window.top){try{top.location.replace(location.pathname+location.search);}catch(e){}}
	</script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>归终殿 · 弟子手册</title>
	<style>
	  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a1614}
	  .frame-wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
	  #pageFrame{width:100%;height:100%;min-height:100%;border:0;display:block}
	  /* 音乐坞：常驻左下角（内页浮动按钮在右上、桌宠在右下，互不遮挡） */
	  .bgm-dock{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;display:flex;gap:6px}
	  .bgm-dock button{background:rgba(30,26,22,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
	    border:1px solid rgba(200,180,160,.25);border-radius:24px;padding:7px 14px;color:#c8b8a0;
	    font-size:.72rem;font-family:"Courier New",monospace;cursor:pointer;letter-spacing:.5px}
	  .bgm-dock button:active{transform:scale(.96)}
	</style>
	</head>
	<body>
	<div class="frame-wrap"><iframe id="pageFrame" src="./命薄.html" title="归终殿"></iframe></div>
	<div class="bgm-dock">
	  <button id="bgmBtn">🎵 音乐</button>
	  <button id="bgmNextBtn">⏭</button>
	</div>
	<script>window.__GZD_SHELL__=true;</script>
	<script src="./核心.js"></script>
	<script>
	(function(){
	'use strict';
	var LIST=(window.GZD&&GZD.BGM_LIST)||[{name:'浮生若梦',src:'./bgm1.mp3'},{name:'忘川引',src:'./bgm2.mp3'}];
	var VOL=(window.GZD&&GZD.Storage)?(GZD.Storage.getSettings().bgmVolume||0.35):0.35;
	var KEY='gzd_bgm',frame=document.getElementById('pageFrame');
	var audio=new Audio();audio.loop=true;audio.volume=0;audio.preload='auto';
	var idx=0,want=true,times={},fadeT=null,bound=false;
	function save(){try{localStorage.setItem(KEY,JSON.stringify({on:want,index:idx,times:times}));}catch(e){}}
	function loadSt(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');
	  if(s){want=s.on!==false;if(isFinite(s.index))idx=((s.index%LIST.length)+LIST.length)%LIST.length;times=s.times||{};}}catch(e){}}
	function setSrc(){audio.src=LIST[idx].src;}
	function updateBtn(){var b=document.getElementById('bgmBtn');if(b)b.textContent=want?('🎵 '+LIST[idx].name):'🔇 音乐';}
	function fade(to,dur,done){clearInterval(fadeT);var from=audio.volume,t0=Date.now();
	  fadeT=setInterval(function(){var k=Math.min(1,(Date.now()-t0)/dur);audio.volume=from+(to-from)*k;
	    if(k>=1){clearInterval(fadeT);if(done)done();}},40);}
	function play(){var p=audio.play();
	  if(p&&p.catch)p.catch(function(){        // 首次被自动播放策略拦 → 绑定壳上任意触摸即响
	    if(bound)return;bound=true;
	    var go=function(){audio.play().catch(function(){});fade(VOL,800);};
	    document.addEventListener('touchstart',go,{once:true,passive:true});
	    document.addEventListener('touchend',go,{once:true,passive:true});
	    document.addEventListener('click',go,{once:true});
	  });}
	/* —— 对内页开放的接口 —— */
	GZD.Shell={
	  load:function(href){                     // 内页换页（BGM 不中断）
	    frame.src=href;
	    try{history.replaceState(null,'','#'+encodeURIComponent(href));}catch(e){}
	  },
	  requestTrack:function(i){                // 内页请求换曲（data-bgm）
	    i=((i%LIST.length)+LIST.length)%LIST.length;
	    var same=(i===idx);idx=i;setSrc();updateBtn();save();
	    if(want){play();fade(VOL,same?400:600);}
	  }
	};
	loadSt();setSrc();updateBtn();
	if(want){play();fade(VOL,900);}
	/* 从 hash 恢复上次的内页（刷新/收藏不丢） */
	try{var h=decodeURIComponent(location.hash.slice(1));
	  if(h&&/\.html?$/i.test(h))frame.src=h;}catch(e){}
	/* 内页标题同步到标签页 */
	frame.addEventListener('load',function(){try{document.title=frame.contentDocument.title;}catch(e){}});
	document.getElementById('bgmBtn').addEventListener('click',function(){
	  want=!want;
	  if(want){play();fade(VOL,500);}else{fade(0,350,function(){audio.pause();});}
	  updateBtn();save();
	});
	document.getElementById('bgmNextBtn').addEventListener('click',function(){
	  want=true;GZD.Shell.requestTrack(idx+1);updateBtn();save();
	});
	})();
	</script>
	</body>
	</html>
