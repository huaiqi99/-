<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社区 PVP · 归终纪</title>
    <style>
        :root {
            --bg-body: #f7f4ef;
            --bg-card: #ffffff;
            --bg-card-alt: #f2eee9;
            --border-light: #ece6de;
            --border-card: #e4ddd4;
            --text-primary: #2c2c2c;
            --text-secondary: #4a4a4a;
            --text-muted: #8a8a8a;
            --accent: #b03a2a;
            --accent-soft: rgba(176, 58, 42, 0.06);
            --accent-soft-hover: rgba(176, 58, 42, 0.10);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            --transition: 0.25s ease;
        }
        [data-theme="dark"] {
            --bg-body: #181614;
            --bg-card: #24201c;
            --bg-card-alt: #1e1b18;
            --border-light: #35302a;
            --border-card: #3a3530;
            --text-primary: #cfc8c0;
            --text-secondary: #9a948c;
            --text-muted: #6a6560;
            --accent: #b05a4a;
            --accent-soft: rgba(176, 90, 74, 0.08);
            --accent-soft-hover: rgba(176, 90, 74, 0.14);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 0 16px 40px 16px;
            display: flex;
            flex-direction: column;
        }
        #topbar {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 0 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 8px;
        }
        #topbar .brand {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #topbar .brand span { color: var(--accent); }
        #topbar .brand small {
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 4px;
        }
        #topbar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            padding: 4px 14px;
            border-radius: 18px;
            border: 1px solid var(--border-light);
            background: transparent;
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all var(--transition);
            font-family: inherit;
        }
        .back-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        .theme-toggle:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        #app {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 0 0 0;
            flex: 1;
        }

        .epigraph {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            padding: 0 0 20px 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 24px;
            line-height: 1.8;
            text-align: center;
        }
        .epigraph .mark { color: var(--accent); }
        .epigraph .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 6px;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* 卡片通用 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 16px 20px 18px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            transition: border-color var(--transition);
            animation: card-in 0.5s ease forwards;
            opacity: 0;
            transform: translateY(12px);
        }
        .card:hover {
            border-color: var(--accent-soft-hover);
        }
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.10s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.20s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.30s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.40s; }

        @keyframes card-in {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card .title {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card .title .deco { color: var(--accent); margin-right: 4px; }
        .card .title .badge {
            font-size: 0.55rem;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 1px 10px;
            border-radius: 10px;
            font-weight: 400;
        }

        /* 版本梗概 */
        .version-brief {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.8;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            animation: card-in 0.5s ease forwards;
            opacity: 0;
            transform: translateY(12px);
        }
        .version-brief::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--accent);
            opacity: 0.4;
        }
        .version-brief .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .version-brief .label .deco { color: var(--accent); }

        /* ===== 天梯数据速览 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .stat-item {
            text-align: center;
            padding: 10px 8px;
            background: var(--bg-card-alt);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-card);
        }
        .stat-item .number {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
        }
        .stat-item .number .suffix {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
        }
        .stat-item .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .stat-item .sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            opacity: 0.6;
            margin-top: 1px;
        }

        /* ===== 热门阵容 ===== */
        .comp-scroll-wrapper {
            position: relative;
            overflow: hidden;
        }
        .comp-scroll {
            display: flex;
            gap: 14px;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .comp-scroll .comp-card {
            flex: 0 0 220px;
            background: var(--bg-card-alt);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border-card);
            transition: border-color var(--transition);
            cursor: default;
        }
        .comp-scroll .comp-card:hover {
            border-color: var(--accent);
        }
        .comp-card .comp-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .comp-card .comp-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .comp-card .comp-tag {
            display: inline-block;
            font-size: 0.6rem;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 1px 8px;
            border-radius: 8px;
            margin-top: 6px;
        }

        .scroll-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }
        .scroll-controls button {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-card);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 0.75rem;
            font-family: inherit;
        }
        .scroll-controls button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .scroll-controls .scroll-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .scroll-controls .scroll-dots .sdot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border-card);
            transition: all var(--transition);
            cursor: pointer;
        }
        .scroll-controls .scroll-dots .sdot.active {
            background: var(--accent);
            width: 16px;
            border-radius: 4px;
        }

        /* ===== 社区热评 ===== */
        .comment-carousel {
            position: relative;
            min-height: 64px;
        }
        .comment-slide {
            animation: fadeSlide 0.4s ease forwards;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .comment-slide .author {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.75rem;
        }
        .comment-slide .text {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.7;
        }
        .comment-slide .text .highlight { color: var(--accent); }

        .comment-progress {
            width: 100%;
            height: 2px;
            background: var(--border-card);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            position: relative;
        }
        .comment-progress .bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 2px;
            transition: width 3s linear;
        }

        /* ===== 本周高光时刻 ===== */
        .highlight-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-card);
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .highlight-item:last-child { border-bottom: none; }
        .highlight-item .h-tag {
            display: inline-block;
            font-size: 0.6rem;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 0 8px;
            border-radius: 8px;
            margin-right: 6px;
            font-weight: 500;
        }
        .highlight-item .h-text { color: var(--text-secondary); }
        .highlight-item .h-text .hl { color: var(--accent); }

        /* ===== 策划回应 ===== */
        .dev-response {
            background: var(--accent-soft);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            border-left: 2px solid var(--accent);
            margin-top: 6px;
        }
        .dev-response .dev-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--accent);
            font-weight: 600;
        }
        .dev-response .dev-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .dev-response .dev-text .hl { color: var(--accent); }

        /* ===== 本周热词（来自第一份） ===== */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 4px 0;
        }
        .tag-cloud .tag-item {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-card-alt);
            padding: 3px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-card);
            transition: all var(--transition);
            cursor: default;
            animation: tag-float 3s ease-in-out infinite alternate;
        }
        .tag-cloud .tag-item:nth-child(1) { animation-delay: 0s; font-size: 0.85rem; color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .tag-cloud .tag-item:nth-child(2) { animation-delay: 0.4s; font-size: 0.8rem; }
        .tag-cloud .tag-item:nth-child(3) { animation-delay: 0.8s; }
        .tag-cloud .tag-item:nth-child(4) { animation-delay: 1.2s; font-size: 0.7rem; }
        .tag-cloud .tag-item:nth-child(5) { animation-delay: 1.6s; font-size: 0.8rem; }
        .tag-cloud .tag-item:nth-child(6) { animation-delay: 2.0s; font-size: 0.7rem; }
        .tag-cloud .tag-item:nth-child(7) { animation-delay: 0.6s; }
        .tag-cloud .tag-item:nth-child(8) { animation-delay: 1.8s; font-size: 0.75rem; }
        .tag-cloud .tag-item:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }
        @keyframes tag-float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-3px); }
        }

        /* ===== 玩家呼声（来自第一份） ===== */
        .voice-scroll {
            max-height: 120px;
            overflow: hidden;
            position: relative;
        }
        .voice-scroll::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: linear-gradient(to top, var(--bg-card), transparent);
            pointer-events: none;
        }
        .voice-track {
            animation: scroll-voice 12s linear infinite;
        }
        .voice-track:hover {
            animation-play-state: paused;
        }
        @keyframes scroll-voice {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
        .voice-item {
            padding: 4px 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .voice-item .tag {
            display: inline-block;
            font-size: 0.6rem;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 0 8px;
            border-radius: 4px;
            margin-right: 6px;
            font-weight: 500;
        }

        /* ===== 战力风向标（来自第一份） ===== */
        .power-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .power-item {
            background: var(--bg-card-alt);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            text-align: center;
            border: 1px solid var(--border-card);
        }
        .power-item .char {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .power-item .stat {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .power-item .stat .num {
            color: var(--accent);
            font-weight: 600;
        }
        .power-item .bar {
            width: 100%;
            height: 3px;
            background: var(--border-card);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .power-item .bar .fill {
            height: 100%;
            border-radius: 2px;
            background: var(--accent);
            transition: width 1s ease;
        }

        /* ===== 梗百科 ===== */
        .meme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .meme-item {
            background: var(--bg-card-alt);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            border: 1px solid var(--border-card);
            transition: border-color var(--transition);
        }
        .meme-item:hover {
            border-color: var(--accent-soft-hover);
        }
        .meme-item .term {
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .meme-item .def {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .update-note {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        @media (max-width: 600px) {
            #topbar { padding: 14px 0 10px 0; }
            #topbar .brand { font-size: 0.95rem; }
            #app { padding: 16px 0 0 0; }
            .card { padding: 14px 14px 16px 14px; }
            .comp-scroll .comp-card { flex: 0 0 170px; }
            .meme-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .power-grid { grid-template-columns: 1fr 1fr; }
            .version-brief { font-size: 0.85rem; padding: 14px 16px; }
            .card .title { font-size: 0.65rem; }
            .tag-cloud .tag-item { font-size: 0.7rem !important; }
        }
    </style>
    <script>
        (function() {
            try {
                const raw = localStorage.getItem('theme');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.value === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else if (parsed && parsed.value === 'light') {
                        document.documentElement.removeAttribute('data-theme');
                    }
                }
            } catch(e) {}
        })();
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
        }
    </script>
</head>
<body>
<div id="topbar">
    <a class="brand" href="#">归终纪 <small>· 社区 PVP</small></a>
    <div class="actions">
        <a class="back-btn" href="../list.html">← 返回图鉴</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
</div>

<div id="app">

    <div class="epigraph">
        <span class="live-dot"></span> 战局隐于风里，玩家藏于热评 <span class="online-count">在线 <span class="num" id="online-num">1247</span></span>
    </div>

    <div id="pvp-content"></div>

</div>

<script>

    // ================================================================
    //  渲染
    // ================================================================

    let commentIndex = 0;
    let commentTimer = null;

    function renderPVP() {
        const container = document.getElementById('pvp-content');
        const data = PVP_DATA;

        let html = '';

        // 版本梗概

            <div class="version-brief">

        // ===== 天梯数据速览 =====

                        <div class="stat-item">

                            <div class="label">${s.label}</div>

                </div>

        `;

        // ===== 热门阵容 =====
        html += `
            <div class="card">
                <div class="title"><span class="deco">✦</span> 热门阵容 <span class="badge">自动滚动</span></div>
                <div class="comp-scroll-wrapper">
                    <div class="comp-scroll" id="comp-scroll">
                        ${data.comps.map(comp => `
                            <div class="comp-card">

                                <div class="comp-desc">${comp.desc}</div>
                                <span class="comp-tag">${comp.tag}</span>
                            </div>

                        <!-- 复制第一张用于无缝循环 -->
                        <div class="comp-card">
                            <div class="comp-name">${data.comps[0].name}</div>
                            <div class="comp-desc">${data.comps[0].desc}</div>
                            <span class="comp-tag">${data.comps[0].tag}</span>
                        </div>
                    </div>
                </div>
                <div class="scroll-controls">
                    <button id="scroll-prev" aria-label="上一组">‹</button>
                    <div class="scroll-dots" id="scroll-dots">
                        ${data.comps.map((_, i) => `<span class="sdot ${i === 0 ? 'active' : ''}" data-idx="${i}"></span>`).join('')}
                    </div>
                    <button id="scroll-next" aria-label="下一组">›</button>

                <div class="tag-cloud">
                    ${data.hotWords.map(word => `

                </div>

        // ===== 社区热评 =====
        html += `

                <div class="title"><span class="deco">✦</span> 社区热评 <span class="badge">3s 轮播</span></div>
                <div class="comment-carousel" id="comment-carousel">
                    <div class="comment-slide" id="comment-slide">
                        <span class="author">${data.comments[0].author}</span>
                        <span class="text">：${data.comments[0].text}</span>
                    </div>
                    <div class="comment-progress" id="comment-progress">
                        <div class="bar" id="progress-bar"></div>

        // ===== 玩家呼声（来自第一份） =====

            <div class="card">
                <div class="title"><span class="deco">✦</span> 玩家呼声 <span class="badge">↻ 滚动</span></div>
                <div class="voice-scroll">
                    <div class="voice-track">
                        ${data.voices.map(v => `
                            <div class="voice-item">
                                <span class="tag">${v.tag}</span>
                                ${v.text}
                            </div>
                        `).join('')}
                        ${data.voices.map(v => `
                            <div class="voice-item">
                                <span class="tag">${v.tag}</span>
                                ${v.text}
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;

        // ===== 战力风向标（来自第一份） =====

            <div class="card">
                <div class="title"><span class="deco">✦</span> 战力风向标 <span class="badge">本周数据</span></div>
                <div class="power-grid">
                    ${data.power.map(p => `
                        <div class="power-item">
                            <div class="char">${p.char}</div>
                            <div class="stat"><span class="num">${p.rate}%</span> ${p.label}</div>

            </div>

        // ===== 本周高光时刻 =====
        html += `
            <div class="card">
                <div class="title"><span class="deco">✦</span> 本周高光时刻 <span class="badge">真实玩家投稿</span></div>
                ${data.highlights.map(h => `
                    <div class="highlight-item">
                        <span class="h-tag">${h.tag}</span>
                        <span class="h-text">${h.text}</span>
                    </div>
                `).join('')}
            </div>
        `;

        // ===== 策划回应区 =====
        html += `
            <div class="card">
                <div class="title"><span class="deco">✦</span> 策划回应区 <span class="badge">官方</span></div>
                ${data.devResponses.map(d => `
                    <div style="margin-bottom:8px;font-size:0.85rem;color:var(--text-primary);font-weight:500;">${d.q}</div>
                    <div class="dev-response">
                        <div class="dev-label">策划回应</div>
                        <div class="dev-text">${d.a}</div>
                    </div>
                `).join('')}
            </div>

        // ===== 梗百科 =====
        html += `
            <div class="card">

                <div class="meme-grid">

        // ===== 更新信息 =====

    // ================================================================
    //  热评轮播 (3s + 进度条)
    // ================================================================

    function startCarousel(comments) {
        if (commentTimer) {
            clearInterval(commentTimer);
            commentTimer = null;
        }

        const slide = document.getElementById('comment-slide');
        if (!slide) return;

        commentIndex = 0;

        function goTo(idx) {
            const c = comments[idx];
            slide.style.animation = 'none';
            void slide.offsetHeight;
            slide.innerHTML = `
                <span class="author">${c.author}</span>
                <span class="text">：${c.text}</span>
            `;
            slide.style.animation = 'fadeSlide 0.4s ease forwards';
            commentIndex = idx;
            // 重置进度条
            const bar = document.getElementById('progress-bar');
            if (bar) {
                bar.style.transition = 'none';
                bar.style.width = '0%';
                void bar.offsetHeight;
                bar.style.transition = 'width 3s linear';
                bar.style.width = '100%';
            }
        }

        // 首次启动进度条
        setTimeout(() => {
            const bar = document.getElementById('progress-bar');
            if (bar) {
                bar.style.transition = 'width 3s linear';
                bar.style.width = '100%';
            }
        }, 100);

        commentTimer = setInterval(() => {
            const next = (commentIndex + 1) % comments.length;
            goTo(next);
        }, 3000);
    }

    // ================================================================
    //  统计数字滚动
    // ================================================================

    function startStatsAnimation() {
        const els = document.querySelectorAll('.stat-num');
        els.forEach(el => {
            const target = parseFloat(el.dataset.target);
            const duration = 1200;
            const startTime = performance.now();

            function update(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = eased * target;
                el.textContent = Math.round(current);
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    el.textContent = target;
                }
            }
            requestAnimationFrame(update);
        });
    }

    // ================================================================
    //  热门阵容自动滚动
    // ================================================================

    let compIndex = 0;
    let compTimer = null;
    let compPaused = false;

    function startCompScroll(comps) {
        const scrollEl = document.getElementById('comp-scroll');
        const dots = document.querySelectorAll('#scroll-dots .sdot');
        const prevBtn = document.getElementById('scroll-prev');
        const nextBtn = document.getElementById('scroll-next');

        if (!scrollEl || dots.length === 0) return;

        const cardWidth = 220 + 14;
        const totalCards = comps.length;
        let currentIdx = 0;

        function goTo(idx) {
            if (idx >= totalCards) {
                scrollEl.style.transition = 'none';
                scrollEl.style.transform = `translateX(0px)`;
                void scrollEl.offsetHeight;
                idx = 0;
                currentIdx = 0;
                scrollEl.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            } else {
                currentIdx = idx;
                scrollEl.style.transform = `translateX(-${idx * cardWidth}px)`;
            }

            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === idx % totalCards);
            });
            compIndex = idx % totalCards;
        }

        function next() {
            goTo((currentIdx + 1) % (totalCards + 1));
        }

        function prev() {
            const prevIdx = currentIdx - 1;
            if (prevIdx < 0) {
                scrollEl.style.transition = 'none';
                scrollEl.style.transform = `translateX(-${totalCards * cardWidth}px)`;
                void scrollEl.offsetHeight;
                scrollEl.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                setTimeout(() => {
                    goTo(totalCards - 1);
                }, 20);
            } else {
                goTo(prevIdx);
            }
        }

        dots.forEach((dot, idx) => {
            dot.addEventListener('click', function() {
                if (compTimer) {
                    clearInterval(compTimer);
                    compTimer = null;
                }
                goTo(idx);
                startAutoScroll();
            });
        });

        if (prevBtn) prevBtn.addEventListener('click', function() {
            if (compTimer) {
                clearInterval(compTimer);
                compTimer = null;
            }
            prev();
            startAutoScroll();
        });

        if (nextBtn) nextBtn.addEventListener('click', function() {
            if (compTimer) {
                clearInterval(compTimer);
                compTimer = null;
            }
            next();
            startAutoScroll();
        });

        const wrapper = scrollEl.closest('.comp-scroll-wrapper');
        if (wrapper) {
            wrapper.addEventListener('mouseenter', () => {
                compPaused = true;
                if (compTimer) {
                    clearInterval(compTimer);
                    compTimer = null;
                }
            });
            wrapper.addEventListener('mouseleave', () => {
                compPaused = false;
                startAutoScroll();
            });
        }

        function startAutoScroll() {
            if (compTimer) clearInterval(compTimer);
            if (compPaused) return;
            compTimer = setInterval(() => {
                next();
            }, 3500);
        }

        setTimeout(startAutoScroll, 500);
    }

    // ================================================================
    //  启动
    // ================================================================

    renderPVP();
</script>
