<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>归终纪 · 游戏系统</title>
  <style>
    /* ===== 色盘（统一系列风格） ===== */
    :root {
      --bg-body: #faf6ef;
      --bg-card: #ffffff;
      --bg-card-alt: #f2eee9;
      --bg-hover: rgba(138, 58, 42, 0.03);
      --border-light: #e8e0d5;
      --border-card: #d5c8b8;
      --text-primary: #1a1410;
      --text-secondary: #2c241e;
      --text-muted: #5a4d42;
      --text-muted-light: #8a7a6a;
      --accent: #8a3a2a;
      --accent-soft: rgba(138, 58, 42, 0.05);
      --accent-glow: rgba(138, 58, 42, 0.08);
      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06);
      --font-serif: "Georgia", "Times New Roman", "Songti SC", serif;
      --font-mono: "Courier New", "Source Code Pro", monospace;
      --transition: 0.25s ease;
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg-body: #24201c;
      --bg-card: #2d2824;
      --bg-card-alt: #24201c;
      --bg-hover: rgba(176, 90, 74, 0.04);
      --border-light: #3d3732;
      --border-card: #4a443e;
      --text-primary: #d8d0c8;
      --text-secondary: #b8aea4;
      --text-muted: #8a8078;
      --text-muted-light: #6a6560;
      --accent: #b05a4a;
      --accent-soft: rgba(176, 90, 74, 0.05);
      --accent-glow: rgba(176, 90, 74, 0.12);
      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-serif);
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 17px;
      line-height: 1.7;
      transition: background var(--transition), color var(--transition);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      padding: 0 16px 40px 16px;
      display: flex;
      flex-direction: column;
    }

    /* ===== 右上角悬浮组（完全可见） ===== */
    .float-group {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .float-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 6px 14px 6px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      letter-spacing: 0.3px;
      text-decoration: none;
    }
    .float-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .float-btn .icon {
      font-size: 0.9rem;
    }

    /* ===== 主容器 ===== */
    #app {
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 4px 20px 4px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ===== 头部 ===== */
    .page-header {
      padding: 0 0 16px 0;
      border-bottom: 1.5px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    .page-header h1 .accent {
      color: var(--accent);
      font-weight: 400;
    }
    .page-header .sub {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-muted-light);
      font-family: var(--font-serif);
      letter-spacing: 0.3px;
    }
    .page-header .sub .sym {
      color: var(--accent);
      opacity: 0.4;
    }

    /* ===== 网格卡片 ===== */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 4px;
    }

    .grid-card {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 28px 22px 22px 22px;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
      position: relative;
    }
    .grid-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }

    /* 顶部装饰符号 */
    .grid-card .deco {
      font-size: 1.4rem;
      color: var(--accent);
      opacity: 0.35;
      margin-bottom: 6px;
      display: block;
      letter-spacing: 2px;
      transition: opacity var(--transition), transform var(--transition);
      font-weight: 400;
    }
    .grid-card:hover .deco {
      opacity: 0.7;
      transform: scale(1.05);
    }

    /* 标题 */
    .grid-card .name {
      font-size: 1.1rem;
      font-weight: 600;
      font-family: var(--font-serif);
      color: var(--text-primary);
      margin-bottom: 2px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* AU 标记（现代AU） */
    .grid-card .badge-au {
      display: inline-block;
      font-size: 0.55rem;
      font-weight: 500;
      font-family: var(--font-mono);
      color: var(--text-muted-light);
      background: var(--bg-card-alt);
      padding: 1px 10px;
      border-radius: 10px;
      letter-spacing: 0.3px;
      border: 1px solid var(--border-light);
      transition: all var(--transition);
    }
    .grid-card:hover .badge-au {
      border-color: var(--accent-soft);
      color: var(--accent);
    }

    /* 分隔细线 */
    .grid-card .divider {
      width: 28px;
      height: 1.5px;
      background: var(--border-card);
      margin: 10px 0 8px 0;
      transition: background var(--transition), width var(--transition);
    }
    .grid-card:hover .divider {
      background: var(--accent);
      width: 36px;
    }

    /* 描述 */
    .grid-card .desc {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.7;
      margin-top: 2px;
      font-family: var(--font-serif);
    }

    /* 状态标签 */
    .grid-card .status {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      font-family: var(--font-mono);
      color: var(--text-muted);
      padding: 2px 14px;
      border-radius: 14px;
      border: 1px solid var(--border-card);
      margin-top: 14px;
      letter-spacing: 0.3px;
      transition: all var(--transition);
    }
    .grid-card:hover .status {
      border-color: var(--accent-soft);
      color: var(--accent);
    }
    .grid-card .status.done {
      color: var(--accent);
      border-color: var(--accent-soft);
      background: var(--accent-soft);
    }

    /* ===== 底部 ===== */
    .page-footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
      font-size: 0.65rem;
      color: var(--text-muted-light);
      text-align: center;
      font-family: var(--font-mono);
      letter-spacing: 1.5px;
    }
    .page-footer .sym {
      color: var(--accent);
      opacity: 0.3;
    }

    /* ============================================================
       手机端
    ============================================================ */
    @media (max-width: 600px) {
      body {
        padding: 0 12px 30px 12px;
        font-size: 16px;
      }
      .float-group {
        top: 12px;
        right: 12px;
        gap: 6px;
      }
      .float-btn {
        padding: 4px 10px 4px 8px;
        font-size: 0.65rem;
      }
      #app {
        padding: 16px 0 10px 0;
        gap: 6px;
      }
      .page-header h1 {
        font-size: 1.3rem;
      }
      .page-header .sub {
        font-size: 0.75rem;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .grid-card {
        padding: 20px 16px 18px 16px;
      }
      .grid-card .name {
        font-size: 1rem;
      }
      .grid-card .desc {
        font-size: 0.82rem;
      }
      .grid-card .status {
        font-size: 0.6rem;
        padding: 2px 12px;
      }
      .page-footer {
        font-size: 0.6rem;
        margin-top: 18px;
      }
    }

    @media (max-width: 400px) {
      body {
        padding: 0 8px 24px 8px;
        font-size: 15px;
      }
      .float-group {
        top: 8px;
        right: 8px;
        gap: 4px;
      }
      .float-btn {
        padding: 3px 8px 3px 6px;
        font-size: 0.55rem;
        border-radius: 18px;
      }
      .float-btn .icon {
        font-size: 0.7rem;
      }
      #app {
        padding: 12px 0 8px 0;
      }
      .page-header h1 {
        font-size: 1.1rem;
      }
      .page-header .sub {
        font-size: 0.7rem;
      }
      .grid-card .name {
        font-size: 0.92rem;
      }
      .grid-card .desc {
        font-size: 0.78rem;
      }
      .grid-card {
        padding: 16px 14px 14px 14px;
      }
    }
  </style>

  <script>
    (function() {
      try {
        var raw = localStorage.getItem('theme');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      } catch (e) {}
    })();

    function toggleTheme() {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark';
      var newTheme = isDark ? 'light' : 'dark';
      if (newTheme === 'dark') {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
      var btn = document.getElementById('themeBtn');
      if (btn) {
        btn.innerHTML = newTheme === 'dark'
          ? '<span class="icon">☀️</span> 日间'
          : '<span class="icon">🌙</span> 夜间';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('themeBtn');
      if (btn) {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.innerHTML = isDark
          ? '<span class="icon">☀️</span> 日间'
          : '<span class="icon">🌙</span> 夜间';
      }
    });

    window.addEventListener('storage', function(e) {
      if (e.key === 'theme') {
        try {
          var parsed = JSON.parse(e.newValue);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
          var btn = document.getElementById('themeBtn');
          if (btn) {
            btn.innerHTML = parsed && parsed.value === 'dark'
              ? '<span class="icon">☀️</span> 日间'
              : '<span class="icon">🌙</span> 夜间';
          }
        } catch (e) {}
      }
    });
  </script>
</head>
<body>

  <!-- ===== 右上角悬浮组（完全可见） ===== -->
  <div class="float-group">
    <a class="float-btn" href="/-/world/">
      <span class="icon">←</span> 返回探索
    </a>
    <button class="float-btn" id="themeBtn" onclick="toggleTheme()">
      <span class="icon">🌙</span> 夜间
    </button>
  </div>

  <div id="app">

    <!-- 头部 -->
    <div class="page-header">
      <h1>归终纪 · <span class="accent">游戏系统</span></h1>
      <p class="sub"><span class="sym">◈</span> 角色藏于卷中，战局隐于风里</p>
    </div>

    <!-- 卡片网格 -->
    <div class="grid">

      <!-- 角色合集 -->
      <a class="grid-card" href="list.html">
        <span class="deco">✿</span>
        <div class="name">归终纪·模拟卡牌游戏</div>
        <div class="divider"></div>
        <div class="desc">查看所有角色卡牌 · 属性 · 技能 · 羁绊</div>
        <span class="status done">已收录 5 位</span>
      </a>

      <!-- 论坛 PVP -->
      <a class="grid-card" href="讨论/index.html">
        <span class="deco">❖</span>
        <div class="name">论坛</div>
        <div class="divider"></div>
        <div class="desc">角色互动 · 内含狗血 · 超绝番外</div>
        <span class="status">鬼脑发动中</span>
      </a>

      <!-- 病历档案（现代AU） -->
      <a class="grid-card" href="病历/index.html">
        <span class="deco">◈</span>
        <div class="name">
          病历档案
          <span class="badge-au">现代 AU</span>
        </div>
        <div class="divider"></div>
        <div class="desc">心理诊疗记录 · 偏执与妄想 · 荒诞自述</div>
        <span class="status">收录中</span>
      </a>

      <a class="grid-card" href="文游/index.html">
        <span class="deco">✦</span>
        <div class="name">
          模拟文游
          <span class="badge-au">模拟文游</span>
        </div>
        <div class="divider"></div>
        <div class="desc">佛系更新 · 内含ooc · 神秘产物</div>
        <span class="status">更新中</span>
      </a>

      <a class="grid-card" href="模拟器/index.html">
        <span class="deco">✦</span>
        <div class="name">
          引渡人模拟器
          <span class="badge-au">并非模拟</span>
        </div>
        <div class="divider"></div>
        <div class="desc">新cp · bg · 神秘产物</div>
        <span class="status">木嘿嘿嘿</span>
      </a>

    </div>

    <!-- 底部 -->
    <div class="page-footer">
      <span class="sym">✦</span> 归终纪 · 用文字构筑世界 <span class="sym">✦</span>
    </div>

  </div>

</body>
</html>
