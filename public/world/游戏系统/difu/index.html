<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>归终纪 · 游戏系统</title>
    <style>
        :root {
            --bg-body: #f7f4ef;
            --bg-card: #ffffff;
            --bg-card-alt: #f2eee9;
            --border-light: #ece6de;
            --border-card: #e4ddd4;
            --text-primary: #2c2c2c;
            --text-secondary: #4a4a4a;
            --text-muted: #8a8a8a;
            --accent: #b03a2a;
            --accent-soft: rgba(176, 58, 42, 0.06);
            --accent-glow: rgba(176, 58, 42, 0.10);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --radius: 14px;
            --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            --transition: 0.25s ease;
        }
        [data-theme="dark"] {
            --bg-body: #181614;
            --bg-card: #24201c;
            --bg-card-alt: #1e1b18;
            --border-light: #35302a;
            --border-card: #3a3530;
            --text-primary: #cfc8c0;
            --text-secondary: #9a948c;
            --text-muted: #6a6560;
            --accent: #b05a4a;
            --accent-soft: rgba(176, 90, 74, 0.08);
            --accent-glow: rgba(176, 90, 74, 0.15);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
        }
        #topbar {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 0 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 8px;
        }
        #topbar .brand {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #topbar .brand span { color: var(--accent); }
        #topbar .brand small {
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 4px;
        }
        #topbar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            padding: 4px 14px;
            border-radius: 18px;
            border: 1px solid var(--border-light);
            background: transparent;
            font-size: 0.78rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all var(--transition);
            font-family: inherit;
        }
        .back-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        .theme-toggle:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        #app {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 0 40px 0;
            flex: 1;
        }

        .epigraph {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 0.3px;
            padding: 0 0 20px 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 24px;
            line-height: 1.8;
            text-align: center;
        }
        .epigraph .mark {
            color: var(--accent);
            font-style: normal;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .grid-card {
            display: block;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 32px 24px 26px 24px;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            position: relative;
        }
        .grid-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }
        .grid-card .deco {
            font-size: 1.4rem;
            color: var(--accent);
            opacity: 0.4;
            margin-bottom: 6px;
            display: block;
            letter-spacing: 2px;
            transition: opacity var(--transition);
        }
        .grid-card:hover .deco {
            opacity: 0.7;
        }
        .grid-card .name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .grid-card .desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 2px;
        }
        .grid-card .status {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-muted);
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-card);
            margin-top: 12px;
            letter-spacing: 0.3px;
            transition: all var(--transition);
        }
        .grid-card:hover .status {
            border-color: var(--accent-soft);
            color: var(--accent);
        }
        .grid-card .status.done {
            color: var(--accent);
            border-color: var(--accent-soft);
            background: var(--accent-soft);
        }

        .grid-card .divider {
            width: 24px;
            height: 1px;
            background: var(--border-card);
            margin: 10px 0 8px 0;
            transition: background var(--transition);
        }
        .grid-card:hover .divider {
            background: var(--accent);
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            #topbar { padding: 14px 0 10px 0; }
            #topbar .brand { font-size: 0.95rem; }
            #app { padding: 16px 0 30px 0; }
            .grid-card { padding: 24px 18px 20px 18px; }
            .epigraph { font-size: 0.78rem; }
        }
        @media (max-width: 400px) {
            .grid-card .name { font-size: 0.95rem; }
            .grid-card .desc { font-size: 0.78rem; }
        }
    </style>
    <script>
        (function() {
            try {
                const raw = localStorage.getItem('theme');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.value === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else if (parsed && parsed.value === 'light') {
                        document.documentElement.removeAttribute('data-theme');
                    }
                }
            } catch(e) {}
        })();
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
        }
    </script>
</head>
<body>
<div id="topbar">
    <a class="brand" href="#">归终纪 <small>· 游戏系统</small></a>
    <div class="actions">
        <a class="back-btn" href="/-/world/">← 返回探索</a>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
</div>
<div id="app">

    <div class="epigraph">
        — 角色藏于卷中，战局隐于风里 —
    </div>

    <div class="grid">
        <a class="grid-card" href="list.html">
            <span class="deco">✿</span>
            <div class="name">角色合集</div>
            <div class="divider"></div>
            <div class="desc">查看所有角色卡牌 · 属性 · 技能 · 羁绊</div>
            <span class="status done">已收录 5 位</span>
        </a>
        <a class="grid-card" href="pvp/index.html">
            <span class="deco">✦</span>
            <div class="name">社区 PVP</div>
            <div class="divider"></div>
            <div class="desc">天梯环境 · 热门阵容 · 玩家梗百科</div>
            <span class="status">建设中</span>
        </a>
    </div>

</div>
</body>
</html>
