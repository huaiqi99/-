<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>归终殿 · 临床病例</title>
    <style>
        :root {
            --bg-body: #e8e0d5;
            --bg-paper: #f6f0e7;
            --bg-card: #fcf8f0;
            --text-primary: #1f1a16;
            --text-secondary: #2c241e;
            --text-muted: #5a4d42;
            --text-muted-light: #8a7a6a;
            --border-light: #d5c8b8;
            --border-card: #c4b4a0;
            --shadow: 0 8px 32px rgba(44, 36, 30, 0.12);
            --radius: 12px;
            --font: "Courier New", "Source Code Pro", "PingFang SC", monospace;
            --transition: 0.3s ease;
            --accent: #8a2a1a;
            --accent-soft: rgba(138, 42, 26, 0.06);
            --sidebar-width: 220px;
        }

        [data-theme="dark"] {
            --bg-body: #1a1614;
            --bg-paper: #24201c;
            --bg-card: #2d2824;
            --text-primary: #cfc8c0;
            --text-secondary: #b8aea4;
            --text-muted: #8a8078;
            --text-muted-light: #6a6560;
            --border-light: #35302a;
            --border-card: #4a443e;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --accent: #b05a4a;
            --accent-soft: rgba(176, 90, 74, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 0 16px 30px 16px;
            display: flex;
            flex-direction: column;
        }

        .float-group {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .float-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 6px 14px 6px 12px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            letter-spacing: 0.3px;
            text-decoration: none;
        }

        .float-btn:hover { border-color: var(--accent); color: var(--accent); }
        .float-btn .icon { font-size: 0.9rem; }
        .float-btn .icon-back { font-size: 0.9rem; margin-right: 2px; }

        #app {
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 0 0 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .medical-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 24px 28px 30px 28px;
            box-shadow: var(--shadow);
            position: relative;
            width: 100%;
            animation: cardIn 0.45s ease forwards;
        }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .medical-header {
            text-align: center;
            border-bottom: 2px solid var(--border-card);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .medical-header .title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-primary);
        }

        .medical-header .sub {
            font-size: 0.75rem;
            color: var(--text-muted-light);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .patient-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px 20px;
            font-size: 0.82rem;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .patient-info .item .label { color: var(--text-muted-light); font-weight: 400; }
        .patient-info .item .value { font-weight: 500; color: var(--text-primary); }

        .diagnosis-block {
            background: var(--accent-soft);
            border-left: 4px solid var(--accent);
            padding: 10px 16px;
            margin-bottom: 14px;
            border-radius: 0 6px 6px 0;
        }

        .diagnosis-block .main-dx {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .diagnosis-block .sub-dx {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            line-height: 1.6;
        }

        .diagnosis-block .sub-dx .dx-line { display: block; }

        .medical-body {
            font-size: 0.92rem;
            line-height: 2;
            color: var(--text-secondary);
            font-family: var(--font);
        }

        .medical-body .section { margin-bottom: 14px; }

        .medical-body .section .title {
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 2px;
            margin-bottom: 2px;
        }

        .medical-body .section .title-en {
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: var(--text-muted-light);
            font-weight: 400;
            margin-bottom: 4px;
        }

        .medical-body .section p {
            margin-bottom: 4px;
            text-indent: 2em;
            color: var(--text-secondary);
        }

        .medical-body .section p.no-indent { text-indent: 0; }
        .medical-body .section .sub-item { margin-left: 1.2em; margin-bottom: 2px; color: var(--text-secondary); }
        .medical-body .section .sub-item .hl { font-weight: 600; color: var(--accent); }
        .hl { color: var(--accent); font-weight: 600; }

        .clinic-note {
            margin: 12px 0 8px 18px;
            padding: 10px 16px 10px 20px;
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 0 6px 6px 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.9;
            position: relative;
        }

        .clinic-note::before {
            content: "[CLINICAL NOTES]";
            display: block;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            opacity: 0.6;
        }

        .clinic-note .hl { font-weight: 600; }

        .clinic-note .quote-line {
            display: block;
            margin-top: 4px;
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .medical-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted-light);
            flex-wrap: wrap;
            gap: 6px;
        }

        .medical-footer .status { color: var(--accent); font-weight: 500; }

        .sidebar-tab {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-left: none;
            border-radius: 0 8px 8px 0;
            padding: 8px 10px 8px 6px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            writing-mode: vertical-rl;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            font-family: var(--font);
            user-select: none;
        }

        .sidebar-tab:hover { border-color: var(--accent); color: var(--accent); }
        .sidebar-tab .icon { writing-mode: horizontal-tb; display: inline-block; margin-bottom: 4px; font-size: 0.9rem; }

        .sidebar-panel {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border-card);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.06);
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            z-index: 95;
            padding: 28px 16px 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-panel.open { transform: translateX(0); }

        .sidebar-panel .close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted-light);
            cursor: pointer;
            font-family: inherit;
            padding: 0 4px;
            margin-bottom: 12px;
            transition: color var(--transition);
        }

        .sidebar-panel .close-btn:hover { color: var(--accent); }

        .sidebar-panel .panel-title {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-muted-light);
            text-transform: uppercase;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
        }

        .sidebar-panel .role-item {
            display: block;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 0.85rem;
            font-family: var(--font);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
            background: none;
            width: 100%;
            margin-bottom: 4px;
        }

        .sidebar-panel .role-item:hover { background: var(--accent-soft); border-color: var(--border-card); }
        .sidebar-panel .role-item.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .sidebar-panel .role-item .badge { font-size: 0.6rem; opacity: 0.5; font-weight: 400; margin-left: 6px; }
        .sidebar-panel .role-item .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; background: var(--accent); opacity: 0.5; }
        .sidebar-panel .role-item.active .status-dot { opacity: 1; }

        .sidebar-panel .panel-footer {
            margin-top: auto;
            font-size: 0.6rem;
            color: var(--text-muted-light);
            text-align: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            letter-spacing: 0.3px;
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 92;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

        @media (max-width: 700px) {
            body { padding: 0 10px 20px 10px; }
            #app { padding: 16px 0 0 0; }
            .medical-card { padding: 18px 16px 22px 16px; }
            .medical-header .title { font-size: 0.95rem; }
            .diagnosis-block .main-dx { font-size: 1rem; }
            .diagnosis-block .sub-dx { font-size: 0.75rem; }
            .medical-body { font-size: 0.85rem; line-height: 1.9; }
            .medical-body .section .sub-item { margin-left: 0.8em; }
            .clinic-note { margin-left: 6px; padding: 8px 12px 8px 16px; font-size: 0.78rem; }
            .sidebar-tab { padding: 6px 8px 6px 4px; font-size: 0.6rem; }
            .sidebar-panel { width: 200px; padding: 20px 12px 16px 12px; }
            .sidebar-panel .role-item { font-size: 0.8rem; padding: 8px 10px; }
            .float-group { top: 12px; right: 12px; gap: 6px; }
            .float-btn { padding: 4px 10px 4px 8px; font-size: 0.65rem; }
            .medical-footer { font-size: 0.65rem; }
            .patient-info { grid-template-columns: 1fr 1fr; gap: 2px 16px; font-size: 0.75rem; }
            .patient-info .item:nth-child(3) { grid-column: 1 / -1; }
        }

        @media (max-width: 420px) {
            .medical-card { padding: 14px 12px 18px 12px; }
            .medical-body { font-size: 0.82rem; }
            .diagnosis-block .main-dx { font-size: 0.92rem; }
            .diagnosis-block .sub-dx { font-size: 0.7rem; }
            .clinic-note { font-size: 0.74rem; padding: 6px 10px 6px 14px; }
            .sidebar-panel { width: 180px; padding: 16px 10px 12px 10px; }
            .sidebar-panel .role-item { font-size: 0.75rem; padding: 6px 8px; }
            .patient-info { font-size: 0.7rem; gap: 2px 10px; }
        }

        body.no-scroll { overflow: hidden; }

        .sidebar-link {
            display: block;
            padding: 10px 12px;
            margin: 6px 0 10px 0;
            border-radius: 6px;
            border: 1px solid var(--border-card);
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.82rem;
            font-family: var(--font);
            text-decoration: none;
            text-align: center;
            transition: all var(--transition);
            letter-spacing: 0.5px;
        }

        .sidebar-link:hover {
            background: var(--accent);
            color: var(--bg-card);
            border-color: var(--accent);
        }

        .sidebar-link .sidebar-link-icon {
            margin-right: 6px;
        }

        	/* ===== BGM 控制按钮 ===== */
        .float-btn.compact { padding: 4px 10px 4px 8px; font-size: 0.65rem; }
	    #bgmBtn #bgmLabel {
	        max-width: 88px; overflow: hidden; text-overflow: ellipsis;
	        white-space: nowrap; display: inline-block; vertical-align: bottom;
	    }
	    #bgmBtn.playing .icon { animation: bgmPulse 2.4s ease-in-out infinite; }
	    @keyframes bgmPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }

    </style>

    <script>
        const patients = [{
            id: 'ling',
            name: '凌宸钧',
            badge: 'LCJ-317-001-A',
            age: '31岁',
            occupation: '凌氏集团总裁',
            date: '2022.03.17',
            doctor: '周医生',
            diagnosis: '偏执型依恋障碍（显性型）',
            subDiagnosis: [
                'F60.0 偏执型人格障碍（倾向）',
                'F43.22 适应障碍伴焦虑和抑郁情绪（继发）'
            ],
            sections: [{
                title: '主诉',
                titleEn: 'CHIEF COMPLAINT',
                content: `
                    <p>患者自述"精神状态稳定"，但经评估确认存在严重的偏执型依恋障碍。患者的核心困扰表现为：对"秦墨予/栾方棋"这一对象持续六年的高强度情感附着，附着程度远超正常范畴，且患者对此缺乏自知力。</p>
                    <p class="no-indent" style="font-style:italic;color:var(--text-muted);font-size:0.85rem;">患者主动陈述："我挺好的，我只是偶尔路过他家楼下。一周大概三四次吧。"</p>
                `
            }, {
                title: '现病史',
                titleEn: 'HISTORY OF PRESENT ILLNESS',
                content: `
                    <p>患者于六年前与目标对象（秦墨予）建立上下级关系，期间逐渐发展为单向高强度情感依恋。患者通过职务之便给予目标对象超出常规的职业晋升和资源支持，并持续进行跟踪行为。</p>
                    <p>目标对象因精神分裂症住院治疗并离职后，患者出现明显的"替代行为"——寻找了与目标对象外貌高度相似的女性（秦雨令）作为情感替代品，维持了约半年的关系。替代品失效后，患者重回对原始目标的执着。</p>
                    <p>当前，目标对象已更名"栾方棋"并与他人（林淮）建立婚姻关系。患者对此事实存在认知回避，仍习惯称呼目标对象为"秦墨予"，并在行为层面持续介入目标对象的生活（包括对目标对象伴侣的创业公司进行投资）。</p>
                `
            }, {
                title: '既往史',
                titleEn: 'PAST MEDICAL HISTORY',
                content: `
                    <p>患者自述为私生子出身，早年经历被排斥和轻视，后通过自身努力接管家族企业。患者曾多次提及"不甘心"这一情绪，认为其多数行为动机源于对早年处境的补偿。</p>
                    <p>患者在目标对象因病离职后，曾短暂寻求心理支持，但未系统接受治疗。患者承认自己"偏执"，但将其合理化为"事业型人格"的一部分，拒绝承认其病理性。</p>
                    <p>家族史：未明确报告重大精神疾病史。</p>
                `
            }, {
                title: '精神检查',
                titleEn: 'MENTAL STATUS EXAMINATION',
                content: `
                    <p><span class="hl">认知：</span>存在明显的认知分裂——将"秦墨予"与"栾方棋"视为两个独立个体。前者被高度理想化，后者被贬低为"不完整的版本"。</p>
                    <p><span class="hl">行为：</span>持续性的跟踪行为（社交监控、地理监控、间接经济干预）。</p>
                    <p><span class="hl">情感：</span>情感附着完全单向，不具备互惠性。存在矛盾情感（渴望靠近与抗拒承认）。</p>
                    <p><span class="hl">人际关系：</span>社交圈高度同质化，患者倾向于与同样被过去困住的人建立关系。</p>
                    <p><span class="hl">自知力：</span>部分受损。患者能部分承认自己的偏执倾向，但无法将其认知为病理性。</p>
                `
            }, {
                title: '处方',
                titleEn: 'TREATMENT PLAN',
                content: `
                    <p><span class="hl">1. 认知重组治疗</span> —— 患者需从认知上接受"秦墨予"与"栾方棋"是同一人，并理解该对象不存在"回归"的可能。</p>
                    <p><span class="hl">2. 行为干预</span> —— 建议患者逐步减少对目标对象的跟踪行为。每日记录路过次数并逐步递减。</p>
                    <p><span class="hl">3. 社交扩充</span> —— 建议患者在保持现有关系的同时，尝试与未受过去创伤影响的人群建立联系。</p>
                    <p><span class="hl">4. 药物治疗</span> —— 如焦虑或抑郁症状加重，可考虑SSRI类药物辅助。</p>
                `
            }],
            clinicNote: `
                患者在第3次复诊时提到："你总是说我对秦墨予有执念，但你没想过，万一他也需要我呢？"<br><br>
                此句暴露了患者的核心信念：他认为自己的偏执是一种"守护"，而非一种"入侵"。他需要理解，被偏执者并不感激被偏执。事实上，他可能就是那个让秦墨予重新生病的原因。<br><br>
                建议在下次复诊中重点探讨：患者的"爱"是否只是一种包装精致的自我感动？当他说"喜欢"的时候，他喜欢的究竟是他自己想象中的秦墨予，还是那个真实存在、已走向不同人生的栾方棋？如果是前者，那这份感情与秦墨予本人毫无关系——他在和一个幻影谈恋爱。<br>
                <span class="quote-line">＊患者在听到"幻影"一词时停止了摩挲戒指。停顿约三秒后，他笑了——体面的、总裁式的笑。他说："周医生，你是第一个把'我根本不懂爱情'说得这么学术的人。"他没有否认，这说明他听懂了。＊</span>
            `
        }, {
            id: 'bai',
            name: '白禾川',
            badge: 'BHC-0918-003-A',
            age: '32岁',
            occupation: '前青丘生物科技创始人/CEO（已破产）',
            date: '2022.06.01',
            doctor: '周医生',
            diagnosis: '偏执型人格障碍（激越型）伴妄想性认知',
            subDiagnosis: [
                'F60.0 偏执型人格障碍（激越型）',
                'F22.0 妄想性障碍'
            ],
            sections: [{
                title: '主诉',
                titleEn: 'CHIEF COMPLAINT',
                content: `
                    <p>患者自述"没什么大事"，但伴随明显的愤怒和冲动控制障碍。患者的核心困扰表现为：对前女友秦雨令的执念、对司衡集团的持续仇恨、以及对自身事业失败的无法接受。三者高度纠缠，患者无法分开处理，导致情绪长期处于激越状态。</p>
                    <p class="no-indent" style="font-style:italic;color:var(--text-muted);font-size:0.85rem;">患者主动陈述："等我东山再起……把那群狗东西按在地上摩擦……还有那个女的……啧，不提也罢。"</p>
                `
            }, {
                title: '现病史',
                titleEn: 'HISTORY OF PRESENT ILLNESS',

                    <p>需要警惕的是，患者的所有自我价值感与安全感均系于单一客体。这种结构在关系稳定时表现为"完美伴侣"，但一旦关系出现危机（如伴侣病重、分离、死亡），隐性偏执极有可能迅速显性化，转化为对外攻击或自我毁灭。</p>
                `
            }, {
                title: '处方',
                titleEn: 'TREATMENT PLAN',
                content: `
                    <p><span class="hl">1. 维持现状</span> —— 目前婚姻关系的稳定性是患者最好的代偿机制。在无显著功能损害的前提下，不建议主动拆解患者的防御结构。</p>
                    <p><span class="hl">2. 社交拓展</span> —— 继续建立独立于婚姻的人际关系支点。患者目前已迈出良好一步（罗修、魏元璟等），建议保持并深化这些非伴侣指向的社交连接。</p>
                    <p><span class="hl">3. 定期评估</span> —— 每半年进行一次隐性偏执指数评估，监测情感投注的集中度是否异常上升。</p>
                    <p><span class="hl">4. 危机预案</span> —— 若婚姻关系出现波动（如争吵、分离、丧偶），需立即介入，防止代偿机制崩溃导致偏执显性化。</p>
                    <p><span class="hl">5. 药物治疗</span> —— 暂不推荐。患者无抑郁、焦虑或精神病性症状，药物可能破坏其现有的高功能代偿。</p>
                `
            }],
            clinicNote: `
                林淮是自己走进诊室的。他穿着整洁，举止得体，第一句话是："周医生，这份病历，请不要给任何人看。包括方棋。"<br><br>
                我问他原因。他说："他知道了会难过。他会觉得是他把我变成了这样。但其实不是，我从孤儿院出来的时候，就已经是这样了。他只是……让我有了可以偏执的对象。"<br><br>
                在谈及与栾方棋的关系时，他的用词精确得像一份合同："十六岁那年，他把我从孤儿院带出来，供我读书，给我名字。没有他，我什么都不是。所以我要陪着他，不管他是秦墨予，还是栾方棋。"<br><br>
                我说这听起来很深情。他看了我一眼，说："您也可以这么理解。"<br><br>
                但当我问及"如果他没有选择你呢"，他沉默了很久，手指在膝盖上轻轻敲了两下，然后说："我不会让这种事发生。"<br><br>
                不是"我会很难过"，不是"我会放手"，而是"我不会让这种事发生"。<br><br>
                那一刻我确定了——他和凌宸钧是同一种人。凌宸钧的偏执是向外的（跟踪、控制、金钱干预），而林淮的偏执是向内的（陪伴、忠诚、自我献祭）。凌宸钧用手段把对方留在视野里，林淮用存在把对方变成自己的全世界。前者让人害怕，后者让人感动，但本质都是"我不能失去这个人"。<br><br>
                有趣的是，林淮比凌宸钧幸运。他得到了那个人，并且用婚姻将关系合法化、固定化。这种"得到"极大安抚了他的偏执，使其维持在隐性、高功能的状态。<br><br>
                我问他有没有朋友。他说有，罗修、魏元璟，还有一些创业的合伙人。他说这些名字的时候，语气明显比谈及栾方棋时要轻，像在读一份无关紧要的名单。<br><br>
                "和他们相处愉快吗？"我问。<br><br>
                "愉快，"他说，"但他们不是他。"<br><br>
                临走时，他忽然在门口停住，回头问："周医生，您觉得我需要治疗吗？"<br><br>
                我说："从社会功能来看，你不需要。但从人格结构来看，你所有的安全感都系于一个人身上，这很危险。一旦那根绳子断了……"<br><br>
                他没等我说完，只是轻轻点了点头，说："那就危险吧。我只要他。"<br>
                <span class="quote-line">＊患者离开后，我在病历封面标注了"绝密·不公开"。本病历单独封存，不向患者伴侣栾方棋及任何第三方披露。从医学伦理角度，我尊重患者对自身病历的隐私权；但从临床角度，我必须记录：这是一份建立在单一人格支点上的高功能隐性偏执档案，目前稳定，但理论上，永远存在崩溃的风险。＊</span>
            `
        }];

        let currentPatient = 'ling';
        let sidebarOpen = false;

        function renderSidebar() {
            const container = document.getElementById('sidebarRoleList');
            if (!container) return;
            container.innerHTML = '';
            patients.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'role-item' + (p.id === currentPatient ? ' active' : '');
                btn.dataset.role = p.id;
                btn.innerHTML = `<span class="status-dot"></span>${p.name}<span class="badge">${p.badge}</span>`;
                btn.addEventListener('click', () => switchPatient(p.id));
                container.appendChild(btn);
            });
        }

        function renderCard(patientId) {
            const patient = patients.find(p => p.id === patientId);
            if (!patient) return;
            currentPatient = patientId;
            document.querySelectorAll('.role-item').forEach(el => {
                el.classList.toggle('active', el.dataset.role === patientId);
            });
            const card = document.getElementById('medicalCard');
            if (!card) return;
            const subDxHtml = patient.subDiagnosis.map(d => `<span class="dx-line">${d}</span>`).join('');
            const sectionsHtml = patient.sections.map(s => `
                <div class="section">
                    <div class="title">■ ${s.title}</div>
                    <div class="title-en">${s.titleEn}</div>
                    ${s.content}
                </div>
            `).join('');
            const clinicHtml = patient.clinicNote ? `<div class="clinic-note">${patient.clinicNote}</div>` : '';
            card.innerHTML = `
                <div class="medical-header">
                    <div class="title">｜ 临床心理科 · 病历单 ｜</div>
                    <div class="sub">LINGSHI GROUP · PSYCHIATRIC CLINIC</div>
                </div>
                <div class="patient-info">
                    <span class="item"><span class="label">姓名</span> <span class="value">${patient.name}</span></span>
                    <span class="item"><span class="label">年龄</span> <span class="value">${patient.age}</span></span>
                    <span class="item"><span class="label">职业</span> <span class="value">${patient.occupation}</span></span>
                    <span class="item"><span class="label">病历号</span> <span class="value">${patient.badge}</span></span>
                    <span class="item"><span class="label">就诊日期</span> <span class="value">${patient.date}</span></span>
                    <span class="item"><span class="label">主治医师</span> <span class="value">${patient.doctor}</span></span>
                </div>
                <div class="diagnosis-block">
                    <div class="main-dx">诊断：${patient.diagnosis}</div>
                    <div class="sub-dx">${subDxHtml}</div>
                </div>
                <div class="medical-body">
                    ${sectionsHtml}
                    ${clinicHtml}
                </div>
                <div class="medical-footer">
                    <span>档案状态：<span class="status">治疗中</span></span>
                    <span>下次复诊：待定</span>
                </div>
            `;
            card.style.animation = 'none';
            requestAnimationFrame(() => {
                card.style.animation = 'cardIn 0.45s ease forwards';
            });
        }

        function switchPatient(patientId) {
            if (patientId === currentPatient) { closeSidebar(); return; }
            renderCard(patientId);
            closeSidebar();
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const panel = document.getElementById('sidebarPanel');
            const overlay = document.getElementById('sidebarOverlay');
            const body = document.body;
            panel.classList.toggle('open', sidebarOpen);
            overlay.classList.toggle('show', sidebarOpen);
            body.classList.toggle('no-scroll', sidebarOpen);
        }

        function closeSidebar() {
            if (sidebarOpen) toggleSidebar();
        }

        (function() {
            try {
                const raw = localStorage.getItem('theme');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.value === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else if (parsed && parsed.value === 'light') {
                        document.documentElement.removeAttribute('data-theme');
                    }
                }
            } catch (e) {}
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            if (newTheme === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }
            localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerHTML = newTheme === 'dark' ?
                    '<span class="icon">☀️</span> 日间' :
                    '<span class="icon">🌙</span> 夜间';
            }
        }

        	// ================= BGM 背景音乐 =================
	const BGM_LIST = [
	    { name: '曲目一', src: '口哨.mp3' },
	    { name: '曲目二', src: 'bgm2.mp3' }
	    // 想几首加几首；name 显示在按钮上，src 是同目录文件名
	];
	const BGM_KEY = 'bgmState';      // 记忆：开关 + 曲目 + 进度（跨页面共享）
	const BGM_VOLUME = 0.45;         // 音量 0~1
	let bgm = null, bgmIndex = 0, bgmWantPlay = false,
	    bgmGestureBound = false, bgmFadeTimer = null;
	function bgmSave() {
	    try {
	        localStorage.setItem(BGM_KEY, JSON.stringify({
	            on: bgmWantPlay, index: bgmIndex,
	            time: bgm ? bgm.currentTime : 0
	        }));
	    } catch (e) {}
	}
	function bgmUpdateBtn() {
	    const btn = document.getElementById('bgmBtn');
	    const label = document.getElementById('bgmLabel');
	    if (!btn || !label) return;
	    if (bgmWantPlay) {
	        btn.classList.add('playing');
	        label.textContent = BGM_LIST[bgmIndex].name;
	    } else {
	        btn.classList.remove('playing');
	        label.textContent = '音乐关';
	    }
	}
	function bgmFade(to, dur, done) {          // 简易音量淡入淡出
	    clearInterval(bgmFadeTimer);
	    if (!bgm) { if (done) done(); return; }
	    const from = bgm.volume, t0 = Date.now();
	    bgmFadeTimer = setInterval(function () {
	        const k = Math.min(1, (Date.now() - t0) / dur);
	        bgm.volume = from + (to - from) * k;
	        if (k >= 1) { clearInterval(bgmFadeTimer); if (done) done(); }
	    }, 40);
	}
	// 尝试播放；被自动播放策略拦截时 → 绑定"首次任意交互即响"
	function bgmTryPlay() {
	    if (!bgm) return;
	    const p = bgm.play();
	    if (p && p.catch) {
	        p.catch(function () {
	            if (bgmGestureBound) return;
	            bgmGestureBound = true;
	            const go = function () {
	                bgm.volume = 0;
	                bgm.play().catch(function () {});
	                bgmFade(BGM_VOLUME, 900);
	                document.removeEventListener('touchstart', go);
	                document.removeEventListener('touchend', go);
	                document.removeEventListener('click', go);
	                document.removeEventListener('keydown', go);
	            };
	            document.addEventListener('touchstart', go, { passive: true });
	            document.addEventListener('touchend',   go, { passive: true });
	            document.addEventListener('click', go);
	            document.addEventListener('keydown', go);
	        });
	    }
	}
	function toggleBGM() {
	    if (!bgm) return;
	    bgmWantPlay = !bgmWantPlay;
	    if (bgmWantPlay) {
	        bgm.volume = 0;
	        bgmTryPlay();
	        bgmFade(BGM_VOLUME, 700);
	    } else {
	        bgmFade(0, 400, function () { bgm.pause(); });
	    }
	    bgmUpdateBtn();
	    bgmSave();
	}
	function nextTrack(dir) {
	    if (!bgm) return;
	    const len = BGM_LIST.length;
	    bgmIndex = (((bgmIndex + (dir || 1)) % len) + len) % len;
	    bgmWantPlay = true;                    // 切歌就是要听
	    bgm.src = BGM_LIST[bgmIndex].src;      // 换 src 自动归零进度
	    bgm.volume = 0;
	    bgmTryPlay();
	    bgmFade(BGM_VOLUME, 700);
	    bgmUpdateBtn();
	    bgmSave();
	}
	function bgmInit() {
	    let state = null;
	    try { state = JSON.parse(localStorage.getItem(BGM_KEY) || 'null'); } catch (e) {}
	    bgm = new Audio();
	    bgm.preload = 'auto';
	    bgm.volume = BGM_VOLUME;
	    const len = BGM_LIST.length;
	    bgmIndex = state && isFinite(state.index) ? ((state.index % len) + len) % len : 0;
	    bgmWantPlay = state ? !!state.on : true;    // 首次访问默认想开（首次交互时响起）
	    bgm.src = BGM_LIST[bgmIndex].src;
	    // 恢复上次进度（需等元数据加载完才能设 currentTime）
	    if (state && state.time > 0) {
	        bgm.addEventListener('loadedmetadata', function () {
	            if (bgm.duration && state.time < bgm.duration - 2) {
	                try { bgm.currentTime = state.time; } catch (e) {}
	            }
	        }, { once: true });
	    }
	    // 播完自动切下一首（列表只有一首 = 从头重播）
	    bgm.addEventListener('ended', function () { nextTrack(1); });
	    if (bgmWantPlay) {
	        bgm.volume = 0;
	        bgmTryPlay();                          // 大概率被拦 → 等首次交互
	        bgmFade(BGM_VOLUME, 900);
	    }
	    // 离开页面 / 每 5 秒存档 → 跳到其他页面自动续播
	    window.addEventListener('pagehide', bgmSave);
	    window.addEventListener('visibilitychange', function () { if (document.hidden) bgmSave(); });
	    setInterval(bgmSave, 5000);
	    bgmUpdateBtn();
	}

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('themeBtn');
            if (btn) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.innerHTML = isDark ?
                    '<span class="icon">☀️</span> 日间' :
                    '<span class="icon">🌙</span> 夜间';
            }
            const overlay = document.getElementById('sidebarOverlay');
            if (overlay) {
                overlay.addEventListener('click', closeSidebar);
            }
            renderSidebar();
            renderCard('ling');
            bgmInit();
        });
    </script>
