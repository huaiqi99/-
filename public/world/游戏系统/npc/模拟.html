<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千律州 · 模拟</title>
<style>
:root{--bg:#F0EFEB;--card:#FAF9F5;--ink:#23243B;--burg:#550F10;--klein:#222C6E;--zhu:#A8443E;--mut:#5D6B80;--gc:rgba(85,15,16,.08);--gc2:rgba(34,44,110,.07);--hair:rgba(34,44,110,.3);}
body.night{--bg:#20405F;--card:#EAE5D6;--ink:#2A2C3F;--burg:#B94A44;--klein:#5B7FA6;--zhu:#B94A44;--mut:#5D6B80;--gc:rgba(10,20,35,.28);--gc2:rgba(10,20,35,.14);--hair:rgba(42,44,63,.4);}
#qlz-app,body{font-family:Georgia,"Songti SC",serif;color:var(--ink);}
body{background:var(--bg);background-image:linear-gradient(var(--gc) 1px,transparent 1px),linear-gradient(90deg,var(--gc) 1px,transparent 1px),linear-gradient(var(--gc2) 1px,transparent 1px),linear-gradient(90deg,var(--gc2) 1px,transparent 1px);background-size:117px 117px,117px 117px,26px 26px,26px 26px;margin:0;}
#qovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,24,40,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s ease}
#qovl.on{opacity:1;pointer-events:auto}
#qlz-app .chap{max-width:1200px;margin:18px auto 0;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--klein);box-shadow:4px 5px 0 rgba(34,44,110,.15);padding:12px 18px;position:sticky;top:0;z-index:5;}
#qlz-app .no{font-family:"Courier New",monospace;font-size:12px;letter-spacing:.14em;color:var(--zhu);border:1.5px solid var(--klein);padding:4px 8px;}
#qlz-app .t{flex:1;min-width:0;}#qlz-app .t b{font-size:15.5px;letter-spacing:.1em;display:block;}#qlz-app .t i{font-style:normal;font-family:"Courier New",monospace;font-size:8.5px;letter-spacing:.16em;color:var(--mut);}
#qlz-app .ico{width:34px;height:34px;border:1.5px solid var(--klein);background:transparent;color:var(--klein);font-size:13px;cursor:pointer;font-family:inherit;}#qlz-app .ico:hover{background:var(--klein);color:#F0EFEB;}
#qlz-app .flow{max-width:1200px;margin:16px auto 0;}
#qlz-app .act{background:var(--card);border:1.5px solid var(--klein);box-shadow:4px 5px 0 rgba(34,44,110,.12);margin:24px 0 24px 26px;padding:22px 30px 18px;position:relative;animation:qfadeUp .55s ease both;}
#qlz-app .act::before{content:"";position:absolute;left:-42px;top:16px;width:9px;height:9px;background:var(--bg);border:2px solid var(--klein);}
@keyframes qfadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#qlz-app .mh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--hair);padding-bottom:6px;margin-bottom:12px;}
#qlz-app .mn{font-family:"Courier New",monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mut);}
#qlz-app .ops .op{background:transparent;border:none;color:var(--mut);font-family:"Courier New",monospace;font-size:9px;letter-spacing:.12em;cursor:pointer;padding:2px 4px;}
#qlz-app .ops .op.hot{color:var(--zhu);}
#qlz-app .abody{font-size:14.5px;line-height:2.05;}
#qlz-app .narr{margin:0 0 14px;}
#qlz-app .cue{font-family:"Songti SC",serif;color:var(--zhu);font-size:13.5px;margin:6px 0 14px;letter-spacing:.04em;}
#qlz-app .opts{border:1.5px dashed var(--klein);padding:10px 13px;background:rgba(250,249,245,.85);margin-bottom:6px;}
body.night #qlz-app .opts{background:rgba(234,229,214,.92);}
#qlz-app .ot{font-family:"Courier New",monospace;font-size:9px;letter-spacing:.2em;color:var(--mut);margin-bottom:8px;}#qlz-app .ot b{color:var(--zhu);font-weight:400;}
#qlz-app .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--hair);background:transparent;font-family:inherit;font-size:14px;padding:8px 12px;margin-bottom:6px;cursor:pointer;color:var(--ink);transition:.15s;}
#qlz-app .opt:hover{background:var(--klein);color:#F0EFEB;border-color:var(--klein);}
#qlz-app .pcmd{border:2px solid var(--burg);background:var(--card);color:var(--ink);padding:10px 13px 8px;margin:24px 0 24px 26px;position:relative;box-shadow:3px 3px 0 rgba(85,15,16,.15);}
#qlz-app .pcmd::before{content:"";position:absolute;left:-43px;top:15px;width:9px;height:9px;background:var(--bg);border:2px solid var(--burg);}
#qlz-app .pcmd .pl{color:var(--zhu);}
#qlz-app .pcmd .pl .op{color:var(--mut);}
#qlz-app .pcmd .tx{color:var(--burg);}
#qlz-app .pl{font-family:"Courier New",monospace;font-size:9.5px;letter-spacing:.18em;color:var(--zhu);display:flex;justify-content:space-between;margin-bottom:4px;}
#qlz-app .pl .op{margin-left:6px;background:transparent;border:none;cursor:pointer;}
#qlz-app .pcmd .pl .op:hover{color:var(--burg);}
#qlz-app .tx{font-size:14px;line-height:2;}#qlz-app .tx::before{content:"> ";font-family:"Courier New",monospace;color:var(--zhu);}
#qlz-app .inbar{max-width:1200px;margin:4px auto 30px;display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;border-top:1.5px solid var(--klein);z-index:3;}
#qlz-app .in{flex:1;border:1.5px solid var(--klein);background:var(--card);color:var(--ink);font-family:inherit;font-size:13.5px;padding:10px 12px;letter-spacing:.03em;}
#qlz-app .go{border:1.5px solid var(--klein);background:var(--klein);color:#F0EFEB;font-family:inherit;font-size:13px;letter-spacing:.3em;padding:0 18px;cursor:pointer;}
#qlz-app .go:hover{background:var(--zhu);border-color:var(--zhu);}
#qlz-app .go:disabled{opacity:.45;cursor:wait;}
#qlz-app .sys{margin:18px 0 18px 26px;text-align:center;}
#qlz-app .sys span{font-family:"Courier New",monospace;font-size:10.5px;letter-spacing:.18em;color:var(--mut);border-bottom:1px dashed var(--hair);padding-bottom:3px;}
#qlz-app .typing{margin:18px 0 18px 26px;text-align:center;font-family:"Courier New",monospace;font-size:10.5px;letter-spacing:.24em;color:var(--klein);animation:qblink 1.4s ease infinite;}
@keyframes qblink{0%,100%{opacity:.45}50%{opacity:1}}
#qlz-app .side{position:fixed;top:0;bottom:0;width:300px;background:var(--card);border:1.5px solid var(--klein);padding:18px 16px;z-index:50;font-size:12px;overflow-y:auto;transition:transform .28s ease;}
#qlz-app .side.r{right:0;transform:translateX(100%);box-shadow:-6px 0 0 rgba(34,44,110,.12);}
#qlz-app .side.l{left:0;transform:translateX(-100%);box-shadow:6px 0 0 rgba(34,44,110,.12);}
#qlz-app .side.open{transform:none;}
#qlz-app .side .st{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.3em;color:var(--mut);border-bottom:2.5px dashed var(--hair);padding-bottom:10px;margin-bottom:8px;}
#qlz-app .sitem{display:flex;justify-content:space-between;align-items:center;padding:11px 6px;border-bottom:1.5px dashed var(--hair);font-size:13px;letter-spacing:.08em;cursor:pointer;}
#qlz-app .sitem:hover{color:var(--klein);}
#qlz-app .sitem.cur{color:var(--zhu);}
#qlz-app .sitem .arr{font-family:"Courier New",monospace;font-size:9px;letter-spacing:.14em;color:var(--mut);}
#qlz-app .favhead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px;}
#qlz-app .favhead span{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.24em;color:var(--mut);}
#qlz-app .favhead b{font-size:22px;color:var(--zhu);font-family:Georgia,serif;}
#qlz-app .favbar{height:9px;border:1.5px solid var(--zhu);margin:10px 0 8px;position:relative;background:rgba(250,249,245,.8);}
body.night #qlz-app .favbar{background:rgba(234,229,214,.7);}
#qlz-app .favbar i{position:absolute;left:0;top:0;bottom:0;background:var(--zhu);transition:width .5s ease;}
#qlz-app .favstage{font-family:"Songti SC",serif;font-size:12px;letter-spacing:.2em;color:var(--burg);margin-bottom:8px;}
#qlz-app .lv{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px dashed var(--hair);font-size:11.5px;color:var(--mut);}
#qlz-app .lv.cur{color:var(--burg);font-weight:bold;}
#qlz-app .lv i{font-family:"Courier New",monospace;font-style:normal;font-size:9px;}
#qlz-app .fbtn{display:block;width:100%;margin-top:12px;padding:9px;border:1.5px dashed var(--klein);background:transparent;color:var(--klein);font-family:inherit;font-size:12px;letter-spacing:.1em;cursor:pointer;}
#qlz-app .fbtn:hover{background:var(--klein);color:#F0EFEB;}
#qlz-app .fbtn i{display:block;font-style:normal;font-family:"Courier New",monospace;font-size:8.5px;color:var(--mut);margin-top:3px;letter-spacing:.06em;}
body.night #qlz-app .fbtn:hover i{color:#EAE5D6;}
#qlz-app .fbtn.danger{border-color:var(--zhu);color:var(--zhu);}
#qlz-app .fbtn.danger:hover{background:var(--zhu);color:#F0EFEB;}
#qlz-app .fnote{margin-top:12px;font-family:"Courier New",monospace;font-size:9px;letter-spacing:.14em;color:var(--mut);border-top:1px dashed var(--hair);padding-top:8px;}
#qlz-app .qnotice{max-width:1200px;margin:18px auto 0;border:1.5px dashed var(--klein);background:var(--card);padding:12px 16px;font-size:12px;line-height:1.9;color:var(--text-secondary,#4A4C63);}
#qlz-app .qnotice b{color:var(--klein);}
#qlz-app .qnotice .ncl{float:right;background:transparent;border:none;color:var(--mut);cursor:pointer;font-family:"Courier New",monospace;font-size:11px;}
#qlz-app .backcur{text-align:center;margin:14px 0 24px 26px;}
#qlz-app .backbtn{padding:7px 16px;border:1.5px solid var(--klein);background:var(--card);color:var(--klein);font-family:inherit;font-size:12px;cursor:pointer;}
@media(max-width:700px){
  #qlz-app .chap{margin:10px 8px 0;padding:9px 12px;}
  #qlz-app .act{margin:16px 0 16px 4px;padding:14px 15px 12px;}
  #qlz-app .pcmd{margin:16px 0 16px 4px;padding:9px 11px 7px;}
  #qlz-app .pcmd::before,#qlz-app .act::before{left:-24px;}
  #qlz-app .inbar{margin:4px 10px 22px;gap:7px;}
  #qlz-app .in{font-size:14px;padding:11px 12px;}
  #qlz-app .go{padding:0 16px;letter-spacing:.15em;}
  #qlz-app .side{width:70vw;max-width:258px;padding:14px 12px;}
}
</style>
</head>
<body>
<div id="qlz-app">
 
  <!-- 入演须知（可收起，关一次不再弹） -->
  <div class="qnotice" id="qnotice">
    <button class="ncl" id="qnoticeClose">✕ 收起</button>
    ◈ <b>入演须知</b> —— 你将以 <b>怀榆</b> 的视角演出，直接输入想做的事即可，无需格式。每轮附「走位参考」，仅为建议。<br>
    ◈ 每章设必经节点与轮数上限，节点齐后自动进入下一章；右上「☰」可校准好感/删档，左侧「目录」可回看已完结章节。<br>
    ◈ 内容由 AI 生成，可能出现剧情崩坏或 OOC；对演出不满意可点该卡「↻ 重新生成」。本模拟为《业焰之国》二次创作，密钥前往<a href="./设置.html" style="color:var(--klein)">设置页</a>配置。
  </div>
 
  <!-- 顶栏：左=章节号+章节标题，右=汉堡菜单 -->
  <div class="chap">
    <span class="no" id="qno">CH.01</span>
    <div class="t"><b id="qtitle">加载中…</b><i id="qsub">QIANLVZHOU // REC</i></div>
    <button class="ico" id="qtocBtn" title="菜单">☰</button>
  </div>
 
  <!-- 剧情流（对话卡动态插入这里） -->
  <div class="flow" id="qflow"></div>
 
  <!-- 底部输入栏 -->
  <div class="inbar">
    <input class="in" id="qin" placeholder="今日欲行何事？">
    <button class="go" id="qgo">呈报</button>
  </div>
 
  <!-- 右侧栏：系统菜单 -->
  <div class="side r" id="qside-r">
    <div class="st">系 统 · MENU</div>
    <div class="sitem" id="qmToc"><span>目录</span><span class="arr">← 左侧展开</span></div>
    <div class="sitem" id="qmNight"><span>日间 / 夜间</span><span class="arr">切换</span></div>
    <div class="sitem"><span>字体大小</span><span style="display:flex;gap:6px;"><button class="op" id="qfminus">A－</button><button class="op" id="qfplus">A＋</button></span></div>
    <div class="sitem" id="qmRound"><span>对话轮数</span><span class="arr" id="qround">— / —</span></div>
    <div class="sitem danger" id="qmReset"><span>删档重来</span><span class="arr">清空全部存档</span></div>
    <div id="qseal"></div>
    <button class="backbtn" id="qback">◂ 返回</button>
  </div>
 
  <!-- 左侧栏：章节目录 -->
  <div class="side l" id="qside-l">
    <div class="st">目 录 · CATALOG</div>
    <div id="qtoc"><div class="sitem dim"><span>章节包加载中</span></div></div>
  </div>
 
</div>
 
<!-- 侧栏暗罩 -->
<div id="qovl"></div>
 
<script>
/* 入演须知：本次收起后不再弹 */
try{ if(localStorage.getItem('gzd_qlz_notice_closed')==='1') document.getElementById('qnotice').style.display='none'; }catch(e){}
</script>
<!-- 数据文件须先于引擎加载。若改名换目录，直接改下面几行 src -->
<script src="./章节包/章节包1.js"></script>
<script src="./回忆AI.js"></script>
<script src="./章节包/章节包1.js"></script>
<script src="./模拟AI.js"></script>
<script src="./核心.js"></script>
</body>
</html>
