<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F0EFEB">
<title>千律州模拟器</title>
<script>
/* ===== 保险丝：壳只能当最外层 ===== */
if(window.self!==window.top){try{top.location.replace(location.pathname+location.search);}catch(e){}}
/* ===== 进壳先按用户主题上底色（防白闪） ===== */
var __t='light';
try{var __r=localStorage.getItem('theme');
if(__r){try{var __p=JSON.parse(__r);if(__p&&__p.value)__t=__p.value;}catch(e){}}}catch(e){}
if(__t==='dark')document.documentElement.setAttribute('data-t','dark');
</script>
<style>
html,body{margin:0;height:100%;background:#F0EFEB;}
html[data-t="dark"],html[data-t="dark"] body{background:#0C365A;}
#iframeBox{position:fixed;inset:0;border:0;width:100%;height:100%;background:transparent;}
/* 左下角 dock：全站唯一音乐开关 */
#bgmDock{position:fixed;left:12px;bottom:12px;z-index:9999;
  background:rgba(250,249,245,.92);color:#23243B;border:2px solid #222C6E;
  font-family:"Fusion Pixel","Zpix",monospace,sans-serif;font-size:.7rem;letter-spacing:2px;
  padding:8px 14px;cursor:pointer;box-shadow:3px 4px 0 rgba(34,44,110,.32);user-select:none;}
html[data-t="dark"] #bgmDock{background:rgba(12,54,90,.92);color:#D6D4C2;border-color:#7C9CB3;}
</style>
</head>
<body>
<iframe id="iframeBox" title="千律州"></iframe>
<div id="bgmDock" title="点击 暂停/继续">🔇 音乐</div>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('iframeBox');
  var audio=new Audio();audio.volume=.7;audio.preload='auto';
  var LIST=[{name:'音乐1',src:'音乐1.mp3'},{name:'音乐2',src:'音乐2.mp3'},{name:'音乐3',src:'音乐3.mp3'}];
  var idx=0,want=false,cur={url:'',name:''},fadeT=null,restored=false,__lastThemeColor='';
  var KEY='qlz_bgm';
 
  function findTrack(url,name){
    for(var i=0;i<LIST.length;i++){
      if(url&&LIST[i].src===url)return LIST[i];
      if(!url&&name&&LIST[i].name===name)return LIST[i];
    }
    return {url:url||'',name:name||'音乐'};
  }
  function dockText(){
    document.getElementById('bgmDock').textContent=want?('♪ '+cur.name):'🔇 音乐';
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({on:want,url:cur.url,name:cur.name,
      index:LIST.indexOf(findTrack(cur.url,cur.name)),time:audio.currentTime||0}));}catch(e){}
  }
  function playTrack(url,name){
    cur={url:url,name:name||'音乐'};want=true;restored=true;
    audio.src=url;tryPlay();dockText();save();
  }
  function pause(){want=false;audio.pause();dockText();save();}
  function resume(){want=true;tryPlay();dockText();save();}
  function toggle(){want?pause():resume();}
  function setTheme(dark){
    document.body.style.background=dark?'#0C365A':'#F0EFEB';
    setThemeColor(dark?'#0C365A':'#F0EFEB');
  }
  function tryPlay(){var p=audio.play();if(p&&p.catch)p.catch(function(){});}
  function fade(to,dur,done){clearInterval(fadeT);var from=audio.volume,t0=Date.now();
    fadeT=setInterval(function(){var k=Math.min(1,(Date.now()-t0)/dur);audio.volume=from+(to-from)*k;
      if(k>=1){clearInterval(fadeT);if(done)done();}},40);}
  function swapMeta(color){
    var m=document.createElement('meta');m.setAttribute('name','theme-color');m.setAttribute('content',color);
    document.head.appendChild(m);
    var all=document.querySelectorAll('meta[name="theme-color"]');
    for(var i=0;i<all.length-1;i++)all[i].remove();
  }
  function setThemeColor(color){
    swapMeta(color);
    setTimeout(function(){if(__lastThemeColor!==color)return;swapMeta(color);},150);
  }
  function load(href){
    try{if(new URL(href,location.href).pathname===frame.contentWindow.location.pathname)return;}catch(e){}
    frame.src=href;
    try{history.replaceState(null,'','#'+encodeURIComponent(href.replace(/^\.\//,'')));}catch(e){}
  }
 
  /* ===== 内页消息总线 ===== */
  window.addEventListener('message',function(ev){
    var msg=ev.data||{};
    if(msg.type==='qlz:gesture'){if(want&&audio.paused){tryPlay();fade(.7,800);}return;}
    if(msg.type==='qlz:track'&&(msg.url||msg.blob)){
      var u=msg.url;
      if(msg.blob){try{u=URL.createObjectURL(msg.blob);}catch(e){u=msg.url;}}
      playTrack(u,msg.name||'音乐');return;}
    if(msg.type==='qlz:pause'){pause();return;}
    if(msg.type==='qlz:stop'){want=false;audio.pause();try{audio.currentTime=0;}catch(e){}dockText();save();return;}
    if(msg.type==='qlz:resume'){resume();return;}
    if(msg.type==='qlz:toggle'){toggle();return;}
    if(msg.type==='qlz:theme'){setTheme(!!msg.night);return;}
    if(msg.type==='qlz:nav'&&msg.href){load(msg.href);return;}
  });
 
  /* ===== 启动 ===== */
  (function(){
    var st=null,startPage='系统.html';
    try{var h=decodeURIComponent(location.hash.replace(/^#/,''));if(h)startPage=h;}catch(e){}
    try{var s=JSON.parse(localStorage.getItem(KEY)||'null');
      if(s){want=s.on!==false&&!!(s.url||s.name);
        if(isFinite(s.index))idx=((s.index%LIST.length)+LIST.length)%LIST.length;
        if(s.url)cur={url:s.url,name:s.name||'音乐'};
        else if(s.name){var t0=findTrack('',s.name);cur={url:t0.src,name:t0.name};}
      }}catch(e){}
    audio.src=cur.url;setTheme(__t==='dark');
    if(!cur.url){cur={url:LIST[idx].src,name:LIST[idx].name};}
    dockText();
    frame.src=startPage;
 
    audio.addEventListener('loadedmetadata',function(){
      try{if(st&&isFinite(st.time)&&st.time>0&&st.time<(audio.duration||1e9)-2)audio.currentTime=st.time;}catch(e){}
    },{once:true});
    audio.addEventListener('error',function(){
      if(!want)return;var d=document.getElementById('bgmDock'),old=d.textContent;
      d.textContent='🔇 无法播放';setTimeout(function(){dockText();},2500);});
    setInterval(save,5000);
    window.addEventListener('pagehide',save);
 
    document.getElementById('bgmDock').onclick=function(){toggle();};
 
    window.QLZ_SHELL=true;
    window.QLZ_Shell={load:load,playTrack:playTrack,pause:pause,resume:resume,setTheme:setTheme};
  })();
})();
</script>
</body>
</html>
