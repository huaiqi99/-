<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>设置 · 千律州模拟器</title>
<style>
:root{--bg:#F4F1E8;--ink:#20242B;--card:#FFFDF6;--line:#20242B;--line-soft:rgba(32,36,43,.35);--banner:#1E3A8A;--banner-ink:#F4F1E8;--ink-2:rgba(32,36,43,.62);}
body{background:var(--bg);color:var(--ink);font-family:"Fusion Pixel","Zpix",monospace,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;}
.panel{max-width:520px;width:calc(100% - 32px);background:var(--card);border:2px solid var(--line);box-shadow:6px 8px 0 var(--line-soft);padding:28px 26px;}
h1{font-size:1.1rem;letter-spacing:6px;margin:0 0 6px;}
small{display:block;font-size:.6rem;letter-spacing:3px;color:var(--ink-2);margin-bottom:18px;}
p{font-size:.72rem;letter-spacing:2px;line-height:2.1;color:var(--ink-2);border:2px dashed var(--line-soft);padding:14px 16px;}
a.back{display:block;text-align:center;margin-top:18px;text-decoration:none;background:var(--banner);color:var(--banner-ink);border:2px solid var(--line);padding:11px 16px;font-size:.78rem;letter-spacing:4px;box-shadow:3px 4px 0 var(--line-soft);}
a.back:hover{transform:translate(-2px,-3px);box-shadow:6px 8px 0 var(--line-soft);}
</style>
</head>
<body>
<div class="panel">
  <h1>设 置</h1>
  <small>SETTINGS · UNDER CONSTRUCTION</small>
  <p>※ 施工中：API 密钥填写、音乐偏好、存档管理等将陆续入驻。<br>※ 此页骨架仅为占位，功能由站长自定义填充。</p>
  <a class="back" href="./系统.html">◂ 返回系统终端</a>
</div>
</body>
</html>
