<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content">
<title>千律州 · 信匣</title>
<style>
/* ═══ 千律州 · 信匣 V4 ═══
   B 信笺折角气泡 / 动效①折角入场②碾墨③呈阅印 / 操作钮三案(临时切换器)
   右上角 ☰ 菜单侧栏：日夜/备注/删除好友/查找对话/资料页联动预留
   AI 接线：./通讯AI.js（MAIL_AI.reply，本页只调这一个口子） */
:root{
  --bg:#F0EFEB;--card:#FAF9F5;--ink:#23243B;--burg:#550F10;--klein:#222C6E;
  --zhu:#A8443E;--mut:#5D6B80;--hair:rgba(34,44,110,.35);
  --gc:rgba(85,15,16,.08);--gc2:rgba(34,44,110,.07);
  --shadow:4px 4px 0 rgba(34,44,110,.14);
  --serif:Georgia,"Times New Roman","Songti SC",serif;
  --mono:"Courier New",monospace;
}
body.night{
  --bg:#20405F;--card:#EAE5D6;--ink:#2A2C3F;--burg:#B94A44;--klein:#5B7FA6;
  --zhu:#B94A44;--mut:#5D6B80;--hair:rgba(42,44,63,.4);
  --gc:rgba(10,20,35,.28);--gc2:rgba(10,20,35,.14);
  --shadow:4px 4px 0 rgba(10,20,35,.35);
}
/* v3 情绪色：纸面日夜间恒浅（#FAF9F5/#EAE5D6），故共用一套深色板 */
:root{--e-angry:#8E332D;--e-sad:#3D5170;--e-soft:#4A7590}
/* v3 信笺落款：气泡内底部，细分线+mono小字（时间左·情绪字右），贴底边 */
.mu .bub .sig{margin-top:3px;border-top:1px solid var(--hair);padding-top:2px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--mut);display:flex;justify-content:space-between;align-items:baseline;line-height:1.4}
.mu .bub .sig .md{letter-spacing:.08em}
.mu .bub .sig .md.c-angry{color:var(--e-angry)}
.mu .bub .sig .md.c-sad{color:var(--e-sad)}
.mu .bub .sig .md.c-soft{color:var(--e-soft)}
.mu .bub.hassig{padding-bottom:3px}
/* v3 情绪染色：来信左边线+右下折角同染（静=默认克莱因不动） */
.mu.in.e-angry .bub{border-left-color:var(--e-angry)}
.mu.in.e-sad .bub{border-left-color:var(--e-sad)}
.mu.in.e-soft .bub{border-left-color:var(--e-soft)}
.mu.in.e-angry .bub::after{border-color:transparent transparent var(--e-angry) transparent}
.mu.in.e-sad .bub::after{border-color:transparent transparent var(--e-sad) transparent}
.mu.in.e-soft .bub::after{border-color:transparent transparent var(--e-soft) transparent}

/* ═══ 桌边小像（罗修桌宠移植）：可点击可拖动，位置记忆，侧栏可关 ═══ */
#desk-pet{position:fixed;bottom:0;right:8px;z-index:50;width:120px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transform-origin:bottom center;-webkit-tap-highlight-color:transparent;touch-action:none;will-change:transform;--drag-x:0px;--drag-y:0px;transform:translate3d(var(--drag-x),var(--drag-y),0)}
body.night #desk-pet{filter:brightness(.9)}
#desk-pet .char-img{width:100%;display:block;pointer-events:none;transition:filter .25s ease}
#desk-pet.dragging{cursor:grabbing;transform:translate3d(var(--drag-x),var(--drag-y),0) scale(1.04)}
#desk-pet.dragging .char-img{filter:drop-shadow(0 10px 12px rgba(0,0,0,.3))}
#desk-pet.q-squash{animation:qSquash .32s cubic-bezier(.34,1.56,.64,1) both}
@keyframes qSquash{0%{transform:translate3d(var(--drag-x),var(--drag-y),0) scale(1,1) translateY(0)}30%{transform:translate3d(var(--drag-x),var(--drag-y),0) scale(.96,.9) translateY(3px)}100%{transform:translate3d(var(--drag-x),var(--drag-y),0) scale(1,1) translateY(0)}}
#desk-pet.hidden{display:none!important}
@media (max-width:760px){#desk-pet{width:88px}}

/* swipe 多版本细线（B案小样原样）：仅多版本时渲染，单版本零占位 */
.swB{margin-top:4px;border-top:1px solid var(--hair);padding-top:3px;display:flex;justify-content:center;align-items:center;gap:12px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--mut)}
.swB .ar{cursor:pointer;user-select:none;padding:0 4px}
.swB .ar:hover{color:var(--klein)}
.swB .cur{color:var(--klein)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--serif);color:var(--ink);background:var(--bg);
  background-image:
    linear-gradient(var(--gc) 1px,transparent 1px),
    linear-gradient(90deg,var(--gc) 1px,transparent 1px),
    linear-gradient(var(--gc2) 1px,transparent 1px),
    linear-gradient(90deg,var(--gc2) 1px,transparent 1px);
  background-size:117px 117px,117px 117px,26px 26px,26px 26px;
  overflow:hidden;
}
b,i{font-style:normal}
button{font-family:inherit;cursor:pointer}
/* ── 整体：全窗左名册+右讯道 ── */
.app{display:flex;height:100vh;height:100dvh;padding:14px;gap:14px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1.5px solid var(--klein);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
#roster{width:340px;flex:none}
/* ── 名册 ── */
.rhead{padding:14px 16px 10px;border-bottom:2.5px dashed var(--hair)}
.rhead .chip{display:inline-block;background:var(--zhu);color:#F0EFEB;font-family:var(--mono);font-size:9px;letter-spacing:.22em;padding:3px 8px;margin-bottom:6px}
.rhead .t{display:flex;align-items:baseline;gap:8px}
.rhead .t b{font-size:20px;letter-spacing:.35em}
.rhead .t i{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--mut)}
/* 返回系统页面：挂在信匣标题右侧，全端可见 */
.sysback{margin-left:auto;border:1.5px solid var(--klein);background:transparent;color:var(--klein);font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:4px 9px;cursor:pointer;white-space:nowrap}
.sysback:hover{background:var(--klein);color:#F0EFEB}
.clist{flex:1;overflow-y:auto}
.contact{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1.5px dashed var(--hair);cursor:pointer;border-left:3px solid transparent;transition:.15s}
/* ── 置顶：名字前一枚mono小签，排序置顶（JS排） ── */
.contact .pinchip{font-family:var(--mono);font-size:7.5px;letter-spacing:.15em;color:var(--klein);border:1px solid var(--klein);padding:1px 4px;flex:none}
/* ── 特别关心（定稿）：朱砂双实环印，名字标红 ── */
.contact.care .seal{border:1.5px solid var(--zhu);outline:1.5px solid var(--zhu);outline-offset:2px;color:var(--zhu)}
.contact.care .n{color:var(--zhu)}
.contact:hover{background:var(--paper,#F4F2EA)}
body.night .contact:hover{background:rgba(42,44,63,.08)}
.contact.on{border-left-color:var(--zhu);background:var(--paper,#F4F2EA)}
body.night .contact.on{background:rgba(42,44,63,.08)}
.seal{width:36px;height:36px;flex:none;border:1.5px dashed var(--zhu);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--zhu);background:transparent;position:relative;overflow:hidden}
/* 头像图：与页面同目录的「头像」文件夹里放 角色名.png/jpg，找不到自动退回字章 */
.seal img.sealimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cinfo{flex:1;min-width:0}
.cinfo .n{font-size:14px;letter-spacing:.08em}
.cinfo .n span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--mut);margin-left:6px}
.cinfo .p{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--zhu)}
.rfoot{border-top:2.5px dashed var(--hair);padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
.rfoot i{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--mut)}
.ico{width:32px;height:32px;border:1.5px solid var(--klein);background:transparent;color:var(--klein);font-size:13px;cursor:pointer}
.ico:hover{background:var(--klein);color:#F0EFEB}
/* ── 讯道 ── */
#chat{flex:1;min-width:0}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2.5px dashed var(--hair)}
/* 顶栏返回：桌面隐藏（名册与讯道并排，此按钮冗余）；手机端由 media query 放回 */
.chead .back{display:none;border:none;background:none;font-size:13px;letter-spacing:.1em;color:var(--klein);cursor:pointer;padding:4px 6px;white-space:nowrap}
.chead .seal{cursor:pointer;width:40px;height:40px;font-size:17px}
.chead .seal:hover{background:rgba(168,68,62,.08)}
.who{flex:1;min-width:0}
.who b{font-size:15px;letter-spacing:.08em}
.who b span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--mut);margin-left:7px}
.who i{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--mut);margin-top:3px}
#msgs{flex:1;overflow-y:auto;padding:18px 16px 10px;display:flex;flex-direction:column}
.day{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--mut);margin:8px 0}
.day::before,.day::after{content:"── ";letter-spacing:0}
.day::after{content:" ──"}
/* ── 中场提示（微信撤回式） ── */
.sysnote{display:block;width:fit-content;max-width:86%;margin:10px auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--zhu);border:1.5px dashed var(--zhu);padding:5px 13px;background:transparent;text-align:center;cursor:default}
/* ── 消息：无头像，mono标签+折角纸卡 ── */
.mu{max-width:80%;margin:7px 0;position:relative;animation:rise .32s ease both}
.mu.in{align-self:flex-start}
.mu.out{align-self:flex-end;margin-left:auto}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mu .lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--mut);margin-bottom:4px}
.mu.out .lbl{text-align:right}
.mu .bub{position:relative;font-size:13.5px;line-height:1.95;padding:8px 13px;border:1.5px solid var(--hair);background:var(--card);word-break:break-word;white-space:pre-wrap;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* B 信笺折角：来信=白纸+右下折角；自己=克莱因蓝实底+左上朱砂角 */
/* 括号分层配色：来信白纸=朱砂；己方蓝底=浅金（日夜通用，蓝底上朱砂看不清） */
.mu .bub .pb{color:var(--zhu)}
.mu.out .bub .pb2{color:#E9C97E}
/* 行距统一：每行自带一点呼吸感，AI输出\n还是\n\n都一样 */
.mu .bub .bl{margin:0 0 4px}
.mu .bub .bl:last-child{margin-bottom:0}
.mu.in .bub{border-left:3px solid var(--klein);box-shadow:3px 3px 0 rgba(34,44,110,.12)}
body.night .mu.in .bub{box-shadow:3px 3px 0 rgba(10,20,35,.35)}.mu.in .bub::after{content:"";position:absolute;right:0;bottom:0;border-style:solid;border-width:0 0 13px 13px;border-color:transparent transparent var(--klein) transparent;opacity:.85}
.mu.out .bub{background:var(--klein);color:#F0EFEB;border-color:var(--klein);box-shadow:3px 3px 0 rgba(85,15,16,.18)}
.mu.out .bub::after{content:"";position:absolute;left:0;top:0;border-style:solid;border-width:13px 13px 0 0;border-color:var(--zhu) transparent transparent transparent}
/* 动效①：折角入场——卡先落，角后折 */
.mu .bub::after{animation:fold .25s ease .22s both}
@keyframes fold{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:.85}}
.mu.in .bub::after{animation-name:fold}
.mu.out .bub::after{animation-name:fold}
/* ── ② 碾墨指示 ── */
.grind{width:fit-content;margin:13px 0;padding:7px 14px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--mut);border:1.5px dashed var(--hair)}
.grind i{display:inline-block;animation:dotf 1.2s infinite}
.grind i:nth-child(2){animation-delay:.2s}.grind i:nth-child(3){animation-delay:.4s}
@keyframes dotf{0%,60%,100%{opacity:.25}30%{opacity:1}}
/* ── 操作钮：浮出条（双击讯文弹出，稳态显示） ── */
.ops{display:none;gap:8px;margin-top:5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em}
.mu.sel .ops{display:flex}
.ops{position:absolute;top:100%;left:0;background:var(--card);border:1.5px solid var(--hair);box-shadow:3px 3px 0 rgba(34,44,110,.15);padding:4px 9px;margin-top:4px;z-index:5;white-space:nowrap}
.mu.out .ops{left:auto;right:0}
.ops .o{border:none;background:none;color:var(--mut);cursor:pointer;padding:2px 0;letter-spacing:.1em}
.ops .o:hover{color:var(--klein)}
.ops .o.danger:hover{color:var(--zhu)}
/* 编辑态 */
.mu textarea{width:100%;min-height:60px;font-family:inherit;font-size:13px;line-height:1.9;border:1.5px solid var(--klein);background:var(--bg);padding:7px 10px;resize:vertical}
.mu .ebtns{margin-top:5px;display:flex;gap:8px}
.mu .ebtns button{font-family:var(--mono);font-size:9px;letter-spacing:.1em;border:1.5px solid var(--klein);background:var(--card);color:var(--klein);padding:3px 9px;cursor:pointer}
/* ── 输入条 ── */
.inputbar{display:flex;gap:9px;padding:10px 14px;border-top:2.5px dashed var(--hair);align-items:center}
.inputbar .nt{display:none}
.inputbar input,.inputbar textarea{flex:1;border:1.5px solid var(--klein);background:var(--card);color:var(--ink);font-family:inherit;font-size:13px;padding:9px 12px;letter-spacing:.04em;min-width:0}
.inputbar input:focus,.inputbar textarea:focus{outline:none;border-color:var(--zhu)}
/* 讯文框：可换行的textarea，外观尺寸与旧版输入框完全一致（单行高，多行时内部滚动） */
.inputbar textarea{resize:none;height:37px;line-height:1.5;overflow-y:auto;display:block}
/* v4 表情渲染：来信文字+表情=表情独立裸图块（气泡外下方）；纯表情=裸图 */
.emoSolo{margin-top:6px}
.emoSolo .emo{width:96px;height:96px;object-fit:contain;display:block}
.bub .emo{width:64px;height:64px;object-fit:contain;display:block;margin-top:6px}
/* 纯表情消息=裸图：无框无底无阴影无折角，透明底直接贴在聊天纸面上 */
.mu .bub.emoOnly{padding:0;border:none;background:none;box-shadow:none}
.mu .bub.emoOnly::after{display:none}
.mu.in .bub.emoOnly{border-left:none}
.mu .bub.emoOnly .emo{width:104px;height:104px;margin-top:0}
@media (max-width:760px){ .bub .emo{width:56px;height:56px} .bub.emoOnly .emo{width:92px;height:92px} .emoSolo .emo{width:84px;height:84px} }
.emoBtn{flex:0 0 auto;height:37px;min-width:37px;border:1.5px solid var(--klein);background:var(--card);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;border-radius:0;letter-spacing:0;padding:0 6px}
.emoBtn:active{background:var(--zhu);color:#fff}
.emoBtn.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
#emoPanel{position:fixed;right:12px;bottom:74px;z-index:60;border:1.5px solid var(--klein);background:var(--card);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:10px 12px 12px;max-width:246px}
#emoPanel.hidden{display:none}
#emoPanel .epTit{font-size:10px;letter-spacing:.18em;color:var(--mut);margin-bottom:8px;font-family:var(--mono)}
#emoPanel .epGrid{display:grid;grid-template-columns:repeat(3,64px);gap:8px;max-height:220px;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
#emoPanel .epGrid::-webkit-scrollbar{width:3px}
#emoPanel .epGrid::-webkit-scrollbar-thumb{background:var(--hair)}
#emoPanel .epGrid img{width:64px;height:64px;object-fit:contain;cursor:pointer;background:rgba(0,0,0,.05);transition:transform .12s ease}
#emoPanel .epGrid img:active{transform:scale(.92)}
@media (max-width:760px){
  #emoPanel{left:0;right:0;bottom:62px;max-width:none;border-left:none;border-right:none;padding:12px 14px 14px}
  #emoPanel .epGrid{grid-template-columns:repeat(3,1fr);gap:10px;max-height:216px}
  #emoPanel .epGrid img{width:100%;max-width:96px;height:auto;aspect-ratio:1;margin:0 auto}
}
textarea#msgInput{height:37px}
.send{border:none;background:var(--klein);color:#F0EFEB;font-family:var(--mono);font-size:10px;letter-spacing:.18em;padding:10px 11px 10px 14px;cursor:pointer}
.send:hover{background:var(--zhu)}
/* ── 右上角菜单侧栏（同模拟页） ── */
#menuBtn{flex:none}
#mside{position:fixed;top:0;right:-300px;width:280px;max-width:82vw;height:100vh;height:100dvh;background:var(--card);border-left:1.5px solid var(--klein);z-index:31;transition:right .28s ease;display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto}
#mside.open{right:0}
/* 侧栏暗罩：开菜单时主内容压暗一层（引渡人同款），点罩收起 */
#movl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,24,40,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .28s ease}
#movl.on{opacity:1;pointer-events:auto}
#mside .st{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--mut);border-bottom:2.5px dashed var(--hair);padding-bottom:10px;margin-bottom:8px}
.sitem{display:flex;justify-content:space-between;align-items:center;padding:11px 6px;border-bottom:1.5px dashed var(--hair);font-size:13px;letter-spacing:.08em;cursor:pointer}
.sitem:hover{color:var(--klein)}
.sitem .arr{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--mut)}
.sitem.danger{color:var(--zhu)}
/* 菜单内返回系统页：背包页同款描边按钮 */
.sitem.miBack{border:1.5px solid var(--klein);margin:8px 0 4px;padding:9px 12px;color:var(--klein);background:transparent;width:100%;font-family:inherit;font-size:13px;letter-spacing:.08em;cursor:pointer}
.sitem.miBack:hover{background:var(--klein);color:#F0EFEB}
#findBox{margin:8px 0;padding:8px 10px;border:1.5px solid var(--klein);background:var(--card);color:var(--ink);font-family:inherit;font-size:12px;width:100%}
#mside .hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--mut);margin:8px 0 2px}
.sitem .plus{border:1.5px solid var(--klein);background:transparent;color:var(--klein);font-size:11px;padding:2px 9px;cursor:pointer}
.sitem .plus:hover{background:var(--klein);color:#F0EFEB}
.backbtn{margin-top:14px;border:1.5px solid var(--klein);background:transparent;color:var(--klein);width:100%;padding:8px;font-size:12px;letter-spacing:.3em;cursor:pointer}
.backbtn:hover{background:var(--klein);color:#F0EFEB}
/* ── 人物简介浮层 ── */
#pfile{position:fixed;inset:0;background:rgba(20,28,48,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#pfile.open{display:flex}
#pfile .pf{background:var(--card);border:1.5px solid var(--klein);box-shadow:6px 6px 0 rgba(34,44,110,.2);max-width:360px;width:100%;padding:20px 20px 16px;position:relative;animation:rise .25s ease both}
#pfile .seal{width:88px;height:88px;font-size:26px;margin-bottom:10px;border-radius:0} /* 简介卡头像：放大+方框，图大了就不锐了 */
#pfile .pf h3{font-size:17px;letter-spacing:.15em}
#pfile .pf h3 span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--mut);margin-left:8px}
#pfile .pf .row{display:flex;gap:8px;font-size:12px;padding:7px 0;border-bottom:1.5px dashed var(--hair)}

<script>
/* ═══ 名册数据：added=已入信匣；pending=待资料页联动添加；
   pin=置顶名单；care=特别关心名单（菜单里切换） ═══ */
var K_ROSTER='gzd_qlz_mail_roster';
function loadRoster(){
  /* 默认全角色；旧存档存在时合并（新增角色自动补进，不丢玩家自己的置顶/关心/备注） */
  var DEF=['段深泉','系统','瑞秋','黎昭','祝焱','凝淼','叶戈尔','阿列克谢'];
  try{ var d=JSON.parse(localStorage.getItem(K_ROSTER)); if(d&&d.added){
    d.notes=d.notes||{}; d.pending=d.pending||[]; d.pin=d.pin||[]; d.care=d.care||[];
    DEF.forEach(function(n){ if(d.added.indexOf(n)<0) d.added.push(n); });
    return d;
  } }catch(e){}
  return { added:DEF, pending:['神谕院','黑鼠帮'], notes:{}, pin:[], care:['段深泉'] };
}
function saveRoster(r){ try{ localStorage.setItem(K_ROSTER,JSON.stringify(r)); }catch(e){} }
var roster=loadRoster(), cur='段深泉';
 
/* ═══════════════════════════════════════════════════════════════
   ★ 添加新角色 · 三步走（以后加人照这个改，别的地方不用动） ★
 
   第一步：进名册。
     在下面 loadRoster() 的默认名单里，把角色名加进 added（直接显示）
     或 pending（隐藏，等资料页联动/手动添加）。
 
   第二步：写档案。
     在 INFO 里加一段 '角色名':{...}，简介浮层会显示：
       pin  = 名字拼音大写（mono 小字标签用）
       rows = 档案行，每行 [标签, 内容]，想写几行写几行
       q    = 底部朱砂引言（一句代表性台词）
 
   第三步：写对话。
     在 DATA 里加一段 '角色名':[...]，每条讯息一个花括号：
       {t:'day',  x:'── 某某 ──'}      时间/分隔条（居中虚线）
       {t:'note',x:'……'}              中场提示（朱砂虚线框，如任务播报、
                                        "段深泉沉默了一会儿"这种）
       {t:'in',  x:'……'}              对方来信（白纸卡，可修改/重新回复）
       {t:'out', x:'……'}              怀榆发出（蓝卡，修改=重新生成）
 
   注意：角色名三处必须完全一致（roster/INFO/DATA 的键）。
   阶段二接 AI 后，AI 的回信会自动追加进 DATA（存档走 localStorage）。
   ═══════════════════════════════════════════════════════════════ */
var INFO={
  '段深泉':{pin:'SHENQUAN',note:'命定之人',rows:[['身份','神使 · 城主级'],['眸色','金琥珀'],['好感','观测中 · 好感度系统已接入'],['状态','部分档案封存']],q:'“回去，这里不是你该来的地方。”'},
  '系统':{pin:'SYSTEM',note:'主线托管',rows:[['身份','主线托管'],['模式','恋爱模式 · 运行中'],['权限','部分恢复']],q:'“本系统不提供情感咨询业务。”'},
  '瑞秋':{pin:'RACHEL',note:'故人',rows:[['身份','故人'],['特长','消息灵通 · 干练毒舌'],['状态','下落不明']],q:'“还活着呢？”'},
  '黎昭':{pin:'LIZHAO',note:'烬影会首领',rows:[['身份','烬影会首领'],['行踪','神出鬼没'],['状态','总在躲着你']],q:'“……别跟着我。”'},
  '祝焱':{pin:'ZHUYAN',note:'逝者之影',rows:[['身份','前火神'],['状态','已陨落 · 逝者之影'],['旧事','死于怀榆之手（她的请求）']],q:'“这次的火，为我燃尽即可。”'},
  '凝淼':{pin:'NINGMIAO',note:'被遗忘的女皇',rows:[['身份','前北境女皇'],['状态','已陨落 · 世界无人记得她'],['痕迹','永叹岭的雪']],q:'“你是唯一还记得我名字的人。”'},
  '叶戈尔':{pin:'YEGOR',note:'北境贵族',rows:[['身份','双冕北境贵族'],['特长','利益交换 · 转移资产'],['状态','已告别']],q:'“合作愉快，东方人。”'},
  '阿列克谢':{pin:'ALEKSEI',note:'巡林铁卫',rows:[['身份','巡林铁卫指挥官'],['驻地','永冻林海'],['态度','公事公办']],q:'“林海有规矩。”'},
  '神谕院':{pin:'ORACLE',note:'并案观察',rows:[['身份','业焰城代治机构'],['态度','并案观察']],q:'“封印类卷宗，不得擅动。”'},
  '黑鼠帮':{pin:'RATS',note:'收税的',rows:[['身份','地头收税的'],['业务','安宁税']],q:'“月底前。”'}
};
/* ═══ 写死的讯息（d:1 = 演示用的死对话标记；
   提示条「双击可修改/重新生成·长按可删除」挂在死对话末尾，
   死对话删光它就自动消失——同引渡人逻辑） ═══ */
var DATA={
  '段深泉':[
    {t:'day',x:'── 第一日 · 午后 ──'},
    {t:'note',x:'【主线任务】业焰城的阴影 · 已开启',d:1},
    {t:'in',x:'……你来做什么。',d:1},
    {t:'out',x:'路过！纯粹路过！我发誓！',d:1},
    {t:'note',x:'段深泉沉默了一会儿',d:1},
    {t:'in',x:'档案馆，东侧。别迟到。',d:1},
    {t:'out',x:'好好好，马上到！',d:1}
  ],
  '系统':[
    {t:'day',x:'── 系统频道 ──'},
    {t:'note',x:'【主线任务】与命定之人缔结羁绊 · 进行中',d:1},
    {t:'in',x:'【提示】检测到玩家情绪波动。恋爱模式运行正常，请勿担心。',d:1},
    {t:'out',x:'谁情绪波动了！',d:1},
    {t:'in',x:'【友情提醒】本系统不提供情感咨询业务。',d:1}
  ],
  '瑞秋':[
    {t:'day',x:'── 瑞秋 ──'},
    {t:'in',x:'哟，还活着呢？消息回头说，最近风声紧。',d:1},
    {t:'out',x:'你也保重。',d:1},
    {t:'in',x:'黑鼠帮最近收税收到神殿门口了，你悠着点。',d:1}
  ],
  '神谕院':[
    {t:'day',x:'── 神谕院 ──'},
    {t:'in',x:'（三日后，档案馆东侧，并案调查。）',d:1}
  ],
  '黑鼠帮':[
    {t:'day',x:'── 黑鼠帮 ──'},
    {t:'in',x:'安宁税，月底前。别让我们再跑一趟。',d:1}
  ]
};
/* 新角色无存档记录时自动补空对话，防止发送/渲染炸undefined；
   同时读取localStorage旧存档（persist有写无读=刷新即丢，补齐） */
var MAIL_DATA_DEFAULTS=null;   /* 内置默认档快照（删档重来用） */
(function(){
  MAIL_DATA_DEFAULTS=JSON.parse(JSON.stringify(DATA));
  var K='gzd_qlz_mail_data';
  try{
    var saved=JSON.parse(localStorage.getItem(K)||'null');
    if(saved && typeof saved==='object'){
      Object.keys(saved).forEach(function(k){ if(!DATA[k]) DATA[k]=saved[k]||[]; });
      /* 已有角色的存档记录也要合并回来（以存档为准，保留玩家聊天记录） */
      Object.keys(saved).forEach(function(k){ if(saved[k]&&saved[k].length) DATA[k]=saved[k]; });
    }
  }catch(e){}
  roster.added.forEach(function(n){ if(!DATA[n]) DATA[n]=[]; });
})();
 
/* ═══ 渲染 ═══ */
var msgsEl=document.getElementById('msgs'), listEl=document.getElementById('clist');
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderContacts(){
  listEl.innerHTML='';
  /* 排序：置顶的排前面，其余保持原顺序 */
  var order=roster.added.slice().sort(function(a,b){
    var pa=roster.pin.indexOf(a)>=0?0:1, pb=roster.pin.indexOf(b)>=0?0:1;
    return pa-pb;
  });
  order.forEach(function(n){
    var pinned=roster.pin.indexOf(n)>=0, cared=roster.care.indexOf(n)>=0;
    var d=document.createElement('div');
    d.className='contact'+(n===cur?' on':'')+(cared?' care':''); d.dataset.name=n;
    var info=INFO[n], preview=lastPreview(n);
    d.innerHTML='<div class="seal">'+n[0]+'</div><div class="cinfo"><div class="n">'+n+(pinned?'<span class="pinchip">置顶</span>':'')+'<span>'+info.pin+'</span></div><div class="p">'+esc(preview)+'</div></div>'+(n==='瑞秋'?'<div class="dot"></div>':'');
    d.onclick=function(){ if(window.SFX)try{SFX.play('da');}catch(e){} cur=n; renderContacts(); openChat(n); if(window.innerWidth<=760) document.getElementById('chat').classList.add('open'); };
    listEl.appendChild(d);
  });
}
function lastPreview(n){
  var arr=DATA[n]||[]; var last=null;
  for(var i=arr.length-1;i>=0;i--){ if(arr[i].t==='in'||arr[i].t==='out'){ last=arr[i].x; break; } }
  return last||'（暂无讯息）';
}
/* 括号分层：（神态/动作）内层变色，对话本体保持墨色。
   先esc转义再包裹，防消息内容破坏页面；己方蓝底用浅金，对方白纸用朱砂。
   换行归一：AI有时输出\n有时\n\n，渲染时全部压成单行断，行距交给.bl的margin统一管 */
function colored(s,out){
  var cls=out?'pb2':'pb';
  var t=String(s).replace(/\r/g,'').replace(/\n[ \t]+(?=\n)/g,'\n').replace(/\n{2,}/g,'\n');
  return t.split('\n').filter(function(ln){ return ln.trim()!==''; }).map(function(ln){
    ln=esc(ln).replace(/（[^（）\n]*）/g,function(w){ return '<span class="'+cls+'">'+w+'</span>'; });
    return '<div class="bl">'+ln+'</div>';
  }).join('');
}
/* ═══ 头像：同目录「头像/」文件夹按角色名找图（.png/.jpg/.jpeg/.webp/.gif），
   找到就顶掉字章，找不到保持字章 —— 以后加角色头像只需丢图进文件夹，零改码 ═══ */
var AVATAR_DIR='头像/';
function setSeal(el,name){
  el.textContent=name[0];
  var old=el.querySelector('img.sealimg'); if(old) old.remove();
  var exts=['png','jpg','jpeg','webp','gif'], i=0;
  (function probe(){
    if(i>=exts.length) return;               /* 全没有：保持字章 */
    var img=new Image(); img.className='sealimg'; img.alt=name;
    img.onload=function(){ el.textContent=''; el.appendChild(img); };
    img.onerror=function(){ i++; probe(); };  /* 这个扩展名没有，试下一个 */
    img.src=AVATAR_DIR+encodeURIComponent(name)+'.'+exts[i];
  })();
}
function buildMu(m){
  var d=document.createElement('div');
  d.className='mu '+(m.t==='out'?'out':'in');
  var who=m.t==='out'?'怀榆 · HUAIYU':cur+' · '+(INFO[cur]?INFO[cur].pin:'');
  /* 操作钮按消息归属区分：
     己方(out)=「修改」＋「删除」（修改保存后自动重答，重答含旧回信作废）；
     对方(in)=「修改」＋「重新回复」＋「删除」 */
  var isStk = m.t==='out' && m.emo && !(m.x && String(m.x).trim());   /* 己方纯表情：无字可改 */
  var btns = m.t==='out'
    ? (isStk?'<button class="o r">⟲ 重新回复</button>':'<button class="o e">✎ 修改</button>')+'<button class="o danger del">✕ 删除</button>'
    : '<button class="o e">✎ 修改</button><button class="o r">⟲ 重新回复</button><button class="o danger del">✕ 删除</button>';
  d.innerHTML='<div class="lbl">'+who+'</div><div class="bub"></div><div class="ops">'+btns+'</div>';
  var bub=d.querySelector('.bub');
  var txt=(m.x&&String(m.x).trim())?colored(m.x, m.t==='out'):'';
  var soloIn = m.t==='in' && m.emo && txt;   /* 来信=文字一条+表情独立一条（微信式两连发） */
  bub.innerHTML=txt+(soloIn?'':STICKER_HTML(m.emo))+sigHTML(m);
  if(!txt && m.emo) bub.classList.add('emoOnly');   /* 纯表情：裸图无框 */
  if(sigHTML(m)) bub.classList.add('hassig');
  if(soloIn){
    var so=document.createElement('div'); so.className='emoSolo';
    so.innerHTML=STICKER_HTML(m.emo);
    bub.after(so);
  }
  if(m.t==='in'&&m.mood&&m.mood!=='静') d.classList.add('e-'+({怒:'angry',怯:'sad',软:'soft'}[m.mood]||''));
  if(m.t==='in'){
    ensureVers(m);
    if(m.vers.length>1){
      var sw=document.createElement('div'); sw.className='swB';
      sw.innerHTML='<span class="ar">◂</span><span class="cur">'+(m.v+1)+' / '+m.vers.length+'</span><span class="ar">▸</span>';
      bub.after(sw);
      sw.children[0].onclick=function(ev){ev.stopPropagation(); swMu(m,d,-1);};
      sw.children[2].onclick=function(ev){ev.stopPropagation(); swMu(m,d,1);};
    }
  }
  return d;
}
/* ═══ swipe 多版本：vers=版本栈，v=当前版下标；m.x/mood/ts 恒等于当前版，
   存档/AI记忆/落款/导出全部无感——旧数据零迁移（首次用到时才建栈） ═══ */
function ensureVers(m){
  if(!m.vers){ m.vers=[{x:m.x,mood:m.mood,emo:m.emo||null,ts:m.ts}]; m.v=0; }
}
function swMu(m,d,delta){
  ensureVers(m);
  var n=m.vers.length; if(n<2) return;
  m.vers[m.v]={x:m.x,mood:m.mood,emo:m.emo||null,ts:m.ts};
  m.v=(m.v+delta+n)%n;
  var t=m.vers[m.v]; m.x=t.x; m.mood=t.mood; m.emo=t.emo; m.ts=t.ts;
  persist();
  var bub=d.querySelector('.bub');
  var txt2=(m.x&&String(m.x).trim())?colored(m.x,m.t==='out'):'';
  var solo2 = m.t==='in' && m.emo && txt2;
  bub.innerHTML=txt2+(solo2?'':STICKER_HTML(m.emo))+sigHTML(m);
  bub.classList.toggle('emoOnly', !txt2 && !!m.emo);
  if(sigHTML(m)) bub.classList.add('hassig');
  var oldSo=bub.parentElement.querySelector('.emoSolo'); if(oldSo) oldSo.remove();
  if(solo2){
    var so2=document.createElement('div'); so2.className='emoSolo';
    so2.innerHTML=STICKER_HTML(m.emo);
    bub.after(so2);
  }
  ['e-angry','e-sad','e-soft'].forEach(function(c){ d.classList.remove(c); });
  if(m.mood&&m.mood!=='静') d.classList.add('e-'+({怒:'angry',怯:'sad',软:'soft'}[m.mood]||''));
  var ce=d.querySelector('.swB .cur'); if(ce) ce.textContent=(m.v+1)+' / '+n;
}
function renderChat(){
  msgsEl.innerHTML='';
  (DATA[cur]||[]).forEach(function(m){ addMsgEl(m,false); });

/* 通用双击检测：350ms内两次抬起。iPad Safari 的 dblclick 事件不可靠，
   必须手写 pointerup 计时（虚线框删不掉的根因就是它） */
function onTap(el, fn){
  var last=0, lastFire=0;
  function fire(e){ var now=Date.now(); if(now-lastFire<200) return; lastFire=now; fn(e); }
  el.addEventListener('pointerup', function(e){
    var now=Date.now();
    if(now-last<500){ last=0; fire(e); } else last=now;
  });
  /* 桌面浏览器原生dblclick兜底（fire自带去重，不会连触两次） */
  el.addEventListener('dblclick', function(e){ fire(e); });
}
function bindOps(el,m){
  if(el.dataset.opsBound) return; el.dataset.opsBound='1';   /* 防重复绑定：绑两次=sel加又删=双击失灵 */
  var bub=el.querySelector('.bub'), ops=el.querySelector('.ops');
  onTap(el,function(ev){
    if(ev.target.closest('.ops')) return;
    var was=el.classList.contains('sel');
    document.querySelectorAll('.mu').forEach(function(x){x.classList.remove('sel')});
    if(!was) el.classList.add('sel');
  });
  el.querySelectorAll('.e').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); startEdit(el,m); }; });
  el.querySelectorAll('.r').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); regen(el,m); }; });
  el.querySelectorAll('.del').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); removeMsg(el,m); refreshHint(); }; });
}
function startEdit(el,m){

  bar.innerHTML='<button class="sv">✓ 保存</button><button class="cc">取消</button>';
  bub.style.display='none'; bub.after(bar); bar.after(ta);
  bar.querySelector('.sv').onclick=function(){ var v=ta.value.trim(); if(!v){restore();return;}
    m.x=v; if(m.vers) m.vers[m.v].x=v; bub.innerHTML=colored(v,m.t==='out')+sigHTML(m); restore(true); persist();
    el.classList.remove('sel');   /* 修改完成默认收起 */
    if(m.t==='out'){ regen(el,m); }   /* 己方讯：修改=重新生成（AI按新讯文重答） */
  };

function regen(el,m){

  if(m.t==='out'){
    /* 己方讯修改重答：其后作废（原语义不动），新回信作为新消息追加 */
    var oi2=DATA[cur].indexOf(m);

    var rq=(m.emo && !(m.x && String(m.x).trim())) ? '[表情:'+m.emo+']' : m.x;   /* 纯表情消息→标签文字 */
    MAIL_AI.reply(cur,rq,timeMeta(),oi2).then(function(reply){

  ensureVers(m);

  msgsEl.appendChild(g); msgsEl.scrollTop=msgsEl.scrollHeight;

function lsDetail(){

  ];
  var rows=[], other=0, others=[], i;
  try{
    for(i=0;i<KEYS.length;i++){
      var v=localStorage.getItem(KEYS[i][0]);
      rows.push({ key:KEYS[i][0], name:KEYS[i][1], bytes:v===null?0:(KEYS[i][0].length+v.length)*2, exist:v!==null });
    }
    var known={}; KEYS.forEach(function(x){ known[x[0]]=1; });
    for(i=0;i<localStorage.length;i++){

      var b=(k.length+(localStorage.getItem(k)||'').length)*2;
      if(!known[k]){ other+=b; others.push({key:k,bytes:b}); }

/* ═══ v3 情绪码解析：回信末尾 [心情:怒|怯|软|静] 抠出存档并从正文剥离；没附/乱写=静 ═══ */
/* v4 表情包白名单：只认这五个名，AI乱写/路径注入一律不渲染 */
/* 表情名单=AI.js注册表EMO_DEFS派生（加表情不用改这里） */

  if(!name || EMO_NAMES.indexOf(name)<0) return '';

function parseMood(reply){
  /* 兼容全角/半角括号与冒号；v4 同时抠表情标签（每条至多一个，多的忽略） */
  var s=String(reply);
  var emo=null;
  var me=/[［\[【]\s*表情\s*[:：]\s*([^］\]】]{1,8})\s*[］\]】]/.exec(s);
  if(me){
    if(EMO_NAMES.indexOf(me[1])>=0) emo=me[1];
    s=(s.slice(0,me.index)+' '+s.slice(me.index+me[0].length)).replace(/\s+$/,'');   /* 未知名也剥离：不暴露标记规则 */
  }
  var mt=/[［\[【]\s*心情\s*[:：]\s*([怒怯软静])\s*[］\]】]/.exec(s);
  if(!mt) return {mood:'静', x:s, emo:emo};
  return {mood:mt[1], x:(s.slice(0,mt.index)+' '+s.slice(mt.index+mt[0].length)).replace(/\s+$/,''), emo:emo};
}
/* ═══ v3 信笺落款：来信气泡内底部一行（时刻左·情绪字右）；无时间戳的旧存档不出落款 ═══ */
function sigHTML(m){
  if(m.t!=='in' || !m.ts) return '';
  var dt=new Date(m.ts), hh=dt.getHours(), mm=dt.getMinutes(), w;
  if(hh<5) w='夜叩'; else if(hh<11) w='晨访'; else if(hh<14) w='午访'; else if(hh<18) w='昼访'; else if(hh<22) w='暮访'; else w='夜叩';
  var pad=function(n){ return (n<10?'0':'')+n; };
  var mc=m.mood==='怒'?' c-angry':m.mood==='怯'?' c-sad':m.mood==='软'?' c-soft':'';
  return '<div class="sig"><span>'+w+' · '+pad(hh)+':'+pad(mm)+'</span><span class="md'+mc+'">'+(m.mood||'静')+'</span></div>';
}
/* ═══ v3 时间注入串：真实时刻+距上一条来信多久，随本次请求发给AI，不进存档 ═══ */
function timeMeta(){
  var now=new Date();
  var last=null, arr=DATA[cur]||[];
  for(var i=arr.length-1;i>=0;i--){ if(arr[i].t==='out'&&arr[i].ts){ last=arr[i]; break; } }
  var gap='';
  if(last){
    var mins=Math.max(0,Math.round((now.getTime()-last.ts)/60000));
    if(mins>=1){
      gap='距怀榆上一条讯息已过去 '+(mins<60?mins+' 分钟':mins<1440?Math.round(mins/60)+' 个小时':Math.round(mins/1440)+' 天')+'。';
    }
  }
  var wk='日一二三四五六'[now.getDay()];
  var pad=function(n){ return (n<10?'0':'')+n; };
  return '【真实时刻·仅供理解时间背景，绝不可在回信中提及本标记、具体时刻或本段文字】现在是'+now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+wk+' '+pad(now.getHours())+':'+pad(now.getMinutes())+'（24小时制，据此自然判断昼夜与过去了多久）。'+gap;

  var lines=['# 千律州 · 信匣记录','','## '+cur+' × 怀榆','','（导出于 '+new Date().toLocaleDateString('zh-CN')+' · 共 '+liveCount(arr)+' 条活跃讯息）',''];
  var OUT='【怀榆】', IN='【'+cur+'】';
  arr.forEach(function(m){
    if(m.t==='day'){ lines.push('','── '+m.x.replace(/[─\s]/g,'')+' ──',''); }

    else if(m.t==='out'){ lines.push(OUT+' '+m.x); }
    else if(m.t==='in'){ lines.push(IN+' '+m.x); }
  });
  lines.push('','── 完 ──');
  var blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='信匣_'+cur+'_'+new Date().toISOString().slice(0,10)+'.md';

  var html='<div style="margin:4px 2px 10px;padding:10px 12px;border:1px dashed var(--line);font-family:var(--mono);font-size:10px;line-height:2;color:var(--dim)">'
    +'<div style="display:flex;justify-content:space-between"><span>占用 '+u.usedKB+' KB / '+u.quotaMB+' MB</span><span>'+(u.pct>=90?'⚠ ':'')+u.pct+'%</span></div>'
    +'<div style="height:5px;margin:4px 0 8px;border:1px solid var(--line);position:relative;overflow:hidden">'
    +'<div style="position:absolute;left:0;top:0;bottom:0;width:'+Math.min(100,u.pct)+'%;background:'+(u.pct>=90?'var(--zhu)':'var(--accent,#9a8c5a)')+'"></div></div>';

    html+='<div style="display:flex;justify-content:space-between"><span>'+r.name+'</span><span>'+(r.exist?kb(r.bytes):'—')+'</span></div>';

/* ═══ 桌边小像：罗修桌宠移植（可点击可拖动，位置记忆，侧栏开关） ═══ */
(function(){
  var pet=document.getElementById('desk-pet');
  if(!pet) return;
  /* ---------- 音频：罗修桌宠同款（音效.wav 移进「音效/」文件夹，仅路径前缀改动） ---------- */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var audioCtx = null;
  var audioBuffer = null;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { initFallback(); }
  if (audioCtx) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '音效/音效.wav', true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function () {
      if (xhr.status === 200 || xhr.status === 0) {
        audioCtx.decodeAudioData(xhr.response,
          function (buf) { audioBuffer = buf; },
          function ()    { initFallback(); });
      } else { initFallback(); }
    };
    xhr.onerror = function () { initFallback(); };
    xhr.send();
  }
  function makeSilentWavURL() {
    var sampleRate = 8000, duration = 1, freq = 55, amp = 0.002;
    var n = sampleRate * duration;
    var buf = new ArrayBuffer(44 + n * 2);
    var v = new DataView(buf);
    function str(off, s) { for (var i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); }
    str(0, 'RIFF');  v.setUint32(4, 36 + n * 2, true);  str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sampleRate, true); v.setUint16(28, sampleRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) {
      v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * freq * i / sampleRate) * amp * 32767), true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  var unlockAudio = null;
  if (isIOS) {
    try {
      unlockAudio = new Audio(makeSilentWavURL());
      unlockAudio.loop = true;
      unlockAudio.preload = 'auto';
    } catch (e) { unlockAudio = null; }
  }
  function ensureMediaSession() {
    if (!isIOS || !unlockAudio) return;
    if (unlockAudio.paused) {
      try { var p = unlockAudio.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
  }
  if (isIOS) {
    var earlyUnlock = function () {
      ensureMediaSession();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    };
    document.addEventListener('touchstart', earlyUnlock, { once: true, passive: true });
    document.addEventListener('click', earlyUnlock, { once: true });
  }
  var fallbackAudio = null;
  function initFallback() {
    if (fallbackAudio) return;
    fallbackAudio = new Audio();
    fallbackAudio.preload = 'auto';
    var x = new XMLHttpRequest();
    x.open('GET', '音效/音效.wav', true);
    x.responseType = 'blob';
    x.onload = function () {
      if (x.status === 200 || x.status === 0) {
        fallbackAudio.src = URL.createObjectURL(x.response);
      }
    };
    x.send();
  }
  function playFallback() {
    if (!fallbackAudio) { initFallback(); return; }
    try { fallbackAudio.currentTime = 0; } catch (e) {}
    var p = fallbackAudio.play();
    if (p && p.catch) p.catch(function () {});
  }
  function playSound() {
    ensureMediaSession();
    if (audioBuffer && audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        var src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(audioCtx.destination);
        src.start(0);
        return;
      } catch (e) {}
    }
    playFallback();
  }
  var K_ON='gzd_qlz_pet_on', K_POS='gzd_qlz_pet_pos';
  /* 开关：存档读入 + 侧栏同步 */
  var on;
  try{ on=localStorage.getItem(K_ON)!=='0'; }catch(e){ on=true; }
  function syncOn(){ pet.classList.toggle('hidden',!on); var a=document.getElementById('petArr'); if(a) a.textContent=on?'显示':'隐藏'; }
  document.getElementById('miPet').onclick=function(){
    on=!on; try{ localStorage.setItem(K_ON,on?'1':'0'); }catch(e){}
    syncOn(); playSound();
  };
  syncOn();
  var activeId=null, startX=0, startY=0, baseX=0, baseY=0, dragging=false, freed=false;
  var THRESHOLD=8;
  function toFree(){
    if(freed) return; freed=true;
    pet.style.left='0px'; pet.style.top='0px'; pet.style.right='auto'; pet.style.bottom='auto';
  }
  function clamp(x,y){
    var w=pet.offsetWidth||120, h=pet.offsetHeight||120, vw=window.innerWidth, vh=window.innerHeight;
    return [Math.max(-w/2,Math.min(vw-w/2,x)), Math.max(-h/2,Math.min(vh-h/2,y))];
  }
  function setPos(x,y){ var p=clamp(x,y); pet.style.setProperty('--drag-x',p[0]+'px'); pet.style.setProperty('--drag-y',p[1]+'px'); }
  function getPos(){ return [parseFloat(pet.style.getPropertyValue('--drag-x'))||0, parseFloat(pet.style.getPropertyValue('--drag-y'))||0]; }
  function savePos(){ try{ var p=getPos(); localStorage.setItem(K_POS,JSON.stringify({x:p[0],y:p[1]})); }catch(e){} }
  function squash(){ pet.classList.remove('q-squash'); void pet.offsetWidth; pet.classList.add('q-squash'); }
  function onDown(e){
    if(activeId!==null) return;
    activeId=e.pointerId;
    try{ pet.setPointerCapture(e.pointerId); }catch(err){}
    pet.classList.remove('q-squash');
    var r=pet.getBoundingClientRect(); baseX=r.left; baseY=r.top;
    startX=e.clientX; startY=e.clientY; dragging=false;
    squash();                                  /* 按下即小蹲一下 */
    playSound();                                /* 罗修桌宠同款音效 */
  }
  function onMove(e){
    if(activeId===null||e.pointerId!==activeId) return;
    var dx=e.clientX-startX, dy=e.clientY-startY;
    if(!dragging){
      if(dx*dx+dy*dy<THRESHOLD*THRESHOLD) return;
      dragging=true; toFree();
      pet.classList.remove('q-squash'); pet.classList.add('dragging');
    }
    setPos(baseX+dx,baseY+dy);
  }
  function onUp(e){
    if(e.pointerId!==activeId) return;
    activeId=null;
    if(dragging){ pet.classList.remove('dragging'); squash(); savePos(); }
    dragging=false;
  }
  function onCancel(e){
    if(e.pointerId!==activeId) return;
    activeId=null;
    if(dragging){ pet.classList.remove('dragging'); savePos(); }
    dragging=false;
  }
  pet.addEventListener('pointerdown',onDown);
  pet.addEventListener('pointermove',onMove);
  pet.addEventListener('pointerup',onUp);
  pet.addEventListener('pointercancel',onCancel);
  pet.addEventListener('dragstart',function(e){ e.preventDefault(); });
  pet.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  /* 位置记忆：图片加载完再恢复+钳边（转屏/换设备不跑丢） */
  var img=pet.querySelector('.char-img');
  function tryRestore(){
    if(img&&!img.complete) return;
    var raw=null; try{ raw=localStorage.getItem(K_POS); }catch(e){}
    if(!raw) return;
    try{ var pos=JSON.parse(raw); if(pos&&isFinite(pos.x)&&isFinite(pos.y)){ toFree(); setPos(pos.x,pos.y); } }catch(e){}
  }
  if(img){ if(img.complete) tryRestore(); else img.addEventListener('load',tryRestore,{once:true}); }
  window.addEventListener('load',tryRestore);
  var rz=null;
  window.addEventListener('resize',function(){
    clearTimeout(rz);
    rz=setTimeout(function(){ if(freed){ var p=getPos(); setPos(p[0],p[1]); } },150);
  });
})();

/* 启动 */
renderContacts(); openChat(cur);
