<!DOCTYPE html>
<!-- ============================================================
     千律州模拟器 · index.html v0.3（着色器背景 · 画质修正版）
     背景：改编自 Shadertoy Ndc3zl（云海列车 · CC BY-NC-SA 3.0）
     v0.3 修正（针对 v0.2 反馈）：
       1. 画质回原版：JS 现场生成 1024² 随机噪声贴图等价复刻
          iChannel0，noise() 恢复贴图采样，倍频恒为 8
       2. 蓝天回归：远处天空回退原版淡蓝 fallback
       3. 速度减半：iTime*4.0 → *2.0
       4. 版面：卡片米黄底深字；文字白字黑边（背景花也能读清）；
          删除中央暗化层；字号参考引渡人缩小
       5. 近现代英文点缀：QIANLVZHOU · PLAYER FILE · START
       6. 右上角：返回(/-/world/) + 昼/夜切换(uExposure)
       7. ?train=0 仍可切纯云海
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千律州模拟器</title>
<style>
:root{
  --card-bg:rgba(247,241,228,0.90);   /* 米黄卡片 */
  --card-line:rgba(138,106,79,0.85);  /* 棕描边 */
  --card-text:#2c241c;
  --card-sub:#6b5a48;
  --accent:#8a6a4f;
  --gold:#a8842f;
  --serif:"Georgia","Times New Roman","Songti SC",serif;
  --cut:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--serif);color:#fff;min-height:100vh;overflow:hidden;
  background:#151110;position:relative;
}
/* WebGL 不可用时的静态退底 */
body.nogl{background:linear-gradient(180deg,#2a1a14 0%,#7a3a22 45%,#c96a3a 78%,#e8a06a 100%);}
 
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}
 
/* ===== 舞台层 ===== */
.stage{
  position:relative;z-index:2;height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;gap:14px;
}
 
/* --- 白字黑边工具类（花背景专用） --- */
.ink{color:#fff;
  text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,
              -1.5px  1.5px 0 #000,1.5px  1.5px 0 #000,
               -2px   0   0 #000, 2px   0   0 #000,
                0  -2px  0 #000, 0  2px  0 #000,
               0 4px 14px rgba(0,0,0,0.45);
}
 
/* --- 顶部右上按钮组 --- */
.topbar{position:fixed;top:18px;right:20px;z-index:5;display:flex;gap:10px;}
.octo-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--serif);font-size:.8rem;letter-spacing:.12em;
  color:var(--card-text);text-decoration:none;cursor:pointer;
  background:var(--card-bg);border:1px solid var(--card-line);
  padding:7px 16px;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
  transition:transform .2s,box-shadow .2s;
}
.octo-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.3);}
 
/* --- 序章引言 --- */
.quote{font-size:.92rem;letter-spacing:.42em;text-indent:.42em;color:#fff;
  animation:rise 1.2s .1s both;}
.quote em{font-style:normal;color:#ffd9a0;}
 
/* --- 标题（参考引渡人尺寸，克制） --- */
.tt{
  font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:600;
  letter-spacing:.5em;text-indent:.5em;color:#fff;
  animation:rise 1.2s .3s both;
}
/* 英文点缀 · 小字母间距排印 */
.tt-en{
  font-size:.68rem;letter-spacing:.55em;text-indent:.55em;
  color:rgba(255,255,255,0.92);font-family:"Georgia",serif;
  animation:rise 1.2s .45s both;
}
 
/* --- 分割线 · 菱形徽记 --- */
.divider{display:flex;align-items:center;gap:12px;margin:4px 0 6px;
  animation:rise 1.2s .6s both;}
.divider .line{width:88px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.85));}
.divider .line.r{background:linear-gradient(270deg,transparent,rgba(255,255,255,0.85));}
.divider .gem{width:8px;height:8px;background:#fff;transform:rotate(45deg);box-shadow:0 0 10px rgba(255,255,255,0.8);}
 
/* --- 八边形组件（带描边双层实现） --- */
.octo{
  --b:1.5px;
  background:var(--card-line);
  padding:var(--b);
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));
}
.octo>.octo-in{
  background:var(--card-bg);
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));
  height:100%;
}
 
/* --- 玩家档案卡（米黄底 · 深字） --- */
.card{animation:rise 1.2s .75s both;}
.card .octo-in{padding:20px 34px;text-align:center;}
.card .file-en{font-size:.62rem;letter-spacing:.5em;text-indent:.5em;color:var(--gold);margin-bottom:8px;}
.card .name{font-size:1.35rem;font-weight:600;letter-spacing:.35em;text-indent:.35em;color:var(--card-text);}
.card .name b{color:#8a5a2e;font-weight:600;}
.card .desc{font-size:.78rem;color:var(--card-sub);margin-top:8px;letter-spacing:.1em;line-height:1.8;}
.card .bound{
  margin-top:12px;padding-top:10px;
  border-top:1px solid rgba(138,106,79,0.35);
  font-size:.72rem;letter-spacing:.25em;color:var(--gold);
}
 
/* --- 开始按钮 --- */
.start-wrap{animation:rise 1.2s .9s both;}
.start-btn{
  display:inline-block;text-decoration:none;cursor:pointer;
  background:linear-gradient(135deg,#8a6a4f,#6e523c);
  color:#fff;font-family:var(--serif);
  font-size:.95rem;letter-spacing:.4em;text-indent:.4em;
  padding:13px 52px;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  transition:transform .2s,box-shadow .2s,filter .2s;
}
.start-btn span.en{display:block;font-size:.55rem;letter-spacing:.5em;text-indent:.5em;opacity:.75;margin-top:3px;}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.35);filter:brightness(1.08);}
 
/* --- 页脚 --- */
.foot{
  position:fixed;bottom:12px;left:0;right:0;z-index:3;
  display:flex;justify-content:space-between;padding:0 20px;
  font-size:.62rem;letter-spacing:.08em;color:rgba(255,255,255,0.85);
}
.foot a{color:inherit;}
 
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
@media (orientation:portrait){
  .stage{padding-bottom:8vh;gap:12px;}
  .card .octo-in{padding:16px 24px;}
  .foot{justify-content:center;}
  .foot span:first-child{display:none;}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
 
<!-- 右上角：返回 + 昼夜切换 -->
<div class="topbar">
  <a class="octo-btn" href="/-/world/">◂ 返回</a>
  <button class="octo-btn" id="dayNightBtn" title="日间/夜间">☾ 夜</button>
</div>
 
<div class="stage">
  <p class="quote ink">大寂灭已过五百年 <em>·</em> 旧日的名字，不可言说</p>
  <h1 class="tt ink">千律州模拟器</h1>
  <p class="tt-en ink">QIANLVZHOU · AN INTERACTIVE SIMULATOR</p>
 
  <div class="divider"><span class="line"></span><span class="gem"></span><span class="line r"></span></div>
 
  <div class="card octo"><div class="octo-in">
    <div class="file-en">PLAYER FILE</div>
    <div class="name"><b>怀</b>榆</div>
    <div class="desc">玩家 · 唯一的玩家<br>四年前降临千律州，至今未归</div>
    <div class="bound">命定之人 · 段深泉</div>
  </div></div>
 
  <div class="start-wrap">
    <a class="start-btn" href="./壳.html">开 始 游 戏<span class="en">START</span></a>
  </div>
</div>
 
<div class="foot ink" style="text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;">
  <span>千律州模拟器 · v0.3 · 原著《业焰之国》</span>
  <span>背景着色器改编自 <a href="https://www.shadertoy.com/view/Ndc3zl" target="_top">Shadertoy Ndc3zl</a> · CC BY-NC-SA 3.0</span>
</div>
 
<script>
(function(){
'use strict';
var canvas=document.getElementById('gl');
var gl=canvas.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.body.classList.add('nogl');return;}
 
/* ===== 设备分级：倍频恒8保画质；移动端仅降DPR ===== */
var isMobile=Math.min(screen.width,screen.height)<768;
var DPR=Math.min(window.devicePixelRatio||1,isMobile?1:2);
 
var FRAG=`
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uTrain;
uniform float uExposure;   /* 夜1.0 / 昼1.15 */
uniform sampler2D uNoise;  /* JS生成的1024噪声贴图 = 原版iChannel0 */
#define DETAIL 8
#define T texture2D
 
/* ↓↓↓ 以下 noise/fbm/fbm2/前景背景云/列车/桥 均为原版逻辑照抄 ↑↑↑ */
float noise(vec2 x){
    vec2 f = fract(x);
    vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
    vec2 p = floor(x);
    float a = T(uNoise, (p+vec2(0.0,0.0))/1024.0).x;
    float b = T(uNoise, (p+vec2(1.0,0.0))/1024.0).x;
    float c = T(uNoise, (p+vec2(0.0,1.0))/1024.0).x;
    float d = T(uNoise, (p+vec2(1.0,1.0))/1024.0).x;
    return a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y;
}
float fbm(vec2 x){
    float a=0.0;float b=1.0;float t=0.0;
    for(int i=0;i<DETAIL;i++){float n=noise(x);a+=b*n;t+=b;b*=0.7;x*=2.0;}
    return a/t;
}
float fbm2(vec2 x){
    float a=0.0;float b=1.0;float t=0.0;
    for(int i=0;i<DETAIL;i++){float n=noise(x);a+=b*n;t+=b;b*=0.9;x*=2.0;}
    return a/t;
}
float box(vec2 uv,float x1,float x2,float y1,float y2){
    return (uv.x>x1&&uv.x<x2&&uv.y>y1&&uv.y<y2)?1.0:0.0;
}
#define dot2(v) dot(v,v)
#define layer(dh,v) if(uv.y<h+midlevel-(dh)) return vec4(v,1.0);
 
vec4 foreground(vec2 uv,float t){
    float midlevel;float h;float disp;float dist;vec2 uv2;
    uv.y-=0.2;
    midlevel=-0.1;disp=1.7;dist=1.0;
    uv2=uv+vec2(t/dist+40.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.12,vec3(0.43,0.32,0.31));
    layer(0.08,vec3(0.55,0.42,0.41));
    layer(0.04,vec3(0.66,0.42,0.40));
    layer(0.0,vec3(0.77,0.48,0.46));
    midlevel=0.05;disp=1.7;dist=2.0;
    uv2=uv+vec2(t/dist+38.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.95,0.66,0.48));
    layer(0.04,vec3(0.98,0.76,0.64));
    layer(0.0,vec3(0.95,0.80,0.77));
    return vec4(0.95,0.80,0.77,0.0);
}
 
vec4 background(vec2 uv,float t){
    float midlevel;float h;float disp;float dist;vec2 uv2;
    midlevel=0.3;disp=0.9;dist=10.0;
    uv2=uv+vec2(t/dist+32.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.14,vec3(0.48,0.19,0.20));
    layer(0.10,vec3(0.68,0.28,0.19));
    layer(0.07,vec3(0.88,0.38,0.24));
    layer(0.0,vec3(0.95,0.45,0.30));
    midlevel=0.35;disp=1.0;dist=15.0;
    uv2=uv+vec2(t/dist+30.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.04,vec3(0.98,0.76,0.64));
    layer(0.0,vec3(0.95,0.80,0.77));
    midlevel=0.35;disp=3.5;dist=20.0;
    uv2=uv+vec2(t/dist+27.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.12,vec3(0.43,0.32,0.31));
    layer(0.08,vec3(0.55,0.42,0.41));
    layer(0.04,vec3(0.66,0.42,0.40));
    layer(0.0,vec3(0.77,0.48,0.46));
    midlevel=0.45;disp=2.0;dist=25.0;
    uv2=uv+vec2(t/dist+23.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.04,vec3(0.98,0.57,0.36));
    layer(0.0,vec3(1.0,0.62,0.44));
    midlevel=0.5;disp=2.3;dist=30.0;
    uv2=uv+vec2(t/dist+20.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.12,vec3(0.41,0.27,0.27));
    layer(0.08,vec3(0.53,0.35,0.32));
    layer(0.04,vec3(0.80,0.24,0.17));
    layer(0.0,vec3(0.99,0.29,0.20));
    midlevel=0.5;disp=2.5;dist=35.0;
    uv2=uv+vec2(t/dist+18.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.88,0.38,0.24));
    layer(0.05,vec3(0.98,0.42,0.28));
    layer(0.0,vec3(1.0,0.48,0.35));
    midlevel=0.6;disp=2.0;dist=40.0;
    uv2=uv+vec2(t/dist+18.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.95,0.66,0.48));
    layer(0.0,vec3(1.0,0.76,0.60));
    midlevel=0.75;disp=3.5;dist=45.0;
    uv2=uv+vec2(t/dist+15.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.20,vec3(1.0,0.55,0.33));
    layer(0.15,vec3(0.98,0.50,0.24));
    layer(0.10,vec3(0.90,0.55,0.40));
    layer(0.0,vec3(1.0,0.62,0.44));
    midlevel=0.7;disp=2.7;dist=50.0;
    uv2=uv+vec2(t/dist+12.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.04,vec3(0.73,0.36,0.30));
    layer(0.0,vec3(0.80,0.40,0.34));
    midlevel=0.8;disp=2.7;dist=60.0;
    uv2=uv+vec2(t/dist+9.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.93,0.58,0.35));
    layer(0.0,vec3(1.0,0.76,0.60));
    midlevel=0.9;disp=3.0;dist=70.0;
    uv2=uv+vec2(t/dist+7.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.56,0.25,0.22));
    layer(0.05,vec3(0.60,0.30,0.27));
    layer(0.0,vec3(0.74,0.35,0.30));
    midlevel=1.0;disp=5.0;dist=100.0;
    uv2=uv+vec2(t/dist+3.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.92,0.85,0.82));
    layer(0.0,vec3(1.0,0.94,0.91));
    /* 原版蓝天 fallback 回归 */
    return vec4(0.58,0.7,1.0,1.0);
}
 
void main(){
    vec2 fragCoord=gl_FragCoord.xy;
    vec2 uv=fragCoord/iResolution.y;
    float t=iTime*2.0;              /* 原版*4.0，按要求降速 */
    vec4 bg=background(uv,t);
 
    vec4 fg=vec4(0.0);
    if(uv.y<0.5){
        for(int i=0;i<5;i++){
            fg+=foreground(uv,t+4.0*float(i)/5.0/60.0)/5.0;
        }
    }
    vec3 col=bg.rgb;
 
    if(uTrain>0.5){
        uv.y-=0.2;
        vec2 uv2=fract(uv*9.0);
        float wagon=1.0;
        wagon*=1.0-step(0.45,uv.x);
        wagon*=1.0-step(0.115,uv.y);
        wagon*=step(0.103,uv.y);
        wagon*=step(0.05,1.0-abs(uv2.x*2.0-1.0));
        float join=1.0;
        join*=1.0-step(0.45,uv.x);
        join*=1.0-step(0.11,uv.y);
        join*=step(0.107,uv.y);
        float roof=1.0;
        roof*=1.0-step(0.45,uv.x);
        roof*=1.0-step(0.117,uv.y);
        roof*=step(0.11,uv.y);
        roof*=step(0.15,1.0-abs(uv2.x*2.0-1.0));
        float loco=box(uv,0.45,0.5,0.103,0.112);
        float chem1=box(uv,0.49,0.495,0.103,0.12);
        float chem2=box(uv,0.488,0.496,0.12,0.123);
        float locoRoof=box(uv,0.443,0.47,0.11,0.117);
        float wheel=1.0-step(0.00004,dot2(uv-vec2(0.457,0.106)));
        wheel+=1.0-step(0.00002,dot2(uv-vec2(0.487,0.105)));
        wheel+=1.0-step(0.00002,dot2(uv-vec2(0.497,0.105)));
        if(uv.x<0.45&&uv.y>0.025&&uv.y<0.2){
            wheel+=1.0-step(0.002,dot2(uv2-vec2(0.2,0.95)));
            wheel+=1.0-step(0.002,dot2(uv2-vec2(0.8,0.95)));
        }
        col=mix(col,vec3(0.18,0.12,0.15),join);
        col=mix(col,vec3(0.48,0.19,0.20),wagon);
        col=mix(col,vec3(0.18,0.12,0.15),roof);
        col=mix(col,vec3(0.38,0.19,0.20),loco);
        col=mix(col,vec3(0.38,0.19,0.20),chem1);
        col=mix(col,vec3(0.18,0.12,0.15),locoRoof);
        col=mix(col,vec3(0.18,0.12,0.15),chem2+wheel);
        float dist=5.0;
        vec2 uv3=uv+vec2(t/dist+3.5,0.0);
        uv3.x-=t/dist*0.2;
        float h=fbm2(uv3)-0.55;
        if(uv.x<0.49){
            float x=-uv.x+0.49;
            float y=abs(uv.y+h*0.4-0.16*sqrt(x)-0.12)-0.8*x*exp(-x*10.0);
            if(y<0.0)col=vec3(1.0,0.94,0.91);
            if(y<-0.02)col=vec3(0.92,0.85,0.82);
        }
        uv3=uv+vec2(t/dist+32.5,0.0);
        uv3.x=fract(uv3.x*3.0);
        float k=1.0;
        k*=smoothstep(0.001,0.003,abs(uv3.y-pow(uv3.x-0.5,2.0)*0.15-0.12));
        k*=min(step(0.05,1.0-abs(uv3.x*2.0-1.0))+step(0.17,uv3.y),1.0);
        k*=min(smoothstep(0.02,0.05,1.0-abs(uv3.x*2.0-1.0))+step(0.177,uv3.y),1.0);
        k*=min(step(0.1,uv3.y)+smoothstep(-0.09,-0.085,-uv3.y-0.001/(1.0-abs(uv3.x*2.0-1.0))),1.0);
        k*=min(smoothstep(0.05,0.2,1.0-abs(fract(uv3.x*16.0)*2.0-1.0))+step(0.12,uv3.y-pow(uv3.x-0.5,2.0)*0.15)+step(-0.1,-uv3.y),1.0);
        col=mix(vec3(0.29,0.09,0.08)*smoothstep(-0.08,0.08,uv.y),col,k);
    }
 
    col=mix(col,fg.rgb,fg.a);
 
    /* 原版 vignette 后处理（并入） */
    uv=fragCoord/iResolution.xy;
    col*=0.5+0.5*pow(16.0*uv.x*uv.y*(1.0-uv.x)*(1.0-uv.y),0.2);
    col*=uExposure;                 /* 昼夜曝光 */
    gl_FragColor=vec4(col,1.0);
}
`;
 
/* ===== 顶点着色器：全屏三角 ===== */
var VERT='attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
 
function sh(type,src){
  var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}
  return s;
}
var vs=sh(gl.VERTEX_SHADER,VERT),fs=sh(gl.FRAGMENT_SHADER,FRAG);
if(!vs||!fs){document.body.classList.add('nogl');return;}
var prog=gl.createProgram();
gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){document.body.classList.add('nogl');return;}
gl.useProgram(prog);
 
/* ===== 全屏大三角 ===== */
var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 
/* ===== 复刻 iChannel0：现场生成 1024² 随机噪声贴图 ===== */
var tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
/* 复刻 iChannel0：纯随机 256² 小噪声贴图（着色器内仍除以1024，
   胞体等效放大4倍 + 线性插值 = 原版的奶油质感） */
var data=new Uint8Array(256*256*4);
for(var i=0;i<data.length;i+=4){
  var v=(Math.random()*256)|0;
  data[i]=v;data[i+1]=v;data[i+2]=v;data[i+3]=255;
}
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,256,256,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
gl.uniform1i(gl.getUniformLocation(prog,'uNoise'),0);
 
var uRes=gl.getUniformLocation(prog,'iResolution');
var uTime=gl.getUniformLocation(prog,'iTime');
var uTrainU=gl.getUniformLocation(prog,'uTrain');
var uExp=gl.getUniformLocation(prog,'uExposure');
var trainOn=location.search.indexOf('train=0')===-1?1.0:0.0;
var exposure=1.0;   /* 夜间默认 */
gl.uniform1f(uTrainU,trainOn);
gl.uniform1f(uExp,exposure);
 
/* ===== 昼夜切换 ===== */
var dnBtn=document.getElementById('dayNightBtn');
dnBtn.addEventListener('click',function(){
  exposure=(exposure===1.0)?1.18:1.0;
  gl.uniform1f(uExp,exposure);
  dnBtn.textContent=(exposure===1.0)?'☾ 夜':'☀ 昼';
});
 
function resize(){
  var w=Math.floor(innerWidth*DPR),h=Math.floor(innerHeight*DPR);
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w;canvas.height=h;
    gl.viewport(0,0,w,h);
  }
}
addEventListener('resize',resize);resize();
 
var t0=performance.now(),running=true,t=0;
document.addEventListener('visibilitychange',function(){
  running=!document.hidden;
  if(running){t0=performance.now()-t;requestAnimationFrame(loop);}
});
function loop(now){
  if(!running)return;
  t=(now-t0)/1000;
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,t);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
