<!DOCTYPE html>
<!-- ============================================================
     千律州模拟器 · index.html v0.4（相框式构图 · 常驻夜间）
     背景：改编自 Shadertoy Ndc3zl（云海列车 · CC BY-NC-SA 3.0）
     v0.4 变更：
       1. 构图：放弃全屏 → 上下米白留白(76vh画面)，四周淡出遮罩
       2. 视角拉远：uv×1.45，云层与列车缩小，层次感提升
       3. 细节：fbm 倍频桌面 8→10 / 移动 5→8
       4. 前景云：disp 1.7→1.2 + 高度钳制，不再糊火车一脸
       5. 常驻夜间渲染；右上角主题按钮只改全局 theme 存储
          （key/格式与引渡人一致：'theme' → {value:'light'|'dark'}），
          内页自行监听联动；图标用内联SVG，杜绝emoji渲染
       6. 卡片改小字氛围向文案；标题字号对齐引渡人(2rem/1.5rem)
       7. 撤销白字黑边 → 纯白+柔和投影
     ============================================================ -->
<html lang="zh-CN">
<head>

<title>千律州模拟器</title>
<style>
:root{
  --paper:#f7f4ef;            /* 米白留白 */
  --card-bg:rgba(255,255,255,0.86);
  --card-line:#d5c8b8;
  --ink:#2c241c;
  --ink-2:#6b5a48;
  --accent:#8a6a4f;
  --gold:#a8842f;
  --serif:"Georgia","Times New Roman","Songti SC",serif;
  --mono:"Courier New","Source Code Pro",monospace;
}
body.dark{
  --paper:#2b241b;            /* 夜间:暖灰褐,不压黑 */
  --card-bg:rgba(54,45,34,0.94);
  --ink:#e8ded0;
  --ink-2:#a89880;
  --accent:#b99a6b;
  --gold:#c9a34e;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--serif);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;overflow-x:hidden;
}
 
/* ===== 顶栏（悬浮于米白留白区）===== */
.topbar{
  position:fixed;top:14px;left:0;right:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 18px;pointer-events:none;
}
.topbar>*{pointer-events:auto;}
.tbtn{
  text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;font-family:var(--serif);font-size:.8rem;
  color:#fff;text-decoration:none;cursor:pointer;
  background:rgba(28,20,14,0.4);
  border:1px solid rgba(255,255,255,0.3);text-shadow:0 1px 3px rgba(0,0,0,0.4);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);
  transition:all .25s ease;user-select:none;
}
.tbtn:hover{background:rgba(28,20,14,0.7);color:#fff;}
.tbtn svg{width:14px;height:14px;display:block;}
 
/* ===== 画布区（相框式）===== */
.viewport{
  position:relative;width:100%;
  height:50vh;min-height:340px;flex:none;
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* 四周淡出遮罩（米白渐隐） */
.viewport .fade{position:absolute;pointer-events:none;z-index:5;}
.fade.top{top:0;left:0;right:0;height:11%;background:linear-gradient(180deg,var(--paper),transparent);}
.fade.bot{bottom:0;left:0;right:0;height:5%;background:linear-gradient(0deg,var(--paper),transparent);}
.fade.left{top:0;bottom:0;left:0;width:9%;background:linear-gradient(90deg,var(--paper),transparent);}
.fade.right{top:0;bottom:0;right:0;width:9%;background:linear-gradient(270deg,var(--paper),transparent);}
/* 画布内引言（纯白+柔影，无描边） */
.txt-group{transform:translateY(-137px);animation:fadeIn .8s ease .25s both;}
.center-stack .quote{position:static;transform:none;
  font-size:.95rem;letter-spacing:3px;color:#fff;white-space:nowrap;
  font-family:var(--serif);margin:6px 0 24px;text-shadow:0 1px 6px rgba(60,30,15,0.85),0 0 2px rgba(60,30,15,0.6);
  text-shadow:0 1px 3px rgba(20,10,5,0.6),0 2px 14px rgba(20,10,5,0.5);}
 
/* ===== 下留白区：标题 / 档案 / 入口 ===== */
.footzone{
  flex:1;width:100%;max-width:560px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  text-align:center;padding:10px 16px 16px;
}
.footzone a{color:#b3a68f;}
h1{
  font-size:2rem;font-weight:700;letter-spacing:6px;color:var(--ink);
}
h1 .dot{color:var(--gold);}
.en-line{
  margin-top:6px;font-family:var(--mono);font-size:.62rem;
  letter-spacing:4px;color:var(--accent);
}
.octo{
  --cut:12px;
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));
  background:var(--card-line);padding:1.5px;width:100%;
}
.octo>.octo-in{
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));
  background:var(--card-bg);
  padding:14px 18px 12px;text-align:left;
}
.card{margin-top:12px;width:100%;}
.card .sym{font-size:1.15rem;color:var(--gold);display:block;margin-bottom:4px;}
.card .name{font-size:1rem;font-weight:600;letter-spacing:2px;color:var(--ink);}
.card .name .en{font-family:var(--mono);font-size:.58rem;letter-spacing:3px;color:var(--accent);margin-left:8px;vertical-align:1px;}
.card .desc{
  margin-top:10px;font-size:.88rem;line-height:1.8;color:var(--ink);
}
.card .desc em{font-style:normal;color:var(--ink);}
.card .tail{
  margin-top:10px;font-family:var(--mono);font-size:.58rem;
  letter-spacing:3px;color:var(--gold);
}
.start-wrap{margin-top:12px;width:100%;}
.octo.start{display:block;margin-top:10px;text-decoration:none;}
.center-stack{
  position:relative;width:min(560px,94%);z-index:10;
  margin:-85px auto 0;animation:fadeIn .8s ease .25s both;text-align:center;
}
.center-stack h1{font-size:2.3rem;font-weight:700;letter-spacing:6px;color:#fff;
  text-shadow:0 1px 3px rgba(20,10,5,0.55),0 2px 16px rgba(20,10,5,0.45);margin-bottom:2px;}
.center-stack .en-line{font-family:var(--mono);font-size:.68rem;letter-spacing:3px;white-space:nowrap;color:rgba(255,255,255,0.85);text-shadow:0 1px 5px rgba(20,10,5,0.55);margin:2px 0 0;}
.center-stack h1 .dot{color:#fff;}   /* 大字统一纯白 */
.center-stack .desc{font-size:.88rem;line-height:1.8;color:var(--ink);margin:8px 0 0;text-align:center;}
.center-stack .octo-in{background:var(--card-bg);}
.center-stack .start-btn{
  display:block;text-align:center;padding:10px 0;text-decoration:none;
  font-size:.88rem;letter-spacing:8px;color:var(--ink);
  background:var(--paper);text-shadow:none;
}
.center-stack .start-btn .en{display:block;font-size:.55rem;letter-spacing:5px;margin-top:3px;opacity:.75;}
.center-stack .start:hover .start-btn{color:var(--gold);}
.center-start{
  text-decoration:none;
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(240px,60%);z-index:10;animation:rise .7s ease .3s both;
}
.center-start .start-btn{
  display:block;text-align:center;padding:12px 0;text-decoration:none;
  font-size:.92rem;letter-spacing:8px;color:#fff;
  background:rgba(28,20,14,0.45);
  text-shadow:0 1px 4px rgba(0,0,0,0.5);
}
.center-start .start-btn .en{display:block;font-size:.55rem;letter-spacing:5px;margin-top:3px;opacity:.75;}
.center-start:hover .start-btn{background:rgba(28,20,14,0.62);}
.start-btn{
  display:block;text-align:center;padding:9px 0;text-decoration:none;
  font-family:var(--serif);font-size:.88rem;letter-spacing:6px;
  color:var(--accent);text-decoration:none;
  transition:none;
}
.start-btn .en{display:block;font-family:var(--mono);font-size:.55rem;letter-spacing:4px;opacity:.65;margin-top:2px;}
.octo.start{background:#c9b27a;}
.octo.start:hover{background:#e0cd9a;}
.octo.start .start-btn{
  --cut:12px;
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));
  background:var(--paper);
}
.octo.start:hover .start-btn{color:var(--gold);}
.foot{
  margin-top:10px;display:flex;flex-direction:column;gap:3px;
  font-family:var(--mono);font-size:.6rem;letter-spacing:1px;color:var(--ink-2);text-align:center;
}
.foot a{color:inherit;}
 
/* ===== 开场入场动画 ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.footzone{animation:fadeIn 1s ease .5s both;}
.topbar{animation:fadeIn .8s ease both;}
.footzone>.card{animation-delay:.12s;}
.footzone>.start-wrap{animation-delay:.24s;}
.footzone>.foot{animation-delay:.36s;}
 
@media (max-width:480px){
  .txt-group{transform:translateY(-113px);}
  h1{font-size:1.5rem;letter-spacing:4px;}
  .center-stack .en-line{font-size:.55rem;letter-spacing:2px;}
  .center-stack .quote{font-size:.68rem;letter-spacing:2px;margin:4px 0 14px;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(20,10,5,0.6),0 2px 14px rgba(20,10,5,0.5);}
  .viewport{height:50vh;margin-top:0;}
  .center-stack{margin:-60px auto 0;}
  .card .desc{font-size:.88rem;}
  .footzone{padding:0 12px 8px;}
}
</style>

<script>
/* ===== 全局日夜间主题（与引渡人同 key 联动：'theme' → {value:'light'|'dark'}）
   本页常驻夜间渲染，按钮只负责读写全局主题，供内页监听。 ===== */
(function(){
  var btn=document.getElementById('themeBtn');
  var icon=document.getElementById('themeIcon');
  var label=document.getElementById('themeLabel');
  var SUN='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
  function isLight(){
    try{
      var raw=localStorage.getItem('theme');
      if(!raw)return true;              /* 默认日间 */
      var p=JSON.parse(raw);
      return !!(p&&p.value==='light');
    }catch(e){return false;}
  }
  function apply(){
    var light=isLight();
    document.body.classList.toggle('light',light);
    document.body.classList.toggle('dark',!light);
    if(typeof window.__setExposure==='function')window.__setExposure(light?1.0:0.72);
  }
  function render(){
    if(isLight()){icon.innerHTML=SUN;label.textContent='日间';}
    else{icon.innerHTML=MOON;label.textContent='夜间';}
    apply();
  }
  btn.addEventListener('click',function(){
    var toLight=!isLight();
    try{localStorage.setItem('theme',JSON.stringify({value:toLight?'light':'dark'}));}catch(e){}
    render();
  });
  /* 其他页面切了主题时本页按钮状态跟随（本页视觉不变） */
  window.addEventListener('storage',function(e){
    if(e.key==='theme')render();
  });
  render();
})();
</script>
 
<script>
(function(){
'use strict';
var canvas=document.getElementById('gl');
var gl=canvas.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.body.classList.add('nogl');return;}
 
/* ===== 设备分级：桌面倍频10/DPR≤2，移动倍频8/DPR≤1 ===== */
var isMobile=Math.min(screen.width,screen.height)<768;
var DETAIL=8;
var DPR=Math.min(window.devicePixelRatio||1,isMobile?1:2);
 
var FRAG=`
 
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uTrain;
uniform float uExposure;   /* 夜1.0 / 昼1.15 */
uniform sampler2D uNoise;  /* JS生成的1024噪声贴图 = 原版iChannel0 */
#define DETAIL 8
#define T texture2D
 
/* ↓↓↓ 以下 noise/fbm/fbm2/前景背景云/列车/桥 均为原版逻辑照抄 ↑↑↑ */
float noise(vec2 x){
    vec2 f = fract(x);
    vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
    vec2 p = floor(x);
    float a = T(uNoise, (p+vec2(0.0,0.0))/1024.0).x;
    float b = T(uNoise, (p+vec2(1.0,0.0))/1024.0).x;
    float c = T(uNoise, (p+vec2(0.0,1.0))/1024.0).x;
    float d = T(uNoise, (p+vec2(1.0,1.0))/1024.0).x;
    return a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y;
}
float fbm(vec2 x){
    float a=0.0;float b=1.0;float t=0.0;
    for(int i=0;i<DETAIL;i++){float n=noise(x);a+=b*n;t+=b;b*=0.7;x*=2.0;}
    return a/t;
}
float fbm2(vec2 x){
    float a=0.0;float b=1.0;float t=0.0;
    for(int i=0;i<DETAIL;i++){float n=noise(x);a+=b*n;t+=b;b*=0.9;x*=2.0;}
    return a/t;
}
float box(vec2 uv,float x1,float x2,float y1,float y2){
    return (uv.x>x1&&uv.x<x2&&uv.y>y1&&uv.y<y2)?1.0:0.0;
}
#define dot2(v) dot(v,v)
#define layer(dh,v) if(uv.y<h+midlevel-(dh)) return vec4(v,1.0);
 
vec4 foreground(vec2 uv,float t){
    float midlevel;float h;float disp;float dist;vec2 uv2;
    uv.y-=0.2;
    midlevel=-0.1;disp=1.45;dist=1.0;
    uv2=uv+vec2(t/dist+40.0,0.0);
    h=min((fbm(uv2)-0.5)*disp,0.5);
    layer(0.12,vec3(0.43,0.32,0.31));
    layer(0.08,vec3(0.55,0.42,0.41));
    layer(0.04,vec3(0.66,0.42,0.40));
    layer(0.0,vec3(0.77,0.48,0.46));
    midlevel=0.05;disp=1.45;dist=2.0;
    uv2=uv+vec2(t/dist+38.0,0.0);
    h=min((fbm(uv2)-0.5)*disp,0.5);
    layer(0.10,vec3(0.95,0.66,0.48));
    layer(0.04,vec3(0.98,0.76,0.64));
    layer(0.0,vec3(0.95,0.80,0.77));
    return vec4(0.95,0.80,0.77,0.0);
}
 
vec4 background(vec2 uv,float t){
    float midlevel;float h;float disp;float dist;vec2 uv2;
    midlevel=0.3;disp=0.9;dist=10.0;
    uv2=uv+vec2(t/dist+32.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.14,vec3(0.48,0.19,0.20));
    layer(0.10,vec3(0.68,0.28,0.19));
    layer(0.07,vec3(0.88,0.38,0.24));
    layer(0.0,vec3(0.95,0.45,0.30));
    midlevel=0.35;disp=1.0;dist=15.0;
    uv2=uv+vec2(t/dist+30.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.04,vec3(0.98,0.76,0.64));
    layer(0.0,vec3(0.95,0.80,0.77));
    midlevel=0.35;disp=3.5;dist=20.0;
    uv2=uv+vec2(t/dist+27.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.12,vec3(0.43,0.32,0.31));
    layer(0.08,vec3(0.55,0.42,0.41));
    layer(0.04,vec3(0.66,0.42,0.40));
    layer(0.0,vec3(0.77,0.48,0.46));
    midlevel=0.45;disp=2.0;dist=25.0;
    uv2=uv+vec2(t/dist+23.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.04,vec3(0.98,0.57,0.36));
    layer(0.0,vec3(1.0,0.62,0.44));
    midlevel=0.5;disp=2.3;dist=30.0;
    uv2=uv+vec2(t/dist+20.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.12,vec3(0.41,0.27,0.27));
    layer(0.08,vec3(0.53,0.35,0.32));
    layer(0.04,vec3(0.80,0.24,0.17));
    layer(0.0,vec3(0.99,0.29,0.20));
    midlevel=0.5;disp=2.5;dist=35.0;
    uv2=uv+vec2(t/dist+18.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.88,0.38,0.24));
    layer(0.05,vec3(0.98,0.42,0.28));
    layer(0.0,vec3(1.0,0.48,0.35));
    midlevel=0.6;disp=2.0;dist=40.0;
    uv2=uv+vec2(t/dist+18.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.95,0.66,0.48));
    layer(0.0,vec3(1.0,0.76,0.60));
    midlevel=0.75;disp=3.5;dist=45.0;
    uv2=uv+vec2(t/dist+15.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.20,vec3(1.0,0.55,0.33));
    layer(0.15,vec3(0.98,0.50,0.24));
    layer(0.10,vec3(0.90,0.55,0.40));
    layer(0.0,vec3(1.0,0.62,0.44));
    midlevel=0.7;disp=2.7;dist=50.0;
    uv2=uv+vec2(t/dist+12.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.04,vec3(0.73,0.36,0.30));
    layer(0.0,vec3(0.80,0.40,0.34));
    midlevel=0.8;disp=2.7;dist=60.0;
    uv2=uv+vec2(t/dist+9.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.93,0.58,0.35));
    layer(0.0,vec3(1.0,0.76,0.60));
    midlevel=0.9;disp=3.0;dist=70.0;
    uv2=uv+vec2(t/dist+7.0,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.56,0.25,0.22));
    layer(0.05,vec3(0.60,0.30,0.27));
    layer(0.0,vec3(0.74,0.35,0.30));
    midlevel=1.0;disp=5.0;dist=100.0;
    uv2=uv+vec2(t/dist+3.5,0.0);
    h=(fbm(uv2)-0.5)*disp;
    layer(0.10,vec3(0.92,0.85,0.82));
    layer(0.0,vec3(1.0,0.94,0.91));
    /* 原版蓝天 fallback 回归 */
    return vec4(0.58,0.7,1.0,1.0);
}
 
void main(){
    vec2 fragCoord=gl_FragCoord.xy;
    vec2 uv=fragCoord/iResolution.y*1.3;
    float t=iTime*2.0;              /* 原版*4.0，按要求降速 */
    vec4 bg=background(uv,t);
 
    vec4 fg=vec4(0.0);
    if(uv.y<0.5){
        for(int i=0;i<5;i++){
            fg+=foreground(uv,t+4.0*float(i)/5.0/60.0)/5.0;
        }
    }
    vec3 col=bg.rgb;
 
    if(uTrain>0.5){
        uv.y-=0.2;
        uv.x-=0.65*1.3*(iResolution.x/iResolution.y)-0.47;
        vec2 uv2=fract(uv*9.0);
        float wagon=1.0;
        wagon*=1.0-step(0.45,uv.x);
        wagon*=1.0-step(0.115,uv.y);
        wagon*=step(0.103,uv.y);
        wagon*=step(0.05,1.0-abs(uv2.x*2.0-1.0));
        float join=1.0;
        join*=1.0-step(0.45,uv.x);
        join*=1.0-step(0.11,uv.y);
        join*=step(0.107,uv.y);
        float roof=1.0;
        roof*=1.0-step(0.45,uv.x);
        roof*=1.0-step(0.117,uv.y);
        roof*=step(0.11,uv.y);
        roof*=step(0.15,1.0-abs(uv2.x*2.0-1.0));
        float loco=box(uv,0.45,0.5,0.103,0.112);
        float chem1=box(uv,0.49,0.495,0.103,0.12);
        float chem2=box(uv,0.488,0.496,0.12,0.123);
        float locoRoof=box(uv,0.443,0.47,0.11,0.117);
        float wheel=1.0-step(0.00004,dot2(uv-vec2(0.457,0.106)));
        wheel+=1.0-step(0.00002,dot2(uv-vec2(0.487,0.105)));
        wheel+=1.0-step(0.00002,dot2(uv-vec2(0.497,0.105)));
        if(uv.x<0.45&&uv.y>0.025&&uv.y<0.2){
            wheel+=1.0-step(0.002,dot2(uv2-vec2(0.2,0.95)));
            wheel+=1.0-step(0.002,dot2(uv2-vec2(0.8,0.95)));
        }
        col=mix(col,vec3(0.18,0.12,0.15),join);
        col=mix(col,vec3(0.48,0.19,0.20),wagon);
        col=mix(col,vec3(0.18,0.12,0.15),roof);
        col=mix(col,vec3(0.38,0.19,0.20),loco);
        col=mix(col,vec3(0.38,0.19,0.20),chem1);
        col=mix(col,vec3(0.18,0.12,0.15),locoRoof);
        col=mix(col,vec3(0.18,0.12,0.15),chem2+wheel);
        float dist=5.0;
        vec2 uv3=uv+vec2(t/dist+3.5,0.0);
        uv3.x-=t/dist*0.2;
        float h=fbm2(uv3)-0.55;
        if(uv.x<0.49){
            float x=-uv.x+0.49;
            float y=abs(uv.y+h*0.4-0.16*sqrt(x)-0.12)-0.8*x*exp(-x*10.0);
            if(y<0.0)col=vec3(1.0,0.94,0.91);
            if(y<-0.02)col=vec3(0.92,0.85,0.82);
        }
        uv3=uv+vec2(t/dist+32.5,0.0);
        uv3.x=fract(uv3.x*3.0);
        float k=1.0;
        k*=smoothstep(0.001,0.003,abs(uv3.y-pow(uv3.x-0.5,2.0)*0.15-0.12));
        k*=min(step(0.05,1.0-abs(uv3.x*2.0-1.0))+step(0.17,uv3.y),1.0);
        k*=min(smoothstep(0.02,0.05,1.0-abs(uv3.x*2.0-1.0))+step(0.177,uv3.y),1.0);
        k*=min(step(0.1,uv3.y)+smoothstep(-0.09,-0.085,-uv3.y-0.001/(1.0-abs(uv3.x*2.0-1.0))),1.0);
        k*=min(smoothstep(0.05,0.2,1.0-abs(fract(uv3.x*16.0)*2.0-1.0))+step(0.12,uv3.y-pow(uv3.x-0.5,2.0)*0.15)+step(-0.1,-uv3.y),1.0);
        col=mix(vec3(0.29,0.09,0.08)*smoothstep(-0.08,0.08,uv.y),col,k);
    }
 
    col=mix(col,fg.rgb,fg.a);
 
    /* 原版 vignette 后处理（并入） */
    uv=fragCoord/iResolution.xy;
    col*=0.5+0.5*pow(16.0*uv.x*uv.y*(1.0-uv.x)*(1.0-uv.y),0.2);
    col*=uExposure;                 /* 昼夜曝光 */
    gl_FragColor=vec4(col,1.0);
}
 
`;
 
var VERT='attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
 
function sh(type,src){
  var s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));return null;
  }
  return s;
}
var vs=sh(gl.VERTEX_SHADER,VERT),fs=sh(gl.FRAGMENT_SHADER,FRAG);
if(!vs||!fs){document.body.classList.add('nogl');return;}
var prog=gl.createProgram();
gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
gl.useProgram(prog);
 
var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 
/* ===== 复刻 iChannel0：1024²纯随机贴图（Shadertoy原生等价，逐像素白噪声） ===== */
var tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
var TN=1024,data=new Uint8Array(TN*TN*4);
for(var i=0;i<data.length;i+=4){
  var v=(Math.random()*256)|0;
  data[i]=v;data[i+1]=v;data[i+2]=v;data[i+3]=255;
}
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,TN,TN,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
gl.uniform1i(gl.getUniformLocation(prog,'uNoise'),0);
 
var uRes=gl.getUniformLocation(prog,'iResolution');
var uTime=gl.getUniformLocation(prog,'iTime');
var uTrain=gl.getUniformLocation(prog,'uTrain');
var trainOn=location.search.indexOf('train=0')===-1?1.0:0.0;
gl.uniform1f(uTrain,trainOn);
var uExp=gl.getUniformLocation(prog,'uExposure');
gl.uniform1f(uExp,1.0);
window.__setExposure=function(v){gl.uniform1f(uExp,v);};
 
function resize(){
  var rect=canvas.getBoundingClientRect();
  var w=Math.floor(rect.width*DPR),h=Math.floor(rect.height*DPR);
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w;canvas.height=h;
    gl.viewport(0,0,w,h);
  }
}
addEventListener('resize',resize);resize();
 
var t0=performance.now(),running=true,t=0;
document.addEventListener('visibilitychange',function(){
  running=!document.hidden;
  if(running){t0=performance.now()-t;requestAnimationFrame(loop);}
});
function loop(now){
  if(!running)return;
  t=(now-t0)/1000;
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,t);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
