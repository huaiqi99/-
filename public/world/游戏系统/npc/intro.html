<!DOCTYPE html>
<!-- ============================================================
     千律州模拟器 · intro.html v0.4（绑定演出 · 完整重写版）
     流程：触碰唤醒 → 系统弹窗 → 打字机 → 散字+整页消散 → 跳hub
     v0.2渐变格线背景 / v0.2温和碎裂 / 无屏闪 / FAST≈3.5s
     声音：WebAudio合成音效；完成后 postMessage intro:done
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="prefetch" href="./系统.html">
<title>千律州系统 · 绑定演出</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/fusion-pixel-12px-monospaced-zh_hans@latest/font.css');
:root{
  --bg:#F0EFEB; --card:#FAF9F5; --line:#222C6E; --line-soft:rgba(34,44,110,.32);
  --red:#550F10; --red-ink:#F0EFEB; --ink:#26263A; --ink-2:#777A93;
  --gold:#C9A24F; --checker-a:#222C6E; --checker-b:#F0EFEB;
  --gred:rgba(85,15,16,.30); --gblue:rgba(34,44,110,.30);
}
body.night{
  --bg:#D6D4C2; --card:#F0EFEB; --line:#0C365A; --line-soft:rgba(12,54,90,.45);
  --red:#A8443E; --red-ink:#F2EDE0; --ink:#24344D; --ink-2:#5D6B80;
  --gold:#A8443E; --checker-a:#0C365A; --checker-b:#D6D4C2;
  --gred:rgba(168,68,62,.34); --gblue:rgba(12,54,90,.30);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:"Georgia","Songti SC",serif;min-height:100vh;overflow:hidden;}
.px{font-family:'Fusion Pixel 12px monospaced zh_hans',"Courier New",monospace;}
.hidden{display:none !important;}
.gone{opacity:0 !important;transition:opacity .15s ease;}
 
/* ===== 渐变格线背景：左上蓝 → 右下红 ===== */
.bgwrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bggrid{position:absolute;inset:0;display:block;
  background-image:linear-gradient(var(--gc) 1px,transparent 1px),linear-gradient(90deg,var(--gc) 1px,transparent 1px);
  background-size:26px 26px;animation:gridpan 18s linear infinite;}
.g-red{--gc:var(--gred);-webkit-mask-image:linear-gradient(315deg,#000 0%,transparent 62%);mask-image:linear-gradient(315deg,#000 0%,transparent 62%);}
.g-blue{--gc:var(--gblue);-webkit-mask-image:linear-gradient(135deg,#000 0%,transparent 62%);mask-image:linear-gradient(135deg,#000 0%,transparent 62%);}
@keyframes gridpan{to{background-position:52px 52px,52px 52px}}
 
/* ===== 阶段0：触碰唤醒 ===== */
#touch{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;}
.t-ring{width:120px;height:120px;border:2px solid var(--line);position:relative;animation:ringpulse 2.4s ease-in-out infinite;}
.t-ring::before,.t-ring::after{content:"";position:absolute;inset:-14px;border:2px dashed var(--line-soft);animation:ringspin 12s linear infinite;}
.t-ring::after{inset:-28px;border-color:var(--line-soft);animation-direction:reverse;opacity:.6;}
@keyframes ringpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ringspin{to{transform:rotate(360deg)}}
.t-ring i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;background:var(--red);}
.t-text{font-size:1.15rem;letter-spacing:6px;animation:tpulse 1.4s ease-in-out infinite;}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.45}}
.t-sub{font-size:.6rem;letter-spacing:4px;color:var(--ink-2);}
 
/* ===== 阶段1-2：系统弹窗 ===== */
#stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;}
#win{width:min(560px,92%);transition:opacity .15s ease;}
.winbar{display:flex;align-items:center;gap:10px;background:var(--red);color:var(--red-ink);
  padding:9px 14px;font-size:.72rem;letter-spacing:3px;}
.winbar .dots{display:flex;gap:6px;}
.winbar .dots i{width:9px;height:9px;background:var(--red-ink);opacity:.85;}
.winbar .wno{margin-left:auto;font-size:.58rem;opacity:.75;}
#winbox{background:var(--card);border:2px solid var(--line);border-top:none;padding:20px 22px 0;}
#lines{min-height:210px;}
.cline{font-size:.66rem;letter-spacing:1px;color:var(--ink-2);line-height:2.1;white-space:pre;}
.sline{font-size:.86rem;letter-spacing:3px;line-height:2.4;}
.sline.final{color:var(--red);font-size:1rem;letter-spacing:4px;padding:6px 0 10px;}
.sline.final i.fly{display:inline-block;font-style:normal;animation:charfly .6s ease-in forwards;}
@keyframes charfly{to{transform:translate(var(--fx),var(--fy)) rotate(var(--fr));opacity:0;}}
.caret{display:inline-block;width:8px;height:14px;background:var(--gold);vertical-align:-2px;animation:cblink .9s steps(2) infinite;}
@keyframes cblink{50%{opacity:0}}
.ok{color:var(--gold);font-weight:700;}
/* 菱形进度 */
#prog{display:flex;gap:7px;padding:14px 0 16px;}
#prog i{width:13px;height:13px;background:transparent;border:2px solid var(--line-soft);transform:rotate(45deg) scale(.82);transition:all .25s;}
#prog i.on{background:var(--red);border-color:var(--red);transform:rotate(45deg) scale(1);}
/* 弹窗底部彩带 */
.wribbon{height:12px;margin:0 -22px;background:repeating-linear-gradient(90deg,var(--checker-a) 0 14px,transparent 14px 26px,var(--checker-b) 26px 32px,transparent 32px 44px);background-size:44px 100%;animation:rib 6s linear infinite;opacity:.8;}
@keyframes rib{to{background-position:44px 0}}
.flicker{animation:wake .5s ease-out 1;}
@keyframes wake{from{opacity:.25}to{opacity:1}}
.fasttip{position:fixed;top:14px;right:16px;z-index:20;font-size:.6rem;letter-spacing:3px;color:var(--ink-2);}
 
/* ===== 整页消散 ===== */
.shardwrap{position:fixed;inset:0;z-index:90;pointer-events:none;}
.shardwrap i{position:absolute;background:var(--bg);animation-fill-mode:forwards;}
@keyframes shfly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0;}}
</style>
</head>
<body>
<div class="bgwrap"><i class="bggrid g-red"></i><i class="bggrid g-blue"></i></div>
 
<div id="touch">
  <div class="t-ring"><i></i></div>
  <div class="t-text px">【 触碰以建立连接 】</div>
  <div class="t-sub px">TOUCH TO ESTABLISH LINK</div>
</div>
 
<div id="stage" class="hidden">
  <div id="win">
    <div class="winbar px"><span class="dots"><i></i><i></i><i></i></span>SYS://BINDING<span class="wno">№ 0x0721</span></div>
    <div id="winbox">
      <div id="lines"></div>
      <div id="prog"></div>
      <div class="wribbon"></div>
    </div>
  </div>
</div>
 
<script>
/* ===== 环境 ===== */
var FAST=false;
try{FAST=localStorage.getItem('intro_seen')==='1';}catch(e){}
var skipped=false;
var touch=document.getElementById('touch');
var stage=document.getElementById('stage');
var win=document.getElementById('win');
var lines=document.getElementById('lines');
var prog=document.getElementById('prog');
(function(){for(var i=0;i<8;i++){prog.appendChild(document.createElement('i'));}})();
 
/* ===== 合成音效 ===== */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,dur,type,vol,delay){
  var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);
  o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function sBlip(){tone(880,.08,'square',.09);tone(1320,.06,'square',.05,.09);}
function sTick(){tone(2400+Math.random()*600,.025,'square',.03);}
function sOk(){tone(660,.07,'square',.05);tone(990,.09,'square',.05,.08);}
function sJingle(){tone(523,.12,'square',.06);tone(659,.12,'square',.06,.13);tone(880,.2,'square',.06,.26);}
function sWhoosh(){
  var a=ac();if(!a)return;
  var len=a.sampleRate*.5,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var src=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();
  fl.type='bandpass';fl.frequency.setValueAtTime(3200,a.currentTime);fl.frequency.exponentialRampToValueAtTime(300,a.currentTime+.5);
  src.buffer=buf;g.gain.value=.10;src.connect(fl);fl.connect(g);g.connect(a.destination);src.start();
}
 
/* ===== 剧本 ===== */
var SCRIPT=[
 {t:'c',x:'LOADING MODULE: TASK_BAR ............ [ OK ]',ok:true},
 {t:'s',x:'【检测到未登记个体】'},
 {t:'c',x:'LOADING MODULE: MEMORY ............. [ OK ]',ok:true},
 {t:'s',x:'【身份核验……通过】'},
 {t:'p'},
 {t:'s',x:'【绑定完成】'},
 {t:'s',x:'【欢迎回来，怀榆】',final:true}
];
function progStep(n){var b=prog.children;for(var i=0;i<n&&i<b.length;i++)b[i].classList.add('on');}
function addCaret(el){var c=document.createElement('i');c.className='caret px';el.appendChild(c);return c;}
 
/* 终场散字：字符化作飞散像素 */
function scatterFinal(el){
  var txt=el.textContent;el.textContent='';
  var frag=document.createDocumentFragment();
  txt.split('').forEach(function(ch){
    var sp=document.createElement('i');sp.className='fly px';
    sp.textContent=ch===' '?'\u00A0':ch;
    sp.style.setProperty('--fx',(Math.random()*160-80)+'px');
    sp.style.setProperty('--fy',(Math.random()*-120-30)+'px');
    sp.style.setProperty('--fr',(Math.random()*40-20)+'deg');
    sp.style.animationDelay=(Math.random()*180)+'ms';
    frag.appendChild(sp);
  });
  el.appendChild(frag);
  setTimeout(function(){try{sWhoosh();}catch(e){}},150);
}
 
/* 整页消散：米白碎块+零星红蓝点缀 */
function pageShatter(){
  var wrap=document.createElement('div');wrap.className='shardwrap';
  var cols=12,rows=8,cw=100/cols,ch=100/rows;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var d=document.createElement('i');
    var pick=(r*7+c*3)%11;
    if(pick===0)d.style.background='var(--red)';
    else if(pick===5)d.style.background='var(--line)';
    else{d.style.background='var(--bg)';d.style.border='1px solid var(--line-soft)';}
    d.style.width=(cw*.62)+'%';d.style.height=(ch*.62)+'%';
    d.style.left='calc('+(c*cw)+'% + '+(cw*.19)+'%)';
    d.style.top='calc('+(r*ch)+'% + '+(ch*.19)+'%)';
    var dx=(c-(cols-1)/2)*(14+Math.random()*22);
    var dy=(r-(rows-1)/2)*(14+Math.random()*22);
    d.style.setProperty('--dx',dx+'px');d.style.setProperty('--dy',dy+'px');
    d.style.setProperty('--rot',(Math.random()*16-8)+'deg');
    d.style.animation='shfly '+(260+Math.random()*220)+'ms ease-in '+(Math.random()*110)+'ms forwards';
    wrap.appendChild(d);
  }
  document.body.appendChild(wrap);
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);},1400);
}
 
/* 就绪：通知壳 / 独立预览则跳转 */
function finish(){
  if(skipped)return;skipped=true;
  try{stage.classList.add('gone');}catch(e){}
  try{document.querySelector('.fasttip').classList.add('gone');}catch(e){}
  try{pageShatter();sWhoosh();}catch(e){}
  try{localStorage.setItem('intro_seen','1');}catch(e){}
  try{if(window.parent!==window)parent.postMessage({type:'intro:done'},'*');}catch(e){}
  setTimeout(function(){location.replace('./系统.html');},FAST?380:460);
}
 
/* ===== 演出引擎 ===== */
function runShow(){
  stage.classList.remove('hidden');
  win.classList.add('flicker');
  var idx=0;
  (function next(){
    if(skipped)return;
    if(idx>=SCRIPT.length)return;
    var L=SCRIPT[idx++];
    if(L.t==='c'){
      var el=document.createElement('div');el.className='cline px';lines.appendChild(el);
      var caret=addCaret(el),i=0;
      (function tc(){
        if(skipped)return;
        if(i>=L.x.length){
          el.removeChild(caret);
          var ok=document.createElement('span');ok.className='ok px';ok.textContent='[ OK ]';
          el.appendChild(ok);
          if(L.ok)sOk();progStep(idx*2);setTimeout(next,FAST?120:330);
          return;
        }
        el.insertBefore(document.createTextNode(L.x[i]),caret);
        if(!FAST&&i%2===0)sTick();i++;setTimeout(tc,FAST?26:55);
      })();
    }else if(L.t==='p'){
      progStep(8);setTimeout(next,FAST?120:280);
    }else{
      var el2=document.createElement('div');el2.className='sline'+(L.final?' final':'');lines.appendChild(el2);
      var caret2=addCaret(el2),j=0;
      (function ts(){
        if(skipped)return;
        if(j>=L.x.length){
          el2.removeChild(caret2);
          if(L.final){
            setTimeout(function(){
              if(skipped)return;sJingle();
              scatterFinal(el2);setTimeout(finish,750);
            },FAST?400:1000);
          }else setTimeout(next,FAST?120:350);
          return;
        }
        el2.insertBefore(document.createTextNode(L.x[j]),caret2);
        if(!FAST&&j%2===0)sTick();j++;setTimeout(ts,FAST?26:55);
      })();
    }
  })();
}
 
/* ===== 主题：读取+实时监听 ===== */
function applyTheme(){try{
  var t=JSON.parse(localStorage.getItem('theme')||'null');
  document.body.classList.toggle('night',!!(t&&t.value==='dark'));
}catch(e){}}
applyTheme();
window.addEventListener('storage',function(e){if(e.key==='theme')applyTheme();});
 
/* ===== 入口 ===== */
touch.onclick=function(){touch.classList.add('hidden');sBlip();runShow();};
stage.onclick=function(){finish();};
if(FAST){
  touch.classList.add('hidden');
  var ft=document.createElement('div');ft.className='fasttip px';ft.textContent='FAST BOOT · 快速载入';
  document.body.appendChild(ft);
  setTimeout(function(){stage.classList.remove('hidden');runShow();},300);
}
</script>
</body>
</html>
