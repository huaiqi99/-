<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>千律州系统 · 开机自检</title>
<!--
  ════════════════════════════════════════════════════════════════
  开屏动画 · 千律州模拟器 v3
  改编自开源项目 dsh-startup-screen (MIT License, 含真声素材)
  github.com/6shenhonghong9/dsh-startup-screen —— 感谢原作者
  衬线字体 · 全链无黑 · 日夜跟随系统 · 音频在同目录 assets/
  部署：开屏.html + assets/ 文件夹（8个mp3）一起上传
  ════════════════════════════════════════════════════════════════
-->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #F0EFEB; }
</style>
<style>
/* 原项目样式（MIT，已按千律州规范改造） */
/* ============================================================================
 * dsh-startup-screen — 启动界面 / 启动动画样式
 * ----------------------------------------------------------------------------
 * 风格取自参考片（Hypergryph 式开机序列）：黑色序幕 → 灰白过曝洗白 → 暖白
 * "技术档案" 底板 → 等宽字距状态行 → 环形准星扫描 → WELCOME 版式 → 色散故障。
 *
 * 全部字体都取系统自带字体，零网络依赖：
 *   --dsu-din   Bahnschrift（Windows 10+ 自带 DIN 1451 风格，对应参考片里
 *               "RHINE LAB / SYNTHESIZE INFORMATION" 那种窄体技术字）
 *   --dsu-mono  Cascadia Mono / Consolas（对应参考片里的等宽字距小字）
 *   --dsu-zh    微软雅黑（对应参考片底部中文小字幕）
 * ========================================================================== */
 
#dsh-startup-root,
#dsh-startup-root *,
#dsh-startup-root *::before,
#dsh-startup-root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
 
#dsh-startup-root {
  /* —— 配色（浅色 / 参考片色板）—— */
  --dsu-bg: #e5e3df;
  --dsu-bg-2: #eceae6;
  --dsu-ink: #0a0a0a;
  --dsu-ink-soft: #3a3936;
  --dsu-muted: #7a7873;
  --dsu-hair: rgba(10, 10, 10, 0.16);
  --dsu-hair-soft: rgba(10, 10, 10, 0.07);
  --dsu-accent: #550F10;
  --dsu-glitch-a: #ff3b30;
  --dsu-glitch-b: #2971b8;
  --dsu-box-bg: #0a0a0a;
  --dsu-box-ink: #ffffff;
  --dsu-sub-glow: 0 0 6px rgba(255, 255, 255, 0.9);
 
  /* 字体全部取系统自带，不下发 webfont（启动零抖动）。
     三档回退链覆盖 Win / macOS / Linux：
       DIN 风格窄体重黑：Bahnschrift(Win) → DIN Alternate(macOS) → Ubuntu/Roboto Condensed(Linux)
       等宽：Cascadia Mono(Win) → SFMono/Consolas → DejaVu Sans Mono(Linux)
       中文：微软雅黑(Win) → 苹方(macOS) → 思源/Noto/WQY(Linux)
     完全没有时退到通用 sans-serif —— 版式不变，只是字面观感略有差异。 */
  --dsu-din: "Bahnschrift", "DIN Alternate", "DIN Condensed", "Archivo", "Oswald",
    "Arial Narrow", "Liberation Sans Narrow", "Ubuntu Condensed", "Roboto Condensed",
    "Noto Sans Display", "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  --dsu-mono: "Cascadia Mono", "SFMono-Regular", "Consolas", "Menlo", "DejaVu Sans Mono",
    "Liberation Mono", "Noto Sans Mono", ui-monospace, monospace;
  --dsu-zh: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "HarmonyOS Sans SC",
    "Source Han Sans SC", "Noto Sans CJK SC", "Noto Sans SC", "WenQuanYi Micro Hei",
    sans-serif;
 
  --dsu-speed: 1;
 
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  overflow: hidden;
  background: var(--dsu-bg);
  color: var(--dsu-ink);
  font-family: var(--dsu-din);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  cursor: default;
  -webkit-user-select: none;
  user-select: none;
  contain: layout paint style;
}
 
/* 逐字渐显（typeIn）：用不透明度而非截断，居中排版不会左右抖动 */
.dsu-status .dsu-ch,
.dsu-sub-en .dsu-ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(0.16em);
  transition: opacity 340ms ease, transform 340ms ease;
}
.dsu-sub-en .dsu-ch { transform: translateY(0.1em); transition-duration: 300ms; }
.dsu-status.dsu-in .dsu-ch,
.dsu-sub-en.dsu-in .dsu-ch { opacity: 1; transform: none; }
 
/* 中央标识与终幕标识统一取当前文字色 */
.dsu-logo svg,
.dsu-w3 svg { fill: currentColor; }
 
/* 深色主题：同一套版式，换成暗底板 */
#dsh-startup-root.dsu-dark {
  --dsu-bg: #0b0b0c;
  --dsu-bg-2: #131315;
  --dsu-ink: #f2f1ee;
  --dsu-ink-soft: #cfcecb;
  --dsu-muted: #85847f;
  --dsu-hair: rgba(255, 255, 255, 0.18);
  --dsu-hair-soft: rgba(255, 255, 255, 0.07);
  --dsu-box-bg: #f2f1ee;
  --dsu-box-ink: #0b0b0c;
  --dsu-sub-glow: 0 0 6px rgba(0, 0, 0, 0.9);
  background: var(--dsu-bg);
}
 
/* 首屏兜底：脚本还没跑起来时也要先糊住整个窗口，避免闪出应用本体 */
#dsh-startup-root.dsu-boot::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--dsu-bg);
  z-index: 90;
}
 
#dsh-startup-root.dsu-gone {
  opacity: 0;
  pointer-events: none;
  transition: opacity 620ms cubic-bezier(0.4, 0, 0.2, 1);
}
 
/* ── 底板 ───────────────────────────────────────────────────────────────── */
.dsu-plate {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 78% 12%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 55%),
    linear-gradient(168deg, var(--dsu-bg-2) 0%, var(--dsu-bg) 42%, var(--dsu-bg) 100%);
  opacity: 0;
}
 
.dsu-dark .dsu-plate {
  background:
    radial-gradient(120% 90% at 78% 12%, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0) 55%),
    linear-gradient(168deg, var(--dsu-bg-2) 0%, var(--dsu-bg) 42%, var(--dsu-bg) 100%);
}
 
/* 背景里若隐若现的档案面板（参考片右侧极淡的方块群） */
.dsu-watermark {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}
.dsu-wm {
  position: absolute;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
  border: 1px solid var(--dsu-hair-soft);
}
.dsu-dark .dsu-wm {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0));
}
 
/* 细颗粒噪点，让大色块不"塑料" */
.dsu-grain {
  position: absolute;
  inset: -50%;
  opacity: 0.05;
  transition: opacity 300ms ease;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.6'/></svg>");
}
 
/* ── 第一幕：黑幕 + DeepSeek 标识 ─────────────────────────────────────── */
.dsu-black {
  position: absolute;
  inset: 0;
  background: var(--dsu-bg);
  display: grid;
  place-items: center;
  z-index: 40;
  opacity: 1;
}
.dsu-black-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 560ms ease, transform 560ms ease;
}
.dsu-black-inner.dsu-in {
  opacity: 1;
  transform: none;
}
.dsu-black-inner.dsu-out {
  opacity: 0;
  transform: scale(1.045);
  transition: opacity 620ms ease, transform 620ms ease;
}
.dsu-whale {
  display: block;
  fill: currentColor;
}
.dsu-black .dsu-whale {
  width: 122px;
  height: 122px;
  color: var(--dsu-accent);
  margin-bottom: 18px;
}
.dsu-black-zh {
  font-family: var(--dsu-zh);
  font-size: 33px;
  font-weight: 700;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  color: var(--dsu-accent);
}
.dsu-black-en {
  margin-top: 9px;
  font-family: var(--dsu-din);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 0.62em;
  text-indent: 0.62em;
  color: var(--dsu-ink);
  transition: letter-spacing 1300ms cubic-bezier(0.16, 0.84, 0.24, 1);
}
.dsu-black-en.dsu-tighten {
  letter-spacing: 0.2em;
  text-indent: 0.2em;
}
.dsu-black-sub {
  margin-top: 12px;
  font-family: var(--dsu-mono);
  font-size: 10px;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: rgba(255, 255, 255, 0.5);
}
/* 扫光：一条极淡的白色横条掠过标识 */
.dsu-sweep {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 42%;
  left: -50%;
  background: linear-gradient(
    100deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.055) 42%,
    rgba(255, 255, 255, 0.12) 50%,
    rgba(255, 255, 255, 0.055) 58%,
    rgba(255, 255, 255, 0) 100%
  );
  pointer-events: none;
}
.dsu-sweep.dsu-go {
  animation: dsu-sweep 1150ms cubic-bezier(0.32, 0, 0.2, 1) forwards;
}
@keyframes dsu-sweep {
  from { left: -50%; }
  to { left: 118%; }
}
 
/* 过曝洗白：黑 → 灰 → 白 → 底板 */
.dsu-wash {
  position: absolute;
  inset: 0;
  background: #8b8a88;
  opacity: 0;
  z-index: 35;
  pointer-events: none;
}
.dsu-flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  z-index: 60;
  pointer-events: none;
}
 
/* ── 品牌块（左上角）──────────────────────────────────────────────────── */
/* 黑幕结束后统一"滑到位"：左侧文字从 -22px 滑入，右侧元素从 +18px 滑入，
   按 60ms 一档错开；不再用裁剪式擦除 */
.dsu-brand {
  position: absolute;
  left: 46px;
  top: 44px;
  z-index: 20;
  color: var(--dsu-ink);
}
.dsu-brand-1,
.dsu-brand-2,
.dsu-brand-3 {
  opacity: 0;
  transform: translateX(-22px);
  transition: opacity 560ms cubic-bezier(0.16, 0.84, 0.24, 1),
    transform 560ms cubic-bezier(0.16, 0.84, 0.24, 1);
}
.dsu-brand-1 {
  font-size: 33px;
  font-weight: 700;
  letter-spacing: 0.012em;
  line-height: 0.98;
}
.dsu-brand-2 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.012em;
  margin-top: 3px;
}
.dsu-brand-3 {
  font-size: 30px;
  font-weight: 400;
  line-height: 1.06;
  letter-spacing: 0.012em;
  display: flex;
  align-items: baseline;
  gap: 9px;
}
.dsu-brand-3 b { font-weight: 700; }
.dsu-brand.dsu-in .dsu-brand-1 { opacity: 1; transform: none; transition-delay: 60ms; }
.dsu-brand.dsu-in .dsu-brand-2 { opacity: 1; transform: none; transition-delay: 150ms; }
.dsu-brand.dsu-in .dsu-brand-3 { opacity: 1; transform: none; transition-delay: 240ms; }
 
/* 中央状态区 */
.dsu-center {
  position: absolute;
  left: 0;
  right: 0;
  top: 47%;
  transform: translateY(-50%);
  z-index: 22;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  pointer-events: none;
  transition: opacity 340ms ease;
}
/* 终幕时整块中央区（状态行 / 分隔线 / 鲸鱼 / 虚线）必须整体退场，
   否则会和 WELCOME 版式叠在一起 */
.dsu-center.dsu-off { opacity: 0; }
 
.dsu-status {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--dsu-din);
  font-size: 44px;
  font-weight: 400;
  letter-spacing: 0.14em;
  color: var(--dsu-ink);
  opacity: 0;
  transition: opacity 300ms ease;
  white-space: nowrap;
}
.dsu-status.dsu-in { opacity: 1; }
.dsu-status.dsu-zhline {
  font-family: var(--dsu-zh);
  font-weight: 400;
  letter-spacing: 0.22em;
  text-indent: 0.22em;
  font-size: 40px;
}
.dsu-caret {
  display: inline-block;
  width: 15px;
  height: 4px;
  background: var(--dsu-accent);
  transform: translateY(3px);
  opacity: 0;
}
.dsu-caret.dsu-on {
  opacity: 1;
  animation: dsu-blink 1s steps(1, end) infinite;
}
@keyframes dsu-blink { 50% { opacity: 0; } }
 
.dsu-sub-en {
  margin-top: 14px;
  font-family: var(--dsu-mono);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.44em;
  text-indent: 0.44em;
  color: var(--dsu-ink-soft);
  opacity: 0;
  white-space: nowrap;
}
.dsu-sub-en.dsu-in { opacity: 1; }
 
.dsu-rule {
  margin-top: 22px;
  height: 1px;
  width: 0;
  background: var(--dsu-hair);
  transition: width 620ms cubic-bezier(0.2, 0.9, 0.2, 1);
}
.dsu-rule.dsu-in { width: min(560px, 42vw); }
 
/* 中央标识（鲸鱼）装配区 */
.dsu-logo {
  margin-top: 26px;
  height: 0;
  opacity: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: opacity 420ms ease, height 420ms ease, margin-top 420ms ease;
}
.dsu-logo.dsu-in {
  opacity: 1;
  height: 118px;
}
.dsu-logo svg {
  width: 84px;
  height: 84px;
  color: var(--dsu-ink);
}
.dsu-logolabel {
  margin-top: 10px;
  font-family: var(--dsu-mono);
  font-size: 10px;
  letter-spacing: 0.58em;
  text-indent: 0.58em;
  color: var(--dsu-ink-soft);
}
.dsu-dots {
  margin-top: 9px;
  height: 2px;
  width: 96px;
  background-image: radial-gradient(circle, var(--dsu-ink) 40%, transparent 42%);
  background-size: 12px 2px;
  background-repeat: repeat-x;
  opacity: 0.5;
}
 
/* 右侧等宽信息行（对应参考片 "· ID CONFIRMED : JOYC"） */
.dsu-idline {
  position: absolute;
  left: calc(50% + 190px);
  top: 49%;
  transform: translateY(-50%) translateX(16px);
  z-index: 22;
  font-family: var(--dsu-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--dsu-ink-soft);
  opacity: 0;
  transition: opacity 520ms ease, transform 520ms cubic-bezier(0.16, 0.84, 0.24, 1);
  transition-delay: 520ms;
  white-space: nowrap;
}
.dsu-idline.dsu-in { opacity: 1; transform: translateY(-50%); }
 
/* ── 环形准星（验证通过）───────────────────────────────────────────────── */
/* 照原片：环居中、直径约 56vw，状态字就落在环心里，两者是一个整体。
   关键是把两段弧的缺口都留在正下方 6 点钟方向，底部字幕永远不会被压到。 */
.dsu-reticle {
  position: absolute;
  left: 50%;
  top: 45%;
  width: min(56vw, 86vh, 1040px);
  height: min(56vw, 86vh, 1040px);
  transform: translate(-50%, -50%);
  z-index: 16;
  opacity: 0;
  transition: opacity 500ms ease;
  pointer-events: none;
}
.dsu-reticle.dsu-in { opacity: 1; }
.dsu-reticle svg { width: 100%; height: 100%; overflow: visible; }
.dsu-ret-rot-a { transform-origin: 50% 50%; animation: dsu-spin 9s linear infinite; }
.dsu-ret-rot-b { transform-origin: 50% 50%; animation: dsu-spin 5.4s linear infinite reverse; }
@keyframes dsu-spin { to { transform: rotate(360deg); } }
.dsu-reticle .dsu-ring-a { fill: none; stroke: var(--dsu-ink); stroke-width: 6; }
.dsu-reticle .dsu-ring-b { fill: none; stroke: var(--dsu-box-ink); stroke-width: 2.2; opacity: 0.95; }
.dsu-reticle .dsu-dot-a { fill: var(--dsu-ink); }
.dsu-reticle .dsu-dot-b { fill: var(--dsu-box-ink); }
.dsu-reticle .dsu-dot-o { fill: var(--dsu-accent); }
.dsu-reticle .dsu-bracket {
  fill: none;
  stroke: var(--dsu-ink);
  stroke-width: 1.6;
  opacity: 0.85;
}
 
/* 读取阶段的十六进制瀑布：放到原片里最空的上右区，不去和主体挤中间 */
.dsu-hex {
  position: absolute;
  right: 46px;
  top: 22%;
  width: 236px;
  height: 148px;
  overflow: hidden;
  z-index: 19;
  font-family: var(--dsu-mono);
  font-size: 10px;
  line-height: 1.55;
  letter-spacing: 0.06em;
  color: var(--dsu-ink-soft);
  opacity: 0;
  transition: opacity 320ms ease;
  text-align: right;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 74%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 22%, #000 74%, transparent);
}
.dsu-hex.dsu-in { opacity: 0.6; }
 
/* ── 交互区 ─────────────────────────────────────────────────────────────── */
.dsu-action {
  position: absolute;
  left: 0;
  right: 0;
  top: 60%;
  z-index: 26;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 320ms ease;
}
.dsu-action.dsu-in {
  opacity: 1;
  pointer-events: auto;
}
.dsu-btn {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 13px 26px;
  border: 1.5px solid var(--dsu-ink);
  background: transparent;
  color: var(--dsu-ink);
  font-family: var(--dsu-din);
  font-size: 15px;
  letter-spacing: 0.14em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color 220ms ease, border-color 220ms ease;
}
.dsu-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--dsu-ink);
  transform: translateX(-101%);
  transition: transform 300ms cubic-bezier(0.2, 0.9, 0.2, 1);
}
.dsu-btn:hover::before { transform: none; }
.dsu-btn:hover { color: var(--dsu-box-ink); }
.dsu-btn:hover .dsu-btn-en { color: var(--dsu-box-ink); opacity: 1; }
.dsu-btn > * { position: relative; z-index: 1; }
.dsu-btn:active { transform: translateY(1px); }
.dsu-btn-zh { font-family: var(--dsu-zh); font-weight: 500; }
.dsu-btn-en { font-family: var(--dsu-mono); font-size: 11px; letter-spacing: 0.24em; opacity: 0.62; }
.dsu-btn.dsu-pulse { animation: dsu-pulse 1.9s ease-in-out infinite; }
@keyframes dsu-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(85, 15, 16, 0); }
  50% { box-shadow: 0 0 0 7px rgba(85, 15, 16, 0.14); }
}
.dsu-hint {
  font-family: var(--dsu-zh);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--dsu-muted);
}
.dsu-hint kbd {
  font-family: var(--dsu-mono);
  border: 1px solid var(--dsu-hair);
  padding: 1px 5px;
  margin: 0 3px;
  font-size: 10px;
  letter-spacing: 0.06em;
}
 
/* 身份卡（第二步）：纯中文标签 + 数字，去掉了英文双写与竖排表头，尽量干净 */
.dsu-card {
  display: flex;
  flex-direction: column;
  gap: 0;
  min-width: 300px;
  padding: 2px 0;
  border-top: 1px solid var(--dsu-hair);
  border-bottom: 1px solid var(--dsu-hair);
}
/* 作者样式里的 display:flex 会盖掉 [hidden] 的 UA display:none，必须显式补一条，
   否则第一步（只要按钮、不要卡片）会露出一条空的边框 */
.dsu-card[hidden] { display: none; }
.dsu-card-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 34px;
  padding: 8px 2px;
  font-family: var(--dsu-zh);
  font-size: 12.5px;
  letter-spacing: 0.14em;
  color: var(--dsu-muted);
}
.dsu-card-row + .dsu-card-row {

       *
       * 三个关键决定：
       *  - **不 cancel 上一句**。原来每步都 cancel，用户点快一点、或者
       *    hold 短于台词长度，语音就被硬生生掐断 —— 那正是要避免的。
       *    speechSynthesis 本身是队列，不 cancel 就是顺序播报。
       *  - 提示音响过之后留 `voiceLead` 的空白再开口，这是旁白的呼吸感。
       *  - 等 `onend` 才 resolve，动画据此决定这一步停多久；个别引擎不触发
       *    onend 时按估算兜底，绝不把动画卡死。
       */
      line: function (en, zh, asset) {
        /* 有真声素材就优先用素材（音色就是你给的那个）；拿不到再回落 TTS */
        if (asset && C.voice && C.voiceSource !== 'tts' && !finished) {
          return audio.ensureAsset(asset).then(function (ok) {
            if (!ok || finished) return 0
            if (C.voiceCue !== false) audio.cue()
            return audio.playAssetAndWait(asset, 0.85).then(function (ms) {
              if (ms > 0) setMeter(true)
              return ms
            })
          }).then(function (ms) {
            if (ms > 0) { saidOnce = true; return ms }
            return ttsLine(en, zh)
          })
        }
        return ttsLine(en, zh)
      },
 
      /** TTS 路径：素材缺失 / voiceSource=tts / 终幕那条动态名字 */
      tts: function (en, zh) { return ttsLine(en, zh) },
 
      /** 不等待的版本：设置页试听 / 任何"念完就行"的场合 */
      say: function (en, zh) { return this.line(en, zh) },
 
      /** 浏览器要求"先有用户手势"才放声：第一次点击/按键解锁 + 补播当前行 */
      unlock: function () {
        try { if (supported) window.speechSynthesis.resume() } catch (e) {}
        audio.resume()
        /* 预热：先无声念一个空格，把引擎唤醒，避免第一句被吃掉开头半个字 */
        if (supported && !saidOnce) {
          try {
            var w = new window.SpeechSynthesisUtterance(' ')
            w.volume = 0
            var v = picked.en || picked.zh
            if (v) { w.voice = v; w.lang = v.lang }
            window.speechSynthesis.speak(w)
          } catch (e) { /* noop */ }
        }
        if (!saidOnce && C.voice && (pending.en || pending.zh)) this.say(pending.en, pending.zh)
      },
      speakName: spokenName,
      current: function () {
        var a = picked.en ? picked.en.name : ''
        var b = picked.zh ? picked.zh.name : ''
        return a === b ? a : (a + (b ? '  /  ' + b : ''))
      },
      listVoices: function () { return voices.slice() },
      /** 只有这里才真的掐断语音（跳过 / 揭幕） */
      stop: function () { try { if (supported) window.speechSynthesis.cancel() } catch (e) {} setMeter(false) }
    }
 
    /** TTS 合成并等它念完，resolve 实际时长(ms)；拿不到引擎时 resolve 0。 */
    function ttsLine(en, zh) {
      return new Promise(function (resolve) {
        if (!supported || !C.voice || finished) { resolve(0); return }
        pending = { en: en || '', zh: zh || '' }
        var items = []
        var mode = C.voiceLang
        if (mode === 'zh') { if (zh) items.push({ t: zh, l: 'zh-CN' }) }
        else if (mode === 'both') {
          if (zh) items.push({ t: zh, l: 'zh-CN' })
          if (en) items.push({ t: en, l: 'en-US' })
        } else if (en) { items.push({ t: en, l: 'en-US' }) }
        if (!items.length) { resolve(0); return }
 
        saidOnce = true
        if (C.voiceCue !== false) audio.cue()
 
        var startedAt = Date.now()
        var est = estimateMs(items)
        var lead = clamp01(C.voiceLead, 0, 1200)
        var settled = false
        var watchdog = null
 
        function settle() {
          if (settled) return
          settled = true
          if (watchdog) clearTimeout(watchdog)
          setMeter(false)
          resolve(Math.max(0, Date.now() - startedAt))
        }
 
        setTimeout(function () {
          if (finished) { settle(); return }
          var last = items.length - 1
          for (var i = 0; i <= last; i++) {
            var u = buildUtter(items[i].t, items[i].l)
            if (i === last) {
              u.onstart = function () { setMeter(true) }
              u.onend = settle
              u.onerror = settle
            }
            try { window.speechSynthesis.speak(u) } catch (e) { if (i === last) settle() }
          }
          watchdog = setTimeout(settle, est + 900)
        }, lead)
      })
    }
  })()
 
  /* 语音/音效接线：声卡要等用户手势才能出声，这里挂一次性解锁 */
  voice.attach(q('.dsu-voice'))
  ;(function preloadVoices() {
    if (C.voiceSource === 'tts') return
    for (var i = 0; i < STEPS.length; i++) if (STEPS[i].audio) audio.ensureAsset(STEPS[i].audio)
    audio.ensureAsset('line-6')   /* 终幕欢迎语 */
  })()
  ;(function wireSound() {
    voice.load()
    if (voice.supported && typeof window.speechSynthesis.addEventListener === 'function') {
      try { window.speechSynthesis.addEventListener('voiceschanged', function () { voice.load() }) } catch (e) {}
    }
    var unlocked = false
    function unlock() {
      if (unlocked) return
      unlocked = true
      voice.unlock()
      document.removeEventListener('pointerdown', unlock, true)
      document.removeEventListener('keydown', unlock, true)
      document.removeEventListener('touchstart', unlock, true)
    }
    document.addEventListener('pointerdown', unlock, true)
    document.addEventListener('keydown', unlock, true)
    document.addEventListener('touchstart', unlock, true)
  })()
 
  /* ── 时间线 ───────────────────────────────────────────────────────────── */
  function run() {
    return Promise.resolve()
      /* 第一幕：黑幕 --> DeepSeek 标识 */
      .then(function () { return wait(820) })
      .then(function () {
        ui.blackInner.classList.add('dsu-in')
        audio.rise()
        return wait(240)
      })
      .then(function () {
        ui.blackEn.classList.add('dsu-tighten')
        return wait(880)
      })
      .then(function () {
        ui.sweep.classList.add('dsu-go')
        return wait(760)
      })
      /* 过场：过曝洗白 */
      .then(function () {
        ui.blackInner.classList.add('dsu-out')
        audio.sweep()
        ui.wash.style.transition = 'opacity ' + ms(220) + 'ms linear'
        ui.wash.style.opacity = '1'
        return wait(260)
      })
      .then(function () {
        ui.plate.style.transition = 'opacity ' + ms(900) + 'ms ease'
        ui.plate.style.opacity = '1'
        ui.watermark.style.transition = 'opacity ' + ms(1100) + 'ms ease'
        ui.watermark.style.opacity = '1'
        ui.wash.style.transition = 'opacity ' + ms(720) + 'ms cubic-bezier(.2,.9,.2,1)'
        ui.wash.style.opacity = '0'
        ui.black.style.transition = 'opacity ' + ms(720) + 'ms ease'
        ui.black.style.opacity = '0'
        return wait(760)
      })
      /* 第二幕：品牌块 / 页脚 / 进度条 */
      .then(function () {
        ui.brand.classList.add('dsu-in')
        ui.foot.classList.add('dsu-in')
        ui.stepcount.classList.add('dsu-in')
        ui.idline.classList.add('dsu-in')
        ui.frame.classList.add('dsu-in')
        ui.slats.classList.add('dsu-in')
        ui.meta.classList.add('dsu-in')
        ui.vignette.classList.add('dsu-in')
        ui.voice.classList.add('dsu-in')
        setProgress(0.12)
        setStepCount(0, 'BOOT')
        setSlats(0)
        setSubtitle('系统自检中…', 'SYSTEM SELF-CHECK')
        if (C.allowSkip) ui.skip.classList.add('dsu-in')
        return wait(700)
      })
      .then(function () { ui.black.style.display = 'none'; sweep() })
      /* 六个阶段 */
      .then(function () { return stepLoop() })
      /* 终幕 */
      .then(function () { return finale() })
      .catch(function (err) {
        try { console.warn('[dsh-startup-screen] 动画异常，直接揭幕：', err) } catch (e2) {}
        return finish()
      })
  }
 
  function stepLoop() {
    var chain = Promise.resolve()
    STEPS.forEach(function (step, i) {
      chain = chain.then(function () {
        if (finished) return
        var n = i + 1
        setStepCount(n, step.badge)
        setSlats(n)
        setProgress(step.progress)
        setSubtitle(step.log, step.logEn)
        audio.step()
        /* 语音在这里起头，但**不阻塞**下面的文字渐显 —— 两者同时发生 */
        var spoke = voice.line(step.say, step.zh, step.audio)
 
        ui.status.classList.toggle('dsu-zhline', true)
        /* 先摘掉 dsu-in 并强制一次样式计算，新的逐字 span 才会重新走渐显动画 */
        ui.status.classList.remove('dsu-in')
        ui.subEn.classList.remove('dsu-in')
        void ui.status.offsetWidth
        typeIn(ui.statusZh, step.zh, 46)
        typeIn(ui.subEn, step.en, 13)
        ui.caret.classList.toggle('dsu-on', !!step.action && step.action !== 'auto')
        requestAnimationFrame(function () {
          if (finished) return
          ui.status.classList.add('dsu-in')
          ui.subEn.classList.add('dsu-in')
        })
        ui.rule.classList.add('dsu-in')
 
        if (step.assembleLogo) assembleLogo()
        if (step.reticle) {
          /* 照原片：准星出现时中央只留状态字，鲸鱼标识和虚线收掉，别挤成一团 */
          ui.logo.classList.remove('dsu-in')
          ui.dots.hidden = true
          ui.reticle.classList.add('dsu-in')
          sweep()
        }
        if (step.hex) startHex()
 
        /* 这一步停多久 = max(视觉基准, 实际播报时长 + 收尾留白) —— 台词长就多停，
           台词短也不会干等。用户点得快时同样等这一句念完，不掐断。 */
        function holdFor(spoken) {
          var target = Math.max(ms(step.hold), (spoken || 0) + ms(240))
          return wait(Math.max(0, target - (spoken || 0)))
        }
 
        if (step.action === 'grant' || step.action === 'confirm') {
          showAction(step)
          return wait(520).then(function () { return waitAction() }).then(function () {
            hideAction()
            audio.confirm()
            ui.caret.classList.remove('dsu-on')
            return spoke
          }).then(function () { return wait(ms(320)) })
        }
        if (step.hex) {
          return spoke.then(holdFor).then(function () { stopHex() })
        }
        return spoke.then(holdFor)
      })
    })
    return chain
  }
 
  function assembleLogo() {
    ui.logo.classList.add('dsu-in')
    ui.dots.hidden = false
    var path = ui.logo.querySelector('path')
    if (path && typeof path.getTotalLength === 'function') {
      try {
        var len = path.getTotalLength()
        path.style.fill = 'none'
        path.style.stroke = 'currentColor'
        path.style.strokeWidth = '1.1'
        path.style.strokeDasharray = len
        path.style.strokeDashoffset = len
        /* 参考片的"一笔画成"：先勾线，再落墨成面 */
        path.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: ms(1400), easing: 'cubic-bezier(.55,.06,.24,1)', fill: 'forwards' }
        )
        setTimeout(function () {
          path.style.transition = 'fill ' + ms(420) + 'ms ease, stroke-width ' + ms(420) + 'ms ease'
          path.style.fill = ''
          path.style.strokeWidth = '0'
        }, ms(1450))
      } catch (err) { /* Web Animations 不可用时直接落墨 */ }
    }
    return wait(300)
  }
 
  function showAction(step) {
    ui.btnZh.textContent = step.btnZh
    ui.btnEn.textContent = step.btnEn
    ui.card.hidden = step.action !== 'confirm'
    if (step.action === 'confirm') {
      ui.card.innerHTML = ''
      /* 纯中文标签 + 数字/名称，去掉英文双写与主机行，别堆信息 */
      var rows = [
        ['身份名称', C.identity, true],
        ['身份编号', C.identityId, false],
        ['权限等级', C.accessLevel, false]
      ]
      rows.forEach(function (r) {
        var row = el('div', 'dsu-card-row')
        row.appendChild(el('span', null, r[0]))
        row.appendChild(el('b', r[2] ? 'dsu-zhname' : null, r[1]))
        ui.card.appendChild(row)
      })
    }
    ui.hint.innerHTML = '按 <kbd>Enter</kbd> / <kbd>Space</kbd>，或点击按钮继续'
    ui.action.classList.add('dsu-in')
    ui.btn.classList.add('dsu-pulse')
  }
 
  function hideAction() {
    ui.action.classList.remove('dsu-in')
    ui.btn.classList.remove('dsu-pulse')
  }
 
  function finale() {
    if (finished) return Promise.resolve()
    setStepCount(6, 'WELCOME')
    setSlats(6)
    setProgress(1)
    /* 底部日志和终幕里的「欢迎 xxx 访问」区分开，避免同一句出现两遍 */
    setSubtitle('身份验证完成，会话已建立', 'IDENTITY VERIFIED · SESSION ESTABLISHED')
    audio.chime()
    /* 终幕欢迎语：用从 Video Project 3 截出来的真声素材（line-6）。
       素材缺失 / voiceSource=tts / voice 关闭时自动静音，不会退回 TTS 念白 ——
       因为这条素材是「欢迎访问」整句，和动态身份名称无关。 */
    var welcome = voice.line(null, null, 'line-6')
 
    ui.status.classList.remove('dsu-in')
    ui.subEn.classList.remove('dsu-in')
    ui.rule.classList.remove('dsu-in')
    ui.reticle.classList.remove('dsu-in')
    stopHex()
    /* 中央区（状态行/分隔线/鲸鱼/虚线）整体退场：不清掉会和 WELCOME 版式叠字 */
    ui.center.classList.add('dsu-off')
    ui.dots.hidden = true
 
    return wait(360)
      .then(function () {
        ui.welcome.classList.add('dsu-in')
        ui.idline.classList.remove('dsu-in')
        return wait(420)
      })
      .then(function () {
        /* 结尾色散故障：分片位移 + 0.5px 模糊 + 混合模式，读起来像镜头色散 */
        var targets = [ui.w1, ui.w2, ui.w4]
        targets.forEach(function (t) {
          t.classList.add('dsu-glitch')
          t.setAttribute('data-text', t.textContent)
        })
        ui.w2.classList.add('dsu-glitch-box')   /* 黑底白字那块换加色混合 */
        void ui.welcome.offsetWidth
        targets.forEach(function (t) { t.classList.add('dsu-on') })
        return wait(640)
      })
      /* 光晕从中心炸开 + 变形光条横扫 + 文字青色 halation */
      .then(function () {
        root.classList.add('dsu-peak')
        ui.bloom.classList.add('dsu-go')
        ui.streak.classList.add('dsu-go')
        return wait(430)
      })
      /* 光晕最亮那一下补一记极短高光（是"眨一下"，不是长时间糊白） */
      .then(function () {
        ui.flash.style.transition = 'opacity ' + ms(70) + 'ms linear'
        ui.flash.style.opacity = '0.72'
        return wait(90)
      })
      .then(function () {
        ui.flash.style.transition = 'opacity ' + ms(340) + 'ms cubic-bezier(0.4, 0, 0.2, 1)'
        ui.flash.style.opacity = '0'
        return wait(320)
      })
      /* 欢迎语没播完就不揭幕（素材缺失时这个 Promise 立刻 resolve，不影响节奏） */
      .then(function () { return welcome })
      /* 揭幕：整个机位后撤 + 轻微失焦，比单纯淡出更有镜头感 */
      .then(function () {
        root.classList.add('dsu-handoff')
        return wait(780)
      })
      .then(function () { return finish() })
  }
 
  function finish() {
    if (finished) return
    finished = true
    releaseAll()
    stopHex()
    voice.stop()
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null }
    try {
      if (C.mode === 'session') window.sessionStorage.setItem('dsh-startup-screen:shown', '1')
      if (C.mode === 'daily') {
        window.localStorage.setItem('dsh-startup-screen:day', new Date().toISOString().slice(0, 10))
      }
    } catch (err) { /* 隐私模式下不可写，忽略 */ }
    /* 解锁：Host 注入的关键样式用 html.dsu-lock 锁滚动，这里必须一并摘掉，
       否则揭幕后主界面会永远滚不动。 */
    document.documentElement.classList.remove('dsu-lock')
    document.documentElement.style.overflow = ''
    if (document.body) document.body.style.overflow = ''
    root.classList.remove('dsu-boot')
    root.classList.add('dsu-gone')
    setTimeout(function () {
      if (root && root.parentNode) root.parentNode.removeChild(root)
      try { window.dispatchEvent(new CustomEvent('dsh-startup:done')) } catch (err) { /* noop */ }
    }, ms(900))
  }
 
  function requestSkip() {
    if (skipped || finished) return
    skipped = true
    releaseAll()
    finish()
  }
 
  if (C.allowSkip && ui.skip) {
    ui.skip.hidden = false
    ui.skip.addEventListener('click', function (e) { e.stopPropagation(); requestSkip() })
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') requestSkip()
    })
  } else if (ui.skip) {
    ui.skip.hidden = true
  }
 
  /* 对外 API：settings 面板里的"立即预览"按钮和重播都走它 */
  window.__DSH_STARTUP_API__ = {
    /* 设置页试听与冒烟测试用：直接念一行 */
    speak: function (en, zh) { voice.say(en, zh) },
    speakName: function (n) { return voice.speakName(n) },
    get voice() { return voice.current() },
    replay: injectSelf,
    skip: requestSkip,
    finish: finish,
    config: C
  }
 
  /* 锁滚动，动画期间不露出下面的应用 */
  document.documentElement.classList.add('dsu-lock')
  document.documentElement.style.overflow = 'hidden'
  if (document.body) document.body.style.overflow = 'hidden'
  setProgress(0.05)
  root.classList.remove('dsu-boot')
 
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { run() })
  } else {
    run()
  }
})()
 
</script>
<script>
/* ── 揭幕后自动跳转：轮询检测动画 root 被移除 → 送 EXIT_URL ────────── */
(function () {
  var started = Date.now();
  var timer = setInterval(function () {
    var root = document.getElementById('dsh-startup-root');
    if (Date.now() - started > 3000 && !root) {
      clearInterval(timer);
      setTimeout(function () { location.replace(window.QLZ_EXIT_URL); }, 250);
    }
    if (Date.now() - started > 90000) { clearInterval(timer); location.replace(window.QLZ_EXIT_URL); }
  }, 80);
})();
</script>
