<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨境 · 探索</title>
  <style>
    /* ===== 色盘 ===== */
    :root {
      --bg-body: #faf6ef;
      --bg-card: #ffffff;
      --bg-card-alt: #f2eee9;
      --border-light: #e8e0d5;
      --border-card: #d5c8b8;
      --text-primary: #1f1a16;
      --text-secondary: #2c241e;
      --text-muted: #5a4d42;
      --text-muted-light: #8a7a6a;
      --accent: #8a3a2a;
      --accent-soft: rgba(138, 58, 42, 0.05);
      --accent-glow: rgba(138, 58, 42, 0.12);
      --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.03);
      --font-serif: "Georgia", "Times New Roman", "Songti SC", serif;
      --font-mono: "Courier New", "Source Code Pro", monospace;
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg-body: #1e1a16;
      --bg-card: #2a2520;
      --bg-card-alt: #24201c;
      --border-light: #3a3530;
      --border-card: #4a443e;
      --text-primary: #cfc8c0;
      --text-secondary: #b8aea4;
      --text-muted: #8a8078;
      --text-muted-light: #6a6560;
      --accent: #b05a4a;
      --accent-soft: rgba(176, 90, 74, 0.06);
      --accent-glow: rgba(176, 90, 74, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-serif);
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.7;
      transition: background var(--transition), color var(--transition);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      padding: 0 16px 40px 16px;
      display: flex;
      flex-direction: column;
    }

    /* ===== 顶部导航 ===== */
    #nav {
      max-width: 840px;
      margin: 0 auto;
      padding: 18px 4px 10px 4px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      transition: border-color 0.3s;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      transition: color var(--transition);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-back:hover {
      color: var(--accent);
    }
    .nav-brand {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: 0.5px;
      font-family: var(--font-serif);
    }
    .nav-brand span {
      color: var(--accent);
      font-weight: 400;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .nav-right a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color var(--transition);
      font-family: var(--font-serif);
    }
    .nav-right a:hover {
      color: var(--accent);
    }
    /* 夜间切换按钮（放导航里，不额外悬浮） */
    .theme-toggle-nav {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color var(--transition);
      font-family: var(--font-serif);
      padding: 2px 4px;
    }
    .theme-toggle-nav:hover {
      color: var(--accent);
    }

    /* ===== 主容器 ===== */
    #app {
      max-width: 840px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 4px 20px 4px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ===== 头部 ===== */
    .page-header {
      padding: 0 0 14px 0;
      border-bottom: 1.5px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .page-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    .page-header h1 .accent {
      color: var(--accent);
      font-weight: 400;
    }
    .page-header .sub {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--text-muted-light);
      font-family: var(--font-serif);
      letter-spacing: 0.3px;
    }

    /* ===== 作品列表（全屏延展，无卡片） ===== */
    #list {
      padding: 6px 0 0 0;
      flex: 1;
    }

    /* ===== 条目 ===== */
    .entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition), border-color var(--transition);
      gap: 20px;
    }
    .entry:last-child {
      border-bottom: none;
    }

    /* ★ 悬停只有极淡背景色，没有上浮、没有阴影、没有圆角 = 全屏感保留 */
    .entry:hover {
      background: var(--accent-soft);
    }

    .entry-info {
      flex: 1;
      min-width: 0;
    }
    .entry-name {
      font-size: 1.05rem;
      font-weight: 600;
      font-family: var(--font-serif);
      color: var(--text-primary);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .entry-name .marker {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 400;
      opacity: 0.6;
    }
    .entry-desc {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-muted-light);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-serif);
      letter-spacing: 0.2px;
    }

    /* ===== 按钮组 ===== */
    .entry-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .entry-actions a {
      padding: 5px 14px;
      border-radius: 18px;
      border: 1px solid var(--border-card);
      background: var(--bg-body);
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-family: var(--font-mono);
      text-decoration: none;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .entry-actions a:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .entry-actions a .sym {
      font-size: 0.7rem;
      font-family: var(--font-serif);
      opacity: 0.5;
    }

    /* ===== 底部 ===== */
    .page-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
      font-size: 0.65rem;
      color: var(--text-muted-light);
      text-align: center;
      font-family: var(--font-mono);
      letter-spacing: 1.5px;
    }
    .page-footer .sym {
      color: var(--accent);
      opacity: 0.3;
    }

    /* ============================================================
       手机端
    ============================================================ */
    @media (max-width: 768px) {
      body {
        padding: 0 12px 30px 12px;
      }
      #nav {
        padding: 14px 4px 8px 4px;
      }
      .nav-brand {
        font-size: 0.95rem;
      }
      .nav-back {
        font-size: 0.72rem;
      }
      .nav-right a,
      .theme-toggle-nav {
        font-size: 0.78rem;
      }
      #app {
        padding: 18px 0 10px 0;
        gap: 4px;
      }
      .page-header h1 {
        font-size: 1.2rem;
      }
      .page-header .sub {
        font-size: 0.72rem;
      }

      .entry {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 14px 0;
      }
      .entry-name {
        font-size: 0.98rem;
      }
      .entry-desc {
        font-size: 0.78rem;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .entry-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        justify-content: stretch;
        gap: 5px;
      }
      .entry-actions a {
        width: 100%;
        justify-content: center;
        padding: 6px 10px;
        font-size: 0.68rem;
      }
    }

    @media (max-width: 480px) {
      .page-header h1 {
        font-size: 1.05rem;
      }
      .entry-name {
        font-size: 0.9rem;
      }
      .entry-name .marker {
        font-size: 0.85rem;
      }
      .entry-desc {
        font-size: 0.72rem;
      }
      .entry-actions a {
        font-size: 0.62rem;
        padding: 5px 8px;
      }
      .nav-brand {
        font-size: 0.85rem;
      }
      .nav-back {
        font-size: 0.65rem;
      }
    }
  </style>
  <script>
    // ===== 主题切换 =====
    (function() {
      try {
        var raw = localStorage.getItem('theme');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      } catch (e) {}
    })();

    function toggleTheme() {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark';
      var newTheme = isDark ? 'light' : 'dark';
      if (newTheme === 'dark') {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
      var btn = document.getElementById('themeToggle');
      if (btn) {
        btn.textContent = newTheme === 'dark' ? '☀️ 日间' : '🌙 夜间';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('themeToggle');
      if (btn) {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.textContent = isDark ? '☀️ 日间' : '🌙 夜间';
      }
    });

    window.addEventListener('storage', function(e) {
      if (e.key === 'theme') {
        try {
          var parsed = JSON.parse(e.newValue);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
          var btn = document.getElementById('themeToggle');
          if (btn) {
            btn.textContent = parsed && parsed.value === 'dark' ? '☀️ 日间' : '🌙 夜间';
          }
        } catch (e) {}
      }
    });
  </script>
</head>
<body>

  <!-- ===== 顶部导航（含返回按钮） ===== -->
  <nav id="nav">
    <div class="nav-left">
      <a class="nav-back" href="/-/">← 返回</a>
      <a class="nav-brand" href="/-/">墨境 · <span>书架</span></a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle-nav" id="themeToggle" onclick="toggleTheme()">🌙 夜间</button>
    </div>
  </nav>

  <div id="app">

    <!-- 头部 -->
    <div class="page-header">
      <h1>选择一部 <span class="accent">作品</span></h1>

    <!-- 列表 -->
    <div id="list">

      <!-- 我在地府打工那些年 -->
      <div class="entry">

        </div>
        <div class="entry-actions">
          <a href="/-/world/timeline/difu/"><span class="sym">◈</span> 编年表</a>
          <a href="/-/world/relation/difu/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/difu/"><span class="sym">❖</span> 世界观</a>
          <a href="/-/world/游戏系统/difu"><span class="sym">◉</span> 归终纪</a>
        </div>
      </div>

      <!-- 这破游戏NPC太能打了 -->
      <div class="entry">
        <div class="entry-info">
          <div class="entry-name">
            <span class="marker">✦</span> 这破游戏NPC太能打了
          </div>
          <div class="entry-desc">此去千秋，有人提灯，渡尽长夜始见光。</div>
        </div>
        <div class="entry-actions">
          <a href="/-/world/timeline/npc/"><span class="sym">◈</span> 编年表</a>
          <a href="/-/world/relation/npc/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/npc/"><span class="sym">❖</span> 世界观</a>
        </div>
      </div>

      <!-- 九州风云录 -->
      <div class="entry">
        <div class="entry-info">
          <div class="entry-name">
            <span class="marker">◈</span> 九州风云录
          </div>
          <div class="entry-desc">残烛蒙尘，暗室千年，风过旧窗，照见骨里青山。</div>
        </div>
        <div class="entry-actions">
          <a href="/-/world/relation/jiuzhou/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/jiuzhou/"><span class="sym">❖</span> 世界观</a>
        </div>
      </div>

      <!-- 北境玫瑰 -->
      <div class="entry">
        <div class="entry-info">
          <div class="entry-name">
            <span class="marker">✧</span> 北境玫瑰
          </div>
          <div class="entry-desc">北风剥尽千般相，铁锈缠作骨中霜。</div>
        </div>
        <div class="entry-actions">
          <a href="/-/world/relation/beijin/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/beijin/"><span class="sym">❖</span> 世界观</a>
          <a href="/-/world/论坛/"><span class="sym">◉</span> 论坛</a>
        </div>
      </div>

    </div>

    <!-- 底部 -->
    <div class="page-footer">
      <span class="sym">✦</span> 更多作品陆续添加 · 用文字构筑世界 <span class="sym">✦</span>
    </div>

  </div>

</body>
</html>
