<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨境 · 探索</title>
  <style>
    /* ===== 色盘（亮色纯白，暗色深灰暖调） ===== */
    :root {
      --bg-body: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: rgba(138, 58, 42, 0.03);
      --border-light: #e8e0d5;
      --border-card: #d5c8b8;
      --text-primary: #1a1410;
      --text-secondary: #2c241e;
      --text-muted: #4a3f38;
      --text-muted-light: #6a5f56;
      --accent: #8a3a2a;
      --accent-soft: rgba(138, 58, 42, 0.04);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.02);
      --font-serif: "Georgia", "Times New Roman", "Songti SC", serif;
      --font-mono: "Courier New", "Source Code Pro", monospace;
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg-body: #24201c;
      --bg-card: #2d2824;
      --bg-hover: rgba(176, 90, 74, 0.05);
      --border-light: #3d3732;
      --border-card: #4a443e;
      --text-primary: #d8d0c8;
      --text-secondary: #b8aea4;
      --text-muted: #8a8078;
      --text-muted-light: #6a6560;
      --accent: #b05a4a;
      --accent-soft: rgba(176, 90, 74, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-serif);
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 18px;
      line-height: 1.7;
      transition: background var(--transition), color var(--transition);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      padding: 0 16px 40px 16px;
      display: flex;
      flex-direction: column;
    }

    /* ===== 右上角悬浮按钮 ===== */
    .float-group {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .float-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 6px 14px 6px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      letter-spacing: 0.3px;
      text-decoration: none;
    }
    .float-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .float-btn .icon { font-size: 0.9rem; }

    /* ===== 主容器 ===== */
    #app {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 20px 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ===== 头部 ===== */
    .page-header {
      padding: 0 0 16px 0;
      border-bottom: 1.5px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .page-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    .page-header h1 .accent {
      color: var(--accent);
      font-weight: 400;
    }
    .page-header .sub {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--text-muted-light);
      font-family: var(--font-serif);
      letter-spacing: 0.3px;
    }

    /* ===== 作品列表 ===== */
    #list {
      padding: 8px 0 0 0;
      flex: 1;
    }

    /* ===== 条目 ===== */
    .entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px;
      border-bottom: 1px solid var(--border-light);
      transition: background var(--transition);
      gap: 30px;
      border-radius: 6px;
      margin: 0 -4px;
    }
    .entry:last-child {
      border-bottom: none;
    }
    .entry:hover {
      background: var(--bg-hover);
    }

    .entry-info {
      flex: 1;
      min-width: 180px;
    }
    .entry-name {
      font-size: 1.3rem;
      font-weight: 600;
      font-family: var(--font-serif);
      color: var(--text-primary);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .entry-name .marker {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 400;
      opacity: 0.6;
    }
    .entry-desc {
      font-size: 1rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-serif);
      letter-spacing: 0.2px;
    }

    /* ===== 按钮组 ===== */
    .entry-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      flex-shrink: 0;
      min-width: 260px;
    }
    .entry-actions a {
      padding: 10px 24px;
      border-radius: 24px;
      border: 1px solid var(--border-card);
      background: var(--bg-body);
      color: var(--text-secondary);
      font-size: 1rem;
      font-family: var(--font-mono);
      text-decoration: none;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .entry-actions a:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .entry-actions a .sym {
      font-size: 0.9rem;
      font-family: var(--font-serif);
      opacity: 0.5;
    }

    /* ===== 底部 ===== */
    .page-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
      font-size: 0.75rem;
      color: var(--text-muted-light);
      text-align: center;
      font-family: var(--font-mono);
      letter-spacing: 1.5px;
    }
    .page-footer .sym {
      color: var(--accent);
      opacity: 0.3;
    }

    /* ============================================================
       手机端
    ============================================================ */
    @media (max-width: 768px) {
      body {
        padding: 0 10px 30px 10px;
        font-size: 16px;
      }
      .float-group {
        top: 12px;
        right: 12px;
        gap: 6px;
      }
      .float-btn {
        padding: 4px 10px 4px 8px;
        font-size: 0.65rem;
      }
      #app {
        padding: 16px 8px 10px 8px;
        gap: 4px;
      }
      .page-header h1 {
        font-size: 1.4rem;
      }
      .page-header .sub {
        font-size: 0.8rem;
      }
      .entry {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 14px 8px;
        margin: 0 -4px;
      }
      .entry-info {
        flex: 1;
        min-width: unset;
      }
      .entry-name {
        font-size: 1.1rem;
      }
      .entry-name .marker {
        font-size: 1rem;
      }
      .entry-desc {
        font-size: 0.88rem;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .entry-actions {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        min-width: unset;
      }
      .entry-actions a {
        font-size: 0.8rem;
        padding: 8px 14px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0 6px 24px 6px;
        font-size: 15px;
      }
      #app {
        padding: 12px 4px 8px 4px;
      }
      .page-header h1 {
        font-size: 1.2rem;
      }
      .entry-name {
        font-size: 1rem;
      }
      .entry-desc {
        font-size: 0.8rem;
      }
      .entry-actions a {
        font-size: 0.7rem;
        padding: 6px 10px;
      }
      .float-group {
        top: 8px;
        right: 8px;
        gap: 4px;
      }
      .float-btn {
        padding: 3px 8px 3px 6px;
        font-size: 0.55rem;
        border-radius: 18px;
      }
      .float-btn .icon {
        font-size: 0.7rem;
      }
    }
  </style>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('theme');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
        }
      } catch (e) {}
    })();

    function toggleTheme() {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark';
      var newTheme = isDark ? 'light' : 'dark';
      if (newTheme === 'dark') {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', JSON.stringify({ value: newTheme }));
      var btn = document.getElementById('themeBtn');
      if (btn) {
        btn.innerHTML = newTheme === 'dark'
          ? '<span class="icon">☀️</span> 日间'
          : '<span class="icon">🌙</span> 夜间';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('themeBtn');
      if (btn) {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.innerHTML = isDark
          ? '<span class="icon">☀️</span> 日间'
          : '<span class="icon">🌙</span> 夜间';
      }
    });

    window.addEventListener('storage', function(e) {
      if (e.key === 'theme') {
        try {
          var parsed = JSON.parse(e.newValue);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.removeAttribute('data-theme');
          }
          var btn = document.getElementById('themeBtn');
          if (btn) {
            btn.innerHTML = parsed && parsed.value === 'dark'
              ? '<span class="icon">☀️</span> 日间'
              : '<span class="icon">🌙</span> 夜间';
          }
        } catch (e) {}
      }
    });
  </script>
</head>
<body>

  <div class="float-group">
    <a class="float-btn" href="/-/">
      <span class="icon">←</span> 返回
    </a>
    <button class="float-btn" id="themeBtn" onclick="toggleTheme()">
      <span class="icon">🌙</span> 夜间
    </button>
  </div>

  <div id="app">

    <div class="page-header">
      <h1>墨境 · <span class="accent">书架</span></h1>
      <p class="sub">◈ 选一部作品，走进它的世界</p>
    </div>

    <div id="list">

      <div class="entry">
        <div class="entry-info">
          <div class="entry-name">
            <span class="marker">❖</span> 我在地府打工那些年
          </div>
          <div class="entry-desc">浮生一梦，花开两世，轮回已就，故人当归。</div>
        </div>
        <div class="entry-actions">
          <a href="/-/world/timeline/difu/"><span class="sym">◈</span> 编年表</a>
          <a href="/-/world/relation/difu/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/difu/"><span class="sym">❖</span> 世界观</a>
          <a href="/-/world/游戏系统/difu"><span class="sym">◉</span> 归终纪</a>
        </div>
      </div>

      <div class="entry">
        <div class="entry-info">
          <div class="entry-name">
            <span class="marker">✦</span> 这破游戏NPC太能打了
          </div>
          <div class="entry-desc">此去千秋，有人提灯，渡尽长夜始见光。</div>
        </div>
        <div class="entry-actions">
          <a href="/-/world/timeline/npc/"><span class="sym">◈</span> 编年表</a>
          <a href="/-/world/relation/npc/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/npc/"><span class="sym">❖</span> 世界观</a>
        </div>
      </div>

      <div class="entry">
        <div class="entry-info">
          <div class="entry-name">
            <span class="marker">◈</span> 九州风云录
          </div>
          <div class="entry-desc">残烛蒙尘，暗室千年，风过旧窗，照见骨里青山。</div>
        </div>
        <div class="entry-actions">
          <a href="/-/world/relation/jiuzhou/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/jiuzhou/"><span class="sym">❖</span> 世界观</a>
        </div>
      </div>

      <div class="entry">
        <div class="entry-info">
          <div class="entry-name">
            <span class="marker">✧</span> 北境玫瑰
          </div>
          <div class="entry-desc">北风剥尽千般相，铁锈缠作骨中霜。</div>
        </div>
        <div class="entry-actions">
          <a href="/-/world/relation/beijin/"><span class="sym">✦</span> 星图</a>
          <a href="/-/world/beijin/"><span class="sym">❖</span> 世界观</a>
          <a href="/-/world/论坛/"><span class="sym">◉</span> 论坛</a>
        </div>
      </div>

    </div>

    <div class="page-footer">
      <span class="sym">✦</span> 更多作品陆续添加 · 用文字构筑世界 <span class="sym">✦</span>
    </div>

  </div>

</body>
</html>
