<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>墨境 - 文字帘幕</title>
  <link rel="stylesheet" href="/-/css/index.css" />
  <script>
    (function() {
      var t = localStorage.getItem('butterfly-theme') || localStorage.getItem('theme') || 'light';
      if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      window.addEventListener('storage', function(e) {
        if (e.key === 'butterfly-theme' || e.key === 'theme') {
          var n = e.newValue || 'light';
          if (n === 'auto') n = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', n);
        }
      });
    })();
  </script>
  <style>
    /* ===== 与北境玫瑰/地府时间线统一的配色 ===== */
    :root {
      --bg-body: #ffffff;
      --bg-section: #faf8f6;
      --text-primary: #2c2c2c;
      --text-secondary: #4a4a4a;
      --text-muted: #8a8a8a;
      --border-light: #ece6de;
      --accent: #b03a2a;
      --accent-soft: rgba(176, 58, 42, 0.06);
      --accent-soft-hover: rgba(176, 58, 42, 0.12);
    }

    [data-theme="dark"] {
      --bg-body: #1a1816;
      --bg-section: #24201c;
      --text-primary: #cfc8c0;
      --text-secondary: #9a948c;
      --text-muted: #6a6560;
      --border-light: #35302a;
      --accent: #b05a4a;
      --accent-soft: rgba(176, 90, 74, 0.1);
      --accent-soft-hover: rgba(176, 90, 74, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg-body);
      color: var(--text-primary);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.8;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }

    /* ===== 阅读进度条 ===== */
    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--accent);
      z-index: 9999;
      transition: width 0.08s ease;
    }

    /* ===== 导航栏 ===== */
    #nav {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 24px 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border-light);
      transition: border-color 0.3s;
    }
    #nav .nav-left {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    #nav .nav-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    #nav .nav-title span { color: var(--accent); }
    #nav .nav-links {
      display: flex;
      gap: 18px;
    }
    #nav .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    #nav .nav-links a:hover { color: var(--accent); }

    .font-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-section);
      border-radius: 20px;
      padding: 2px 8px;
      border: 1px solid var(--border-light);
      transition: border-color 0.3s, background 0.3s;
    }
    .font-control button {
      padding: 4px 10px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-weight: 500;
    }
    .font-control button:hover {
      background: var(--accent);
      color: #fff;
    }
    .font-control .size-display {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 32px;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* ===== 主容器 ===== */
    #page-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 30px 24px;
      position: relative;
    }

    /* ===== 页头 ===== */
    #page-header {
      padding: 28px 0 14px 0;
      text-align: center;
    }
    #page-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 1px;
    }
    #page-header .sub {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 400;
    }

    /* ===== 配置按钮 ===== */
    .configure-wrap {
      text-align: right;
      margin: 4px 0 14px 0;
    }
    .configure {
      border: 1px solid var(--border-light);
      padding: 6px 18px;
      border-radius: 20px;
      color: var(--text-secondary);
      background: var(--bg-section);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .configure:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== 配置面板 ===== */
    .settings {
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background: var(--bg-section);
      padding: 18px 20px;
      margin-bottom: 16px;
      transition: border-color 0.3s, background 0.3s;
      display: grid;
      gap: 12px;
    }
    .settings[hidden] { display: none; }

    .setting {
      display: grid;
      gap: 4px;
    }
    .setting label {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
    }
    .setting input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      background: var(--bg-body);
      height: 4px;
      border-radius: 2px;
    }
    .setting input[type="file"] {
      width: 100%;
      font-size: 0.8rem;
      color: var(--text-secondary);
      padding: 4px 0;
    }
    .setting textarea {
      width: 100%;
      resize: vertical;
      min-height: 48px;
      padding: 6px 10px;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-family: inherit;
      transition: border-color 0.3s, background 0.3s;
    }
    .setting textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .setting .hint {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .settings .divider {
      border: none;
      border-top: 1px solid var(--border-light);
      margin: 4px 0;
    }
    .settings .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .settings .reset {
      flex: 1;
      min-width: 80px;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      padding: 6px 12px;
      color: var(--text-secondary);
      background: var(--bg-body);
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      font-family: inherit;
    }
    .settings .reset:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== 珠帘画布 ===== */
    .artboard {
      position: relative;
      width: 100%;
      aspect-ratio: 901 / 730;
      max-height: 80vh;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      background: var(--bg-body);
      transition: border-color 0.3s, background 0.3s;
    }
    .artboard canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
      touch-action: none;
    }
    .artboard .cursor {
      position: absolute;
      z-index: 12;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      background: rgba(176, 58, 42, 0.08);
    }
    .artboard.is-active .cursor { opacity: 1; }

    /* ===== 底部 ===== */
    #footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 24px 24px 24px;
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      transition: border-color 0.3s;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    #footer a {
      color: var(--accent);
      text-decoration: none;
    }
    #footer a:hover { text-decoration: underline; }
    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ===== 字号控制 ===== */
    body {
      --font-size-base: 16px;
    }
    body.font-sm { --font-size-base: 15px; }
    body.font-md { --font-size-base: 16px; }
    body.font-lg { --font-size-base: 17px; }
    body.font-xl { --font-size-base: 18px; }
    body.font-2xl { --font-size-base: 19px; }
    body { font-size: var(--font-size-base); }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      #nav { padding: 14px 16px 8px 16px; }
      #nav .nav-title { font-size: 1rem; }
      #nav .nav-links a { font-size: 0.85rem; }
      .font-control button { padding: 2px 8px; font-size: 0.75rem; }
      .font-control .size-display { min-width: 26px; font-size: 0.7rem; }
      #page-wrap { padding: 0 16px 20px 16px; }
      #page-header h1 { font-size: 1.4rem; }
      #page-header .sub { font-size: 0.9rem; }
      .settings { padding: 14px 16px; }
      #footer { padding: 14px 16px 18px 16px; font-size: 0.8rem; flex-direction: column; align-items: flex-start; gap: 6px; }
    }
    @media (max-width: 480px) {
      #page-header h1 { font-size: 1.2rem; }
      .settings { padding: 12px 12px; }
      .settings .reset { font-size: 0.7rem; padding: 4px 8px; }
      .artboard { aspect-ratio: auto; height: 50vh; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       进度条 JS
  ============================================================ -->
  <script>
    (function() {
      var bar = document.getElementById('reading-progress');
      var ticking = false;

      function update() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function() {
          var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          var docHeight = document.documentElement.scrollHeight - window.innerHeight;
          var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
          bar.style.width = Math.min(progress, 100) + '%';
          ticking = false;
        });
      }
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update, { passive: true });
      update();
    })();
  </script>

  <!-- ============================================================
       字号控制 JS
  ============================================================ -->
  <script>
    var sizeLevels = ['sm', 'md', 'lg', 'xl', '2xl'];
    var sizeLabels = ['小', '中', '大', '更大', '最大'];
    var currentLevel = 1;

    function changeSize(delta) {
      var next = currentLevel + delta;
      if (next < 0) next = 0;
      if (next >= sizeLevels.length) next = sizeLevels.length - 1;
      if (next === currentLevel) return;

      sizeLevels.forEach(function(s) {
        document.body.classList.remove('font-' + s);
      });

      currentLevel = next;
      document.body.classList.add('font-' + sizeLevels[currentLevel]);
      document.getElementById('sizeDisplay').textContent = sizeLabels[currentLevel];

      try { localStorage.setItem('worldFontSize', String(currentLevel)); } catch (e) {}
    }

    var saved = localStorage.getItem('worldFontSize');
    if (saved !== null) {
      var n = parseInt(saved);
      if (!isNaN(n) && n >= 0 && n < sizeLevels.length) {
        currentLevel = n;
        if (currentLevel !== 1) {
          document.body.classList.add('font-' + sizeLevels[currentLevel]);
        }
        document.getElementById('sizeDisplay').textContent = sizeLabels[currentLevel];
      }
    }
  </script>

  <!-- ============================================================
       夜间模式同步
  ============================================================ -->
  <script>
    (function() {
      var html = document.documentElement;

      function applyTheme() {
        var attr = html.getAttribute('data-theme');
        if (!attr) {
          try {
            var raw = localStorage.getItem('theme');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.value) attr = parsed.value;
            }
          } catch (e) {}
        }
        if (attr === 'dark') {
          html.setAttribute('data-theme', 'dark');
        } else {
          html.removeAttribute('data-theme');
        }
      }

      applyTheme();

      window.addEventListener('storage', function(e) {
        if (e.key === 'theme') {
          applyTheme();
        }
      });

      var observer = new MutationObserver(function() {
        applyTheme();
      });
      observer.observe(html, {
        attributes: true,
        attributeFilter: ['data-theme']
      });
    })();
  </script>

  <!-- ============================================================
       珠帘交互 JS（核心功能）
  ============================================================ -->
  <script>
    (function() {
      var artboard = document.getElementById('artboard');
      var canvas = document.getElementById('curtain');
      var ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      var cursor = document.getElementById('cursor');
      var configure = document.getElementById('configure');
      var settings = document.getElementById('settings');
      var reset = document.getElementById('reset');
      var resetAll = document.getElementById('resetAll');
      var customImage = document.getElementById('customImage');
      var customText = document.getElementById('customText');

      var chains = [];

      var defaultGlyphs = '豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿；临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。披绣闼，俯雕甍；山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？呜呼！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！';

      var defaultImgSrc = '/-/images/lixi.jpg';

      var glyphs = defaultGlyphs;
      var mouse = { x: -999, y: -999, oldX: -999, oldY: -999, active: false };
      var physics = { strength: 0.82, radius: 34, friction: 0.95, gravity: 0.18 };
      var RIBBON_COLORS = [
        'rgba(44, 44, 44, 0.05)',
        'rgba(44, 44, 44, 0.04)',
        'rgba(44, 44, 44, 0.06)',
        'rgba(44, 44, 44, 0.035)'
      ];
      var width = 0,
        height = 0,
        dpr = 1;

      function applyThemeToColors() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var base = isDark ? '247, 245, 240' : '44, 44, 44';
        RIBBON_COLORS[0] = 'rgba(' + base + ', 0.07)';
        RIBBON_COLORS[1] = 'rgba(' + base + ', 0.05)';
        RIBBON_COLORS[2] = 'rgba(' + base + ', 0.09)';
        RIBBON_COLORS[3] = 'rgba(' + base + ', 0.04)';
      }
      applyThemeToColors();

      var themeObserver = new MutationObserver(function() {
        applyThemeToColors();
        build();
      });
      themeObserver.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
      });

      function build() {
        chains.length = 0;
        var source = glyphs.length ? glyphs : defaultGlyphs;
        var rect = artboard.getBoundingClientRect();
        var w = rect.width;
        var h = rect.height;

        var narrow = w < 720;
        var maxColumns = narrow ? 12 : 22;
        var minColumns = 2;
        var MIN_CURTAIN_HEIGHT = narrow ? 180 : 260;
        var fontSpacingFactor = 17;
        var absoluteMinRows = Math.ceil(MIN_CURTAIN_HEIGHT / fontSpacingFactor);
        var rowCapacity = Math.max(1, absoluteMinRows - 1);
        var columns = Math.max(minColumns, Math.min(maxColumns, Math.ceil(source.length / rowCapacity)));

        var left = w * 0.06;
        var right = w * 0.94;
        var curtainWidth = right - left;
        var top = h * 0.08;
        var bottom = h * 0.92;
        var requiredTextRows = Math.max(1, Math.ceil(source.length / columns)) + 1;
        var rows = Math.max(absoluteMinRows, requiredTextRows);
        var maxAvailableRows = Math.floor((bottom - top) / fontSpacingFactor) + 1;
        rows = Math.min(maxAvailableRows, rows);
        var curtainBottom = top + (rows - 1) * fontSpacingFactor;

        for (var column = 0; column < columns; column += 1) {
          var x = columns > 1 ? left + (column * curtainWidth) / (columns - 1) : w / 2;
          var segmentLength = Math.max(6.4, (curtainBottom - top) / (rows - 1));
          var readingColumn = columns - 1 - column;
          var chain = [];

          for (var row = 0; row < rows; row += 1) {
            var y = top + (row === 0 ? 0 : 4) + row * segmentLength;
            var charToShow = '';
            if (row > 0) {
              var textRowIndex = row - 1;
              var textRowsCount = rows - 1;
              var globalIndex = readingColumn * textRowsCount + textRowIndex;
              if (globalIndex < source.length) charToShow = source[globalIndex];
            }
            chain.push({
              x: x,
              y: y,
              oldX: x,
              oldY: y,
              anchorX: x,
              anchorY: y,
              pinned: row === 0,
              restLength: segmentLength,
              char: charToShow,
              alpha: 0.8
            });
          }
          chain._ribbon = null;
          chains.push(chain);
        }
      }

      function resize() {
        var rect = artboard.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var fontSize = width < 720 ? 9.5 : 10.5;
        ctx.font = '500 ' + fontSize + 'px "Songti SC", SimSun, Georgia, serif';
        build();
      }

      function injectMouseDelta() {
        if (!mouse.active) return;
        var moveX = mouse.x - mouse.oldX;
        var moveY = mouse.y - mouse.oldY;
        var speed = Math.hypot(moveX, moveY);
        if (speed < 0.01 || speed > 80) return;
        for (var chainIndex = 0; chainIndex < chains.length; chainIndex += 1) {
          var chain = chains[chainIndex];
          for (var index = 1; index < chain.length; index += 1) {
            var point = chain[index];
            var distance = Math.hypot(point.x - mouse.oldX, point.y - mouse.oldY);
            if (distance >= physics.radius) continue;
            var falloff = 1 - distance / physics.radius;
            point.x += moveX * physics.strength * falloff;
            point.y += moveY * physics.strength * falloff;
          }
        }
      }

      function integrate() {
        for (var c = 0; c < chains.length; c += 1) {
          var chain = chains[c];
          for (var p = 0; p < chain.length; p += 1) {
            var point = chain[p];
            if (point.pinned) continue;
            var velocityX = (point.x - point.oldX) * physics.friction;
            var velocityY = (point.y - point.oldY) * physics.friction;
            point.oldX = point.x;
            point.oldY = point.y;
            point.x += velocityX;
            point.y += velocityY + physics.gravity;
          }
        }
      }

      function constrain() {
        for (var pass = 0; pass < 6; pass += 1) {
          for (var c = 0; c < chains.length; c += 1) {
            var chain = chains[c];
            var anchor = chain[0];
            anchor.x = anchor.anchorX;
            anchor.y = anchor.anchorY;
            for (var index = 1; index < chain.length; index += 1) {
              var a = chain[index - 1];
              var b = chain[index];
              var dx = b.x - a.x;
              var dy = b.y - a.y;
              var distance = Math.max(0.0001, Math.hypot(dx, dy));
              var difference = (distance - b.restLength) / distance;
              if (a.pinned) {
                b.x -= dx * difference;
                b.y -= dy * difference;
              } else {
                var cx = dx * difference * 0.5;
                var cy = dy * difference * 0.5;
                a.x += cx;
                a.y += cy;
                b.x -= cx;
                b.y -= cy;
              }
            }
          }
        }
      }

      function updateRibbons(widthParam) {
        for (var c = 0; c < chains.length; c += 1) {
          var chain = chains[c];
          var n = chain.length;
          var ribbon = chain._ribbon;
          if (!ribbon || ribbon.length !== n) {
            ribbon = chain._ribbon = new Array(n);
            for (var i = 0; i < n; i += 1) ribbon[i] = { lx: 0, ly: 0, rx: 0, ry: 0 };
          }
          for (var i = 0; i < n; i += 1) {
            var prev = chain[i === 0 ? 0 : i - 1];
            var next = chain[i === n - 1 ? n - 1 : i + 1];
            var dx = next.x - prev.x;
            var dy = next.y - prev.y;
            var dist = Math.hypot(dx, dy) || 1;
            var nx = -dy / dist;
            var ny = dx / dist;
            var extraExtend = i === n - 1 ? 6.5 : 0;
            var point = chain[i];
            var p = ribbon[i];
            p.lx = point.x + nx * widthParam;
            p.ly = point.y + ny * widthParam + extraExtend;
            p.rx = point.x - nx * widthParam;
            p.ry = point.y - ny * widthParam + extraExtend;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        var columnsCount = chains.length;
        if (!columnsCount) return;
        var widthParam = Math.max(4.5, Math.min(6.5, ((width * 0.84) / columnsCount) * 0.34));
        updateRibbons(widthParam);

        ctx.shadowColor = 'rgba(44, 44, 44, 0.04)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 1.2;
        ctx.shadowOffsetY = 2;
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = 'rgba(44, 44, 44, 0.06)';
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var textColor = isDark ? '#cfc8c0' : '#2c2c2c';

        for (var tone = 0; tone < 4; tone += 1) {
          ctx.beginPath();
          for (var c = tone; c < columnsCount; c += 4) {
            var ribbon = chains[c]._ribbon;
            var n = ribbon.length;
            if (n < 2) continue;
            ctx.moveTo(ribbon[0].lx, ribbon[0].ly);
            for (var i = 1; i < n; i += 1) ctx.lineTo(ribbon[i].lx, ribbon[i].ly);
            for (var i = n - 1; i >= 0; i -= 1) ctx.lineTo(ribbon[i].rx, ribbon[i].ry);
            ctx.closePath();
          }
          ctx.fillStyle = RIBBON_COLORS[tone];
          ctx.fill();
          ctx.stroke();
        }

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        ctx.beginPath();
        for (var c = 0; c < columnsCount; c += 1) {
          var anchor = chains[c][0];
          ctx.moveTo(anchor.x + 1.8, anchor.y + 2);
          ctx.arc(anchor.x, anchor.y + 2, 1.8, 0, Math.PI * 2);
        }
        ctx.fillStyle = isDark ? 'rgba(247,245,240,0.6)' : 'rgba(44,44,44,0.5)';
        ctx.fill();

        ctx.fillStyle = textColor;
        for (var c = 0; c < columnsCount; c += 1) {
          var chain = chains[c];
          for (var index = 1; index < chain.length; index += 1) {
            var point = chain[index];
            if (!point.char) continue;
            ctx.fillText(point.char, point.x, point.y);
          }
        }
      }

      function frame() {
        injectMouseDelta();
        mouse.oldX = mouse.x;
        mouse.oldY = mouse.y;
        integrate();
        constrain();
        draw();
        requestAnimationFrame(frame);
      }

      function enter(event) {
        var rect = canvas.getBoundingClientRect();
        var currentX = event.clientX - rect.left;
        var currentY = event.clientY - rect.top;
        mouse.x = mouse.oldX = currentX;
        mouse.y = mouse.oldY = currentY;
        mouse.active = true;
        cursor.style.left = currentX + 'px';
        cursor.style.top = currentY + 'px';
        artboard.classList.add('is-active');
      }

      function move(event) {
        if (!mouse.active) enter(event);
        var rect = canvas.getBoundingClientRect();
        mouse.x = event.clientX - rect.left;
        mouse.y = event.clientY - rect.top;
        cursor.style.left = mouse.x + 'px';
        cursor.style.top = mouse.y + 'px';
      }

      function leave() {
        mouse.active = false;
        artboard.classList.remove('is-active');
      }

      function bindRange(id, outputId, update) {
        var input = document.getElementById(id);
        var output = document.getElementById(outputId);
        input.addEventListener('input', function() {
          var value = Number(input.value);
          output.value = String(value);
          update(value);
        });
      }

      function applyCustomText() {
        var raw = customText.value.replace(/\s+/g, '');
        glyphs = raw.length ? raw : defaultGlyphs;
        build();
      }

      function applyCustomImage(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
          var dataUrl = reader.result;
          var img = new Image();
          img.onload = function() {
            var canvas = document.getElementById('curtain');
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            build();
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      }

      configure.addEventListener('click', function() {
        var open = settings.hidden;
        settings.hidden = !open;
        configure.setAttribute('aria-expanded', String(open));
      });

      reset.addEventListener('click', build);
      resetAll.addEventListener('click', function() {
        customImage.value = '';
        customText.value = '';
        glyphs = defaultGlyphs;
        build();
      });

      bindRange('strength', 'strengthValue', function(value) { physics.strength = value / 100; });
      bindRange('reach', 'reachValue', function(value) { physics.radius = value; });
      bindRange('inertia', 'inertiaValue', function(value) { physics.friction = value / 100; });

      customImage.addEventListener('change', function(event) {
        applyCustomImage(event.target.files && event.target.files[0]);
      });
      customText.addEventListener('input', applyCustomText);

      canvas.addEventListener('pointerenter', enter);
      canvas.addEventListener('pointermove', move);
      canvas.addEventListener('pointerleave', leave);
      window.addEventListener('resize', resize);

      resize();
      frame();
    })();
  </script>

</body>
</html>
