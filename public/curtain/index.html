<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨境 · 文字珠帘</title>
  <style>
    /* ===== 统一墨境风格配色 ===== */
    :root {
      --bg-body: #ffffff;
      --bg-section: #faf8f6;
      --text-primary: #2c2c2c;
      --text-secondary: #4a4a4a;
      --text-muted: #8a8a8a;
      --border-light: #ece6de;
      --accent: #b03a2a;
      --accent-soft: rgba(176, 58, 42, 0.06);
      --accent-glow: rgba(176, 58, 42, 0.2);
    }

    [data-theme="dark"] {
      --bg-body: #1a1816;
      --bg-section: #24201c;
      --text-primary: #cfc8c0;
      --text-secondary: #9a948c;
      --text-muted: #6a6560;
      --border-light: #35302a;
      --accent: #b05a4a;
      --accent-soft: rgba(176, 90, 74, 0.1);
      --accent-glow: rgba(176, 90, 74, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.8;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ===== 阅读进度条 ===== */
    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--accent);
      z-index: 9999;
      transition: width 0.08s ease;
    }

    /* ===== 导航栏 ===== */
    #nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border-light);
    }
    .nav-left {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    .nav-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    .nav-title span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 18px;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }

    .font-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-section);
      border-radius: 20px;
      padding: 2px 8px;
      border: 1px solid var(--border-light);
    }
    .font-control button {
      padding: 4px 10px;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-weight: 500;
    }
    .font-control button:hover {
      background: var(--accent);
      color: #fff;
    }
    .font-control .size-display {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 32px;
      text-align: center;
    }

    /* ===== 页头 ===== */
    #page-header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 20px 24px;
      text-align: center;
    }
    #page-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 1px;
    }
    #page-header .sub {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ===== 画布容器 ===== */
    .artboard {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px 24px;
      position: relative;
      min-height: 500px;
      isolation: isolate;
    }

    #curtain {
      width: 100%;
      height: 560px;
      display: block;
      border-radius: 8px;
      background: var(--bg-section);
      border: 1px solid var(--border-light);
      cursor: none;
      touch-action: none;
      transition: background 0.3s, border-color 0.3s;
    }
    #curtain:hover {
      border-color: var(--accent);
    }

    /* ===== 标题叠层 ===== */
    .headline-overlay {
      position: absolute;
      z-index: 10;
      left: clamp(24px, 4vw, 56px);
      bottom: clamp(30px, 5vh, 60px);
      pointer-events: none;
    }
    .headline-overlay .eyebrow {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .headline-overlay h2 {
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 1px;
    }
    .headline-overlay h2 span {
      color: var(--accent);
    }

    .caption-overlay {
      position: absolute;
      z-index: 10;
      right: clamp(24px, 4vw, 56px);
      bottom: clamp(30px, 5vh, 60px);
      pointer-events: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
    }

    /* ===== 配置按钮 ===== */
    .configure-wrap {
      position: absolute;
      z-index: 20;
      top: 16px;
      right: 16px;
    }
    .configure {
      border: 1px solid var(--border-light);
      padding: 6px 16px;
      border-radius: 20px;
      color: var(--text-muted);
      background: var(--bg-body);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      font-family: inherit;
    }
    .configure:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== 设置面板 ===== */
    .settings {
      position: absolute;
      z-index: 30;
      top: 52px;
      right: 16px;
      width: 280px;
      max-height: calc(100% - 80px);
      overflow-y: auto;
      padding: 18px 20px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background: var(--bg-body);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .settings[hidden] { display: none; }

    .setting {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }
    .setting label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .setting input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .setting input[type="file"] {
      width: 100%;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .setting textarea {
      width: 100%;
      resize: vertical;
      min-height: 48px;
      padding: 6px 8px;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      background: var(--bg-section);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .setting textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .setting .hint {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .divider {
      margin: 4px 0 14px;
      border: none;
      border-top: 1px solid var(--border-light);
    }

    .reset {
      width: 100%;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 7px 10px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      font-family: inherit;
    }
    .reset:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .reset + .reset { margin-top: 6px; }

    /* ===== 底部 ===== */
    #footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px 24px 24px;
      border-top: 1px solid var(--border-light);
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      #nav { padding: 14px 16px 8px 16px; }
      .nav-title { font-size: 1rem; }
      .nav-links a { font-size: 0.85rem; }
      .font-control button { padding: 2px 8px; font-size: 0.75rem; }
      .font-control .size-display { min-width: 26px; font-size: 0.7rem; }

      #page-header { padding: 20px 16px 14px 16px; }
      #page-header h1 { font-size: 1.4rem; }

      .artboard { padding: 0 16px 30px 16px; }
      #curtain { height: 400px; }

      .headline-overlay h2 { font-size: 1.2rem; }
      .caption-overlay { display: none; }
      .settings { width: 240px; right: 8px; top: 48px; padding: 14px 16px; }
    }

    @media (max-width: 480px) {
      #curtain { height: 320px; }
      .headline-overlay h2 { font-size: 1rem; }
      .headline-overlay .eyebrow { font-size: 0.6rem; }
      .settings { width: 200px; }
    }
  </style>
</head>
<body>

  <!-- ===== 阅读进度条 ===== -->
  <div id="reading-progress"></div>

  <!-- ===== 导航栏 ===== -->
  <nav id="nav">
    <div class="nav-left">
      <span class="nav-title">墨境 · <span>珠帘</span></span>
      <div class="nav-links">
        <a href="/-/">首页</a>
        <a href="/-/world/">世界观</a>
        <a href="/-/gallery/">插图集</a>
      </div>
    </div>
    <div class="font-control">
      <button onclick="changeSize(-1)" title="缩小字号">A−</button>
      <span class="size-display" id="sizeDisplay">中</span>
      <button onclick="changeSize(1)" title="放大字号">A+</button>
    </div>
  </nav>

  <!-- ===== 页头 ===== -->
  <header id="page-header">
    <h1>文字珠帘</h1>
    <p class="sub">移动鼠标拨动文字 · 可换图片 · 可换文字 · 全部等距</p>
  </header>

  <!-- ===== 画布区 ===== -->
  <main class="artboard" id="artboard">
    <canvas id="curtain" aria-label="可交互的文字珠帘"></canvas>

    <div class="configure-wrap">
      <button class="configure" id="configure" type="button" aria-expanded="false" aria-controls="settings">配 置</button>
    </div>

    <div class="headline-overlay">
      <p class="eyebrow">/ 淮子生生</p>
      <h2>墨境 · <span>文字帘幕</span></h2>
    </div>
    <p class="caption-overlay">文字随指尖流动</p>

    <!-- ===== 设置面板 ===== -->
    <aside class="settings" id="settings" hidden>
      <div class="setting">
        <label for="customImage">图片 / Image</label>
        <input id="customImage" type="file" accept="image/*" />
        <span class="hint">上传自定义图片替换背景</span>
      </div>
      <div class="setting">
        <label for="customText">珠帘文字</label>
        <textarea id="customText" placeholder="输入任意文字，将替换珠帘上的字符…"></textarea>
        <span class="hint">留空则使用默认文字</span>
      </div>
      <hr class="divider" />
      <div class="setting">
        <label>Strength <output id="strengthValue">72</output></label>
        <input id="strength" type="range" min="20" max="110" value="72" />
      </div>
      <div class="setting">
        <label>Reach <output id="reachValue">34</output></label>
        <input id="reach" type="range" min="18" max="56" value="34" />
      </div>
      <div class="setting">
        <label>Inertia <output id="inertiaValue">97</output></label>
        <input id="inertia" type="range" min="86" max="99" value="97" />
      </div>
      <button class="reset" id="reset" type="button">重置珠帘</button>
      <button class="reset" id="resetAll" type="button">重置图片与文字</button>
    </aside>
  </main>

  <!-- ===== 底部 ===== -->
  <footer id="footer">
    <span>©2026 淮子生生 · 用文字构筑世界</span>
  </footer>

  <!-- ============================================================
       功能 JS
  ============================================================ -->
  <script>
    // ===== 字号控制 =====
    (function() {
      var levels = ['sm', 'md', 'lg', 'xl', '2xl'];
      var labels = ['小', '中', '大', '更大', '最大'];
      var current = 1;

      window.changeSize = function(delta) {
        var next = current + delta;
        if (next < 0) next = 0;
        if (next >= levels.length) next = levels.length - 1;
        if (next === current) return;
        levels.forEach(function(s) { document.body.classList.remove('font-' + s); });
        current = next;
        document.body.classList.add('font-' + levels[current]);
        document.getElementById('sizeDisplay').textContent = labels[current];
        try { localStorage.setItem('worldFontSize', String(current)); } catch(e) {}
      };

      var saved = localStorage.getItem('worldFontSize');
      if (saved !== null) {
        var n = parseInt(saved);
        if (!isNaN(n) && n >= 0 && n < levels.length) {
          current = n;
          if (current !== 1) document.body.classList.add('font-' + levels[current]);
          document.getElementById('sizeDisplay').textContent = labels[current];
        }
      }
    })();

    // ===== 进度条 =====
    (function() {
      var bar = document.getElementById('reading-progress');
      var ticking = false;
      function update() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function() {
          var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          var docHeight = document.documentElement.scrollHeight - window.innerHeight;
          var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
          bar.style.width = Math.min(progress, 100) + '%';
          ticking = false;
        });
      }
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update, { passive: true });
      update();
    })();

    // ===== 夜间模式同步 =====
    (function() {
      var html = document.documentElement;
      function applyTheme() {
        var attr = html.getAttribute('data-theme');
        if (!attr) {
          try {
            var raw = localStorage.getItem('theme');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.value) attr = parsed.value;
            }
          } catch(e) {}
        }
        if (attr === 'dark') html.setAttribute('data-theme', 'dark');
        else html.removeAttribute('data-theme');
      }
      applyTheme();
      window.addEventListener('storage', function(e) {
        if (e.key === 'theme') applyTheme();
      });
      var observer = new MutationObserver(function() { applyTheme(); });
      observer.observe(html, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>

  <!-- ============================================================
       珠帘核心 JS (原功能完全保留)
  ============================================================ -->
  <script>
    (function() {
      const artboard = document.getElementById("artboard");
      const canvas = document.getElementById("curtain");
      const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
      const configure = document.getElementById("configure");
      const settings = document.getElementById("settings");
      const reset = document.getElementById("reset");
      const resetAll = document.getElementById("resetAll");
      const customImage = document.getElementById("customImage");
      const customText = document.getElementById("customText");
      const chains = [];

      const defaultGlyphs = `豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。
时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿；临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。
披绣闼，俯雕甍；山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。
遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？
呜呼！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！`;

      const defaultImgSrc = "/-/images/lixi.jpg";
      let glyphs = defaultGlyphs;
      const mouse = { x: -999, y: -999, oldX: -999, oldY: -999, active: false };
      const physics = { strength: 0.82, radius: 34, friction: 0.95, gravity: 0.18 };
      const RIBBON_COLORS = [
        "rgba(176, 58, 42, 0.08)",
        "rgba(176, 58, 42, 0.05)",
        "rgba(176, 58, 42, 0.10)",
        "rgba(176, 58, 42, 0.04)",
      ];
      let width = 0, height = 0, dpr = 1;

      // ---- 图片加载 ----
      let currentImg = null;
      const img = new Image();

      function loadImage(src) {
        return new Promise((resolve) => {
          img.onload = () => { resolve(img); };
          img.onerror = () => { resolve(null); };
          img.src = src;
        });
      }

      // ---- 构建珠帘 ----
      function build() {
        chains.length = 0;
        const source = glyphs.length ? glyphs : defaultGlyphs;
        const narrow = width < 720;
        const maxColumns = narrow ? 16 : 26;
        const minColumns = 2;
        const MIN_CURTAIN_HEIGHT = narrow ? 260 : 360;
        const fontSpacingFactor = 17;
        const absoluteMinRows = Math.ceil(MIN_CURTAIN_HEIGHT / fontSpacingFactor);
        const rowCapacity = Math.max(1, absoluteMinRows - 1);
        let columns = Math.max(minColumns, Math.min(maxColumns, Math.ceil(source.length / rowCapacity)));

        const imgW = img.width || 600;
        const imgH = img.height || 400;
        const rect = artboard.getBoundingClientRect();
        const centerX = rect.width / 2;
        const curtainWidth = Math.min(rect.width * 0.82, imgW * 0.72);
        const left = centerX - curtainWidth / 2;
        const imageTop = Math.max(20, (rect.height - imgH * 0.55) / 2 - 20);
        const imageBottom = imageTop + imgH * 0.55;

        const requiredTextRows = Math.max(1, Math.ceil(source.length / columns)) + 1;
        let rows = Math.max(absoluteMinRows, requiredTextRows);
        const maxAvailableRows = Math.floor((height - 48 - imageBottom) / fontSpacingFactor) + 1;
        rows = Math.min(maxAvailableRows, rows);
        const curtainBottom = imageBottom + (rows - 1) * fontSpacingFactor;

        for (let column = 0; column < columns; column++) {
          const x = columns > 1 ? left + (column * curtainWidth) / (columns - 1) : centerX;
          const top = imageBottom + 16;
          const segmentLength = Math.max(6.4, (curtainBottom - top) / (rows - 1));
          const readingColumn = columns - 1 - column;
          const chain = [];

          for (let row = 0; row < rows; row++) {
            const y = top + (row === 0 ? 0 : 4) + row * segmentLength;
            let charToShow = "";
            if (row > 0) {
              const textRowIndex = row - 1;
              const textRowsCount = rows - 1;
              const globalIndex = readingColumn * textRowsCount + textRowIndex;
              if (globalIndex < source.length) charToShow = source[globalIndex];
            }
            chain.push({
              x, y, oldX: x, oldY: y, anchorX: x, anchorY: y,
              pinned: row === 0, restLength: segmentLength, char: charToShow, alpha: 0.8,
            });
          }
          chain._ribbon = null;
          chains.push(chain);
        }
      }

      // ---- 尺寸变化 ----
      function resize() {
        const rect = artboard.getBoundingClientRect();
        width = rect.width;
        height = rect.height || 560;
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const fontSize = width < 720 ? 9.5 : 10.5;
        ctx.font = `500 ${fontSize}px "Songti SC", SimSun, Georgia, serif`;
        build();
      }

      // ---- 物理引擎 ----
      function injectMouseDelta() {
        if (!mouse.active) return;
        const moveX = mouse.x - mouse.oldX;
        const moveY = mouse.y - mouse.oldY;
        const speed = Math.hypot(moveX, moveY);
        if (speed < 0.01 || speed > 80) return;
        for (const chain of chains) {
          for (let index = 1; index < chain.length; index++) {
            const point = chain[index];
            const distance = Math.hypot(point.x - mouse.oldX, point.y - mouse.oldY);
            if (distance >= physics.radius) continue;
            const falloff = 1 - distance / physics.radius;
            point.x += moveX * physics.strength * falloff;
            point.y += moveY * physics.strength * falloff;
          }
        }
      }

      function integrate() {
        for (const chain of chains) {
          for (const point of chain) {
            if (point.pinned) continue;
            const vx = (point.x - point.oldX) * physics.friction;
            const vy = (point.y - point.oldY) * physics.friction;
            point.oldX = point.x;
            point.oldY = point.y;
            point.x += vx;
            point.y += vy + physics.gravity;
          }
        }
      }

      function constrain() {
        for (let pass = 0; pass < 6; pass++) {
          for (const chain of chains) {
            const anchor = chain[0];
            anchor.x = anchor.anchorX;
            anchor.y = anchor.anchorY;
            for (let index = 1; index < chain.length; index++) {
              const a = chain[index - 1];
              const b = chain[index];
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const distance = Math.max(0.0001, Math.hypot(dx, dy));
              const diff = (distance - b.restLength) / distance;
              if (a.pinned) {
                b.x -= dx * diff;
                b.y -= dy * diff;
              } else {
                const cx = dx * diff * 0.5;
                const cy = dy * diff * 0.5;
                a.x += cx; a.y += cy;
                b.x -= cx; b.y -= cy;
              }
            }
          }
        }
      }

      function updateRibbons(wParam) {
        for (const chain of chains) {
          const n = chain.length;
          let ribbon = chain._ribbon;
          if (!ribbon || ribbon.length !== n) {
            ribbon = chain._ribbon = new Array(n);
            for (let i = 0; i < n; i++) ribbon[i] = { lx: 0, ly: 0, rx: 0, ry: 0 };
          }
          for (let i = 0; i < n; i++) {
            const prev = chain[i === 0 ? 0 : i - 1];
            const next = chain[i === n - 1 ? n - 1 : i + 1];
            const dx = next.x - prev.x;
            const dy = next.y - prev.y;
            const dist = Math.hypot(dx, dy) || 1;
            const nx = -dy / dist;
            const ny = dx / dist;
            const extra = i === n - 1 ? 6.5 : 0;
            const p = chain[i];
            const r = ribbon[i];
            r.lx = p.x + nx * wParam;
            r.ly = p.y + ny * wParam + extra;
            r.rx = p.x - nx * wParam;
            r.ry = p.y - ny * wParam + extra;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        // 绘制背景图片
        if (img.complete && img.naturalWidth > 0) {
          const imgW = img.naturalWidth;
          const imgH = img.naturalHeight;
          const rect = artboard.getBoundingClientRect();
          const scale = Math.min((width * 0.78) / imgW, (height * 0.58) / imgH, 0.85);
          const drawW = imgW * scale;
          const drawH = imgH * scale;
          const x = (width - drawW) / 2;
          const y = (height - drawH) / 2 - 10;
          ctx.save();
          ctx.globalAlpha = 0.85;
          ctx.shadowColor = "rgba(0,0,0,0.08)";
          ctx.shadowBlur = 24;
          ctx.shadowOffsetX = 4;
          ctx.shadowOffsetY = 8;
          ctx.drawImage(img, x, y, drawW, drawH);
          ctx.restore();
        }

        const columnsCount = chains.length;
        if (!columnsCount) return;
        const widthParam = Math.max(4.5, Math.min(6.5, ((width * 0.84) / columnsCount) * 0.34));
        updateRibbons(widthParam);

        ctx.shadowColor = "rgba(176, 58, 42, 0.06)";
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 1.2;
        ctx.shadowOffsetY = 2;
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = "rgba(176, 58, 42, 0.08)";

        for (let tone = 0; tone < 4; tone++) {
          ctx.beginPath();
          for (let c = tone; c < columnsCount; c += 4) {
            const ribbon = chains[c]._ribbon;
            const n = ribbon.length;
            if (n < 2) continue;
            ctx.moveTo(ribbon[0].lx, ribbon[0].ly);
            for (let i = 1; i < n; i++) ctx.lineTo(ribbon[i].lx, ribbon[i].ly);
            for (let i = n - 1; i >= 0; i--) ctx.lineTo(ribbon[i].rx, ribbon[i].ry);
            ctx.closePath();
          }
          ctx.fillStyle = RIBBON_COLORS[tone];
          ctx.fill();
          ctx.stroke();
        }

        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        ctx.fillStyle = "#b03a2a";
        for (const chain of chains) {
          const anchor = chain[0];
          ctx.beginPath();
          ctx.arc(anchor.x, anchor.y + 2, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#4a4a4a";
        for (const chain of chains) {
          for (let index = 1; index < chain.length; index++) {
            const point = chain[index];
            if (!point.char) continue;
            ctx.fillText(point.char, point.x, point.y + 1);
          }
        }
      }

      function frame() {
        injectMouseDelta();
        mouse.oldX = mouse.x;
        mouse.oldY = mouse.y;
        integrate();
        constrain();
        draw();
        requestAnimationFrame(frame);
      }

      // ---- 事件 ----
      function enter(event) {
        const rect = canvas.getBoundingClientRect();
        mouse.x = mouse.oldX = event.clientX - rect.left;
        mouse.y = mouse.oldY = event.clientY - rect.top;
        mouse.active = true;
      }

      function move(event) {
        if (!mouse.active) enter(event);
        const rect = canvas.getBoundingClientRect();
        mouse.x = event.clientX - rect.left;
        mouse.y = event.clientY - rect.top;
      }

      function leave() {
        mouse.active = false;
      }

      function bindRange(id, outputId, update) {
        const input = document.getElementById(id);
        const output = document.getElementById(outputId);
        input.addEventListener("input", () => {
          const value = Number(input.value);
          output.value = String(value);
          update(value);
        });
      }

      function applyCustomText() {
        const raw = customText.value.replace(/\s+/g, "");
        glyphs = raw.length ? raw : defaultGlyphs;
        build();
      }

      function applyCustomImage(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          img.onload = () => { resize(); };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      }

      // ---- 初始化 ----
      configure.addEventListener("click", () => {
        const open = settings.hidden;
        settings.hidden = !open;
        configure.setAttribute("aria-expanded", String(open));
      });
      reset.addEventListener("click", build);
      resetAll.addEventListener("click", () => {
        img.onload = () => { resize(); };
        img.src = defaultImgSrc;
        customImage.value = "";
        customText.value = "";
        glyphs = defaultGlyphs;
        resize();
      });
      bindRange("strength", "strengthValue", (v) => { physics.strength = v / 100; });
      bindRange("reach", "reachValue", (v) => { physics.radius = v; });
      bindRange("inertia", "inertiaValue", (v) => { physics.friction = v / 100; });
      customImage.addEventListener("change", (e) => {
        applyCustomImage(e.target.files && e.target.files[0]);
      });
      customText.addEventListener("input", applyCustomText);
      canvas.addEventListener("pointerenter", enter);
      canvas.addEventListener("pointermove", move);
      canvas.addEventListener("pointerleave", leave);
      window.addEventListener("resize", resize);

      img.onload = () => { resize(); };
      img.src = defaultImgSrc;
      if (img.complete) resize();
      frame();
    })();
  </script>
</body>
</html>
