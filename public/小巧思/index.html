<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小巧思 · 墨境</title>
  <style>
    /* ============================================================
       0. 夜间模式
    ============================================================ */
    :root {
      --bg-body: #ffffff;
      --bg-hover: rgba(176, 58, 42, 0.04);
      --text-primary: #2c2c2c;
      --text-secondary: #4a4a4a;
      --text-muted: #8a8a8a;
      --border-light: #ece6de;
      --accent: #b03a2a;
      --accent-soft: rgba(176, 58, 42, 0.08);
      --card-shadow: rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg-body: #1a1816;
      --bg-hover: rgba(176, 90, 74, 0.08);
      --text-primary: #cfc8c0;
      --text-secondary: #9a948c;
      --text-muted: #6a6560;
      --border-light: #35302a;
      --accent: #b05a4a;
      --accent-soft: rgba(176, 90, 74, 0.12);
      --card-shadow: rgba(0, 0, 0, 0.3);
    }

    /* ============================================================
       1. 全局
    ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       2. 导航栏
    ============================================================ */
    #nav {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 24px 10px 24px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      transition: border-color 0.3s;
    }
    .nav-brand {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .nav-brand span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 18px;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }

    /* ============================================================
       3. 页头
    ============================================================ */
    #header {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 16px 24px;
      width: 100%;
    }
    #header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    #header .sub {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ============================================================
       4. 卡片网格
    ============================================================ */
    #grid {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 24px 40px 24px;
      width: 100%;
      flex: 1;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* ===== 卡片 ===== */
    .card {
      display: flex;
      flex-direction: column;
      padding: 28px 24px 22px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      background: var(--bg-body);
      transition: border-color 0.3s, background 0.3s, transform 0.25s, box-shadow 0.3s;
      text-decoration: none;
      color: inherit;
      position: relative;
    }
    .card:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 28px var(--card-shadow);
    }

    .card-icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
      line-height: 1;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex: 1;
    }
    .card-btn {
      align-self: flex-start;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
      transition: all 0.25s;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .card:hover .card-btn {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ===== 占位卡片（预留） ===== */
    .card.placeholder {
      opacity: 0.5;
      cursor: default;
      border-style: dashed;
    }
    .card.placeholder:hover {
      transform: none;
      box-shadow: none;
      border-color: var(--border-light);
      background: var(--bg-body);
    }
    .card.placeholder .card-btn {
      cursor: default;
    }
    .card.placeholder:hover .card-btn {
      border-color: var(--border-light);
      color: var(--text-secondary);
      background: transparent;
    }

    /* ============================================================
       5. 底部
    ============================================================ */
    #footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 24px 24px 24px;
      width: 100%;
      border-top: 1px solid var(--border-light);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      transition: border-color 0.3s;
    }

    /* ============================================================
       6. 手机端
    ============================================================ */
    @media (max-width: 768px) {
      #nav {
        padding: 14px 16px 8px 16px;
      }
      .nav-brand { font-size: 1rem; }
      .nav-links a { font-size: 0.85rem; }

      #header {
        padding: 24px 16px 12px 16px;
      }
      #header h1 { font-size: 1.3rem; }
      #header .sub { font-size: 0.85rem; }

      #grid {
        padding: 4px 16px 30px 16px;
      }

      .card-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .card {
        padding: 20px 18px 18px;
      }
      .card-icon {
        font-size: 2rem;
      }
      .card-title {
        font-size: 1.05rem;
      }
      .card-desc {
        font-size: 0.85rem;
      }
      .card-btn {
        font-size: 0.78rem;
        padding: 5px 14px;
      }

      #footer {
        padding: 14px 16px 18px 16px;
        font-size: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      #header h1 { font-size: 1.1rem; }
      .card-title { font-size: 0.98rem; }
      .card-desc { font-size: 0.82rem; }
    }
  </style>
  <script>
    // ============================================================
    //  读取夜间模式
    // ============================================================
    (function() {
      try {
        var raw = localStorage.getItem('theme');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        }
      } catch(e) {}
    })();

    window.addEventListener('storage', function(e) {
      if (e.key === 'theme') {
        try {
          var parsed = JSON.parse(e.newValue);
          if (parsed && parsed.value === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (parsed && parsed.value === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      }
    });

    var observer = new MutationObserver(function() {
      var attr = document.documentElement.getAttribute('data-theme');
    });
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme']
    });
  </script>
</head>
<body>

  <nav id="nav">
    <a class="nav-brand" href="/-/">墨境 · <span>神秘小页面</span></a>
    <div class="nav-links">
      <a href="/-/">首页</a>
    </div>
  </nav>

  <header id="header">
    <h1>🪄 神秘小页面</h1>
    <p class="sub">在抖音B站上学的神秘小代码</p>
  </header>

  <main id="grid">
    <div class="card-grid">

      <!-- ===== 卡片 1：插图集 ===== -->
      <a class="card" href="/-/小巧思/gallery/">
        <div class="card-icon">🖼️</div>
        <div class="card-title">插图集</div>
        <div class="card-desc">都是 AI 画的，但是我觉得挺好看</div>
        <span class="card-btn">进入 →</span>
      </a>

      <!-- ===== 卡片 2：文字帘幕 ===== -->
      <a class="card" href="/-/小巧思/curtain/">
        <div class="card-icon">📜</div>
        <div class="card-title">文字帘幕</div>
        <div class="card-desc">可交互的文字珠帘，鼠标划过会飘动</div>
        <span class="card-btn">进入 →</span>
      </a>

      <!-- ===== 卡片 3：预留占位（后面可替换） ===== -->
      <div class="card placeholder">
        <div class="card-icon">✦</div>
        <div class="card-title">更多功能</div>
        <div class="card-desc">预留位置，等待新的小巧思</div>
        <span class="card-btn">即将上线</span>
      </div>

    </div>
  </main>

  <footer id="footer">
    用文字构筑世界 · 随手攒的小角落
  </footer>

</body>
</html>
