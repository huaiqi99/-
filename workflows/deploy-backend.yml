name: 部署后端到Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "后端/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
                worker: [difu-ai, difu-stats, difu-quest, difu-chat, difu-test]
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "后端/${{ matrix.worker }}"
