<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨境 · 配乐</title>
  <style>
    body {
      margin: 0;
      background: #1a1816;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .music-box {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
      min-width: 260px;
    }
    .music-box h2 {
      color: #cfc8c0;
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .music-box button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #b03a2a;
      color: #fff;
      border: none;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 24px rgba(176,58,42,0.3);
    }
    .music-box button:hover {
      transform: scale(1.08);
      background: #8a2e1e;
    }
    .music-box .label {
      color: rgba(255,255,255,0.3);
      font-size: 0.7rem;
      margin-top: 14px;
      letter-spacing: 1px;
    }
    audio { display: none; }
  </style>
</head>
<body>
  <div class="music-box">
    <h2>🎵 墨境 · 配乐</h2>
    <button id="musicBtn">▶</button>
    <div class="label">点击播放 / 暂停</div>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="/music/30SecondClassical.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bg-music');
    const btn = document.getElementById('musicBtn');
    let isPlaying = false;

    // 尝试自动播放
    audio.play().then(() => {
      isPlaying = true;
      btn.textContent = '⏸';
    }).catch(() => {});

    btn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        btn.textContent = '▶';
        isPlaying = false;
      } else {
        audio.play().then(() => {
          btn.textContent = '⏸';
          isPlaying = true;
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
